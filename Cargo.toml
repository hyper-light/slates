[workspace]
members = ["crates/*", "xtask"]
default-members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Ada Lundhe <info@lundhe.audio>"]
edition = "2024"
license = "MIT"
rust-version = "1.98"
readme = "README.md"

[workspace.dependencies]
slates-machine = { path = "crates/machine", version = "0.1.0", default-features = false }
slates-mem = { path = "crates/mem", version = "0.1.0" }
slates-rt = { path = "crates/rt", version = "0.1.0" }
slates-wire = { path = "crates/wire", version = "0.1.0" }
slates-vfs = { path = "crates/vfs", version = "0.1.0" }
slates-base = { path = "crates/base", version = "0.1.0" }
slates-land = { path = "crates/land", version = "0.1.0" }
slates-anchor = { path = "crates/anchor", version = "0.1.0" }
slates-db = { path = "crates/db", version = "0.1.0" }
slates-ipc = { path = "crates/ipc", version = "0.1.0" }
slates-server = { path = "crates/server", version = "0.1.0" }
slates-bridge-core = { path = "crates/bridge-core", version = "0.1.0" }
slates-bridge-fuse = { path = "crates/bridge-fuse", version = "0.1.0" }
slates-bridge-nfs = { path = "crates/bridge-nfs", version = "0.1.0" }
slates-merge = { path = "crates/merge", version = "0.1.0" }
slates-mcp = { path = "crates/mcp", version = "0.1.0" }
slates-client = { path = "crates/client", version = "0.1.0" }
slates-cli = { path = "crates/cli", version = "0.1.0" }
slates-wire-derive = { path = "crates/wire-derive", version = "0.1.0" }
slates-transport = { path = "crates/transport", version = "0.1.0" }
slates-cluster = { path = "crates/cluster", version = "0.1.0" }

# Third-party versions are pinned once here. Exact `=` pins only where an ABI contract is
# version-specific, each with a comment saying why (Appendix B.1).
libc = "0.2"
# The design's syscall surface (§2.4 of the IPC research): safe, I/O-safe wrappers; raw libc stays
# only where rustix has no call (Apple sysctl, mach, IOKit).
rustix = { version = "1", features = ["mm", "fs", "event", "process", "shm", "param", "system", "std", "pipe", "thread", "time", "net", "mount"] }
# Memory maps with a safe surface (map_anon, advise, lock, Deref to [u8]); the raw mmap calls
# that remain are the file-backed ones in the profile segment.
memmap2 = "0.9"
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_Performance",
  "Win32_System_IO",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Console",
  "Win32_Networking_WinSock",
  "Win32_Security_Authorization",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
# AES-256-GCM for the fleet control-plane seal (§4.10a §7; D-15's TLS 1.3 cipher). The RustCrypto
# AEAD; counter nonces mean no RNG, so `getrandom` is off and only the AES backend + `alloc` (the
# Vec-returning `encrypt`/`decrypt`) are pulled. Vetted primitive — the project never hand-rolls AEAD.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# HKDF (RFC 5869) over SHA-256 for the control-plane key schedule (§4.10a §7): HKDF-Expand-Label
# (RFC 8446 §7.1 labelled form) derives the seal's per-(sender, key_epoch, direction) keys from an
# enrolled control secret. Vetted RustCrypto crates — key derivation is never hand-rolled.
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
# TLS 1.3 for the session plane's handshake (§4.10a §3; D-15's named dependency). The `ring` provider
# builds without cmake (prebuilt asm); the default `aws-lc-rs` would need it. slates drives the QUIC
# core sans-io, so rustls pulls no async runtime. rustls's config API takes Arc — D-8 exception 2.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Self-signed certificates for the handshake tests (pure Rust with the ring feature — no cmake).
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode", "frame"] }
zstd = "0.13"
# The io_uring syscall wrapper (tokio-rs/io-uring): thin, no reference counting in its core types;
# the driver probes setup flags at boot and falls back to epoll (D-9).
io-uring = "0.7"
# The derive macro's parser and emitter (the standard trio); build-time only.
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
# Compile-fail tests for the derive's refusals (dev only).
trybuild = "1"
# Name folding for the per-volume equivalence policy (APFS folds by normalization and case).
unicode-normalization = "0.1"
# Model-based tests with shrinking (D-20; the design names proptest).
proptest = "1"
# Instruction-count benches under valgrind (dev only; the runner version must match).
iai-callgrind = "=0.16.1"
# ratchets.toml (dev only, in xtask).
toml = "0.8"

# Lints are the enforcement of Part 0's rules, not a style preference. Every crate opts in
# with `[lints] workspace = true`. Allowed exceptions live in clippy.toml with their reason.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
# `--cfg loom` selects loom's atomics for the interleaving tests (AC-0.7).
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# R1, R2, D-7, D-8: the disallowed types and methods are listed in clippy.toml with reasons.
disallowed_types = "deny"
disallowed_methods = "deny"
# Every unsafe block carries a `// SAFETY:` line stating the invariant that makes it sound.
undocumented_unsafe_blocks = "deny"
# The no-panic law: typed refusals, never panics, outside tests (clippy.toml allows tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
# Integers are checked: a narrowing `as` is a review failure; use `try_from`.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
# Bounded functions: the threshold is a ratified shape constant in clippy.toml.
cognitive_complexity = "deny"
mem_forget = "deny"
missing_safety_doc = "deny"
missing_panics_doc = "deny"

[profile.release]
lto = true
# No unwinding in release: allocation exhaustion and every other failure is a typed refusal,
# and a panic is a bug that must stop the process (Appendix B.1, hecate's no-panic law).
panic = "abort"
# codegen-units stays at the default until a measured build shows a gain (Appendix B.1).
