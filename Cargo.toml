[workspace]
members = ["crates/*", "xtask"]
default-members = ["crates/*"]
# vendor/ holds third-party crates slates builds from its own tree (vendor/UPSTREAM.md); they are not workspace members,
# so the lint wall, fmt and xtask's checks apply to slates' code only.
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Ada Lundhe <info@lundhe.audio>"]
edition = "2024"
license = "MIT"
rust-version = "1.98"
readme = "README.md"

[workspace.dependencies]
slates-machine = { path = "crates/machine", version = "0.1.0", default-features = false }
slates-mem = { path = "crates/mem", version = "0.1.0" }
slates-rt = { path = "crates/rt", version = "0.1.0" }
slates-wire = { path = "crates/wire", version = "0.1.0" }
slates-vfs = { path = "crates/vfs", version = "0.1.0" }
slates-test-seeds = { path = "crates/test-seeds" }
slates-base = { path = "crates/base", version = "0.1.0" }
slates-land = { path = "crates/land", version = "0.1.0" }
slates-anchor = { path = "crates/anchor", version = "0.1.0" }
slates-db = { path = "crates/db", version = "0.1.0" }
slates-ipc = { path = "crates/ipc", version = "0.1.0" }
slates-server = { path = "crates/server", version = "0.1.0" }
slates-bridge-core = { path = "crates/bridge-core", version = "0.1.0" }
slates-bridge-fuse = { path = "crates/bridge-fuse", version = "0.1.0" }
slates-bridge-nfs = { path = "crates/bridge-nfs", version = "0.1.0" }
slates-bridge-virtiofs = { path = "crates/bridge-virtiofs", version = "0.1.0" }
slates-bridge-oci = { path = "crates/bridge-oci", version = "0.1.0" }
slates-merge = { path = "crates/merge", version = "0.1.0" }
slates-mcp = { path = "crates/mcp", version = "0.1.0" }
slates-client = { path = "crates/client", version = "0.1.0" }
slates-cli = { path = "crates/cli", version = "0.1.0" }
slates-wire-derive = { path = "crates/wire-derive", version = "0.1.0" }
slates-transport = { path = "crates/transport", version = "0.1.0" }
slates-cluster = { path = "crates/cluster", version = "0.1.0" }
slates-archive = { path = "crates/archive", version = "0.1.0" }
slates-conformance = { path = "crates/conformance", version = "0.1.0" }

# Third-party versions are pinned once here. Exact `=` pins only where an ABI contract is
# version-specific, each with a comment saying why (Appendix B.1).
libc = "0.2"
# The design's syscall surface (§2.4 of the IPC research): safe, I/O-safe wrappers; raw libc stays
# only where rustix has no call (Apple sysctl, mach, IOKit).
rustix = { version = "1", features = ["mm", "fs", "event", "process", "shm", "param", "system", "std", "pipe", "thread", "time", "net", "mount"] }
# Memory maps with a safe surface (map_anon, advise, lock, Deref to [u8]); the raw mmap calls
# that remain are the file-backed ones in the profile segment.
memmap2 = "0.9"
windows-sys = { version = "0.60", features = [
  # The Windows base host's contained opens (`slates-base`, AUD-29-62): `NtCreateFile` relative to a
  # retained directory handle, which Win32's `CreateFileW` cannot do.
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_Performance",
  "Win32_System_WindowsProgramming",
  "Win32_System_IO",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Console",
  "Win32_Networking_WinSock",
  "Win32_Security_Authorization",
  # The anonymous pipe of the consumer-capability delivery (`slates-ipc`'s `delivery`, §4.13):
  # `CreatePipe` and `PeekNamedPipe`.
  "Win32_System_Pipes",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
# AWS-LC, through its Rust binding aws-lc-rs: the one cryptographic library slates builds on (Ada, 2026-09-28; the
# same library ../mantle and ../focal use). It provides the control-plane seal's AES-256-GCM (§4.10a §7), the key
# schedule's HKDF-SHA-256 (RFC 5869, RFC 8446 §7.1 labelled form), SHA-256, and rustls' TLS 1.3 provider (D-15).
# Its C library builds with the system C compiler through aws-lc-sys's `cc` builder (no cmake, no bindgen: the
# bindings are pregenerated for every target slates builds). On x86 Windows its assembly is NASM source: CI installs
# NASM and refuses the prebuilt objects (`AWS_LC_SYS_PREBUILT_NASM=0`); rustls' feature still lets a developer machine
# without NASM fall back to them. CPU jitter entropy is left out at build time (`.cargo/config.toml`,
# `AWS_LC_SYS_NO_JITTER_ENTROPY`), so AWS-LC seeds from the operating system's generator and a new process pays no
# start-up latency for its first random bytes. Vetted primitives — the project never hand-rolls cryptography.
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys", "alloc"] }
# The shared crates from ../hyper-raft, vendored at the revision in vendor/hyper-raft/SNAPSHOT (A-67).
hyper-datagram = { path = "vendor/hyper-raft/hyper-datagram" }
hyper-swim = { path = "vendor/hyper-raft/hyper-swim" }
hyper-timing = { path = "vendor/hyper-raft/hyper-timing" }
# Sealing at rest (A-92; hyper-raft docs/seal.md): keys, STREAM, the ML-KEM-1024 recipient wrap, keyed names.
hyper-seal = { path = "vendor/hyper-raft/hyper-seal" }
# TLS 1.3 for the session plane's handshake (§4.10a §3; D-15's named dependency), over the aws-lc-rs provider. slates
# drives the QUIC core sans-io, so rustls pulls no async runtime. rustls's config API takes Arc — D-8 exception 2.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
# Self-signed certificates for the handshake tests, signed through aws-lc-rs.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode", "frame"] }
zstd = "0.13"
# The io_uring syscall wrapper (tokio-rs/io-uring): thin, no reference counting in its core types;
# the driver probes setup flags at boot and falls back to epoll (D-9).
io-uring = "0.7"
# The derive macro's parser and emitter (the standard trio); build-time only.
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
# Compile-fail tests for the derive's refusals (dev only).
trybuild = "1"
# Name folding for the per-volume equivalence policy (APFS folds by normalization and case).
unicode-normalization = "0.1"
# Model-based tests with shrinking (D-20; the design names proptest).
proptest = "1"
# Instruction-count benches under valgrind (dev only; the runner version must match).
iai-callgrind = "=0.16.1"
# ratchets.toml (dev only, in xtask).
toml = "0.8"

# Lints are the enforcement of Part 0's rules, not a style preference. Every crate opts in
# with `[lints] workspace = true`. Allowed exceptions live in clippy.toml with their reason.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
# `--cfg loom` selects loom's atomics for the interleaving tests (AC-0.7); `--cfg shuttle` builds
# the randomized-schedule tests of the pure cores (T-1.6, T-6.7) against the shuttle dev-dependency.
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(loom)", "cfg(shuttle)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# R1, R2, D-7, D-8: the disallowed types and methods are listed in clippy.toml with reasons.
disallowed_types = "deny"
disallowed_methods = "deny"
# Every unsafe block carries a `// SAFETY:` line stating the invariant that makes it sound.
undocumented_unsafe_blocks = "deny"
# The no-panic law: typed refusals, never panics, outside tests (clippy.toml allows tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
# Out-of-bounds indexing and slicing (a byte index inside a UTF-8 character too) panic; use `get`.
indexing_slicing = "deny"
string_slice = "deny"
# A function that returns `Result` reports its failures in it, never by panicking.
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
# Integers are checked: a narrowing `as` is a review failure; use `try_from`.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
# Bounded functions: the threshold is a ratified shape constant in clippy.toml.
cognitive_complexity = "deny"
mem_forget = "deny"
missing_safety_doc = "deny"
missing_panics_doc = "deny"

[profile.release]
lto = true
# No unwinding in release: allocation exhaustion and every other failure is a typed refusal,
# and a panic is a bug that must stop the process (Appendix B.1, hecate's no-panic law).
panic = "abort"
# codegen-units stays at the default until a measured build shows a gain (Appendix B.1).

# AWS-LC and its Rust binding, built from the copies in vendor/ (vendor/UPSTREAM.md): ../mantle's vendored copies, each
# its crates.io package plus the local changes listed there, so slates owns the exact bytes it builds.
[patch.crates-io]
aws-lc-rs = { path = "vendor/aws-lc-rs" }
aws-lc-sys = { path = "vendor/aws-lc-sys" }
