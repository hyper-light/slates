<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90" role="img" aria-labelledby="title desc">
  <title id="title">Slates split-slate logo</title>
  <desc id="desc">An upright slate divided into two complementary pieces by a stepped open seam.</desc>
  <!-- Two filled vector paths. The shared slope is one unit left per four down;
       the six-unit seam keeps the pieces separate at the README's 90-pixel size. -->
  <g fill="#f0f6fc">
    <path d="M 30 9 H 73 L 76.75 14 L 72.5 31 H 46.5 L 41.75 50 H 19.75 Z"/>
    <path d="M 51 37 H 71 L 60 81 H 17 L 13.25 76 L 18.25 56 H 46.25 Z"/>
  </g>
</svg>
