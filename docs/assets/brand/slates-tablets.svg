<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="-3 -1 98 98" role="img" aria-labelledby="title desc">
  <title id="title">Slates workspace tablets</title>
  <desc id="desc">A slate lifted from its source tablet, with a stepped opening in the upper workspace.</desc>
  <!-- A source tablet and its offset copy share a rectangular profile.
       A transparent gap separates their thin edges; a stepped cut marks
       the changed workspace. Every visible contour is a vector path. -->
  <defs>
    <mask id="separation" maskUnits="userSpaceOnUse" x="-2" y="0" width="102" height="96">
      <path d="M -2 0 H 100 V 96 H -2 Z" fill="#ffffff"/>
      <path d="M 51 7 L 92 27 V 31 L 61 58 L 20 38 V 34 Z" fill="#000000" stroke="#000000" stroke-width="6" stroke-linejoin="miter"/>
    </mask>
    <mask id="workspace-cut" maskUnits="userSpaceOnUse" x="-2" y="0" width="102" height="96">
      <path d="M -2 0 H 100 V 96 H -2 Z" fill="#ffffff"/>
      <path d="M 27.85 10.45 L 60.65 26.45 L 51.35 34.55 L 88.25 52.55" fill="none" stroke="#000000" stroke-width="5.5" stroke-linejoin="miter"/>
    </mask>
  </defs>
  <g fill="#000000">
    <path d="M 31 39 L 78 61 V 65 L 48 87 L 1 65 V 61 Z" mask="url(#separation)"/>
    <path d="M 51 7 L 92 27 V 31 L 61 58 L 20 38 V 34 Z" mask="url(#workspace-cut)"/>
  </g>
</svg>
