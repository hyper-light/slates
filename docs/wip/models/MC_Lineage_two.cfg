\* TLC configuration for Lineage (A-518): four hosts, two objects, o1 created by h1 and o2 by h2, the two founding
\* members, their successors ranked apart; F = 1, two retirements and two
\* completion records kept, three records written per object, versions up to MaxVersion (MC_Lineage.tla).
SPECIFICATION Spec
CONSTANTS
  h1 = h1
  h2 = h2
  h3 = h3
  h4 = h4
  o1 = o1
  o2 = o2
  None = None
  Hosts <- MCHosts
  Objects <- MCObjectsTwo
  Creator <- MCCreatorTwo
  Weight <- MCWeightTwo
  F = 1
  Bound = 2
  MaxSeq = 3
CONSTRAINT StateBound
INVARIANTS
  TypeOK
  SettledOnRecord
  Bounded
PROPERTIES
  ReclaimOnlyStale
  SettleKeepsFPlusOne
  NoLastCopyLost
