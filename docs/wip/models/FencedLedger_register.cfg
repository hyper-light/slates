\* TLC configuration for FencedLedger: three holders (f = 1), two hosts, two positions, two values;
\* two epochs under the register's rule (the highest record alone): must fail Continuity.
SPECIFICATION Spec
CONSTANTS
  Acceptors = {a1, a2, a3}
  Hosts = {h1, h2}
  Values = {v1, v2}
  MaxEpoch = 2
  MaxPos = 2
  PerPosition = FALSE
INVARIANTS
  TypeOK
  Agreement
  Continuity
  AdoptedIsPrefix
  StaleNeverCommits
  ReadSafety
