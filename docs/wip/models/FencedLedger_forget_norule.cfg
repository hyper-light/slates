  MaxPos = 2
  PerPosition = TRUE
  MaxForgets = 1
  StartRule = FALSE
INVARIANTS
  TypeOK
  Agreement
  Continuity
  AdoptedIsPrefix
  StaleNeverCommits
  ReadSafety
