\* TLC configuration for FencedLedger with A-919's forgetting holder: three holders (f = 1), one forget, the start
\* rule off: must fail Continuity (non-vacuity of A-919's start rule).
\* two epochs (one takeover plus a resumed stale owner), the design's per-position adoption.
SPECIFICATION Spec
