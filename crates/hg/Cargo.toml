[package]
name = "slates-hg"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "Mercurial's exchange formats (§4.17.3, A-514): bundle2, bundle1, changegroups and their deltas, decoded and encoded as pure functions over bytes, every length checked against the input and the caller's admission; compressed bundles inflated within it (A-598)."

[dependencies]
# The engines of compressed bundles (A-598; D-17): zlib through the workspace's flate2, whose backend the workspace chose
# by measurement (A-607); bzip2 on its pure-Rust libbz2-rs-sys; zstd the workspace's (libzstd 1.5.7).
bzip2 = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
slates-test-seeds = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
