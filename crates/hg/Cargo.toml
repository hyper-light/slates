[package]
name = "slates-hg"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "Mercurial's exchange formats and objects (§4.17.3, A-514, A-545, A-569, A-588): bundle2, bundle1, changegroups and their deltas, part payloads, the wire protocol, changesets, manifests and file revisions with their nodes, and the repository's revlog-shaped index on the shared object store's tables, decoded and encoded as pure functions over bytes, every length checked against the input and the caller's admission."

[dependencies]
# The SHA-1 of a Mercurial node with collision detection, as 7.2's sha1dc computes it (A-588): the workspace's port of
# sha1collisiondetection, which git's object names use (A-600; the workspace manifest says why this crate).
sha1-checked = { workspace = true }
# The shared object store's tables, which hold the repository's index (A-588 part 2, A-581).
slates-vcs = { workspace = true }

[dev-dependencies]
slates-test-seeds = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
