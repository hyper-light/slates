[package]
name = "slates-bridge-winfsp"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "The Windows WinFsp bridge (§4.6, D-2; Phase 4): the refusal taxonomy that maps the volume core's `VfsError` to the `NTSTATUS` WinFsp returns (mirroring the FUSE errno and NFS `nfsstat3` edges), and the WinFsp host — the `FSP_FILE_SYSTEM_INTERFACE` vtable and `FspFileSystem*` FFI, hand-transcribed from winfsp's headers (like the AFD reactor from the WDK), dispatching each callback onto the shared `Bridge` over a single-owner volume thread. Cross-lints on the Windows target; the live mount runs on the native Windows runner."

[dependencies]
slates-vfs = { workspace = true }
slates-bridge-core = { workspace = true }
slates-mem = { workspace = true }
slates-wire = { workspace = true }

[target.'cfg(windows)'.dependencies]
# A direct dep so a cross-lint for the Windows target from a host with no MSVC assembler can enable
# blake3's pure-Rust backend with `--features slates-machine/pure-hash` (as ipc/client do); the CI
# Windows build uses the default SIMD C path. The host reads the machine's allocation granularity from it, which bounds
# a purge's write (A-190).
slates-machine = { workspace = true }
windows-sys = { workspace = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices"] }
# The purge client's process (A-190 moved out of the daemon, §4.6): its spawn into a kill-on-close job and its pipe.
slates-ipc = { workspace = true }

# loom builds only under `RUSTFLAGS="--cfg loom"` for the purge slot's interleaving model (A-243, AC-0.7).
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[target.'cfg(windows)'.dev-dependencies]
slates-anchor = { workspace = true }
slates-db = { workspace = true }

[lints]
workspace = true
