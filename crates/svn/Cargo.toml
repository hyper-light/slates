[package]
name = "slates-svn"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "The Subversion server's pure pieces (§4.17.4, A-500): svndiff versions 0 and 2, decoded with every refusal Subversion's own decoder makes, encoded as Subversion encodes, and applied by the reference applier."

[dependencies]
# The dump format's text checksums (A-593): MD5 and SHA-1 through the workspace's one cryptographic library, whose
# vendored copy exposes MD5 (`vendor/UPSTREAM.md`).
aws-lc-rs = { workspace = true }
# A text's and a property list's content identity in the migration verbs' records (A-628): BLAKE3, the identity the
# green and the shared object store name content by (§4.11), as the Subversion index's `ContentIdentity` names it.
blake3 = { workspace = true }
# svndiff version 2 stores each window section as an LZ4 block (`libsvn_subr/compress_lz4.c`); the workspace's LZ4
# codec, built with its safe encoder and decoder only.
lz4_flex = { workspace = true }
# CRAM-MD5's HMAC-MD5 for the ra_svn handshake (`handshake`, A-599; the workspace manifest says why these crates).
hmac = { workspace = true }
md-5 = { workspace = true }
# `list`'s fold of a name, as utf8proc folds it (`reads::fold`, A-613 part 2 step 7): Unicode's canonical
# decomposition, combining classes, marks and composition, the crate slates-vfs already takes (Unicode 17.0.0).
unicode-normalization = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
slates-test-seeds = { workspace = true }

[lints]
workspace = true
