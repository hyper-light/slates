[package]
name = "slates-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "The `slates` command: the anchor process that owns the segment and supervises the daemon, the daemon itself, and the lifecycle verbs over the Rust client (design §2.5, §2.6, §4.4, §4.12; Phase 2 task 5)."

[[bin]]
name = "slates"
path = "src/main.rs"

[dependencies]
slates-machine = { workspace = true }
slates-anchor = { workspace = true }
slates-db = { workspace = true }
slates-ipc = { workspace = true }
slates-server = { workspace = true }
slates-client = { workspace = true }
slates-vfs = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[lints]
workspace = true
