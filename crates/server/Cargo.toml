[package]
name = "slates-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "The daemon: shards over the runtime, the control shard's rendezvous, the lifecycle verbs of §4.4 with completion records, leases, attachments and quotas, recovery through the anchor segment (design §2.5, §2.6, §4.4, §4.7, §4.8, §4.13; Phase 2 task 4)."

[dependencies]
slates-machine = { workspace = true }
slates-mem = { workspace = true }
slates-rt = { workspace = true }
slates-wire = { workspace = true }
slates-vfs = { workspace = true }
slates-base = { workspace = true }
slates-anchor = { workspace = true }
slates-db = { workspace = true }
slates-cluster = { workspace = true }
slates-archive = { workspace = true }
slates-transport = { workspace = true }
slates-ipc = { workspace = true }
slates-land = { workspace = true }
slates-merge = { workspace = true }
slates-bridge-core = { workspace = true }
blake3 = { workspace = true }
rustls = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }
# The NFS loopback mount server is the macOS/Linux mount path (Windows mounts through WinFsp), and it
# rides `slates_rt::tcp`, which is Unix-only, so the daemon's NFS transport (`crate::nfs`) is too.
slates-bridge-nfs = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
# self-signed fleet identities for the two-daemon membership test (as the cluster tests mint them).
rcgen = { workspace = true }

[lints]
workspace = true
