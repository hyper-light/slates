[package]
name = "slates-bridge-oci"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "The OCI attachment form (§4.6 A-9, RQ-20; Phase 4): the kernel's mount table read as a query that never touches a mount, the verification that a host path is the mount point of this volume's export, and the runtime-specification `mounts` entry the harness hands its OCI runtime. slates never enters a namespace, creates a directory or asks for a privilege; the runtime binds."

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
# `getfsstat(MNT_NOWAIT)` and the unmount watch's `kevent` on `EVFILT_FS` (A-511): the two FFI calls for which no
# safe wrapper exists (rustix has no mount-table query and no `EVFILT_FS`); the first returns the kernel's cached
# table without contacting any filesystem.
libc = { workspace = true }
# The unmount watch's kqueue, made through rustix's safe wrapper (A-511).
rustix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# A read-only open and read of `/proc/self/mountinfo`, the kernel's own table (a query, never a write), and the
# unmount watch's epoll instance over it (A-511).
rustix = { workspace = true }

[lints]
workspace = true
