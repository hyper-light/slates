[package]
name = "slates-transport"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "The fleet claims-plane transport (§4.10a, Phase 8): the two-plane UDP wire — the control-datagram codec with its AES-256-GCM seal and HKDF-Expand-Label key schedule, and the owned QUIC session plane (frames, ordered streams, reliability, flow control, rustls TLS 1.3 handshake, and the live Endpoint carrying a stream end to end). Enrollment (identity), congestion, and header protection owed. Design: docs/wip/fleet-transport.md."

[dependencies]
aes-gcm = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
# The session plane's TLS 1.3 handshake (D-15). The ring provider builds without cmake here; aws-lc-rs
# (default) would need it. rustls's config API takes Arc by signature — D-8 exception 2, the only Arc.
rustls = { workspace = true }
# The runtime's async UDP socket drives the connection edge (`endpoint.rs`). The protocol *core*
# (codec, seal, schedule, streams, reliability, flow, handshake) stays sans-io and never imports rt;
# only the edge does. rt is slates's own executor, not a foreign async runtime (§4.10a §3, #2).
slates-rt = { workspace = true }
# Address types for the UDP edge (via rustix::net, not std::net — the host-path wall's guard).
rustix = { workspace = true }

[dev-dependencies]
# Generative hostile-input fuzzing of the wire parsers (the hostile-input rule; D-20).
proptest = { workspace = true }
# A self-signed cert for the handshake test (pure Rust with the ring feature — no cmake).
rcgen = { workspace = true }

[lints]
workspace = true
