[package]
name = "slates-transport"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "The fleet claims-plane transport (§4.10a, Phase 8): the two-plane UDP wire — the control-datagram codec, its AES-256-GCM seal, and the HKDF-Expand-Label key schedule (control secret injected; enrollment and the owned QUIC session plane owed). Design: docs/wip/fleet-transport.md."

[dependencies]
aes-gcm = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
# The session plane's TLS 1.3 handshake (D-15). The ring provider builds without cmake here; aws-lc-rs
# (default) would need it. rustls's config API takes Arc by signature — D-8 exception 2, the only Arc.
rustls = { workspace = true }

[dev-dependencies]
# The runtime's async UDP socket (real driver + the deterministic sim fabric) drives the end-to-end
# control-plane test (§4.10a); shipped transport code stays pure — this is only the test's substrate.
slates-rt = { workspace = true }
rustix = { workspace = true }
# Generative hostile-input fuzzing of the wire parsers (the hostile-input rule; D-20).
proptest = { workspace = true }
# A self-signed cert for the handshake test (pure Rust with the ring feature — no cmake).
rcgen = { workspace = true }

[lints]
workspace = true
