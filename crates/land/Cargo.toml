[package]
name = "slates-land"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "The landing engine: the only writer of host paths, under a human grant (design §4.15, D-26)."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
slates-machine = { workspace = true }
slates-mem = { workspace = true }
slates-vfs = { workspace = true }
slates-base = { workspace = true }
blake3 = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }
libc = { workspace = true }

# Windows' write seam (`src/os_windows.rs`): handle-relative creates, renames, removals and flushes; a symbolic link's
# set names `SeCreateSymbolicLinkPrivilege` by its number (`Wdk_System_SystemServices`, A-438).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_System_SystemServices"] }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
