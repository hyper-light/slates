[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "slates"
description = "The slates Python SDK: a PyO3 extension over the typed Rust client (design §2.3, D-19)."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ada Lundhe" }]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
]
dynamic = ["version"]

[tool.maturin]
# The compiled extension is imported as `slates` (the `#[pymodule]` name and the `[lib] name`).
module-name = "slates"
manifest-path = "Cargo.toml"
