[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "slates"
description = "The Python SDK for slates — a hermetic, RAM-only, copy-on-write VFS an agent provisions in under 50 µs. A PyO3 extension over the typed Rust client: a sync Client and an async-primary AsyncClient resolved on any asyncio loop by the completion fd's readiness (design §2.3, D-19)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ada Lundhe" }]
keywords = ["slates", "vfs", "filesystem", "copy-on-write", "agent", "sandbox", "asyncio"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Framework :: AsyncIO",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
]
# The version is the workspace's (`[workspace.package] version` in the root Cargo.toml, inherited by
# the crate manifest): maturin reads it from there, so there is no second copy to hand-edit here.
# `cargo xtask version` refuses a static one (docs/publish.md).
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/hyper-light/slates"
Documentation = "https://github.com/hyper-light/slates/blob/main/crates/sdk-python/README.md"

[tool.maturin]
# The compiled extension is imported as `slates` (the `#[pymodule]` name and the `[lib] name`).
module-name = "slates"
manifest-path = "Cargo.toml"
