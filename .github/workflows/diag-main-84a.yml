name: diag-main-84a
# Run 4 (main 01a20182, 2026-11-27 06:22 PST): macos-latest alone, its leg in run 3 having run nothing (no GNU timeout on
# macOS runners); the bench bounded by perl's alarm where timeout is missing. Linux and Windows stand from run 3.
# Run 3 (main 01a20182, 2026-11-27 06:01 PST): goal 84a's loaded and quiet tails at current main (0408a5b26) on every
# runner its 11-21 figures came from: macos-latest (A-831's "p999 4/12", BENCHMARKS "84a on macOS", run 44934544995),
# windows-latest and windows-11-arm (w-k90-win's run 44948887874), and Linux's two with the account granted
# RLIMIT_RTPRIO as run 2 did (slates asks no privilege and takes SCHED_RR where the account grants it). macOS and Windows
# run as the runner's user, ungranted. edit_merge_bench (release), --spinners-per-core 2, 10 files, both forms; three
# loaded invocations, then two quiet; each form's `goal` line is an annotation. Bare metal (the big Studio, adacachy2)
# waits on kiln, which this Mac cannot reach. Run only from diag-measurer-main-84a-* branches, never main.
# Run 2 (main 01a20182, 2026-11-24 09:38 PST): the Linux legs only, with RLIMIT_RTPRIO granted.
# Run 1 (main 01a20182, 2026-11-24 09:12 PST): ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm at afa579483.
on:
  push:
    branches: ["diag-measurer-main-84a-*"]

env:
  CARGO_TERM_COLOR: never

jobs:
  tails:
    name: 84a tails (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: NASM (x86_64 Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64 Windows)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the bench (release)
        env:
          AWS_LC_SYS_PREBUILT_NASM: ${{ matrix.os == 'windows-latest' && '0' || '' }}
        run: |
          git log -1 --format='at %h %s' | cut -c1-120
          cargo build --release --locked -p slates-client --example edit_merge_bench
      - name: Three loaded invocations, then two quiet
        run: |
          set +e
          # macOS runners have no GNU timeout (run 3's macOS leg: "timeout: command not found"); perl's alarm bounds it.
          bound() { if command -v timeout > /dev/null; then timeout "$@"; else perl -e 'alarm shift; exec @ARGV' "$@"; fi; }
          if [ "$RUNNER_OS" = Linux ]; then
            sudo prlimit --pid $$ --rtprio=99:99
            echo "RLIMIT_RTPRIO of this shell: $(ulimit -r) (soft) $(ulimit -Hr) (hard), user $(id -un)"
          fi
          L="$RUNNER_TEMP/84a"; mkdir -p "$L"
          B=target/release/examples/edit_merge_bench; [ -f "$B.exe" ] && B="$B.exe"
          echo "cores: $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "$NUMBER_OF_PROCESSORS")"
          for n in 1 2 3; do
            bound 1500 "$B" --loaded-only --spinners-per-core 2 --files 10 --form accept --form conflict </dev/null > "$L/loaded-$n.log" 2>&1
            rc=$?
            echo "::notice title=${{ matrix.os }} loaded $n (exit $rc)::$(grep -a '^goal	merge\.' "$L/loaded-$n.log" | cut -f2 | cut -c1-400 | tr '\n' ' ')"
            grep -a '^goal	merge\.' "$L/loaded-$n.log" | cut -c1-400
          done
          grep -ahE 'runs round-robin|runs time-share|NoPriorityGranted' "$L"/loaded-*.log | sort | uniq -c | head -4
          for n in 1 2; do
            bound 1200 "$B" --quiet-only --files 10 --form accept --form conflict </dev/null > "$L/quiet-$n.log" 2>&1
            rc=$?
            echo "::notice title=${{ matrix.os }} quiet $n (exit $rc)::$(grep -a '^goal	merge\.' "$L/quiet-$n.log" | cut -f2 | cut -c1-400 | tr '\n' ' ')"
            grep -a '^goal	merge\.' "$L/quiet-$n.log" | cut -c1-400
          done
          exit 0
      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-84a-${{ matrix.os }}
          path: ${{ runner.temp }}/84a
          if-no-files-found: warn
