# DIAG (not for main): the seeded nemesis at the three seeds that failed before A-338, on Linux x86_64 and arm64 (the supervisor's ask of
# 2026-11-18 11:57 UTC), release.
name: diag-integrator-nemesis
on:
  push:
    branches: ['diag-integrator-nemesis-*']
env:
  CARGO_TERM_COLOR: never
jobs:
  nemesis-seeds:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the chaos binary (release)
        run: cargo test --locked --release -p slates-cli --test live_chaos --no-run
      - name: The nemesis at its three seeds
        run: bash .github/diag-integrator-nemesis.sh
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nemesis-results-${{ matrix.os }}
          path: target/nemesis-*
