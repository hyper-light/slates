name: DIAG w-reaper -- A-754, the Linux issuer surface (not for main)

on:
  push:
    branches: ['diag-w-reaper-a754-*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    name: A-754 on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RESULTS_BRANCH: ${{ github.ref_name }}-results-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Stock clients
        run: |
          command -v svn >/dev/null || { sudo apt-get update && sudo apt-get install -y subversion; }
          git --version; ssh -V 2>&1; svn --version --quiet || true
      - name: The tests, published
        shell: bash
        run: |
          set +e
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          echo "started $(date -u +%FT%TZ) at $(git rev-parse HEAD); $(uname -r)" > "$out/status.txt"
          cargo test -p slates-ipc --lib issuer_route > "$out/ipc.txt" 2>&1
          echo "ipc issuer_route exit $? $(grep -E '^test result' "$out/ipc.txt" | tail -1)" >> "$out/status.txt"
          for t in issuer_surface git_interop svn_interop; do
            cargo test -p slates-cli --test "$t" -- --test-threads=1 --nocapture > "$out/$t.txt" 2>&1
            echo "$t exit $? $(grep -E '^test result' "$out/$t.txt" | tail -1) skips $(grep -ciE 'skipping|SKIP' "$out/$t.txt")" >> "$out/status.txt"
          done
          echo "ended $(date -u +%FT%TZ)" >> "$out/status.txt"
          entries=""
          for f in "$out"/*; do
            b=$(tail -c 3000000 "$f" | git hash-object -w --stdin)
            entries="$entries$(printf '100644 blob %s\t%s' "$b" "$(basename "$f")")"$'\n'
          done
          tree=$(printf '%s' "$entries" | git mktree)
          c=$(git commit-tree "$tree" -m "results of run $GITHUB_RUN_ID")
          git push -q origin "$c:refs/heads/$RESULTS_BRANCH"
