name: diag-main-v3
# main 01a20182 (2026-11-24 06:12 PST): gate 9 for the push-0/1 failure, at 7d6874639 (w-git's line for each non-Kept
# answer of a home's put, and for a region exchange that ended with hosts unanswered; agreed with w-shared; no behaviour
# change). Gate 8 (45405128575, ee9571813) failed 2 of 40: push 0 right after creation, a remote home's answer other than
# kept within about 1 ms of a 2 s budget. Twenty release then twenty debug runs, each log grepped for the new lines.
# Run only from diag-measurer-main-v3-* branches, never main.
on:
  push:
    branches: ["diag-measurer-main-v3-*"]

env:
  CARGO_TERM_COLOR: never

jobs:
  v3:
    name: v3_takeover (gate 9 at 7d6874639)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7d6874639df859f7eeeef4f20f1d3082c02d8b50
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the test, release and debug
        run: |
          git log -1 --format='at %h %s' | cut -c1-120
          cargo test --release --locked -p slates-cli --test v3_takeover --no-run
          cargo test --locked -p slates-cli --test v3_takeover --no-run
      - name: Run it, twenty release then twenty debug back to back
        env:
          SLATES_TEST_CLI: "1"
        run: |
          set +e
          pass=0
          for n in $(seq 1 20); do
            timeout 1200 cargo test --release --locked -p slates-cli --test v3_takeover -- --test-threads=1 --nocapture > "$RUNNER_TEMP/release-$n.log" 2>&1
            rc=$?; [ $rc -eq 0 ] && pass=$((pass + 1))
            echo "release $n rc=$rc $(date -u +%T) load $(cut -d' ' -f1-3 /proc/loadavg): $(grep -a '^test result' "$RUNNER_TEMP/release-$n.log" | tail -1)"
            grep -a -A2 'panicked at' "$RUNNER_TEMP/release-$n.log" | head -4 | cut -c1-300
          done
          for n in $(seq 1 20); do
            timeout 1800 cargo test --locked -p slates-cli --test v3_takeover -- --test-threads=1 --nocapture > "$RUNNER_TEMP/debug-$n.log" 2>&1
            rc=$?; [ $rc -eq 0 ] && pass=$((pass + 1))
            echo "debug $n rc=$rc $(date -u +%T) load $(cut -d' ' -f1-3 /proc/loadavg): $(grep -a '^test result' "$RUNNER_TEMP/debug-$n.log" | tail -1)"
            grep -a -A2 'panicked at' "$RUNNER_TEMP/debug-$n.log" | head -4 | cut -c1-300
          done
          echo "== gate 9: $pass of 40 passed"
          for f in "$RUNNER_TEMP"/*.log; do
            echo "-- $(basename "$f"): edge ends $(grep -ac 'ended early\|ends early\|ended the response\|cause' "$f") line(s), Unlanded $(grep -ac 'Unlanded' "$f")"
            grep -a 'Unlanded\|refused after its body\|fell short\|publication for generation\|ticket of generation\|answered a put of\|a region exchange ended with' "$f" | head -8 | cut -c1-400
          done
          exit 0
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-gate9
          path: ${{ runner.temp }}/*.log
