name: diag-main-v3
# main 01a20182 (2026-11-24 09:39 PST): gate 10 for the push-0/1 failure, at d48863ddb (w-shared's A-902: a Put and a
# PutPart's first part carry the sender's configuration version; a home not ranked by its own configuration and behind
# its sender waits within the budget for its next changing install, counted vcs_store.homes.install_waits / caught_up /
# elapsed). Gate 9 (45411079579) failed 3 of 40, each Refused(NotAHome) about 1 ms in. 0 of 40 closes it. Twenty release
# then twenty debug runs; each log grepped for the answer lines and the new counters. Run only from
# diag-measurer-main-v3-* branches, never main.
on:
  push:
    branches: ["diag-measurer-main-v3-*"]

env:
  CARGO_TERM_COLOR: never

jobs:
  v3:
    name: v3_takeover (gate 10 at d48863ddb)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d48863ddb3d330618e13050451d6703b7c243462
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the test, release and debug
        run: |
          git log -1 --format='at %h %s' | cut -c1-120
          cargo test --release --locked -p slates-cli --test v3_takeover --no-run
          cargo test --locked -p slates-cli --test v3_takeover --no-run
      - name: Run it, twenty release then twenty debug back to back
        env:
          SLATES_TEST_CLI: "1"
        run: |
          set +e
          pass=0
          for n in $(seq 1 20); do
            timeout 1200 cargo test --release --locked -p slates-cli --test v3_takeover -- --test-threads=1 --nocapture > "$RUNNER_TEMP/release-$n.log" 2>&1
            rc=$?; [ $rc -eq 0 ] && pass=$((pass + 1))
            echo "release $n rc=$rc $(date -u +%T) load $(cut -d' ' -f1-3 /proc/loadavg): $(grep -a '^test result' "$RUNNER_TEMP/release-$n.log" | tail -1)"
            grep -a -A2 'panicked at' "$RUNNER_TEMP/release-$n.log" | head -4 | cut -c1-300
          done
          for n in $(seq 1 20); do
            timeout 1800 cargo test --locked -p slates-cli --test v3_takeover -- --test-threads=1 --nocapture > "$RUNNER_TEMP/debug-$n.log" 2>&1
            rc=$?; [ $rc -eq 0 ] && pass=$((pass + 1))
            echo "debug $n rc=$rc $(date -u +%T) load $(cut -d' ' -f1-3 /proc/loadavg): $(grep -a '^test result' "$RUNNER_TEMP/debug-$n.log" | tail -1)"
            grep -a -A2 'panicked at' "$RUNNER_TEMP/debug-$n.log" | head -4 | cut -c1-300
          done
          echo "== gate 10: $pass of 40 passed"
          for f in "$RUNNER_TEMP"/*.log; do
            echo "-- $(basename "$f"): edge ends $(grep -ac 'ended early\|ends early\|ended the response\|cause' "$f") line(s), Unlanded $(grep -ac 'Unlanded' "$f")"
            grep -a 'Unlanded\|refused after its body\|fell short\|publication for generation\|ticket of generation\|answered a put of\|a region exchange ended with\|install_wait' "$f" | head -8 | cut -c1-400
          done
          exit 0
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-gate10
          path: ${{ runner.temp }}/*.log
