name: diag-main-v3
# main 01a20182 (2026-11-24 04:38 PST): gate 6 for the push-0 failure, at 77397a5f4 (w-git: a push keeps the side-band
# its request asked, and Unlanded names its cause on band 3; gate 5, run 45386968890, found Unlanded right after creation).
# barrier fixed the f=1 push loss (after 4 of 5, before 0 of 5), but push 0 was disconnected on the second consecutive
# debug v3_takeover run in both arms. w-git's ba4e4e35e logs why the edge ends a response early, with its cause; it is on
# main in b98233544. One arm at that commit: three release runs, then four debug runs back to back, one test thread. The
# anchor's stderr (and the daemons' under it) is copied to the test's stderr, so each run's log holds every daemon and
# anchor line; all are kept as the artifact. Run only from diag-measurer-main-v3-* branches, never main.
on:
  push:
    branches: ["diag-measurer-main-v3-*"]

env:
  CARGO_TERM_COLOR: never

jobs:
  v3:
    name: v3_takeover (gate 6 at 77397a5f4)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 77397a5f482d58a47aa169c1f2d74e2a57716fe2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the test, release and debug
        run: |
          git log -1 --format='at %h %s' | cut -c1-120
          cargo test --release --locked -p slates-cli --test v3_takeover --no-run
          cargo test --locked -p slates-cli --test v3_takeover --no-run
      - name: Run it, three release then four debug back to back
        env:
          SLATES_TEST_CLI: "1"
        run: |
          set +e
          pass=0
          for n in 1 2 3; do
            timeout 1200 cargo test --release --locked -p slates-cli --test v3_takeover -- --test-threads=1 --nocapture > "$RUNNER_TEMP/release-$n.log" 2>&1
            rc=$?; [ $rc -eq 0 ] && pass=$((pass + 1))
            echo "release $n rc=$rc $(date -u +%T) load $(cut -d' ' -f1-3 /proc/loadavg): $(grep -a '^test result' "$RUNNER_TEMP/release-$n.log" | tail -1)"
            grep -a -A2 'panicked at' "$RUNNER_TEMP/release-$n.log" | head -4 | cut -c1-300
          done
          for n in 1 2 3 4; do
            timeout 1800 cargo test --locked -p slates-cli --test v3_takeover -- --test-threads=1 --nocapture > "$RUNNER_TEMP/debug-$n.log" 2>&1
            rc=$?; [ $rc -eq 0 ] && pass=$((pass + 1))
            echo "debug $n rc=$rc $(date -u +%T) load $(cut -d' ' -f1-3 /proc/loadavg): $(grep -a '^test result' "$RUNNER_TEMP/debug-$n.log" | tail -1)"
            grep -a -A2 'panicked at' "$RUNNER_TEMP/debug-$n.log" | head -4 | cut -c1-300
          done
          echo "== gate 6: $pass of 7 passed"
          for f in "$RUNNER_TEMP"/*.log; do
            echo "-- $(basename "$f"): edge ends $(grep -ac 'ended early\|ends early\|ended the response\|cause' "$f") line(s)"
          done
          exit 0
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-gate6
          path: ${{ runner.temp }}/*.log
