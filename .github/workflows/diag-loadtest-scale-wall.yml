name: DIAG loadtest-scale -- the verdict maps through the deltas that changed its paths, after and red-checked (not for main)

# This commit's parent on ubuntu-latest and ubuntu-24.04-arm (after), and four variants of it on ubuntu-latest, each
# with one fix reverted in place before the build (before-*), running the test that holds it. Results are published as
# one commit per job on diag-loadtest-scale-wall-results-<run>-<job>, read with git.

on:
  push:
    branches: ['diag-loadtest-scale-wall-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  w3:
    name: ${{ matrix.variant }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: after, os: ubuntu-latest }
          - { variant: after, os: ubuntu-24.04-arm }
          - { variant: before-walk, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      RESULTS_BRANCH: diag-loadtest-scale-wall-results-${{ github.run_id }}-${{ matrix.variant }}-${{ matrix.os }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}
      - name: suites
        shell: bash
        run: |
          set -u +e +o pipefail
          out="$RUNNER_TEMP/results.txt"; : > "$out"
          step() { name=$1; shift; start=$(date +%s); "$@" > "$RUNNER_TEMP/$name.log" 2>&1; code=$?
            echo "$name exit $code $(( $(date +%s) - start ))s" >> "$out"
            grep -E '^test result|FAILED|panicked|^error|left:|right:|assertion|refused|head reached|partition snapshot|meets|unknown|released|did not hold|outlived|once the floor|kept forward|consulted|---- ' "$RUNNER_TEMP/$name.log" | head -80 | sed "s/^/  $name: /" >> "$out"; }
          echo "tested $(git rev-parse HEAD^) variant $VARIANT on $(uname -m), $(nproc) cpus" >> "$out"
          revert() { perl -0pi -e "$2" "$1"; if git diff --quiet -- "$1"; then echo "REVERT DID NOT APPLY to $1" >> "$out"; else git diff --stat -- "$1" | sed 's/^/  reverted: /' >> "$out"; fi; }
          case "$VARIANT" in
            after)
              step merge cargo test -p slates-merge --no-fail-fast
              step server-lib cargo test -p slates-server --lib
              step server-tests cargo test -p slates-server --test green_checkpoint --test green_retention --test green_post_state --test merge_load --test recovery --test checkout --test daemon --test forward_retry --no-fail-fast
              step client-merge cargo test -p slates-client --test merge_identity --test merge_chaos --test merge_post_state --test client --no-fail-fast
              step clippy cargo clippy --workspace --all-targets -- -D warnings
              ;;
            before-walk)
              revert crates/merge/src/engine.rs 's/    if base < self\.folded_below \{\n      return self\.intervening_walk\(path, base\);\n    \}/    if base < u64::MAX {\n      return self.intervening_walk(path, base);\n    }/s'
              step verdict cargo test -p slates-merge --test engine -- a_verdict_consults_only --nocapture
              ;;
          esac
          git checkout -- . 2>/dev/null
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          blob=$(git hash-object -w "$out")
          tree=$(printf '100644 blob %s\tresults.txt\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "wall results of run $GITHUB_RUN_ID, $VARIANT on ${{ matrix.os }}")
          git push origin "$commit:refs/heads/$RESULTS_BRANCH" || echo "::warning::could not publish the results"
