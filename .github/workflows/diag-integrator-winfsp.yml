# DIAG (not for main): live_winfsp.rs (A-292's Windows side, g244): a live-shipped volume's FlushFileBuffers through a
# WinFsp drive answered only once a candidate holds it; never run by CI. Three runs each, on x86_64 and arm64 Windows.
name: diag-integrator-winfsp
on:
  push:
    branches: ['diag-integrator-winfsp-*']
env:
  CARGO_TERM_COLOR: never
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a
  DOWNLOAD_RETRIES: "20"
  DOWNLOAD_RETRY_SECONDS: "60"
  DOWNLOAD_TRY_SECONDS: "120"
jobs:
  live-winfsp:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl for the C the daemon links (arm64)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install WinFsp
        timeout-minutes: 45
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi -MaximumRetryCount $env:DOWNLOAD_RETRIES -RetryIntervalSec $env:DOWNLOAD_RETRY_SECONDS -TimeoutSec $env:DOWNLOAD_TRY_SECONDS
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build the test
        run: cargo test --locked -p slates-cli --test live_winfsp --no-run
      - name: live_winfsp, three runs
        shell: bash
        env:
          SLATES_TEST_CLI: "1"
          WINFSP_TEST_MOUNT: "1"
        run: |
          failed=0
          for run in 1 2 3; do
            began=$(date +%s)
            cargo test --locked -p slates-cli --test live_winfsp -- --test-threads=1 --nocapture > target/live-winfsp-run-$run.log 2>&1; code=$?
            echo "run $run exit $code took $(( $(date +%s) - began ))s" | tee -a target/live-winfsp-results.txt
            grep -E "skipping|SKIP|test result|panicked|gave up" target/live-winfsp-run-$run.log | cut -c1-2000 | tee -a target/live-winfsp-results.txt
            [ $code -eq 0 ] || failed=$((failed+1))
          done
          [ $failed -eq 0 ]
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-winfsp-${{ matrix.os }}
          path: target/live-winfsp-*
