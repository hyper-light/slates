name: DIAG who owns what on the Windows runners (not for main)

on:
  push:
    branches: ['diag-winfsp-bench-land-[0-9]*']

permissions:
  contents: write

jobs:
  owners:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Owners and the token
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Say($label, [scriptblock]$what) {
            try { "$label $(& $what)" } catch { "$label FAILED: $_" }
          }
          $probe = Join-Path $env:GITHUB_WORKSPACE 'target\tmp\probe'
          New-Item -ItemType Directory -Force $probe | Out-Null
          $lines = @(
            (Say 'user' { [Security.Principal.WindowsIdentity]::GetCurrent().Name }),
            (Say 'user sid' { [Security.Principal.WindowsIdentity]::GetCurrent().User.Value }),
            (Say 'token default owner' { [Security.Principal.WindowsIdentity]::GetCurrent().Owner.Translate([Security.Principal.NTAccount]).Value }),
            (Say 'elevated' { ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator) }),
            (Say 'workspace owner' { (Get-Acl $env:GITHUB_WORKSPACE).Owner }),
            (Say 'crates\server owner' { (Get-Acl (Join-Path $env:GITHUB_WORKSPACE 'crates\server')).Owner }),
            (Say 'a directory this step makes, owner' { (Get-Acl $probe).Owner })
          )
          $lines | Out-File results.txt -Encoding ascii
      - name: Publish
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          [ -f results.txt ] || echo "the probe step wrote nothing" > results.txt
          git config user.name diag; git config user.email diag@invalid
          tree=$(printf '100644 blob %s\tresults.txt\n' "$(git hash-object -w results.txt)" | git mktree)
          commit=$(git commit-tree "$tree" -m probe)
          git push -f origin "$commit:refs/heads/diag-winfsp-bench-land-results-probe-${{ matrix.runner }}"
