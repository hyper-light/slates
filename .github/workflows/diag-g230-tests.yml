# DIAG (not for main): g230's focused fleet tests on Linux x86_64 -- the two takeover tests held to the design's rule,
# on the test-fix branch merged with main.
name: diag-g230-tests
on:
  push:
    branches: ['diag-g230-tests-*']
env:
  CARGO_TERM_COLOR: never
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the fleet test binary
        run: cargo test --locked -p slates-server --test fleet --no-run
      - name: The focused tests
        env:
          G230_TESTS: a_greens_policy_signers_and_verdicts_survive_its_owner a_volumes_policy_and_signers_survive_its_owner a_takeover_round_started_over_under_a_new_configuration_keeps_its_adoptions_writable a_takeover_adopts_the_newest_head_a_holder_left_out_of_its_pages a_successor_restarted_before_any_write_keeps_the_live_volume_it_took_over a_successors_live_log_goes_on_past_every_position_durable_before_it a_takeovers_envelope_is_opened_in_turns_and_served a_successors_takeover_report_survives_its_warm_restart
        run: |
          set -u
          for t in ${G230_TESTS}; do
            for n in 1; do
              timeout 900 cargo test --locked -p slates-server --test fleet -- --exact "$t" --nocapture > "out-$t-$n.log" 2>&1; code=$?
              echo "== $t run $n exit $code"
              grep -E "^(reached walk|restarted round|a write after the successor|held for good)|panicked at|test result" -A 1 "out-$t-$n.log" | cut -c1-300
            done
          done
