# DIAG, not for main: main's KIND job at 1c49c33f, unchanged but for runs-on ubuntu-24.04 (and its legs' output kept), to tell
# the ubuntu-26.04 image from B7's code.
name: DIAG KIND on ubuntu-24.04 (not for main)
'on':
  push:
    branches:
    - diag-release-10
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a
  DOWNLOAD_RETRIES: '20'
  DOWNLOAD_RETRY_SECONDS: '60'
  DOWNLOAD_TRY_SECONDS: '120'
  KIND_URL: https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  KUBECTL_URL: https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl
  KUBECTL_SHA256: a2e984a18a0c063279d692533031c1eff93a262afcc0afdc517375432d060989
jobs:
  kind:
    name: KIND fleet lane (chart, formation, takeover, scale, WAN profiles)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.98.1
    - uses: Swatinem/rust-cache@v2
    - uses: azure/setup-helm@v4
      with:
        version: v4.3.0
    - name: Install kind and kubectl
      id: kind_tools
      timeout-minutes: 45
      run: "set -euo pipefail\nbin=\"$RUNNER_TEMP/kind-tools\"\nmkdir -p \"$bin\"\nfetch() {\n  curl --fail --silent --show-error --location --retry \"$DOWNLOAD_RETRIES\" --retry-delay \"$DOWNLOAD_RETRY_SECONDS\" \\\n    --retry-all-errors --max-time \"$DOWNLOAD_TRY_SECONDS\" --output \"$2\" \"$1\" \\\n    || { echo \"::error::could not download $1 after $DOWNLOAD_RETRIES retries; the KIND lane needs it, so the job stops here\"; exit 1; }\n}\nfetch \"$KIND_URL\" \"$bin/kind\"\necho \"$KIND_SHA256  $bin/kind\" | sha256sum -c -\nfetch \"$KUBECTL_URL\" \"$bin/kubectl\"\necho \"$KUBECTL_SHA256  $bin/kubectl\" | sha256sum -c -\nchmod +x \"$bin/kind\" \"$bin/kubectl\"\necho \"$bin\" >> \"$GITHUB_PATH\"\n"
    - name: The chart's gates (helm lint; the golden render)
      run: cargo test -p xtask --test helm_chart
    - name: The kernel's TLS record layer and NFS client (for the export leg)
      run: sudo modprobe tls && sudo modprobe nfs && sudo modprobe nfsv4
    - name: The export leg (kubelet's nfs PersistentVolume over RPC-with-TLS)
      run: 'set -o pipefail

        cargo xtask kind export --require-kernel-tls 2>&1 | tee "$RUNNER_TEMP/kind-export.log"'
      id: export
      shell: bash
    - name: The direct leg (a pod's process maps a file by the direct map)
      if: ${{ (success() || failure()) && steps.kind_tools.outcome == 'success' }}
      run: 'set -o pipefail

        cargo xtask kind direct 2>&1 | tee "$RUNNER_TEMP/kind-direct.log"'
      id: direct
      shell: bash
    - name: The lane, end to end (the cluster is deleted at the end whatever happens)
      if: ${{ (success() || failure()) && steps.kind_tools.outcome == 'success' }}
      run: 'set -o pipefail

        cargo xtask kind all 2>&1 | tee "$RUNNER_TEMP/kind-all.log"'
      id: all
      shell: bash
    - name: Publish the results to a diag-results branch
      if: always()
      shell: bash
      run: 'out="$RUNNER_TEMP/summary.txt"

        echo "image: $ImageOS $ImageVersion; kernel $(uname -r)" > "$out"

        echo "export=${{ steps.export.outcome }} direct=${{ steps.direct.outcome }} all=${{ steps.all.outcome }}" >> "$out"

        for l in export direct all; do f="$RUNNER_TEMP/kind-$l.log"; [ -f "$f" ] || continue; echo "=== $l: $(wc -l < "$f") lines" >> "$out"; grep -n -E "peers_probed|configuration_version|ConsensusRecoveryUnavailable|^kind: (ok|FAIL|error|leg|the lane)|panicked|error:|Error" "$f" | head -60 >> "$out"; tail -15 "$f" >> "$out"; done

        git config user.name diag-release; git config user.email diag-release@users.noreply.github.com

        blob=$(git hash-object -w "$out"); tree=$(printf "100644 blob %s\tsummary.txt\n" "$blob" | git mktree)

        c=$(echo "results of run ${{ github.run_id }}" | git commit-tree "$tree")

        git push origin "$c:refs/heads/diag-results/release-10-kind-2404"'
    permissions:
      contents: write
