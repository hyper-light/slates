# DIAG, not for main: ci.yml's real WinFsp and kind install steps, the good path and a red check of each.
name: DIAG download retries (not for main)
'on':
  push:
    branches:
    - diag-release-*
permissions:
  contents: read
env:
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a
  DOWNLOAD_RETRIES: '20'
  DOWNLOAD_RETRY_SECONDS: '60'
  DOWNLOAD_TRY_SECONDS: '120'
  KIND_URL: https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  KUBECTL_URL: https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl
  KUBECTL_SHA256: a2e984a18a0c063279d692533031c1eff93a262afcc0afdc517375432d060989
jobs:
  winfsp-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - name: Install WinFsp
      id: winfsp
      timeout-minutes: 45
      run: "$msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'\ntry {\n  Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi -MaximumRetryCount $env:DOWNLOAD_RETRIES -RetryIntervalSec $env:DOWNLOAD_RETRY_SECONDS -TimeoutSec $env:DOWNLOAD_TRY_SECONDS\n} catch {\n  throw \"WinFsp's installer could not be downloaded from $env:WINFSP_MSI_URL after $env:DOWNLOAD_RETRIES retries ($_). The job stops here: the steps after this one need WinFsp.\"\n}\n$found = (Get-FileHash $msi -Algorithm SHA256).Hash\nif ($found -ne $env:WINFSP_MSI_SHA256) { throw \"WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256\" }\n$install = Start-Process msiexec -ArgumentList '/i', \"`\"$msi`\"\", '/qn', '/norestart' -Wait -PassThru\nif ($install.ExitCode -ne 0) { throw \"WinFsp's installer answered $($install.ExitCode)\" }\n\"C:\\Program Files (x86)\\WinFsp\\bin\" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8\n"
    - &id001
      name: Guarded step (must run only when the install succeeded)
      if: ${{ !cancelled() && steps.winfsp.outcome == 'success' }}
      run: 'Write-Output "DIAG: the guarded step ran"; & "C:/Program Files (x86)/WinFsp/bin/fsptool-x64.exe" ver 2>&1 | Select-Object -First 3'
      shell: pwsh
  winfsp-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
    - name: Install WinFsp (native arm64 Windows)
      id: winfsp
      if: ${{ !cancelled() }}
      timeout-minutes: 45
      run: "$msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'\ntry {\n  Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi -MaximumRetryCount $env:DOWNLOAD_RETRIES -RetryIntervalSec $env:DOWNLOAD_RETRY_SECONDS -TimeoutSec $env:DOWNLOAD_TRY_SECONDS\n} catch {\n  throw \"WinFsp's installer could not be downloaded from $env:WINFSP_MSI_URL after $env:DOWNLOAD_RETRIES retries ($_). The job stops here: the steps after this one need WinFsp.\"\n}\n$found = (Get-FileHash $msi -Algorithm SHA256).Hash\nif ($found -ne $env:WINFSP_MSI_SHA256) { throw \"WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256\" }\n$install = Start-Process msiexec -ArgumentList '/i', \"`\"$msi`\"\", '/qn', '/norestart' -Wait -PassThru\nif ($install.ExitCode -ne 0) { throw \"WinFsp's installer answered $($install.ExitCode)\" }\n\"C:\\Program Files (x86)\\WinFsp\\bin\" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8\n"
    - name: Guarded step (must run only when the install succeeded)
      if: ${{ !cancelled() && steps.winfsp.outcome == 'success' }}
      run: 'Write-Output "DIAG: the guarded step ran"'
      shell: pwsh
  winfsp-red:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - name: Install WinFsp
      id: winfsp
      timeout-minutes: 45
      run: "$msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'\ntry {\n  Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi -MaximumRetryCount $env:DOWNLOAD_RETRIES -RetryIntervalSec $env:DOWNLOAD_RETRY_SECONDS -TimeoutSec $env:DOWNLOAD_TRY_SECONDS\n} catch {\n  throw \"WinFsp's installer could not be downloaded from $env:WINFSP_MSI_URL after $env:DOWNLOAD_RETRIES retries ($_). The job stops here: the steps after this one need WinFsp.\"\n}\n$found = (Get-FileHash $msi -Algorithm SHA256).Hash\nif ($found -ne $env:WINFSP_MSI_SHA256) { throw \"WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256\" }\n$install = Start-Process msiexec -ArgumentList '/i', \"`\"$msi`\"\", '/qn', '/norestart' -Wait -PassThru\nif ($install.ExitCode -ne 0) { throw \"WinFsp's installer answered $($install.ExitCode)\" }\n\"C:\\Program Files (x86)\\WinFsp\\bin\" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8\n"
      env:
        WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/no-such-file.msi
        DOWNLOAD_RETRIES: '2'
        DOWNLOAD_RETRY_SECONDS: '2'
    - *id001
  kind-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Install kind and kubectl
      id: kind_tools
      timeout-minutes: 45
      run: "set -euo pipefail\nbin=\"$RUNNER_TEMP/kind-tools\"\nmkdir -p \"$bin\"\nfetch() {\n  curl --fail --silent --show-error --location --retry \"$DOWNLOAD_RETRIES\" --retry-delay \"$DOWNLOAD_RETRY_SECONDS\" \\\n    --retry-all-errors --max-time \"$DOWNLOAD_TRY_SECONDS\" --output \"$2\" \"$1\" \\\n    || { echo \"::error::could not download $1 after $DOWNLOAD_RETRIES retries; the KIND lane needs it, so the job stops here\"; exit 1; }\n}\nfetch \"$KIND_URL\" \"$bin/kind\"\necho \"$KIND_SHA256  $bin/kind\" | sha256sum -c -\nfetch \"$KUBECTL_URL\" \"$bin/kubectl\"\necho \"$KUBECTL_SHA256  $bin/kubectl\" | sha256sum -c -\nchmod +x \"$bin/kind\" \"$bin/kubectl\"\necho \"$bin\" >> \"$GITHUB_PATH\"\n"
    - name: Show the pinned tools
      run: which kind kubectl; kind version; kubectl version --client
  kind-red:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Install kind and kubectl
      id: kind_tools
      timeout-minutes: 45
      run: "set -euo pipefail\nbin=\"$RUNNER_TEMP/kind-tools\"\nmkdir -p \"$bin\"\nfetch() {\n  curl --fail --silent --show-error --location --retry \"$DOWNLOAD_RETRIES\" --retry-delay \"$DOWNLOAD_RETRY_SECONDS\" \\\n    --retry-all-errors --max-time \"$DOWNLOAD_TRY_SECONDS\" --output \"$2\" \"$1\" \\\n    || { echo \"::error::could not download $1 after $DOWNLOAD_RETRIES retries; the KIND lane needs it, so the job stops here\"; exit 1; }\n}\nfetch \"$KIND_URL\" \"$bin/kind\"\necho \"$KIND_SHA256  $bin/kind\" | sha256sum -c -\nfetch \"$KUBECTL_URL\" \"$bin/kubectl\"\necho \"$KUBECTL_SHA256  $bin/kubectl\" | sha256sum -c -\nchmod +x \"$bin/kind\" \"$bin/kubectl\"\necho \"$bin\" >> \"$GITHUB_PATH\"\n"
      env:
        KIND_URL: https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/no-such-file
        DOWNLOAD_RETRIES: '1'
        DOWNLOAD_RETRY_SECONDS: '2'
    - name: Guarded KIND step (must be skipped)
      if: ${{ (success() || failure()) && steps.kind_tools.outcome == 'success' }}
      run: 'echo "DIAG: the guarded kind step ran"'
