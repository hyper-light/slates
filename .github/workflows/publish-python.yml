# The Python SDK's release lane (§2.4 "`slates` on PyPI"; docs/publish.md). On a pushed tag
# `v<version>`: build the cp39-abi3 wheel of crates/sdk-python (one wheel per platform serves every
# CPython >= 3.9) for the targets slates ships (A-210): manylinux and musllinux (x86_64, aarch64), macOS arm64 and
# Windows (x64, arm64), each on a runner of its own platform, plus the sdist; check every artifact's metadata; and on
# a tag publish to PyPI through TRUSTED
# PUBLISHING — OIDC from the `pypi` environment's id-token; no API token anywhere. PyPI registers a
# *pending* trusted publisher for a project that does not exist yet, so no maintainer upload ever
# happens (the one-time registration is in docs/publish.md). workflow_dispatch is a dry run: it builds and checks every
# artifact and publishes nothing (the publish job runs on a tag only).
#
# The version is the workspace's: maturin reads it from the crate manifest (`dynamic = ["version"]`
# in pyproject.toml), and the shared guard refuses a tag that does not name it.
name: Publish Python SDK

on:
  push:
    # Never on a test of the binary release lane (`v<version>-test.N`, release.yml): a test publishes nothing.
    tags: ["v*", "!v*-test.*"]
    branches: ["diag-release-9"] # DIAG only: the release dry run on one push; publishing jobs are tag-only
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    uses: ./.github/workflows/version-guard.yml

  wheels:
    name: wheel ${{ matrix.name }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto }
          # Native builds on the arm64 runners: an explicit target makes maturin demand a cross
          # linker the manylinux/musllinux images lack (vorpal's finding, publish-python.yml).
          - { name: linux-aarch64, os: ubuntu-24.04-arm, manylinux: auto }
          - { name: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, manylinux: musllinux_1_2 }
          - { name: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: windows-x64, os: windows-2025, target: x64, nasm: true }
          # Native arm64 Windows (windows-11-arm), an arm64 CPython, and clang-cl for AWS-LC, as release.yml builds it.
          - { name: windows-arm64, os: windows-11-arm, target: aarch64, python_arch: arm64, clang_cl: true }
    env:
      # The extension links AWS-LC (slates-client's seal). Its Windows x86 assembly is built from its NASM source, never
      # the prebuilt objects, as release.yml and CI build it (ignored elsewhere).
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM
        if: ${{ matrix.nasm }}
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl for the C the extension links (arm64 Windows)
        if: ${{ matrix.clang_cl }}
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          & $clang --version
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch || '' }}
      - uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          target: ${{ matrix.target || '' }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist -m crates/sdk-python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  sdist:
    name: sdist
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          command: sdist
          args: --out dist -m crates/sdk-python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: dist
          if-no-files-found: error

  # Every run, the dry run too: PyPI's own metadata and README check over every artifact, so a refused artifact fails
  # here, before any tag, and not halfway through an upload.
  check:
    name: every artifact passes twine check
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check every artifact's metadata
        run: |
          ls -l dist
          pipx run twine check --strict dist/*

  publish:
    name: Publish slates to PyPI (trusted publishing)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC: PyPI trusted publishing — no token
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The check PyPI applies to metadata and the README rendering, run before anything is uploaded
      # so a refused artifact fails here with its reason, not halfway through an upload.
      - name: Check every artifact's metadata
        run: pipx run twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true # a re-run after a moved tag must not 400 on duplicates

  # DIAG only: every job's result, published to a branch so the run is read with git, not the API.
  diag-results:
    name: DIAG results
    if: always()
    needs: [guard, wheels, sdist, check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the results
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" > "$RUNNER_TEMP/summary.json"
          git config user.name diag-release; git config user.email diag-release@users.noreply.github.com
          blob=$(git hash-object -w "$RUNNER_TEMP/summary.json"); tree=$(printf "100644 blob %s\tsummary.json\n" "$blob" | git mktree)
          c=$(echo "results of run ${{ github.run_id }} (publish-python)" | git commit-tree "$tree")
          git push origin "$c:refs/heads/diag-results/release-9-publish-python"
