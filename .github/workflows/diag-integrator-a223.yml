# DIAG (not for main): A-223's tests (g234: a Windows wake learned only from a sleep its own switch count confirms; the
# window rule; A-326) on Windows x86_64 and arm64, three runs each, one test at a time (the supervisor's ask of
# 2026-11-18 10:58 UTC).
name: diag-integrator-a223
on:
  push:
    branches: ['diag-integrator-a223-*']
env:
  CARGO_TERM_COLOR: never
jobs:
  a223-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl for the C the daemon links (arm64)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build A-223's test targets
        shell: bash
        run: |
          began=$(date +%s)
          cargo test --locked -p slates-machine --lib --no-run
          cargo test --locked -p slates-rt --test wake_estimate --no-run
          cargo test --locked -p slates-ipc --test rings --no-run
          cargo test --locked -p slates-server --test closed_loop --no-run
          echo "build $(( $(date +%s) - began ))s" | tee -a a223-results.txt
      - name: A-223's tests, three runs each, one test at a time
        shell: bash
        run: |
          failed=0
          for run in 1 2 3; do
            for target in "slates-machine --lib" "slates-rt --test wake_estimate" "slates-ipc --test rings" "slates-server --test closed_loop"; do
              tag=$(echo "$target" | tr ' ' '_' | tr -d '-')
              began=$(date +%s)
              cargo test --locked -p $target -- --test-threads=1 > a223-run-$run-$tag.log 2>&1; code=$?
              echo "run $run $target exit $code took $(( $(date +%s) - began ))s" | tee -a a223-results.txt
              grep -E "test result|FAILED|panicked" a223-run-$run-$tag.log | cut -c1-400 | tee -a a223-results.txt
              [ $code -eq 0 ] || failed=$((failed+1))
            done
          done
          [ $failed -eq 0 ]
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a223-${{ matrix.os }}
          path: a223-*
