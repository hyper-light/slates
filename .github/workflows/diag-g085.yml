# DIAG, not for main (g085): the Windows landing writer (A-185) and the daemon's unit tests on CI's Windows runners,
# with the Unix side of the same focused tests on ubuntu and macOS.
name: DIAG g085 Windows landing (not for main)

on:
  push:
    branches: ["diag-g085-*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a
  DOWNLOAD_RETRIES: "20"
  DOWNLOAD_RETRY_SECONDS: "60"
  DOWNLOAD_TRY_SECONDS: "120"

jobs:
  windows:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, nasm: true }
          - { runner: windows-11-arm, clang_cl: true }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - name: Install NASM
        if: ${{ matrix.nasm }}
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl for the C the daemon links (arm64)
        if: ${{ matrix.clang_cl }}
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Machine
        shell: pwsh
        run: |
          Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors, TotalPhysicalMemory
          Get-CimInstance Win32_OperatingSystem | Select-Object Version, TotalVirtualMemorySize, FreeVirtualMemory
          whoami
          whoami /groups | Select-String 'S-1-5-32-544'
          New-Item -ItemType Directory -Path owner-probe | Out-Null
          "DIAG: the owner Windows gives a directory this runner makes: " + (Get-Acl owner-probe).Owner
      - name: Every target of the touched crates compiles for Windows (check, no lints)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: cargo check --locked --keep-going -p slates-land -p slates-base -p slates-server -p slates-client -p slates-mcp --all-targets
      - name: The land suite (debug)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: bash
        run: |
          set +e
          started=$(date +%s)
          cargo test --locked -p slates-land > land.log 2>&1
          status=$?
          grep -E '^test |test result|panicked|left:|right:|attributes' land.log
          echo "DIAG: land suite (debug, build included) took $(( $(date +%s) - started )) s, exit $status"
          if [ $status -ne 0 ]; then tail -150 land.log; fi
          exit $status
      - name: The base host
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test --locked -p slates-base
      - name: The daemon's unit tests, one test at a time
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: bash
        run: |
          set +e
          started=$(date +%s)
          cargo test --locked -p slates-server --lib -- --test-threads=1 > lib.log 2>&1
          status=$?
          grep -E '^test .*landing|test result|panicked|FAILED|failures|^    [a-z_:]+$' lib.log
          echo "DIAG: server lib (build included) took $(( $(date +%s) - started )) s, exit $status"
          if [ $status -ne 0 ]; then tail -150 lib.log; fi
          exit $status
      - name: The two landing tests and their file (presentations.rs), one test at a time
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test --locked -p slates-server --test presentations -- --test-threads=1
      - name: The landing suites through the daemon, each binary run whatever another did, one test at a time
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        shell: bash
        run: |
          set +e
          started=$(date +%s)
          cargo test --locked --no-fail-fast -p slates-server --test lease --test snapshot_landing --test landing_fairness --test write_policy --test checkout --test signed_work --test presentation_fairness -- --test-threads=1 > suites.log 2>&1
          status=$?
          grep -E 'Running tests|test result|panicked|FAILED|failures:|^    [a-z_]+$' suites.log
          echo "DIAG: landing suites (build included) took $(( $(date +%s) - started )) s, exit $status"
          if [ $status -ne 0 ]; then tail -200 suites.log; fi
          exit $status
      - name: A killed client's presentation goes with it (client presentation.rs)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test --locked -p slates-client --test presentation -- --test-threads=1
      - name: A landed write reaches a fresh DAX map (client shards suite, the new test)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test --locked -p slates-client --test shards -- --test-threads=1 a_write_through_another_attachment_landed_on_the_disk_reaches_a_fresh_map
      - name: The MCP surface, landing included (slates-mcp's test)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          started=$(date +%s)
          cargo test --locked -p slates-mcp --test mcp -- --nocapture > mcp.log 2>&1
          status=$?
          grep -E 'test result|panicked|left:|right:' mcp.log
          echo "DIAG: mcp test (build included) took $(( $(date +%s) - started )) s, exit $status"
          if [ $status -ne 0 ]; then tail -120 mcp.log; fi
          exit $status
      - name: Install WinFsp
        id: winfsp
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi -MaximumRetryCount $env:DOWNLOAD_RETRIES -RetryIntervalSec $env:DOWNLOAD_RETRY_SECONDS -TimeoutSec $env:DOWNLOAD_TRY_SECONDS
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: A landing target and a base on the daemon's own WinFsp drive are refused (A-227)
        if: ${{ !cancelled() && steps.winfsp.outcome == 'success' }}
        timeout-minutes: 30
        env:
          SLATES_TEST_CLI: "1"
          WINFSP_TEST_MOUNT: "1"
        run: cargo test --locked -p slates-cli --test winfsp -- --test-threads=1 --nocapture a_landing_target_on_the_daemons_own_drive_is_refused_before_any_open a_base_on_the_daemons_own_drive_is_refused_before_any_open
      - name: The land suite (release, for the timing)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: bash
        run: |
          set +e
          started=$(date +%s)
          cargo test --locked --release -p slates-land > land-release.log 2>&1
          status=$?
          grep -E 'test result|panicked' land-release.log
          echo "DIAG: land suite (release, build included) took $(( $(date +%s) - started )) s, exit $status"
          if [ $status -ne 0 ]; then tail -150 land-release.log; fi
          exit $status
  unix:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - name: The land suite
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: cargo test --locked -p slates-land
      - name: The daemon's landing unit tests
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: cargo test --locked -p slates-server --lib landing
      - name: The presentations suite and the suites whose enrolment now reads the channel's account
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: cargo test --locked --no-fail-fast -p slates-server --test presentations --test write_policy --test signed_work -- --test-threads=1
