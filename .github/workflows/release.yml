# The nine-target release lane (Appendix B.2). In Phase 0 this is a dry run: every target
# builds the workspace in release mode; the binary and asset steps arrive with the `slates`
# CLI in Phase 2. The shared `version-guard.yml` asserts the git tag names the workspace version
# (and that the npm copies are derived from it); the SDK publish lanes (publish-python.yml,
# publish-node.yml) run on the same tag with the same guard (docs/publish.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    uses: ./.github/workflows/version-guard.yml

  build:
    name: ${{ matrix.target }}
    needs: [guard]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-apple-darwin, runner: macos-latest }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
          - { target: aarch64-pc-windows-msvc, runner: windows-latest }
          - { target: i686-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.musl }}
        with:
          toolchain: 1.98.0 # keep in sync with rust-toolchain.toml
          targets: ${{ matrix.target }}
      - name: Build (native or cross via --target)
        if: ${{ !matrix.musl }}
        run: cargo build --release --workspace --target ${{ matrix.target }}
      # musl lanes build inside the official rust:alpine container, native per arch, with
      # +crt-static for binaries; cdylibs get -crt-static from .cargo/config.toml (B.2).
      - name: Build (musl, in the rust:1.98-alpine container)
        if: ${{ matrix.musl }}
        run: |
          docker run --rm -v "$PWD":/work -w /work rust:1.98-alpine sh -c '
            apk add --no-cache build-base &&
            RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --workspace --target ${{ matrix.target }}'
