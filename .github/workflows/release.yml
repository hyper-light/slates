# The binary release (Appendix B.2; AC-9.5; docs/publish.md "The binary release"). One `slates` binary serves as the
# anchor, the daemon and every client verb, so a release is one raw binary per platform, built natively on that
# platform, started there before it is attached, and described by checksums and signed build provenance:
#
#   1. `guard` — the shared version guard: the tag must be `v` + the workspace version (a release) or that + `-test.N`
#      (a test of this lane; `cargo xtask version --allow-test-tag`). The SDK publish lanes never start on a test tag.
#   2. `build` — each target natively on its own runner: macOS arm64, Linux x86_64 and arm64 (glibc, and static musl
#      inside the official rust:alpine image), Windows x86_64 and arm64 with the C runtime linked statically. Then
#      the release lane's smoke task (`cargo run -p xtask --bin release -- smoke`) runs the built bytes as a person installing them would (the binary names its
#      version, the anchor starts and its daemon serves, a volume provisions, a file round-trips through one client and
#      reads back through another, the daemon leaves with its anchor) and records their digests and each step's time.
#      The musl binaries must be static; the Windows x86_64 binary must start in Nano Server, which has no Visual C++
#      runtime.
#      Every target is built twice, each copy on a runner of its own (`copy: build` and `copy: rebuild`), and the
#      release is refused unless the two are byte for byte the same (AC-9.5: reproducible from the tag).
#   3. `stage` (every run, read-only) — the artifacts task (`--bin release -- artifacts`) refuses a release missing a
#      target, carrying bytes no smoke test ran, or whose two copies differ, and writes SHA256SUMS,
#      slates-provenance.json, the draft's notes and the publish plan; `sha256sum --check` holds the staged binaries to
#      SHA256SUMS; everything is kept as the run's `release-staged` artifact, and the plan is the job's summary.
#   4. `release` (tags only; the one job holding write permissions) — takes the `release-staged` artifact, checks it
#      against SHA256SUMS again, has GitHub's artifact attestation sign SLSA build provenance for every binary
#      (Sigstore, through this job's OIDC identity: no key or secret exists), and attaches the binaries, the checksums,
#      the provenance and the attestation bundle to a DRAFT release.
#
# Nothing here publishes. A draft is visible only to the repository's maintainers until one of them publishes it
# (`gh release edit vX.Y.Z --draft=false`, or "Publish release" on the draft) — that is the one approved step. A test
# tag's draft is a pre-release titled as a test, and is never published.
#
# workflow_dispatch is the DRY RUN (A-320): guard, build and stage run as on a tag, with `--dry-run` for the tag, so
# the checksums, the comparison of each target's two copies and the provenance are made and checked, and the staged
# release is kept as the run's `release-staged` artifact. The `release` job does not run: a dry run signs nothing (on
# this public repository a Sigstore signature is a public record) and makes no release, and none of its jobs holds a
# permission that could. `gh workflow run release.yml --ref <branch>` starts one.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    uses: ./.github/workflows/version-guard.yml
    with:
      allow-test-tag: true

  build:
    name: ${{ matrix.asset }} (${{ matrix.copy }})
    needs: [guard]
    strategy:
      fail-fast: false
      matrix:
        # The targets and asset names are `ASSETS` in xtask/src/targets.rs; the artifacts task refuses a release that
        # lacks one. Each is built twice, on separate runners: the release ships `build` and requires `rebuild` to be
        # the same bytes (AC-9.5).
        target:
          - aarch64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
        copy: [build, rebuild]
        include:
          - { target: aarch64-apple-darwin, runner: macos-latest, asset: slates-macos-arm64 }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, asset: slates-linux-x64 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, asset: slates-linux-arm64 }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, asset: slates-linux-x64-musl, musl: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, asset: slates-linux-arm64-musl, musl: true }
          # windows-2025, not windows-latest: Nano Server ltsc2025 runs process-isolated only on a 2025 host.
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, asset: slates-windows-x64.exe, windows: true, nasm: true, msvc_arch: x64 }
          # Native arm64 Windows (GitHub's windows-11-arm image), where aws-lc-sys builds with clang-cl.
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, asset: slates-windows-arm64.exe, windows: true, clang_cl: true, msvc_arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # AWS-LC's Windows x86 assembly is built from its NASM source, never the prebuilt objects (ignored elsewhere).
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM
        if: ${{ matrix.nasm }}
        uses: ilammy/setup-nasm@v1.5.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          targets: ${{ matrix.target }}
      # The MSVC toolset is pinned, so a tag's Windows bytes do not depend on the runner's image (A-411). Visual Studio's
      # default toolset moves with every image update, and its linker and its C runtime objects, which `+crt-static`
      # links in, went into the binary: the tag v0.1.0's two x86_64 copies, on windows-2025 20261103.298.1 and
      # 20261116.315.1, differed in 2,559,679 bytes, and their Rich headers differed only in those tools (linker 14.51
      # build 36260 against 14.52 build 37029; runtime objects 35721 against 36815), the Windows SDK's 204 objects alike
      # (build 33145). Both images, and the arm64 one, carry VS 2022 17.14's toolset 14.44 beside the default
      # (`Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64` and `.ARM64`; actions/runner-images' readmes,
      # 2026-11-18), and a side-by-side toolset is serviced apart from the default; the SDK is pinned to its one version.
      - name: MSVC toolset 14.44 and Windows SDK 10.0.26100.0, pinned
        if: ${{ matrix.windows }}
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}
          toolset: "14.44"
          sdk: 10.0.26100.0
      # As CI's windows-arm64 lane: aws-lc-sys refuses cl.exe for aarch64-pc-windows-msvc and builds with clang-cl.
      - name: clang-cl for the C the binary links (arm64 Windows)
        if: ${{ matrix.clang_cl }}
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          & $clang --version
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build (macOS, Linux glibc)
        if: ${{ !matrix.musl && !matrix.windows }}
        run: cargo build --release --locked -p slates-cli --target ${{ matrix.target }}
      # The C runtime linked statically: Windows does not ship vcruntime140.dll and Nano Server and Server Core lack it,
      # where a dynamically linked slates.exe exits 0xC0000135 before any code runs (GAPS, CI run 40580524733).
      # /Brepro: MSVC's linker writes the PE timestamp, the debug directory's timestamps and the PDB GUID from the
      # content rather than the clock, so two builds of one tag are the same bytes (without it they differed in 20
      # bytes, exactly those fields, on both architectures: run 42046848954; Chromium links with it for the same
      # reason).
      - name: Build (Windows, the C runtime linked statically)
        if: ${{ matrix.windows }}
        env:
          RUSTFLAGS: -C target-feature=+crt-static -C link-arg=/Brepro
        run: cargo build --release --locked -p slates-cli --target ${{ matrix.target }}
      # musl builds inside the official rust:alpine image, native per arch, +crt-static for the binary (the workspace's
      # -crt-static in .cargo/config.toml is for cdylibs; RUSTFLAGS outranks it). `docker run`, not `container:`, so the
      # checkout and the uploads stay on the host (Appendix B.2).
      - name: Build (musl, in the rust:1.98.1-alpine image)
        if: ${{ matrix.musl }}
        run: |
          docker run --rm -v "$PWD":/work -w /work rust:1.98.1-alpine sh -c '
            apk add --no-cache build-base &&
            RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --locked -p slates-cli --target ${{ matrix.target }}'
          sudo chown -R "$(id -u):$(id -g)" target
      # The build's binary is staged in dist/, the rebuild's in rebuild/, so the two never meet in one directory.
      - name: Stage the binary
        shell: bash
        run: |
          mkdir -p dist rebuild records
          suffix=""
          if [ "${{ matrix.windows }}" = "true" ]; then suffix=".exe"; fi
          dir=dist
          if [ "${{ matrix.copy }}" = "rebuild" ]; then dir=rebuild; fi
          cp "target/${{ matrix.target }}/release/slates$suffix" "$dir/${{ matrix.asset }}"
          ls -l "$dir"
      # A static binary is what lets one file run on every Linux. glibc's ldd says "not a dynamic executable" for a
      # classic static binary (aarch64) and "statically linked" for a static PIE (x86_64 since rustc 1.85).
      - name: The musl binary is static
        if: ${{ matrix.musl }}
        run: |
          answer="$(ldd ${{ matrix.copy == 'rebuild' && 'rebuild' || 'dist' }}/${{ matrix.asset }} 2>&1 || true)"
          echo "ldd: $answer"
          case "$answer" in
            *"not a dynamic executable"*|*"statically linked"*) ;;
            *) echo "${{ matrix.asset }} is not static"; exit 1 ;;
          esac
      - name: Smoke test (the binary starts, a volume provisions, a file round-trips)
        timeout-minutes: 30
        run: >-
          cargo run --locked -p xtask --bin release -- smoke
          --binary ${{ matrix.copy == 'rebuild' && 'rebuild' || 'dist' }}/${{ matrix.asset }} --target ${{ matrix.target }}
          --record records/${{ matrix.asset }}${{ matrix.copy == 'rebuild' && '.rebuild' || '' }}.record.json
      # Nano Server has no Visual C++ runtime, so a binary that starts there carries its C runtime (GAPS, "The Windows
      # binary needs the Visual C++ runtime"), and imports nothing Nano Server's DLLs lack (A-357). The action starts
      # Docker's engine when a runner left it stopped, and names a Docker failure apart from the binary's.
      # Shape: the step took 22-45 s on 2026-11-18 (runs 44326428333, 44332283768, 44338576506); ten minutes is over ten
      # times its longest, so only a runner whose Docker cannot start or pull meets the bound.
      - name: The Windows binary starts in Nano Server
        if: ${{ matrix.nasm && matrix.copy == 'build' }}
        timeout-minutes: 10
        uses: ./.github/actions/nano-server-start
        with:
          binary: dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.copy == 'rebuild' && 'rebuild-' || '' }}${{ matrix.asset }}
          path: |
            ${{ matrix.copy == 'rebuild' && 'rebuild' || 'dist' }}/${{ matrix.asset }}
            records/${{ matrix.asset }}${{ matrix.copy == 'rebuild' && '.rebuild' || '' }}.record.json
          if-no-files-found: error

  # Every run, a tag's and a dry run's alike, with the workflow's read-only permissions: everything a release needs short
  # of the signature and the draft (A-320). The release job below takes these exact files.
  stage:
    name: stage (checksums, provenance, every copy reproduced)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: actions/download-artifact@v4
        with:
          path: gathered
          merge-multiple: true
      - name: Checksums, provenance, notes and plan (every target, only tested bytes, each rebuilt byte for byte)
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then staging=(--tag "${GITHUB_REF_NAME}"); else staging=(--dry-run); fi
          cargo run --locked -p xtask --bin release -- artifacts --dist gathered/dist --rebuild gathered/rebuild \
            --records gathered/records --notes gathered/notes "${staging[@]}" --commit "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: The staged binaries are the checksummed bytes
        working-directory: gathered/dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The plan is this job's summary
        run: cat gathered/notes/plan.md >> "$GITHUB_STEP_SUMMARY"
      # The binaries, SHA256SUMS and the provenance under dist/, the draft's notes, title, kind and the plan under
      # notes/: the release job attaches exactly these.
      - uses: actions/upload-artifact@v4
        with:
          name: release-staged
          path: |
            gathered/dist
            gathered/notes
          if-no-files-found: error

  release:
    name: draft release
    if: ${{ github.ref_type == 'tag' }}
    needs: [stage]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and attach its files
      id-token: write # the OIDC identity Sigstore signs the provenance with (no key, no secret)
      attestations: write # store the attestation with the repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-staged
          path: gathered
      - name: The staged binaries are still the checksummed bytes
        working-directory: gathered/dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Sign build provenance for every binary
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: gathered/dist/SHA256SUMS
      - name: Attach everything to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" gathered/dist/slates-attestation.sigstore.json
          prerelease=""
          if [ "$(cat gathered/notes/prerelease)" = "true" ]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag $prerelease \
            --title "$(cat gathered/notes/title)" --notes-file gathered/notes/notes.md \
            gathered/dist/slates-* gathered/dist/SHA256SUMS
          gh release view "${GITHUB_REF_NAME}" --json name,isDraft,isPrerelease,assets \
            --jq '{name, isDraft, isPrerelease, assets: [.assets[] | {name, size}]}'
