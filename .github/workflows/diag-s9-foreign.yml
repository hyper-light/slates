name: DIAG a taken WinFsp read before settlement (Step 9.4)
on:
  push:
    branches: ['diag-s9-request-red-*']
jobs:
  takeover:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/setup-nasm@v1.5.2
        if: runner.arch == 'X64'
      - name: clang-cl on arm64
        if: runner.arch == 'ARM64'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install WinFsp as in the native Windows lane
        shell: pwsh
        run: |
          choco install winfsp -y --no-progress
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Native lint before the runtime oracle
        shell: bash
        env:
          AWS_LC_SYS_PREBUILT_NASM: '0'
        run: |
          cargo clippy -p slates-bridge-winfsp --all-targets -- -D warnings && cargo clippy -p slates-cli --test winfsp -- -D warnings
      - name: A taken read fails to finish after the original dispatcher dies
        shell: bash
        env:
          WINFSP_TEST_MOUNT: '1'
          AWS_LC_SYS_PREBUILT_NASM: '0'
        run: |
          set +e
          cargo test -p slates-bridge-winfsp --lib host::tests::a_read_taken_before_the_kill_is_settled_after_takeover -- --exact --nocapture --test-threads=1 > request.log 2>&1
          result=$?
          cat request.log
          test "$result" -ne 0 && grep -q 'WINFSP INFLIGHT: first server took the read' request.log && grep -q 'a taken read stayed unanswered after the successor started' request.log && grep -q '1 failed' request.log && grep -q 'successor answered a fresh read on the original volume' request.log
      - name: A second independent daemon is refused
        shell: bash
        env:
          SLATES_TEST_CLI: '1'
          WINFSP_TEST_MOUNT: '1'
          AWS_LC_SYS_PREBUILT_NASM: '0'
        run: |
          cargo test -p slates-cli --test winfsp a_second_daemon_cannot_take_an_instance_with_a_live_winfsp_drive -- --exact --nocapture --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: request-${{ matrix.runner }}
          path: request.log
