name: DIAG w-reaper -- A-645 P3, the FSFS format 8 view under stock Subversion (not for main)

on:
  push:
    branches: ['diag-w-reaper-fsfs8-*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    name: fsfs_view on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RESULTS_BRANCH: ${{ github.ref_name }}-results-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Stock Subversion
        run: |
          sudo apt-get update && sudo apt-get install -y subversion
          svnadmin --version --quiet; svnlook --version --quiet
      - name: The view's tests, published
        shell: bash
        run: |
          set +e
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          echo "started $(date -u +%FT%TZ) at $(git rev-parse HEAD); svn $(svnadmin --version --quiet)" > "$out/status.txt"
          cargo test -p slates-svn --test fsfs_view -- --nocapture > "$out/fsfs_view.txt" 2>&1
          echo "fsfs_view exit $? $(grep -E '^test result' "$out/fsfs_view.txt" | tail -1) skipped $(grep -c SKIPPED "$out/fsfs_view.txt")" >> "$out/status.txt"
          echo "ended $(date -u +%FT%TZ)" >> "$out/status.txt"
          entries=""
          for f in "$out"/*; do
            b=$(tail -c 3000000 "$f" | git hash-object -w --stdin)
            entries="$entries$(printf '100644 blob %s\t%s' "$b" "$(basename "$f")")"$'\n'
          done
          tree=$(printf '%s' "$entries" | git mktree)
          c=$(git commit-tree "$tree" -m "results of run $GITHUB_RUN_ID")
          git push -q origin "$c:refs/heads/$RESULTS_BRANCH"
