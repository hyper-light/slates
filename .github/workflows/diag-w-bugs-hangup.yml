name: DIAG w-bugs -- the hangup test's flake under load (not for main)

on:
  push:
    branches: ['diag-w-bugs-hangup-*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  b14:
    name: B14 on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RESULTS_BRANCH: ${{ github.ref_name }}-results-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: FUSE and the operator's grant
        run: |
          command -v fusermount3 >/dev/null || { sudo apt-get update && sudo apt-get install -y fuse3; }
          grep -qx user_allow_other /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf
      - name: The test, and the release test beside it, published
        shell: bash
        env:
          SLATES_TEST_CLI: "1"
        run: |
          set +e
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          echo "started $(date -u +%FT%TZ) at $(git rev-parse HEAD); $(uname -r)" > "$out/status.txt"
          cargo test -p slates-server --lib --no-run > "$out/build.txt" 2>&1
          echo "build exit $?" >> "$out/status.txt"
          for k in $(seq 1 $(( $(nproc) * 2 ))); do ( while :; do :; done ) & done
          fails=0
          for n in $(seq 1 30); do
            cargo test -p slates-server --lib -- --test-threads=4 hangup:: hook_driver > "$out/run.txt" 2>&1
            code=$?
            echo "run $n exit $code $(grep -E '^test result' "$out/run.txt" | tail -1)" >> "$out/status.txt"
            if [ $code -ne 0 ]; then fails=$((fails+1)); cp "$out/run.txt" "$out/failed-$n.txt"; fi
          done
          rm -f "$out/run.txt"
          echo "fails $fails of 30" >> "$out/status.txt"
          echo "ended $(date -u +%FT%TZ)" >> "$out/status.txt"
          entries=""
          for f in "$out"/*; do
            b=$(tail -c 3000000 "$f" | git hash-object -w --stdin)
            entries="$entries$(printf '100644 blob %s\t%s' "$b" "$(basename "$f")")"$'\n'
          done
          tree=$(printf '%s' "$entries" | git mktree)
          c=$(git commit-tree "$tree" -m "results of run $GITHUB_RUN_ID")
          git push -q origin "$c:refs/heads/$RESULTS_BRANCH"
