name: DIAG A-194 guard rows on Linux (not for main)

# Step 3 of the VFS and DAX plan, its guard rows (A-194): slates' own device lays its backings out guarded and maps each
# guest window as two pieces from page interiors. The placement tests on both Linux architectures with their output,
# then four red-checks in this throwaway checkout, each of which must fail on its assertion (each mutation compiles):
# placement off, a placed page punched rather than zeroed by stores, the decline memo off, and the interior widened by
# a guard so pieces reach into it. Then QEMU 11.1 runs every test of tests/guest_vhost.rs through slates' own device,
# so a real VMM maps the two pieces of each window.

on:
  push:
    branches: ['diag-a194-*']

env:
  CARGO_TERM_COLOR: never

jobs:
  placement:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    name: guard rows on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: The runner
        run: |
          echo "image $ImageOS $ImageVersion; $(nproc) CPUs; $(uname -srm); page $(getconf PAGESIZE)"
          cat /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/shmem_enabled /sys/kernel/mm/transparent_hugepage/hpage_pmd_size
          grep -E "MemTotal|MemAvailable" /proc/meminfo
      - name: Clippy on Linux
        run: cargo clippy --locked -p slates-mem -p slates-vfs -p slates-bridge-core -p slates-bridge-virtiofs -p slates-server --all-targets -- -D warnings
      - name: The layout, the object and the session's tests
        shell: bash
        run: cargo test --locked -p slates-mem --test dax_object --test dax_layout -p slates-bridge-core --test dax_backing -- --nocapture --test-threads 1
      - name: The device suite
        shell: bash
        run: cargo test --locked -p slates-bridge-virtiofs --test device -- --nocapture --test-threads 1
      - name: Red-check, placement off
        shell: bash
        run: |
          set -u
          cp crates/mem/src/dax_object.rs /tmp/dax_object.rs
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("crates/mem/src/dax_object.rs")
          t = p.read_text()
          old = "      if !ranges_can_be_huge() {\n        return Ok(Placement::Unavailable);"
          assert t.count(old) == 1
          p.write_text(t.replace(old, "      if true {\n        return Ok(Placement::Unavailable);"))
          EOF
          failed=0
          cargo test --locked -p slates-bridge-core --test dax_backing -- --test-threads 1 > m1-core.txt 2>&1 || failed=$((failed + 1))
          cargo test --locked -p slates-bridge-virtiofs --test device -- --test-threads 1 every_window_over_a_backing a_hostile_guests_churn a_read_only_attachments_window > m1-device.txt 2>&1 || failed=$((failed + 1))
          grep -E "panicked|test result|error\[" -A 1 m1-core.txt m1-device.txt
          cp /tmp/dax_object.rs crates/mem/src/dax_object.rs
          [ "$failed" = 2 ] || { echo "RED-CHECK placement off: $failed of 2 suites failed, expected 2"; exit 1; }
      - name: Red-check, a placed page punched rather than zeroed by stores
        shell: bash
        run: |
          set -u
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("crates/mem/src/dax_object.rs")
          t = p.read_text()
          old = "        if placed {\n          view.zero_bytes(first_page, last_page)?;"
          assert t.count(old) == 1
          p.write_text(t.replace(old, "        if placed && DAX_RANGE_BYTES == 0 {\n          view.zero_bytes(first_page, last_page)?;"))
          EOF
          if cargo test --locked -p slates-bridge-virtiofs --test device -- --nocapture --test-threads 1 every_window_over_a_backing > m2.txt 2>&1; then
            grep -E "SKIP|panicked|test result" m2.txt; echo "RED-CHECK punch: the cut test passed with placed pages punched"; exit 1
          fi
          grep -E "panicked|test result|error\[" -A 1 m2.txt
          cp /tmp/dax_object.rs crates/mem/src/dax_object.rs
      - name: Red-check, the decline memo off
        shell: bash
        run: |
          set -u
          cp crates/vfs/src/shards_backing.rs /tmp/shards_backing.rs
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("crates/vfs/src/shards_backing.rs")
          t = p.read_text()
          old = "    if self.placement_declined {\n      return Ok(Placement::Declined { transient: false });"
          assert t.count(old) == 1
          p.write_text(t.replace(old, "    if self.placement_declined && DAX_RANGE_BYTES == 0 {\n      return Ok(Placement::Declined { transient: false });"))
          EOF
          if cargo test --locked -p slates-bridge-core --test dax_backing -- --test-threads 1 a_declined_placement_is_remembered > m3.txt 2>&1; then
            grep -E "SKIP|panicked|test result" m3.txt; echo "RED-CHECK memo: the memo test passed with the memo off"; exit 1
          fi
          grep -E "panicked|test result|error\[" -A 1 m3.txt
          cp /tmp/shards_backing.rs crates/vfs/src/shards_backing.rs
      - name: Red-check, the interior widened by a guard, so pieces reach into it
        shell: bash
        run: |
          set -u
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("crates/mem/src/dax_object.rs")
          t = p.read_text()
          old = "    DAX_RANGE_BYTES.saturating_sub(self.guard().saturating_mul(2))"
          assert t.count(old) == 1
          p.write_text(t.replace(old, "    DAX_RANGE_BYTES.saturating_sub(self.guard())"))
          EOF
          if cargo test --locked -p slates-bridge-virtiofs --test device -- --nocapture --test-threads 1 every_window_over_a_backing a_read_only_attachments_window > m4.txt 2>&1; then
            grep -E "SKIP|panicked|test result" m4.txt; echo "RED-CHECK guard: the guard tests passed with pieces reaching a guard"; exit 1
          fi
          grep -E "panicked|test result|error\[" -A 1 m4.txt
          cp /tmp/dax_object.rs crates/mem/src/dax_object.rs

  qemu:
    name: slates' own device with DAX in QEMU 11.1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Open KVM to the job
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm || echo "no /dev/kvm: the guest runs under software emulation"
          cat /sys/kernel/mm/transparent_hugepage/hpage_pmd_size
      - name: Build the guest image
        run: docker build -t slates-guest ci/guest
      - name: slates' own device with DAX in QEMU
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --device /dev/fuse --cap-add SYS_ADMIN \
            $( [ -e /dev/kvm ] && echo --device /dev/kvm ) \
            -v "$PWD":/src -w /src slates-guest sh -c \
            'set -e; host=$(rustc -vV | sed -n "s/^host: //p"); \
             RUSTFLAGS="-C target-feature=+crt-static" cargo build --release -p slates-guest-probe \
               --bin slates-guest-probe --target "$host" --target-dir target/probe; \
             SLATES_GUEST_QEMU=$(ls /usr/bin/qemu-system-x86_64 /usr/bin/qemu-system-aarch64 2>/dev/null | head -1) \
             SLATES_GUEST_KERNEL=/guest/vmlinuz \
             SLATES_GUEST_PROBE="/src/target/probe/$host/release/slates-guest-probe" \
             cargo test -p slates-cli --test guest_vhost -- --nocapture --test-threads=1' 2>&1 | tee guest-vhost.log
          if grep -q "SKIP: the guest-over-slates" guest-vhost.log; then echo "the QEMU guest was skipped"; exit 1; fi
          grep -q "guest over slates' own device in qemu: QEMU emulator version 11" guest-vhost.log
          grep -E "test result|dax_maps|dax_placed|dax_placement" guest-vhost.log | head -20
