name: DIAG bug-sweep 23, U10 and A-248, every CLI suite and the live chaos flows against their base (not for main)

# A diagnostics branch, never merged. diag 22 (run 42486013825) passed every other gate step on this tree on both arches;
# its CLI step asked for a library the crate does not have, and its A/B a short sha checkout cannot fetch.

on:
  push:
    branches: [diag-bug-sweep-23]

jobs:
  a248:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      SLATES_TEST_CLI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Suite tools and the operator's grant
        run: |
          sudo apt-get update && sudo apt-get install -y strace nfs-common fuse3 inotify-tools ripgrep sqlite3 vim
          grep -qx user_allow_other /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf
          uname -a
      - name: Every CLI suite but the live chaos flows, which the job below compares with their base
        if: ${{ !cancelled() }}
        run: |
          targets=$(ls crates/cli/tests/*.rs | xargs -n1 basename | sed 's/\.rs$//' | grep -vx live_chaos | sed 's/^/--test /' | tr '\n' ' ')
          cargo test --no-fail-fast -p slates-cli --bins $targets -- --test-threads=1

  # diag 21 ran live_chaos for the first time on this stack and it failed (1 test on arm64, 3 on x86_64), in fleet code
  # neither change touches, and no CI lane runs it. Each tree has its own target dir (diag 15 and 16's lesson), three
  # rounds interleaved on one runner, every test's outcome printed. The job's own conclusion means nothing: read the lines.
  live-chaos-ab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      SLATES_TEST_CLI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5805be68630fb409a122d01789ea3ad6d624208b
          path: base
      - uses: actions/checkout@v4
        with:
          path: stack
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build each tree's live chaos flows
        run: |
          for tree in base stack; do
            (cd "$tree" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-$tree" cargo test -p slates-cli --test live_chaos --no-run) || echo "BUILD $tree FAILED"
          done
      - name: live_chaos, interleaved
        run: |
          set +e
          for round in 1 2 3; do
            for tree in base stack; do
              echo "=== live_chaos $tree round $round start $(date -u +%H:%M:%S) load $(cut -d' ' -f1 /proc/loadavg)"
              (cd "$tree" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-$tree" cargo test -p slates-cli --test live_chaos -- --test-threads=1) > "$tree-$round.log" 2>&1
              echo "=== live_chaos $tree round $round exit $?"
              grep -E '^test .* \.\.\. FAILED|^test result' "$tree-$round.log"
            done
          done
          exit 0
