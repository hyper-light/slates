# Diagnostics for the fs-server agent (the Linux live-shipped fsstress hang): the plain and live-shipped conformance
# pair on ubuntu at main, with each live daemon's counters sampled every 60 s so a hang leaves its state behind; never
# on main. Triggered only by pushes to diag-fs-server-[0-9]* branches. Each step publishes its text results to
# diag-fs-server-results-<run>-ubuntu, one commit per step, so the agent reads them with git fetch.
name: diag-fs-server

on:
  push:
    branches: ['diag-fs-server-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    name: the live-shipped conformance pair on ubuntu, sampled
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      RESULTS_BRANCH: diag-fs-server-results-${{ github.run_id }}-ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: The results publisher and the sampler
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'EOF'
          #!/bin/bash
          # One commit per call on the results branch: every *.txt and records.tgz under results/; a failed publish
          # is reported and does not end the job.
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          cd "$GITHUB_WORKSPACE" || exit 0
          mkdir -p results
          tar czf results/records.tgz --exclude=tools target/pair 2>/dev/null || true
          entries=""
          for f in results/*; do
            [ -f "$f" ] || continue
            blob=$(git hash-object -w "$f") || exit 0
            entries="$entries$(printf '100644 blob %s\t%s' "$blob" "$(basename "$f")")"$'\n'
          done
          tree=$(printf '%s' "$entries" | git mktree) || exit 0
          parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID") || exit 0
          if git push origin "$commit:refs/heads/$RESULTS_BRANCH"; then
            echo "$commit" > "$RUNNER_TEMP/results-parent"
          else
            echo "::warning::could not publish the results"
          fi
          EOF
          cat > "$RUNNER_TEMP/sample.sh" <<'EOF'
          #!/bin/bash
          # sample.sh OUT: every 60 s, each live daemon of the newest anchor logs (by the pid its log names): its CPU,
          # the load, and its status lines for live shipping, the fleet sessions, NFS and refusals; until killed.
          # Every tenth sample also publishes, so a step that never ends still leaves its samples.
          out=$1; n=0
          while true; do
            sleep 60; n=$((n + 1))
            { echo "== $(date -u +%T) load $(cut -d' ' -f1-3 /proc/loadavg)"
              ps -eo pid,pcpu,time,stat,comm --sort=-pcpu | head -12
              for log in $(ls -t target/pair/live/scratch/*/anchor-conf-*.log 2>/dev/null | head -3); do
                inst=$(basename "$log" .log); inst=${inst#anchor-}
                pid=$(sed -n 's/.*daemon pid \([0-9]*\);.*/\1/p' "$log" | tail -1)
                echo "-- $inst pid $pid cpu $(ps -o pcpu=,time= -p "$pid" 2>/dev/null)"
                tail -3 "$log" | cut -c1-400
                timeout 20 target/debug/slates --instance "$inst" status 2>&1 \
                  | grep -vE 'absent/unknown' | grep -E 'live|fleet|nfs|refused|session|stuck|took|lease' | cut -c1-300 | head -60
              done; } >> "$out"
            [ $((n % 10)) -eq 0 ] && bash "$RUNNER_TEMP/publish.sh" > /dev/null 2>&1
          done
          EOF
          chmod +x "$RUNNER_TEMP/publish.sh" "$RUNNER_TEMP/sample.sh"
          mkdir -p results
          { echo "tree $(git rev-parse HEAD) $(date -u +%FT%TZ)"; nproc; uname -a; free -g; } > results/00-image.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Suite tools
        run: |
          sudo apt-get update && sudo apt-get install -y strace nfs-common fuse3 inotify-tools ripgrep sqlite3 vim
          grep -qx user_allow_other /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf
      - name: The plain and live-shipped conformance pair
        if: ${{ !cancelled() }}
        run: |
          set +e
          cargo build -p slates-cli --bins
          for suite in fsstress fsx pjdfstest; do
            for arm in plain live; do
              flag=""; [ "$arm" = live ] && flag="--live-ship"
              sampler=""
              if [ "$arm" = live ]; then
                "$RUNNER_TEMP/sample.sh" "results/25-samples-$suite.txt" & sampler=$!
              fi
              start=$(date +%s)
              timeout --signal=INT 2400 cargo xtask conformance run --suite $suite $flag \
                --records target/pair/$arm/records --scratch target/pair/$arm/scratch --keep > results/run-$suite-$arm.log 2>&1
              code=$?
              [ -n "$sampler" ] && kill "$sampler" && wait "$sampler" 2>/dev/null
              echo "$suite $arm exit=$code seconds=$(( $(date +%s) - start )) load=$(cut -d' ' -f1-3 /proc/loadavg)" >> results/20-conformance.txt
              grep -E '^conformance:|panicked|error' results/run-$suite-$arm.log | cut -c1-600 >> results/20-conformance.txt
              rm -f results/run-$suite-$arm.log
              bash "$RUNNER_TEMP/publish.sh"
            done
          done
      - name: Compare the live-shipped runs with the plain ones
        if: ${{ !cancelled() }}
        run: |
          cargo xtask conformance compare --plain target/pair/plain --live target/pair/live > "$RUNNER_TEMP/compare.txt" 2>&1
          echo "compare exit $?" > results/30-compare.txt
          grep -vE 'DIFFERENCE .*pjdfstest-output' "$RUNNER_TEMP/compare.txt" | tail -80 >> results/30-compare.txt
          grep -cE 'DIFFERENCE .*pjdfstest-output' "$RUNNER_TEMP/compare.txt" >> results/30-compare.txt
          bash "$RUNNER_TEMP/publish.sh"
      - name: Publish whatever was measured
        if: always()
        run: if [ -f "$RUNNER_TEMP/publish.sh" ]; then bash "$RUNNER_TEMP/publish.sh"; fi
