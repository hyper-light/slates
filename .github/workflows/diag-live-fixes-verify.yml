# Diagnostics for the live-fixes agent (not for main): agents/live-fixes-1 with main merged, under two spinners a logical
# CPU on macos-latest. The fleet-deploy test (fix 1), the anchored rejoin (fix 2), and the server fleet suite's mirror
# placement test whose region-0 learner never caught up (the supervisor's dump of 2026-11-06). Each failure keeps its
# whole log. Results go to diag-live-fixes-results-<run>-macos-verify.
name: diag-live-fixes-verify

on:
  push:
    branches: ['diag-live-fixes-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  verify:
    name: the fixes on the merged tree, under load, on macos-latest
    runs-on: macos-latest
    timeout-minutes: 300
    env:
      RESULTS_BRANCH: diag-live-fixes-results-${{ github.run_id }}-macos-verify
    steps:
      - uses: actions/checkout@v4
      - name: The results publisher
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'EOF'
          #!/bin/bash
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          cd "$GITHUB_WORKSPACE" || exit 0
          entries=""
          for f in results/*; do
            [ -f "$f" ] || continue
            blob=$(git hash-object -w "$f") || exit 0
            entries="$entries$(printf '100644 blob %s\t%s' "$blob" "$(basename "$f")")"$'\n'
          done
          tree=$(printf '%s' "$entries" | git mktree) || exit 0
          parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID") || exit 0
          if git push origin "$commit:refs/heads/$RESULTS_BRANCH"; then
            echo "$commit" > "$RUNNER_TEMP/results-parent"
          else
            echo "::warning::could not publish the results"
          fi
          EOF
          chmod +x "$RUNNER_TEMP/publish.sh"
          mkdir -p results
          { echo "tree $(git rev-parse HEAD) $(date -u +%FT%TZ)"; sysctl -n hw.logicalcpu; sw_vers; } > results/00-image.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build -p slates-cli --tests --bins
          cargo test -p slates-server --test fleet --no-run
      - name: Runs under two spinners a logical CPU
        run: |
          set +e
          export SLATES_TEST_CLI=1
          spinners=$(( $(sysctl -n hw.logicalcpu) * 2 ))
          for i in $(seq 1 $spinners); do (while :; do :; done) & echo $! >> "$RUNNER_TEMP/spinners"; done
          sleep 10
          one() {
            local tag=$1 n=$2; shift 2
            local log="$RUNNER_TEMP/$tag-$n.log"
            perl -e 'alarm shift; exec @ARGV' 900 "$@" > "$log" 2>&1
            local code=$?
            {
              echo "=== $tag $n exit $code load $(sysctl -n vm.loadavg)"
              grep -E '^rejoins: |panicked at' -A1 "$log" | grep -v '^--' | head -6
            } >> results/10-verify.txt
            if [ $code -ne 0 ]; then grep -vE '^slates-cluster: fleet: HostId' "$log" | tail -600 > "results/$tag-$n-tail.txt"; fi
            pkill -f "cli-fleet-|chaos-rejoins-" || true
            echo "mounts $(mount | grep -c slates)" >> results/10-verify.txt
            bash "$RUNNER_TEMP/publish.sh"
          }
          for n in 1 2 3 4 5; do
            one deploy $n cargo test -p slates-cli --test cli three_daemon_processes_deploy_a_fleet_from_one_manifest_and_survive_the_owners_death -- --nocapture
          done
          for n in 1 2 3 4 5 6; do
            one rejoin $n cargo test -p slates-cli --test live_chaos a_candidates_daemon_succeeded_under_its_anchor_rejoins_the_fleet -- --nocapture
          done
          for n in 1 2 3 4 5 6; do
            one mirror $n cargo test -p slates-server --test fleet a_placed_snapshot_is_held_whole_by_f_plus_one_hosts_of_the_mirror_region -- --nocapture
          done
          kill $(cat "$RUNNER_TEMP/spinners") 2>/dev/null || true
      - name: Publish whatever was measured
        if: always()
        run: if [ -f "$RUNNER_TEMP/publish.sh" ]; then bash "$RUNNER_TEMP/publish.sh"; fi
