name: DIAG loadtest-scale -- a kept forward sent again without another request, after and red-checked (not for main)

# This commit's parent on ubuntu-latest and ubuntu-24.04-arm (after), and four variants of it on ubuntu-latest, each
# with one fix reverted in place before the build (before-*), running the test that holds it. Results are published as
# one commit per job on diag-loadtest-scale-fwd-results-<run>-<job>, read with git.

on:
  push:
    branches: ['diag-loadtest-scale-fwd-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  w3:
    name: ${{ matrix.variant }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: after, os: ubuntu-latest }
          - { variant: after, os: ubuntu-24.04-arm }
          - { variant: before-kept, os: ubuntu-latest }
          - { variant: before-kept, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      RESULTS_BRANCH: diag-loadtest-scale-fwd-results-${{ github.run_id }}-${{ matrix.variant }}-${{ matrix.os }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}
      - name: suites
        shell: bash
        run: |
          set -u +e +o pipefail
          out="$RUNNER_TEMP/results.txt"; : > "$out"
          step() { name=$1; shift; start=$(date +%s); "$@" > "$RUNNER_TEMP/$name.log" 2>&1; code=$?
            echo "$name exit $code $(( $(date +%s) - start ))s" >> "$out"
            grep -E '^test result|FAILED|panicked|^error|left:|right:|assertion|refused|head reached|partition snapshot|meets|unknown|released|did not hold|outlived|once the floor|kept forward|---- ' "$RUNNER_TEMP/$name.log" | head -80 | sed "s/^/  $name: /" >> "$out"; }
          echo "tested $(git rev-parse HEAD^) variant $VARIANT on $(uname -m), $(nproc) cpus" >> "$out"
          revert() { perl -0pi -e "$2" "$1"; if git diff --quiet -- "$1"; then echo "REVERT DID NOT APPLY to $1" >> "$out"; else git diff --stat -- "$1" | sed 's/^/  reverted: /' >> "$out"; fi; }
          case "$VARIANT" in
            after)
              step forward-retry cargo test -p slates-server --test forward_retry -- --nocapture
              step server-lib cargo test -p slates-server --lib
              step server-tests cargo test -p slates-server --test daemon --test ack_release --no-fail-fast
              step client cargo test -p slates-client --no-fail-fast
              ;;
            before-kept)
              revert crates/server/src/daemon.rs 's/        if kept \{\n          let _ = futures::within\(idle_window_ns\.max\(1\), futures::idle\(\)\)\.await;\n        \} else \{\n          futures::idle\(\)\.await;\n        \}/        let _ = kept;\n        futures::idle().await;/s'
              step forward-retry cargo test -p slates-server --test forward_retry -- --nocapture
              ;;
          esac
          git checkout -- . 2>/dev/null
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          blob=$(git hash-object -w "$out")
          tree=$(printf '100644 blob %s\tresults.txt\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "fwd results of run $GITHUB_RUN_ID, $VARIANT on ${{ matrix.os }}")
          git push origin "$commit:refs/heads/$RESULTS_BRANCH" || echo "::warning::could not publish the results"
