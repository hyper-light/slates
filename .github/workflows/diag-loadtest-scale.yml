name: DIAG loadtest-scale -- the acknowledgement watermark, forwards sharing the owner's session, and the multiplexing harness on Linux (not for main)

# The branch's own commits (this diag commit's tree is its parent's plus this file) on both Linux runners: the new fleet
# test three times, the fleet suite, the client, transport and cluster suites, clippy and the structural check. Each job
# publishes its step results as one commit on diag-loadtest-scale-results-<run>-<runner>, read with git, not the API.

on:
  push:
    branches: ['diag-loadtest-scale-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    name: linux on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      RESULTS_BRANCH: diag-loadtest-scale-results-${{ github.run_id }}-${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: suites
        shell: bash
        env:
          SLATES_TEST_HEDGE_STARVATION_SECS: "20"
          SLATES_TEST_RESTART_SLOWDOWN: "10"
          SLATES_TEST_FLEET_DEADLINE_SECS: "120"
        run: |
          set -u +e +o pipefail
          out="$RUNNER_TEMP/results.txt"; : > "$out"
          step() { name=$1; shift; start=$(date +%s); "$@" > "$RUNNER_TEMP/$name.log" 2>&1; code=$?
            echo "$name exit $code $(( $(date +%s) - start ))s" >> "$out"
            grep -E '^test result|FAILED|panicked|^error|forward of a read on a free shard took' "$RUNNER_TEMP/$name.log" | head -60 | sed "s/^/  $name: /" >> "$out"; }
          echo "tested $(git rev-parse HEAD^) on $(uname -m), $(nproc) cpus, load $(cut -d' ' -f1-3 /proc/loadavg)" >> "$out"
          step fmt cargo fmt --all --check
          step clippy cargo clippy --workspace --all-targets -- -D warnings
          step xtask cargo xtask check
          for n in 1 2 3; do step forward-$n cargo test -p slates-server --test fleet -- --nocapture --exact forwards_to_one_owner_never_wait_behind_each_other; done
          step fleet cargo test -p slates-server --test fleet --no-fail-fast
          step client cargo test -p slates-client --no-fail-fast
          step transport-cluster cargo test -p slates-transport -p slates-cluster --no-fail-fast
          step server-lib cargo test -p slates-server --lib
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          tail -c 200000 "$RUNNER_TEMP/fleet.log" > "$RUNNER_TEMP/fleet-tail.log"
          blob=$(git hash-object -w "$out"); tail=$(git hash-object -w "$RUNNER_TEMP/fleet-tail.log")
          tree=$(printf '100644 blob %s\tresults.txt\n100644 blob %s\tfleet-tail.log\n' "$blob" "$tail" | git mktree)
          commit=$(git commit-tree "$tree" -m "results of run $GITHUB_RUN_ID on ${{ matrix.runner }}")
          git push origin "$commit:refs/heads/$RESULTS_BRANCH" || echo "::warning::could not publish the results"
