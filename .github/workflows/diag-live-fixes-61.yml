name: DIAG live-fixes the forward-refused-at-admission test under load on macOS, learner e19c6fe4 (not for main)

on:
  push:
    branches: [diag-live-fixes-61]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  arm:
    name: forward refused at admission, learner e19c6fe4
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo test --locked -p slates-server --test fleet --no-run
      - name: The test under load
        shell: bash
        run: |
          R=../results.txt
          cpus=$(getconf _NPROCESSORS_ONLN)
          echo "learner e19c6fe4 on macos-latest, $cpus CPUs, head $(git rev-parse HEAD)" > $R
          pids=()
          for i in $(seq 1 $((cpus * 2))); do (while :; do :; done) & pids+=($!); done
          for run in $(seq 1 10); do
            status=0
            perl -e 'alarm shift; exec @ARGV' 600 cargo test --locked -p slates-server --test fleet -- --exact a_forward_refused_at_admission_answers_its_client > ../run.log 2>&1 || status=$?
            echo "== run $run exit $status, load $(uptime | sed 's/.*load average[s]*: //')" | tee -a $R
            grep -E -A2 'panicked|^test result' ../run.log | cut -c1-600 >> $R || true
          done
          kill "${pids[@]}" 2>/dev/null || true
      - name: Publish the results to a branch
        if: always()
        run: |
          git config user.name "diag-live-fixes"
          git config user.email "diag-live-fixes@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-live-fixes-61 results"
          git push -q origin "HEAD:refs/heads/diag-live-fixes-results-61"
