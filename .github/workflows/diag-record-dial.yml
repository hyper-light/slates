name: diag-record-dial

# Diagnostics only, never on main: the record dial's pinning test on both Linux runners, past main's known red
# (crates/bridge-fuse/tests/owner_turn.rs:295) that stops CI's own Test step before slates-server's fleet binary runs.
on:
  push:
    branches: ["diag-record-dial-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  dial:
    name: record dial pinning test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: The pinning test alone, then the fleet binary whole
        if: always()
        run: bash .github/diag-record-dial.sh "$(git log -1 --format=%s | cut -c1-120)"
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/${GITHUB_REF_NAME#diag-}-${{ matrix.os }}"
          git config user.name "diag-record-dial"
          git config user.email "diag-record-dial@users.noreply.github.com"
          gzip -9 ../*.log 2>/dev/null
          mkdir -p ../publish && cp ../results.txt ../*.log.gz ../publish/ 2>/dev/null
          git checkout --orphan results-only
          git rm -rq --cached . || true
          rm -rf ./* && cp ../publish/* . 2>/dev/null || echo "no results" > results.txt
          git add -A
          git commit -qm "diag ${GITHUB_REF_NAME} results, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"
