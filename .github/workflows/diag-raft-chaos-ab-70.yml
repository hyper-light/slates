name: DIAG raft-chaos A-251 (d) on the B10 landing tree 3fd1de00, judged by c's held head (not for main)

# Diagnostics branch of the raft-chaos agent; never merged. One arm: agents/land-b10-wip at 3fd1de00, the B10 tree that
# lands (learner-3, bug-sweep-2 and A-251 on main 1c49c33f). Built as CI's gate builds the fleet tests (debug); the test runs alone, five times a runner.

on:
  push:
    branches: [diag-raft-chaos-ab-70]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ab:
    name: A/B ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build
        run: CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../t-after cargo test --locked -p slates-server --test fleet --no-run
      - name: Interleaved runs
        run: |
          R=../results.txt
          echo "runner ubuntu-latest, $(nproc) CPUs, $(date -u), tip $(git rev-parse --short=8 HEAD^), sample ${{ matrix.sample }}" > $R
          bin_of() { ls -t ../t-$1/debug/deps/fleet-* | grep -v '\.d$' | head -1; }
          echo "after $(bin_of after)" >> $R
          ORDER="after"
          for pair in 1 2 3 4 5; do
            for arm in $ORDER; do
              BIN=$(bin_of $arm)
              echo "== pair $pair arm $arm at $(date -u +%H:%M:%S), load $(cut -d' ' -f1-3 /proc/loadavg)" >> $R
              status=0
              timeout 600 "$BIN" --nocapture --test-threads=1 --exact a_takeover_adopts_the_newest_head_a_holder_left_out_of_its_pages > ../run.log 2>&1 || status=$?
              grep -E -A1 'held positions|test result|panicked' ../run.log | cut -c1-1600 >> $R
              echo "== pair $pair arm $arm exit $status, load $(cut -d' ' -f1-3 /proc/loadavg)" >> $R
            done
          done
      - name: Publish the results to a branch
        if: always()
        run: |
          git config user.name "diag-raft-chaos"
          git config user.email "diag-raft-chaos@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-raft-chaos-ab-70 results ${{ matrix.sample }}"
          git push -q origin "HEAD:refs/heads/diag-results/diag-raft-chaos-ab-70-${{ matrix.sample }}"
