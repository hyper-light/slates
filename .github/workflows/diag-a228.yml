name: diag-a228

# Diagnostics only, never on main (A-228, starved is not stuck). The branch's documentation gate and structural checks.
# Results go to diag-results/a228-6-<os>.
on:
  push:
    branches: ["diag-a228-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  gates:
    name: docs and xtask (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (x86_64)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: The gates
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
        run: |
          R=../results.txt
          echo "runner ${{ matrix.os }}, $(git log --oneline -1 | cut -c1-80), $(date -u)" > $R
          status=0
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo doc --locked -p slates-mem -p slates-ipc -p slates-rt -p slates-base -p slates-client -p slates-server -p slates-vfs --no-deps --document-private-items > ../doc.log 2>&1 || status=$?
          else
            cargo doc --locked --workspace --no-deps --document-private-items > ../doc.log 2>&1 || status=$?
          fi
          grep -E '^error|^warning: unresolved|Finished|-->' ../doc.log | cut -c1-240 | tail -20 | tee -a $R || true
          echo "== documentation gate, exit $status" | tee -a $R
          status=0
          cargo xtask check > ../xtask.log 2>&1 || status=$?
          grep -E 'structural|literals|unsafe:|slates-rt |xtask:|capabilities|toolchain' ../xtask.log | cut -c1-200 | tee -a $R || true
          echo "== xtask check, exit $status" | tee -a $R
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/a228-6-${{ matrix.os }}"
          git config user.name "diag-a228"
          git config user.email "diag-a228@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-a228-6 results, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"
