name: DIAG g226 -- a live-shipped volume against a plain one over the Linux FUSE mount (not for main)

on:
  push:
    branches: ['agents/diag-g226-*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  pair:
    name: fsx and fsstress, plain and live, over the daemon's own FUSE mount
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RESULTS_BRANCH: ${{ github.ref_name }}-results-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: FUSE
        run: |
          command -v fusermount3 >/dev/null || { sudo apt-get update && sudo apt-get install -y fuse3; }
      - name: The pair, published
        shell: bash
        run: |
          set +e
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          out="$RUNNER_TEMP/out"; work="$RUNNER_TEMP/g226"; mkdir -p "$out" "$work/plain" "$work/live"
          echo "started $(date -u +%FT%TZ) at $(git rev-parse HEAD); $(uname -r); $(nproc) cpus; load $(cut -d' ' -f1-3 /proc/loadavg)" > "$out/status.txt"
          cargo build --release -p slates-cli > "$out/build.txt" 2>&1
          echo "build exit $?" >> "$out/status.txt"
          for s in fsx fsstress; do
            for m in plain live; do
              f=""; [ "$m" = live ] && f=--live-ship
              t0=$(date +%s)
              timeout 1500 cargo xtask conformance run --suite "$s" $f --transport native-linux-fuse \
                --records "$work/$m/records" --scratch "$work/$m/scratch" --keep > "$out/$m.$s.txt" 2>&1
              echo "$s $m exit $? $(( $(date +%s) - t0 ))s load $(cut -d' ' -f1-3 /proc/loadavg)" >> "$out/status.txt"
              grep -E "conformance: native-linux-fuse" "$out/$m.$s.txt" | tail -2 >> "$out/status.txt"
            done
          done
          cargo xtask conformance compare --plain "$work/plain" --live "$work/live" > "$out/compare.txt" 2>&1
          echo "compare exit $?" >> "$out/status.txt"
          grep -E "^compare" "$out/compare.txt" >> "$out/status.txt"
          for m in plain live; do
            for r in "$work/$m/records"/*.json; do [ -f "$r" ] && cp "$r" "$out/$m.$(basename "$r")"; done
          done
          echo "ended $(date -u +%FT%TZ)" >> "$out/status.txt"
          entries=""
          for f in "$out"/*; do
            b=$(tail -c 3000000 "$f" | git hash-object -w --stdin)
            entries="$entries$(printf '100644 blob %s\t%s' "$b" "$(basename "$f")")"$'\n'
          done
          tree=$(printf '%s' "$entries" | git mktree)
          c=$(git commit-tree "$tree" -m "results of run $GITHUB_RUN_ID")
          git push -q origin "$c:refs/heads/$RESULTS_BRANCH"
