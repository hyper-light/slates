# DIAG (not for main): g240's and g250's owed live_chaos runs on Linux x86_64 and arm64 -- the store-destroyed flow x24 and
# the candidate-killed flow x12 a arch, release, one at a time.
name: diag-integrator-takeover2
on:
  push:
    branches: ['diag-integrator-takeover2-*']
env:
  CARGO_TERM_COLOR: never
jobs:
  takeover-flows:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the chaos binary (release)
        run: cargo test --locked --release -p slates-cli --test live_chaos --no-run
      - name: The takeover flows, repeated
        run: bash .github/diag-integrator-takeover2.sh
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: takeover-results-${{ matrix.os }}
          path: target/takeover-*
