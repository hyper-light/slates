name: DIAG a WinFsp mount across killed daemons (Step 9.3)
on:
  push:
    branches: ['diag-s9-mount-*']
jobs:
  takeover:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/setup-nasm@v1.5.2
        if: runner.arch == 'X64'
      - name: clang-cl on arm64
        if: runner.arch == 'ARM64'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install WinFsp as in the native Windows lane
        shell: pwsh
        run: |
          choco install winfsp -y --no-progress
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: The mount oracle before the fix must lose its drive
        shell: bash
        env:
          SLATES_TEST_CLI: '1'
          WINFSP_TEST_MOUNT: '1'
          AWS_LC_SYS_PREBUILT_NASM: '0'
        run: |
          set +e
          cargo test -p slates-cli --test winfsp a_winfsp_drive_handle_and_view_survive_twenty_killed_daemons -- --exact --nocapture --test-threads=1 > takeover.log 2>&1
          result=$?
          cat takeover.log
          test "$result" -ne 0 && grep -q 'the original drive must survive kill 1' takeover.log && grep -q '1 failed' takeover.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: takeover-${{ matrix.runner }}
          path: takeover.log
