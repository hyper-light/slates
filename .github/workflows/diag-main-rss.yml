name: diag-main-rss
# Run 1 (main 01a20182, 2026-11-26 06:40 PST): w-git's C5, the git daemon's resident memory after a push and a clone of
# git/git's v2.0.0 cut (git_interop the_daemons_resident_memory_after_a_push_and_a_clone_follows_the_pack_not_the_history),
# after (b) (19f442f21: a push's pack put into the content store as it arrives, no push buffer, the judge's cache
# within its grant). Linux's RSS is honest (a discard punches holes), so this is the lane the bound is judged on.
# Release, ubuntu-latest and ubuntu-24.04-arm; git/git cloned bare from GitHub. Run only from diag-measurer-main-rss-*
# branches, never main.
on:
  push:
    branches: ["diag-measurer-main-rss-*"]

env:
  CARGO_TERM_COLOR: never

jobs:
  rss:
    name: C5 RSS (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: git/git, bare
        run: git clone -q --bare https://github.com/git/git.git "$RUNNER_TEMP/git-git.git" && git -C "$RUNNER_TEMP/git-git.git" rev-parse v2.0.0
      - name: Build the test (release)
        run: |
          git log -1 --format='at %h %s' | cut -c1-120
          cargo test --release --locked -p slates-cli --test git_interop --no-run
      - name: The RSS test
        run: |
          set +e
          SLATES_TEST_GIT_SOURCE="$RUNNER_TEMP/git-git.git" SLATES_TEST_GIT_CUT=v2.0.0 \
            cargo test --release --locked -p slates-cli --test git_interop \
            the_daemons_resident_memory_after_a_push_and_a_clone_follows_the_pack_not_the_history -- --nocapture > "$RUNNER_TEMP/rss.log" 2>&1
          rc=$?
          line=$(grep -a '^resident MiB' "$RUNNER_TEMP/rss.log" | head -1 | cut -c1-400)
          echo "::notice title=${{ matrix.os }} RSS (exit $rc)::$line"
          grep -a -E '^resident MiB|panicked|test result' "$RUNNER_TEMP/rss.log" | cut -c1-400
          exit 0
