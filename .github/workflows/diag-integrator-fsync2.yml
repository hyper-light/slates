# DIAG (not for main): A-292's live FUSE fsync flows (g244) 10 times each beside one spinner a CPU at normal priority, each run bounded at 15 min, on Linux
# x86_64 and arm64 (the integrator's queue item 6).
name: diag-integrator-fsync2
on:
  push:
    branches: ['diag-integrator-fsync2-*']
env:
  CARGO_TERM_COLOR: never
jobs:
  live-fuse-fsync:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: FUSE tools
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - name: Build the tests (release)
        run: cargo test --locked --release -p slates-cli --test live_fleet --no-run
      - name: The live FUSE fsync flows under spinners
        run: bash .github/diag-integrator-fsync2.sh
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsync-results-${{ matrix.os }}
          path: target/fsync-*
