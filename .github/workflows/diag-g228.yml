# g228's diagnostic run (85a): the live-shipping measurement on ubuntu-latest, release, arms interleaved round by round.
# Lives only on diag-g228-* branches; never on main.
name: diag-g228
on:
  push:
    branches: ["diag-g228-*"]
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Shape: the arms, `name:commit` each, built and measured in turn; the rounds each arm runs.
      ARMS: ""
      ROUNDS: "5"
      TESTS: "measure_what_live_shipping_adds_to_a_stable_nfs_write"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - name: build and measure
        shell: bash
        run: |
          set -u
          exec > >(tee ../results.txt) 2>&1
          echo "runner $(nproc) cores, $(free -g | awk '/Mem/{print $2}') GiB, load $(cat /proc/loadavg)"
          # g228's seal probe (85a): each part of sealing one live entry's body, release, from main.
          PROBE_COMMIT=65133486d
          mkdir -p ../probe-src ../probe/src && git archive "$PROBE_COMMIT" | tar -x -C ../probe-src
          P=$(cd .. && pwd)
          printf '%s\n' '[package]' 'name = "g228-sealprobe"' 'version = "0.1.0"' 'edition = "2024"' '[workspace]' '[dependencies]' \
            "slates-cluster = { path = \"$P/probe-src/crates/cluster\" }" "slates-archive = { path = \"$P/probe-src/crates/archive\" }" \
            "hyper-seal = { path = \"$P/probe-src/vendor/hyper-raft/hyper-seal\" }" 'blake3 = "1"' > ../probe/Cargo.toml
          cat > ../probe/src/main.rs <<'RS'
          use std::time::Instant;
          use hyper_seal::keys::WrappingKey;
          use hyper_seal::name::Namer;
          use hyper_seal::stream::FileSealer;
          const BODY: usize = 4627;
          const CALLS: u32 = 5000;
          fn time(name: &str, mut f: impl FnMut()) {
            for _ in 0..200 { f(); }
            let mut best = u128::MAX; let mut all = Vec::new();
            for _ in 0..3 { let t = Instant::now(); for _ in 0..CALLS { f(); } let ns = t.elapsed().as_nanos() / u128::from(CALLS); best = best.min(ns); all.push(ns); }
            println!("{name:<44} best {best:>6} ns a call; rounds {all:?}");
          }
          fn main() {
            hyper_seal::lock_keys(64).unwrap();
            let tenant = WrappingKey::generate(1).unwrap();
            let (naming, _) = tenant.make_child().unwrap();
            let namer = Namer::new(&naming).unwrap();
            let lineage = WrappingKey::generate(1).unwrap();
            let body: Vec<u8> = (0..BODY).map(|i| (i % 251) as u8).collect();
            let content = *blake3::hash(&body).as_bytes();
            time("copy of the body (to_vec)", || { std::hint::black_box(body.to_vec()); });
            time("blake3 of the body", || { std::hint::black_box(blake3::hash(&body)); });
            time("raw_chunk (copy + identity hash)", || { std::hint::black_box(slates_archive::Archive::raw_chunk(body.to_vec())); });
            time("derive_child (HKDF-SHA384 + wrap)", || { std::hint::black_box(lineage.derive_child(b"hyper-seal content key", &content).unwrap()); });
            time("content_keyed (2 derive + commit + schedule)", || { std::hint::black_box(FileSealer::content_keyed(&lineage, &content, 4096).unwrap()); });
            let chunk = slates_archive::Archive::raw_chunk(body.to_vec());
            time("namer.name (HMAC)", || { std::hint::black_box(namer.name(&chunk.identity).unwrap()); });
            time("seal_chunk whole", || { std::hint::black_box(slates_cluster::sealed::seal_chunk(&lineage, &namer, &chunk, 4096).unwrap()); });
            time("raw_chunk + seal_chunk (seal_body's piece)", || { let c = slates_archive::Archive::raw_chunk(body.to_vec()); std::hint::black_box(slates_cluster::sealed::seal_chunk(&lineage, &namer, &c, 4096).unwrap()); });
          }
          RS
          sed -i 's/^          //' ../probe/src/main.rs
          echo "probe at $PROBE_COMMIT on $(nproc) cores, $(grep -m1 'model name' /proc/cpuinfo)"
          (cd ../probe && CARGO_TARGET_DIR=../t-probe cargo run --release -q 2>&1 | grep -vE "^warning|^\s+(\||=|-->)|^$" | tail -10)
          for pair in $ARMS; do
            arm=${pair%%:*}; commit=${pair#*:}
            mkdir -p "../arm-$arm" && git archive "$commit" | tar -x -C "../arm-$arm"
            echo "arm $arm = $(git rev-parse --short "$commit")"
            (cd "../arm-$arm" && CARGO_TARGET_DIR="../t-$arm" cargo test --release -p slates-cli --test live_fleet --no-run 2>&1 | tail -2)
            b=$(cd "../arm-$arm" && CARGO_TARGET_DIR="../t-$arm" cargo test --release -p slates-cli --test live_fleet --no-run --message-format=json 2>/dev/null | python3 -c 'import sys,json
          for l in sys.stdin:
              m=json.loads(l)
              if m.get("reason")=="compiler-artifact" and m.get("executable") and m["target"]["name"]=="live_fleet": print(m["executable"])' | tail -1)
            echo "$arm $b"; echo "$arm=$b" >> ../bins
          done
          # The transport reference on the same runner: the bare live ship over real endpoints (no daemon), from the first arm.
          first=$(echo $ARMS | cut -d' ' -f1); first=${first%%:*}
          (cd "../arm-$first" && CARGO_TARGET_DIR="../t-$first" cargo build --release -p slates-cluster --example replication_bench 2>&1 | tail -1)
          bench="../t-$first/release/examples/replication_bench"
          cat > ../counters.py <<'PY'
          import sys,re,json
          t=open(sys.argv[1]).read()
          for line in t.splitlines():
              if "added at" in line or "live  p50" in line or "cpu ms" in line: print(line.split("live log at the end")[0].rstrip())
          for who,line in re.findall(r"measure: (the owner|candidate \d)'s live counters (\{.*\})",t):
              d=json.loads(line); out=[]
              for h in ["build","to_control","lane","exchange","to_owner","round","reply","holder"]:
                  n=d.get("hop."+h,0); ns=d.get("hop."+h+"_ns",0)
                  if n: out.append(f"{h} {ns/n/1000:.1f}")
              for h in ["reply_wake","reply_poll","reply_tail","reply_fold_rest"]:
                  n=d.get("hop."+h,0); ns=d.get("hop."+h+"_ns",0)
                  if n: out.append(f"{h} {ns/n/1000:.1f}")
              out.append("| p50/p99 " + ", ".join(f"{h} {d.get('hop.'+h+'.p50_ns',0)/1000:.1f}/{d.get('hop.'+h+'.p99_ns',0)/1000:.1f}" for h in ["build","build.capture","build.keys","build.seal","build.append","build.send","to_control","lane","exchange","exchange.round_trip","exchange.collect","to_owner","round","reply","holder"] if 'hop.'+h+'.p50_ns' in d))
              for k in ["hold.declined","hold.answer","hold.exchange","hold.dispatches","hold.entries","hop.reply_timed"]:
                  if k in d: out.append(f"{k}={d[k]}")
              out += [f"{k.split('.')[-1]}={v}" for k,v in d.items() if "woken_by" in k or "reply_pending" in k or "reply_poll" in k or "reply_between" in k]
              print(f"  {who}: "+", ".join(out))
          PY
          for r in $(seq 1 "$ROUNDS"); do
            order=$(cut -d= -f1 ../bins | tr '\n' ' '); [ $((r % 2)) -eq 0 ] && order=$(echo $order | tr ' ' '\n' | tac | tr '\n' ' ')
            echo "== round $r transport reference load $(cut -d' ' -f1-3 /proc/loadavg)"
            "$bench" 1000 0 2>&1 | grep -i "live ship" || echo "transport bench gave no live ship row"
            for arm in $order; do
              b=$(grep "^$arm=" ../bins | cut -d= -f2-)
              for t in $TESTS; do
                echo "== round $r arm $arm $t load $(cut -d' ' -f1-3 /proc/loadavg)"
                SLATES_TEST_CLI=1 SLATES_TEST_MEASURE=1 "$b" "$t" --exact --nocapture --test-threads=1 > ../run.log 2>&1; echo "exit $?"
                python3 ../counters.py ../run.log
              done
            done
          done
      - name: publish the results to a branch
        if: always()
        shell: bash
        run: |
          git config user.name "diag-g228"; git config user.email "diag-g228@users.noreply.github.com"
          blob=$(git hash-object -w ../results.txt)
          tree=$(printf "100644 blob %s\tresults.txt\n" "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "diag results: ${GITHUB_REF_NAME} run ${GITHUB_RUN_ID}")
          git push origin "$commit:refs/heads/diag-results/${GITHUB_REF_NAME}-${GITHUB_RUN_ID}"
