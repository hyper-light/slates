name: diag-w-win2

# w-win2 for main 01a20182 (2026-11-23), run 23: bridge-fuse's takeover_round red on main. Main's bisect (run
# 45325199476) put it between ff16bed94 and 3c3efe4f0; the suspect is 6f0804bbd ("a takeover names every inode of the
# head"). Job one runs the test as each commit had it, at 6f0804bbd^ (f8ba01f61) and at 6f0804bbd: green, then red.
# Job two runs the test rewritten to the design's rule (§4.6, A-158, A-562) on this branch's main: green, then red with
# the walk made to ignore the budget (the first slice takes the whole set).

on:
  push:
    branches: ["diag-measurer-w-win2-*"]

env:
  CARGO_TERM_COLOR: never

jobs:
  bisect:
    name: takeover_round at ${{ matrix.ref }}
    strategy:
      fail-fast: false
      matrix:
        ref: [f8ba01f61bfd2a062ae239b83a44a62d4cf85347, 6f0804bbd46532b83b29fdbf831114d7ac77f654]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: "The test as this commit had it"
        timeout-minutes: 60
        run: |
          git log --oneline -1
          set +e
          cargo test -p slates-bridge-fuse --test takeover_round -- --test-threads=1 > "$RUNNER_TEMP/takeover.log" 2>&1
          code=$?
          grep -a '^test \|test result\|panicked' -A3 "$RUNNER_TEMP/takeover.log" | cut -c1-300 | head -30 || true
          echo "takeover_round exit $code"

  rule:
    name: takeover_round by the rule (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
      - name: "Green: the rewritten test, three rounds"
        timeout-minutes: 50
        run: |
          for round in 1 2 3; do
            cargo test -p slates-bridge-fuse --test takeover_round -- --test-threads=1 2>&1 | grep -a '^test \|test result\|panicked' -A3 | cut -c1-300
          done
      - name: "Red: the walk ignores the budget"
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          git apply .github/diag-w-win2/takeover-red-unsliced.patch
          set +e
          cargo test -p slates-bridge-fuse --test takeover_round -- --test-threads=1 > "$RUNNER_TEMP/red.log" 2>&1
          code=$?
          set -e
          git apply -R .github/diag-w-win2/takeover-red-unsliced.patch
          grep -a '^test \|test result\|panicked' -A3 "$RUNNER_TEMP/red.log" | cut -c1-300 | head -20 || true
          echo "red arm exit $code"
          if [ "$code" -eq 0 ]; then echo "UNEXPECTED: the rule held with the budget ignored"; exit 1; fi
      - name: "Clippy of bridge-fuse's tests"
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          set +e
          cargo clippy -p slates-bridge-fuse --tests -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1
          echo "clippy exit $?"
          grep -a -A8 '^error' "$RUNNER_TEMP/clippy.log" | head -60
          true
