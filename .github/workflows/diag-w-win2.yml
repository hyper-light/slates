name: diag-w-win2

# w-win2 for main 01a20182 (2026-11-23), item 2, run 5. A diagnostics lane run only from `diag-measurer-w-win2-*`
# branches, never main. Run 4 (45269168513) showed item 2's fix green 5 of 5 on windows-11-arm (12 to 24 s a round) but
# 3 of 5 on windows-latest (35 to 124 s a round, the failing ones at the 60-interval bound). This run logs, on both
# runners with the fix applied, each look's sweep state (the learned slice, the write log and recovery memory left),
# one line a sweep pass (its steps, its time, how it ended), and the give-back rate's first folds (DIAG lines).

on:
  push:
    branches: ["diag-measurer-w-win2-*"]

env:
  CARGO_TERM_COLOR: never

jobs:
  item2:
    name: item 2, the idle sweep logged (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: NASM (x86_64 Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64 Windows)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: "Item 2, logged: the idle sweep's two tests, five times"
        timeout-minutes: 60
        run: |
          set +e
          failed=0
          for round in 1 2 3 4 5; do
            cargo test -p slates-server --lib -- --test-threads=1 --nocapture idle_sweep::tests::an_idle_shard_runs_no_sweep_pass idle_sweep::tests::a_write_on_a_settled_shard_arms_a_pass > "$RUNNER_TEMP/item2-logged-$round.log" 2>&1
            code=$?
            echo "round $round: exit $code, $(grep -a 'test result' "$RUNNER_TEMP/item2-logged-$round.log" | tail -1)"
            if [ "$code" -ne 0 ]; then failed=1; fi
          done
          exit $failed
      - name: "Item 2: every round's DIAG lines, whatever happened"
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/item2-logged-*.log; do echo "=== $f"; grep -a '^test \|DIAG\|panicked at\|test result' "$f" | sed 's/slates daemon: descriptor_limit.*$//'; done
