name: diag-w-win2

# w-win2 for main 01a20182 (2026-11-23), A-879, run 12. A diagnostics lane run only from `diag-measurer-w-win2-*`
# branches, never main. A-879 on main 0d9cc659c, the Windows extents tests holding their attachment from its making with
# `slates attach --hold` until the write says its own hold is taken (run 10: the commit test's attachment lapsed before
# its write began). On both Windows runners: the commit give-back test red with the write's hold ended at once (its
# line kept), then the whole extents file, the attachment-term and hold tests, and clippy of every changed crate.

on:
  push:
    branches: ["diag-measurer-w-win2-*"]

env:
  CARGO_TERM_COLOR: never

jobs:
  windows:
    name: A-879 on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
      SLATES_TEST_CLI: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
      - name: NASM (x86_64 Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64 Windows)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: "A-879, red: the commit give-back test with the write's hold ended at once"
        timeout-minutes: 45
        run: |
          git apply .github/diag-w-win2/a879-red.patch
          set +e
          cargo test -p slates-cli --test content_extents_windows -- --test-threads=1 --nocapture a_freed_content_extent_gives_its_commit_back_on_windows > "$RUNNER_TEMP/a879-red.log" 2>&1
          code=$?
          set -e
          git apply -R .github/diag-w-win2/a879-red.patch
          grep -av '^slates daemon: \|^slates anchor: \|^\s*Compiling \|^warning: aws-lc-sys' "$RUNNER_TEMP/a879-red.log" | tail -30
          echo "red arm exit $code"
          if [ "$code" -eq 0 ]; then echo "UNEXPECTED: the commit give-back test passed with the write's hold ended"; exit 1; fi
      - name: "A-879, green: the Windows extents tests"
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        run: |
          set +e
          cargo test -p slates-cli --test content_extents_windows -- --test-threads=1 --nocapture > "$RUNNER_TEMP/a879-extents.log" 2>&1
          code=$?
          grep -av '^slates daemon: \|^slates anchor: \|^\s*Compiling \|^warning: aws-lc-sys' "$RUNNER_TEMP/a879-extents.log" | tail -40
          exit $code
      - name: "A-879, green: the attachment-term tests and the library's holds"
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          set +e
          cargo test -p slates-server --test attachment_term -- --test-threads=1 > "$RUNNER_TEMP/a879-term.log" 2>&1
          term=$?
          cargo test -p slates-client --test client -- --test-threads=1 a_hold > "$RUNNER_TEMP/a879-hold.log" 2>&1
          hold=$?
          grep -a '^test \|test result\|panicked at' "$RUNNER_TEMP/a879-term.log" "$RUNNER_TEMP/a879-hold.log"
          [ "$term" -eq 0 ] && [ "$hold" -eq 0 ]
      - name: Clippy the changed crates on Windows
        if: ${{ !cancelled() }}
        run: |
          cargo clippy -p slates-ipc -p slates-client -p slates-api -p slates-server --no-deps --lib --tests -- -D warnings 2>&1 | grep -v '^\s*Checking \|^\s*Compiling \|^warning: aws-lc-sys'
          cargo clippy -p slates-cli --no-deps --bins --test content_extents_windows -- -D warnings 2>&1 | grep -v '^\s*Checking \|^\s*Compiling \|^warning: aws-lc-sys'
