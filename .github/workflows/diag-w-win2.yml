name: diag-w-win2

# w-win2 for main 01a20182 (2026-11-23), item 2, run 16: CI's Miri set on slates-rt for the shard loop's change
# (2697686f5). Run 14's Miri stopped at sync::tests::a_bad_channel_and_a_blocking_call_on_a_shard_are_refused, an OS
# runtime test Miri cannot model (timerfd_create), which w-tsan is marking ignored under Miri; this run skips the
# sync::tests module so the rest of the set runs.

on:
  push:
    branches: ["diag-measurer-w-win2-*"]

env:
  CARGO_TERM_COLOR: never

jobs:
  miri:
    name: rt Miri (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: CI's Miri set on slates-rt, the OS-runtime sync tests skipped
        run: |
          MIRIFLAGS="-Zmiri-ignore-leaks" cargo +nightly miri test -p slates-rt --lib -- --skip sync::tests::
          MIRIFLAGS="-Zmiri-ignore-leaks" cargo +nightly miri test -p slates-rt --test differential --test ownership --test timers --test readiness --test alone
