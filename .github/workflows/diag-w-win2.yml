name: diag-w-win2

# w-win2 for main 01a20182 (2026-11-23), A-879, run 9. A diagnostics lane run only from `diag-measurer-w-win2-*`
# branches, never main. Run 7 found the 256 MiB commit give-back write, with the hold, ending before the test fed it
# its input (BrokenPipe at the feed, content_extents_windows.rs:61) on both Windows runners. This run drives the flow by
# hand with a real anchor and prints each command's exit code and stderr whole: a tiny write, a 64 MiB write, and
# `slates attach --hold`.

on:
  push:
    branches: ["diag-measurer-w-win2-*"]

env:
  CARGO_TERM_COLOR: never

jobs:
  flow:
    name: A-879 by hand (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: NASM (x86_64 Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64 Windows)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the CLI
        run: |
          cargo build -p slates-cli 2>&1 | grep -v '^\s*Compiling \|^warning: aws-lc-sys'
      - name: "A-879 by hand: the writes and the hold, each one's stderr whole"
        timeout-minutes: 20
        run: |
          set +e
          .github/diag-w-win2/a879-flow.sh "$(pwd)/target/debug/slates.exe"
