name: diag-w-win2

# w-win2 for main 01a20182 (2026-11-23), A-880, run 18b: run 18's one Windows failure read whole. On both Windows
# runners `an_open_staging_buffer_goes_with_its_attachment` failed at its NotFound check (client.rs:3974) and run 18's
# filter dropped the message; here the test runs alone, unfiltered, three rounds, with the daemon's counters printed.

on:
  push:
    branches: ["diag-measurer-w-win2-*"]

env:
  CARGO_TERM_COLOR: never

jobs:
  detach:
    name: A-880's detach test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: "The detach test alone, unfiltered, three rounds"
        timeout-minutes: 60
        run: |
          for round in 1 2 3; do
            set +e
            RUST_BACKTRACE=1 cargo test -p slates-client --test client -- --test-threads=1 --nocapture --exact an_open_staging_buffer_goes_with_its_attachment > "$RUNNER_TEMP/detach-$round.log" 2>&1
            code=$?
            set -e
            echo "== round $round exit $code"
            grep -av 'descriptor_limit\|^\s*Compiling\|^\s*Running\|^warning: aws-lc' "$RUNNER_TEMP/detach-$round.log" | tail -40
          done
