# Diagnostics for the conformance agent: never on main. Triggered only by pushes to diag-conformance-* branches.
# conformance-18 (A-275, Windows symbolic links), one push: green on the branch (the drive test with its SymlinkEvaluation
# readings, the unprivileged-link test, the semantics, winfstest against the shortened list, recorded, and the WinFsp
# CLI suite, with the privilege tests); red with the four reparse callbacks removed (the drive test must fail); and the
# policy job: Developer Mode's unprivileged create with the mode off and on, and L2R:0's effect on a drive link and an
# NTFS link to a UNC target. Results go to diag-results/conformance-<run>-<job>, read with git fetch.
name: diag-conformance

on:
  push:
    branches: ['diag-conformance-*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a

jobs:
  green:
    name: "A-275: drive test, privilege, semantics, winfstest recorded, WinFsp suite"
    runs-on: windows-latest
    timeout-minutes: 170
    defaults:
      run:
        shell: bash
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
      RESULTS_BRANCH: diag-results/conformance-${{ github.run_id }}-green
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The results publisher
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'PUB'
          #!/bin/bash
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          cd "$GITHUB_WORKSPACE" || exit 0
          entries=""
          for f in results/*; do
            [ -f "$f" ] || continue
            blob=$(git hash-object -w "$f") || exit 0
            entries="$entries$(printf '100644 blob %s\t%s' "$blob" "$(basename "$f")")"$'\n'
          done
          tree=$(printf '%s' "$entries" | git mktree) || exit 0
          parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID") || exit 0
          if git push origin "$commit:refs/heads/$RESULTS_BRANCH"; then
            echo "$commit" > "$RUNNER_TEMP/results-parent"
          else
            echo "::warning::could not publish the results"
          fi
          PUB
          chmod +x "$RUNNER_TEMP/publish.sh"
          mkdir -p results
          { echo "tree $(git rev-parse HEAD) $(date -u +%FT%TZ)"; uname -a; } > results/00-image.txt
          "$RUNNER_TEMP/publish.sh"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: a275-green
      - name: Install NASM
        uses: ilammy/setup-nasm@v1.5.2
      - name: Install WinFsp
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi -MaximumRetryCount 20 -RetryIntervalSec 60 -TimeoutSec 120
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: The drive test, the unprivileged-link test, the semantics
        timeout-minutes: 60
        env:
          SLATES_TEST_CLI: "1"
          WINFSP_TEST_MOUNT: "1"
        run: |
          set +e
          cargo test -p slates-cli --test winfsp_semantics -- --test-threads=1 --nocapture --exact symbolic_links_made_through_the_drive_are_followed_and_read_back > results/10-links.log 2>&1
          echo "exit $?" >> results/10-links.log
          grep -E "^test |test result|panicked|left|right|exit |os error|A-275" results/10-links.log > results/10-links-summary.txt
          "$RUNNER_TEMP/publish.sh"
          cargo test -p slates-cli --test winfsp_semantics -- --test-threads=1 --nocapture --exact a_link_is_refused_to_a_caller_without_the_symlink_privilege > results/11-refused.log 2>&1
          echo "exit $?" >> results/11-refused.log
          grep -E "^test |test result|panicked|left|right|exit |os error|A-275|SKIP" results/11-refused.log > results/11-refused-summary.txt
          "$RUNNER_TEMP/publish.sh"
          cargo test -p slates-cli --test winfsp_semantics -- --test-threads=1 --nocapture --exact a_link_is_made_by_a_caller_holding_the_symlink_privilege > results/12-privileged.log 2>&1
          echo "exit $?" >> results/12-privileged.log
          grep -E "^test |test result|panicked|left|right|exit |os error|A-275|SKIP" results/12-privileged.log > results/12-privileged-summary.txt
          "$RUNNER_TEMP/publish.sh"
          cargo test -p slates-cli --test winfsp_semantics -- --test-threads=1 --nocapture --exact a_link_relative_to_the_drives_root_follows_its_directory_when_moved > results/13-rooted.log 2>&1
          echo "exit $?" >> results/13-rooted.log
          grep -E "^test |test result|panicked|left|right|exit |os error|A-275|SKIP" results/13-rooted.log > results/13-rooted-summary.txt
          "$RUNNER_TEMP/publish.sh"
          cargo test -p slates-cli --test winfsp_semantics -- --test-threads=1 > results/14-semantics.log 2>&1
          echo "exit $?" >> results/14-semantics.log
          grep -E "^test |test result|panicked|exit " results/14-semantics.log > results/15-semantics-summary.txt
          "$RUNNER_TEMP/publish.sh"
      - name: winfstest against the shortened list, recorded
        timeout-minutes: 90
        run: |
          set +e
          cargo xtask conformance run --suite winfstest --records target/rec --scratch target/scr --keep > results/20-winfstest.log 2>&1
          echo "exit $?" >> results/20-winfstest.log
          cp target/rec/native-windows-winfsp.winfstest.json results/30-record.json
          tail -40 results/20-winfstest.log > results/21-winfstest-tail.txt
          find target/scr -name 't_reparse_*.out' -o -name 't_streams_04.t.out' | while read -r f; do cp "$f" "results/40-$(basename "$f")"; done
          "$RUNNER_TEMP/publish.sh"
      - name: The WinFsp CLI suite, as CI runs it
        timeout-minutes: 90
        env:
          SLATES_TEST_CLI: "1"
          WINFSP_TEST_MOUNT: "1"
        run: |
          set +e
          cargo test -p slates-cli --test winfsp -- --test-threads=1 > results/50-winfsp.log 2>&1
          echo "exit $?" >> results/50-winfsp.log
          grep -E "^test |test result|panicked|exit " results/50-winfsp.log > results/51-winfsp-summary.txt
          "$RUNNER_TEMP/publish.sh"

  red-callbacks:
    name: "A-275: the drive test with the reparse callbacks removed (expected red)"
    runs-on: windows-latest
    timeout-minutes: 170
    defaults:
      run:
        shell: bash
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
      RESULTS_BRANCH: diag-results/conformance-${{ github.run_id }}-red-callbacks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The results publisher
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'PUB'
          #!/bin/bash
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          cd "$GITHUB_WORKSPACE" || exit 0
          entries=""
          for f in results/*; do
            [ -f "$f" ] || continue
            blob=$(git hash-object -w "$f") || exit 0
            entries="$entries$(printf '100644 blob %s\t%s' "$blob" "$(basename "$f")")"$'\n'
          done
          tree=$(printf '%s' "$entries" | git mktree) || exit 0
          parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID") || exit 0
          if git push origin "$commit:refs/heads/$RESULTS_BRANCH"; then
            echo "$commit" > "$RUNNER_TEMP/results-parent"
          else
            echo "::warning::could not publish the results"
          fi
          PUB
          chmod +x "$RUNNER_TEMP/publish.sh"
          mkdir -p results
          { echo "tree $(git rev-parse HEAD) $(date -u +%FT%TZ)"; uname -a; } > results/00-image.txt
          "$RUNNER_TEMP/publish.sh"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: a275-red
      - name: Install NASM
        uses: ilammy/setup-nasm@v1.5.2
      - name: Install WinFsp
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi -MaximumRetryCount 20 -RetryIntervalSec 60 -TimeoutSec 120
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: The four reparse callbacks removed from the vtable, then the drive test (expected red)
        timeout-minutes: 60
        env:
          SLATES_TEST_CLI: "1"
          WINFSP_TEST_MOUNT: "1"
        run: |
          set +e
          python - <<'PY'
          p = 'crates/bridge-winfsp/src/host.rs'
          s = open(p).read()
          for slot in ('resolve_reparse_points', 'get_reparse_point', 'set_reparse_point', 'delete_reparse_point'):
              line = f'  {slot}: Some({slot}),\n'
              assert s.count(line) == 1, slot
              s = s.replace(line, '')
          open(p, 'w').write(s)
          PY
          git diff --stat > results/05-red-tree.txt; git diff >> results/05-red-tree.txt
          "$RUNNER_TEMP/publish.sh"
          cargo test -p slates-cli --test winfsp_semantics -- --test-threads=1 --nocapture --exact symbolic_links_made_through_the_drive_are_followed_and_read_back > results/10-links.log 2>&1
          echo "exit $?" >> results/10-links.log
          grep -E "^test |test result|panicked|left|right|exit |os error|A-275" results/10-links.log > results/10-links-summary.txt
          "$RUNNER_TEMP/publish.sh"

  policy:
    name: "A-275: Developer Mode unprivileged create, SymlinkEvaluation L2R:0 (drive and NTFS)"
    runs-on: windows-latest
    timeout-minutes: 170
    defaults:
      run:
        shell: bash
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
      RESULTS_BRANCH: diag-results/conformance-${{ github.run_id }}-policy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The results publisher
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'PUB'
          #!/bin/bash
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          cd "$GITHUB_WORKSPACE" || exit 0
          entries=""
          for f in results/*; do
            [ -f "$f" ] || continue
            blob=$(git hash-object -w "$f") || exit 0
            entries="$entries$(printf '100644 blob %s\t%s' "$blob" "$(basename "$f")")"$'\n'
          done
          tree=$(printf '%s' "$entries" | git mktree) || exit 0
          parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID") || exit 0
          if git push origin "$commit:refs/heads/$RESULTS_BRANCH"; then
            echo "$commit" > "$RUNNER_TEMP/results-parent"
          else
            echo "::warning::could not publish the results"
          fi
          PUB
          chmod +x "$RUNNER_TEMP/publish.sh"
          mkdir -p results
          { echo "tree $(git rev-parse HEAD) $(date -u +%FT%TZ)"; uname -a; } > results/00-image.txt
          "$RUNNER_TEMP/publish.sh"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: a275-policy
      - name: Install NASM
        uses: ilammy/setup-nasm@v1.5.2
      - name: Install WinFsp
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi -MaximumRetryCount 20 -RetryIntervalSec 60 -TimeoutSec 120
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Developer Mode on, its unprivileged create; then SymlinkEvaluation L2R:0 and a drive link to a UNC target
        timeout-minutes: 120
        env:
          SLATES_TEST_CLI: "1"
          WINFSP_TEST_MOUNT: "1"
          MSYS_NO_PATHCONV: "1"
        run: |
          set +e
          reg query 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' > results/06-devmode-before.txt 2>&1
          fsutil behavior query SymlinkEvaluation > results/07-evaluation-before.txt 2>&1
          "$RUNNER_TEMP/publish.sh"
          cargo test -p slates-cli --test winfsp_semantics -- --test-threads=1 --nocapture --exact a_link_is_made_without_the_privilege_under_developer_mode > results/10-devmode-off.log 2>&1
          echo "exit $?" >> results/10-devmode-off.log
          grep -E "^test |test result|panicked|left|right|exit |os error|A-275|SKIP" results/10-devmode-off.log > results/10-devmode-off-summary.txt
          "$RUNNER_TEMP/publish.sh"
          reg add 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f > results/11-devmode-on.txt 2>&1
          reg query 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' >> results/11-devmode-on.txt 2>&1
          cargo test -p slates-cli --test winfsp_semantics -- --test-threads=1 --nocapture --exact a_link_is_made_without_the_privilege_under_developer_mode > results/12-devmode-on.log 2>&1
          echo "exit $?" >> results/12-devmode-on.log
          grep -E "^test |test result|panicked|left|right|exit |os error|A-275|SKIP" results/12-devmode-on.log > results/12-devmode-on-summary.txt
          "$RUNNER_TEMP/publish.sh"
          fsutil behavior set SymlinkEvaluation L2R:0 > results/13-l2r-off.txt 2>&1
          fsutil behavior query SymlinkEvaluation >> results/13-l2r-off.txt 2>&1
          cargo test -p slates-cli --test winfsp_semantics -- --test-threads=1 --nocapture --exact symbolic_links_made_through_the_drive_are_followed_and_read_back > results/14-links-l2r-off.log 2>&1
          echo "exit $?" >> results/14-links-l2r-off.log
          grep -E "^test |test result|panicked|left|right|exit |os error|A-275|SKIP" results/14-links-l2r-off.log > results/14-links-l2r-off-summary.txt
          "$RUNNER_TEMP/publish.sh"
      - name: The NTFS control, a link to a UNC target under L2R:0 and then L2R:1
        timeout-minutes: 10
        shell: pwsh
        run: |
          $l = Join-Path $env:RUNNER_TEMP 'ntfs-unc-link'
          New-Item -ItemType SymbolicLink -Path $l -Target '\\localhost\C$\Windows\win.ini' | Out-Null
          $read = { try { "read $((Get-Content $l -ErrorAction Stop | Measure-Object -Line).Lines) lines" } catch { "refused: $($_.Exception.Message)" } }
          "L2R:0 (as the step before left it): $(& $read)" | Out-File results/16-ntfs-unc.txt
          fsutil behavior set SymlinkEvaluation L2R:1 | Out-File -Append results/16-ntfs-unc.txt
          "L2R:1: $(& $read)" | Out-File -Append results/16-ntfs-unc.txt
          bash "$env:RUNNER_TEMP/publish.sh"
