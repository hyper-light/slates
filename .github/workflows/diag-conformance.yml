# Diagnostics for the conformance agent: never on main. Triggered only by pushes to diag-conformance-* branches.
name: diag-conformance

on:
  push:
    branches: ['diag-conformance-*']

env:
  CARGO_TERM_COLOR: always
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a

jobs:
  gates-linux:
    name: gates on ubuntu (fmt, clippy, xtask check, doc, the conformance tests)
    if: ${{ !contains(github.event.head_commit.message, 'red twin') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: xtask check
        if: ${{ !cancelled() }}
        run: cargo xtask check
      - name: doc
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
        run: cargo doc --workspace --no-deps --document-private-items
      - name: the conformance crate and xtask tests
        if: ${{ !cancelled() }}
        run: cargo test -p slates-conformance && cargo test -p xtask winfstest && cargo test -p xtask plain_path
  windows-conformance:
    name: conformance on ${{ matrix.os }} (fsx, winfstest over the WinFsp drive)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (x86_64)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl for the C the harness links (arm64)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install WinFsp (pinned, as ci.yml)
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Clippy xtask, the CLI's WinFsp tests and the bridge (native Windows)
        run: cargo clippy -p xtask -p slates-bridge-winfsp -p slates-cli --all-targets -- -D warnings
      - name: xtask's own tests (native Windows)
        if: ${{ !cancelled() }}
        run: cargo test -p xtask winfstest
      - name: Win32 semantics through the drive (A-214's red tests)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          SLATES_TEST_CLI: "1"
          WINFSP_TEST_MOUNT: "1"
        run: cargo test -p slates-cli --test winfsp_semantics -- --test-threads=1 --nocapture
      - name: fsx over the WinFsp drive
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: cargo xtask conformance run --suite fsx --records target/conformance-records --scratch target/conformance-scratch --keep
      - name: winfstest over the WinFsp drive
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: cargo xtask conformance run --suite winfstest --records target/conformance-records --scratch target/conformance-scratch --keep
      - name: Upload the records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-records-${{ matrix.os }}
          path: target/conformance-records
      - name: Upload winfstest's per-script output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winfstest-output-${{ matrix.os }}
          path: target/conformance-scratch/*/winfstest-output
          if-no-files-found: ignore
      - name: Upload the anchor logs and fsx logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-logs-${{ matrix.os }}
          path: |
            target/conformance-scratch/*/*.log
            target/conformance-scratch/*/fsx-logs
          if-no-files-found: ignore
