# Diagnostics for the conformance agent: never on main. Triggered only by pushes to diag-conformance-* branches.
name: diag-conformance

on:
  push:
    branches: ['diag-conformance-*']

env:
  CARGO_TERM_COLOR: always
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a

jobs:
  linux-live:
    name: plain and live-shipped suites on ubuntu (three transports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Suite tools
        run: |
          sudo apt-get update && sudo apt-get install -y strace nfs-common fuse3 inotify-tools ripgrep sqlite3 vim
          grep -qx user_allow_other /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf
      - name: The plain runs
        if: ${{ !cancelled() }}
        run: |
          for suite in fsx fsstress pjdfstest; do
            cargo xtask conformance run --suite $suite --records target/pair/plain/records --scratch target/pair/plain/scratch --keep || true
          done
      - name: The live-shipped runs
        if: ${{ !cancelled() }}
        run: |
          for suite in fsx fsstress pjdfstest; do
            cargo xtask conformance run --suite $suite --live-ship --records target/pair/live/records --scratch target/pair/live/scratch --keep || true
          done
      - name: Compare the live-shipped runs with the plain ones
        if: ${{ !cancelled() }}
        run: cargo xtask conformance compare --plain target/pair/plain --live target/pair/live
      - name: The stopped-candidates test (A-200, red until raft's fix)
        if: ${{ !cancelled() }}
        env:
          SLATES_TEST_LIVE_CONFORMANCE: "1"
        run: |
          cargo build -p slates-cli
          SLATES_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/slates" cargo test -p xtask a_live_shipped_volume_makes_a_writer_wait -- --nocapture
      - name: Upload the pair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-linux
          path: |
            target/pair/*/records
            target/pair/*/scratch/*/pjdfstest-output
            target/pair/*/scratch/*/*.log
          if-no-files-found: ignore

  windows-live:
    name: cluster clippy, plain and live-shipped suites on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (x86_64)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Clippy slates-cluster whole (part 1)
        run: cargo clippy -p slates-cluster --all-targets -- -D warnings
      - name: Install WinFsp (pinned, as ci.yml)
        if: ${{ !cancelled() }}
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: The plain runs
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: bash
        run: |
          for suite in fsx winfstest; do
            cargo xtask conformance run --suite $suite --records target/pair/plain/records --scratch target/pair/plain/scratch --keep || true
          done
      - name: The live-shipped runs
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        shell: bash
        run: |
          for suite in fsx winfstest; do
            cargo xtask conformance run --suite $suite --live-ship --records target/pair/live/records --scratch target/pair/live/scratch --keep || true
          done
      - name: Compare the live-shipped runs with the plain ones
        if: ${{ !cancelled() }}
        run: cargo xtask conformance compare --plain target/pair/plain --live target/pair/live
      - name: Upload the pair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-${{ matrix.os }}
          path: |
            target/pair/*/records
            target/pair/*/scratch/*/winfstest-output
            target/pair/*/scratch/*/*.log
          if-no-files-found: ignore
