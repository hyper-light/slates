name: DIAG the image form in QEMU 11.1 (not for main)

# A-165 in QEMU (A-189): QEMU maps a slates volume's image file, through a slates mount, as a virtio-pmem device's
# memory, and the guest mounts it as ext4 with DAX. Green on x86_64 with KVM and on arm64 under QEMU's own emulation;
# red on x86_64 with the guest mounting dax=never, where every pmem test must fail at its own DAX check.

on:
  push:
    branches: [diag-a189-qemu-image]

jobs:
  green:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    name: the image form in QEMU on ${{ matrix.runner }} (green)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Open KVM to the job
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm || echo "no /dev/kvm: QEMU emulates the guest"
      - name: Build the guest image
        run: docker build -t slates-guest ci/guest
      - name: The image tests in QEMU
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --device /dev/fuse --cap-add SYS_ADMIN \
            $( [ -e /dev/kvm ] && echo --device /dev/kvm ) \
            -v "$PWD":/src -w /src slates-guest sh -c \
            'set -e; host=$(rustc -vV | sed -n "s/^host: //p"); \
             RUSTFLAGS="-C target-feature=+crt-static" cargo build --release -p slates-guest-probe \
               --bin slates-guest-probe --target "$host" --target-dir target/probe; \
             SLATES_GUEST_QEMU=$(ls /usr/bin/qemu-system-x86_64 /usr/bin/qemu-system-aarch64 2>/dev/null | head -1) \
             SLATES_GUEST_KERNEL=/guest/vmlinuz \
             SLATES_GUEST_MODULES="/lib/modules/$(ls /lib/modules | head -1)" \
             SLATES_GUEST_PROBE="/src/target/probe/$host/release/slates-guest-probe" \
             cargo test -p slates-cli --test guest_image -- --nocapture --test-threads=1' 2>&1 | tee guest-image.log
          if grep -q "SKIP" guest-image.log; then echo "an image test was skipped"; exit 1; fi
          grep -q "test result: ok. 4 passed" guest-image.log

  red:
    name: the image form in QEMU with the guest mounting dax=never (red)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Open KVM to the job
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Build the guest image
        run: docker build -t slates-guest ci/guest
      - name: The guest mounts the image with dax=never
        run: |
          sed -i 's/slates.dax=always slates.modules=/slates.dax=never slates.modules=/' crates/cli/tests/guest_image.rs
          grep -c "slates.dax=never" crates/cli/tests/guest_image.rs
      - name: Every pmem test must fail at its DAX check
        shell: bash
        run: |
          set +e
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --device /dev/fuse --cap-add SYS_ADMIN \
            $( [ -e /dev/kvm ] && echo --device /dev/kvm ) \
            -v "$PWD":/src -w /src slates-guest sh -c \
            'set -e; host=$(rustc -vV | sed -n "s/^host: //p"); \
             RUSTFLAGS="-C target-feature=+crt-static" cargo build --release -p slates-guest-probe \
               --bin slates-guest-probe --target "$host" --target-dir target/probe; \
             SLATES_GUEST_QEMU=$(ls /usr/bin/qemu-system-x86_64 2>/dev/null | head -1) \
             SLATES_GUEST_KERNEL=/guest/vmlinuz \
             SLATES_GUEST_MODULES="/lib/modules/$(ls /lib/modules | head -1)" \
             SLATES_GUEST_PROBE="/src/target/probe/$host/release/slates-guest-probe" \
             cargo test -p slates-cli --test guest_image -- --nocapture --test-threads=1' > guest-image.log 2>&1
          code=$?
          set -e
          grep -E "^test |test result|panicked|dax: false|DAX is what" guest-image.log | head -40
          test "$code" -ne 0
          grep -q "test result: FAILED. 1 passed; 3 failed" guest-image.log
          test "$(grep -c "DAX is what this test is for" guest-image.log)" -ge 3
