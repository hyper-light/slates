name: DIAG loadtest-scale A-243 -- a fresh partition's longest tail against its recovery budget, the rate timed on the append and the apply (not for main)

# This commit's parent on ubuntu-latest and ubuntu-24.04-arm (after), and four variants of it on ubuntu-latest, each
# with one fix reverted in place before the build (before-*), running the test that holds it. Results are published as
# one commit per job on diag-loadtest-scale-budget-results-<run>-<job>, read with git.

on:
  push:
    branches: ['diag-loadtest-scale-budget-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  w3:
    name: ${{ matrix.variant }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: after, os: ubuntu-latest }
          - { variant: after, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      RESULTS_BRANCH: diag-loadtest-scale-budget-results-${{ github.run_id }}-${{ matrix.variant }}-${{ matrix.os }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}
      - name: suites
        shell: bash
        run: |
          set -u +e +o pipefail
          out="$RUNNER_TEMP/results.txt"; : > "$out"
          step() { name=$1; shift; start=$(date +%s); "$@" > "$RUNNER_TEMP/$name.log" 2>&1; code=$?
            echo "$name exit $code $(( $(date +%s) - start ))s" >> "$out"
            grep -E '^test result|FAILED|panicked|^error|left:|right:|assertion|refused|head reached|partition snapshot|budget |ring |a tail of|checks|check [0-9]|due|meets|unknown|released|did not hold|outlived|once the floor|---- ' "$RUNNER_TEMP/$name.log" | head -80 | sed "s/^/  $name: /" >> "$out"; }
          echo "tested $(git rev-parse HEAD^) variant $VARIANT on $(uname -m), $(nproc) cpus" >> "$out"
          revert() { perl -0pi -e "$2" "$1"; if git diff --quiet -- "$1"; then echo "REVERT DID NOT APPLY to $1" >> "$out"; else git diff --stat -- "$1" | sed 's/^/  reverted: /' >> "$out"; fi; }
          case "$VARIANT" in
            after)
              step model cargo test -p slates-db --test model
              step cadence cargo test -p slates-db --test snapshot_cadence -- --nocapture
              step clippy cargo clippy --workspace --all-targets -- -D warnings
              ;;
            before-rate)
              revert crates/db/src/replay.rs 's/    replay_work\(&mut self\.replay_work_ns_since_snapshot, \|\| \{\n      self\.log\.append\(segment, seq, entry\)\n    \}\)/    self.log.append(segment, seq, entry)/'
              step budget cargo test -p slates-db --test snapshot_cadence -- a_fresh_partitions_longest_tail --nocapture
              step budget-again cargo test -p slates-db --test snapshot_cadence -- a_fresh_partitions_longest_tail --nocapture
              step budget-third cargo test -p slates-db --test snapshot_cadence -- a_fresh_partitions_longest_tail --nocapture
              ;;
          esac
          git checkout -- . 2>/dev/null
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          blob=$(git hash-object -w "$out")
          tree=$(printf '100644 blob %s\tresults.txt\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "snap results of run $GITHUB_RUN_ID, $VARIANT on ${{ matrix.os }}")
          git push origin "$commit:refs/heads/$RESULTS_BRANCH" || echo "::warning::could not publish the results"
