name: DIAG the transaction's wait forms against each other, five runs a runner (not for main)

# The per-phase profile (diag-36 to 38) left a few µs an IRP on arm64 in the transaction call itself, where the
# receiver's form differs from the DLL's: the receiver waits on its OVERLAPPED's event and its purge intents' event
# together (WaitForMultipleObjects, then GetOverlappedResult); the DLL passes no OVERLAPPED, so DeviceIoControl waits on
# the handle (WinFsp v2.1 src/dll/fsctl.c). transact_cost (crates/bridge-winfsp/tests/support/transact.rs) now times
# both, beside its earlier modes, five runs on each runner.
#
# Derived: diag-15 (run 42114236343) ran the five-mode harness five times a runner within its job; eight modes are
# 1.6 times the calls, and the step times out at three times diag-20's whole live step (4 min 52 s, run 42130583401):
# 15 minutes.

on:
  push:
    branches: ['diag-winfsp-overlap-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  OLD_COMMIT: 71cf09acb500fba021c92cfc9c42f0180e93876b
  MAIN_COMMIT: 2f343fcd747148912ea9b6edac653ca48c2e47c0
  SEPARATE_COMMIT: 2adf3d5b7c3ef55c66116d538a5e65603e5ca9ff
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a

jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
        include:
          - runner: windows-latest
            msvc: x64
          - runner: windows-11-arm
            msvc: arm64
    name: transaction wait forms on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - name: The results publisher
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'EOF'
          #!/bin/bash
          # One commit per call on the results branch; a failed publish is reported and does not end the job.
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          cd "$GITHUB_WORKSPACE" || exit 0
          touch ab.txt live.txt clippy.txt mount.txt
          ab=$(git hash-object -w ab.txt) || exit 0
          live=$(git hash-object -w live.txt) || exit 0
          lint=$(git hash-object -w clippy.txt) || exit 0
          mount=$(git hash-object -w mount.txt) || exit 0
          tree=$(printf '100644 blob %s\tab.txt\n100644 blob %s\tclippy.txt\n100644 blob %s\tlive.txt\n100644 blob %s\tmount.txt\n' "$ab" "$lint" "$live" "$mount" | git mktree) || exit 0
          parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID") || exit 0
          if git push origin "$commit:refs/heads/$RESULTS_BRANCH"; then
            echo "$commit" > "$RUNNER_TEMP/results-parent"
          else
            echo "::warning::could not publish the results"
          fi
          EOF
          chmod +x "$RUNNER_TEMP/publish.sh"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (x86_64)
        if: matrix.msvc == 'x64'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64)
        if: matrix.msvc == 'arm64'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install WinFsp, pinned
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "image $env:ImageOS $env:ImageVersion; $env:NUMBER_OF_PROCESSORS CPUs; $env:PROCESSOR_ARCHITECTURE $env:PROCESSOR_IDENTIFIER; WinFsp 2.1.25156" | Out-File -FilePath image.txt -Encoding utf8
      - name: The transaction harness, five runs
        timeout-minutes: 15
        shell: bash
        env:
          RESULTS_BRANCH: diag-winfsp-overlap-results-${{ github.run_id }}-wait-${{ matrix.runner }}
        run: |
          set +e
          {
            echo "# transaction wait forms at $(git rev-parse HEAD); $(date -u +%FT%TZ)"
            cat image.txt
            for run in 1 2 3 4 5; do
              echo "## run $run"
              WINFSP_TEST_MOUNT=1 cargo test --release --locked -p slates-bridge-winfsp --lib -- --ignored --exact \
                host::transact_bench::transact_cost --nocapture
              echo "## run $run exit $?"
            done
          } 2>&1 | tee live.txt
          "$RUNNER_TEMP/publish.sh"
          grep -c '^## run . exit 0$' live.txt | grep -qx 5
      - name: Publish whatever was run
        if: always()
        shell: bash
        env:
          RESULTS_BRANCH: diag-winfsp-overlap-results-${{ github.run_id }}-wait-${{ matrix.runner }}
        run: |
          if [ -f "$RUNNER_TEMP/publish.sh" ]; then bash "$RUNNER_TEMP/publish.sh"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wait-forms-${{ matrix.runner }}
          path: live.txt
