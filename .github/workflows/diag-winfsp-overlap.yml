name: DIAG Windows clippy and the live WinFsp suites on agents/winfsp-overlap-6 (A-219 slice 1) (not for main)

# Audit plan step 7, A-215: slates at 71cf09ac (WinFsp's DLL dispatcher, two threads) and this commit (the receiver whose
# last response of a batch rides the next receive), each with its own daemon and drive, one mount_bench rounding over
# both, after the live oracles (A-215's kill oracle among them). Each runner's output goes to its own results branch as
# each run ends, and to an artifact.

on:
  push:
    branches: ['diag-winfsp-overlap-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  OLD_COMMIT: 71cf09acb500fba021c92cfc9c42f0180e93876b
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a

jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            msvc: x64
          - runner: windows-11-arm
            msvc: arm64
    name: oracles and receiver A/B on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (x86_64)
        if: matrix.msvc == 'x64'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64)
        if: matrix.msvc == 'arm64'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install WinFsp, pinned
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "image $env:ImageOS $env:ImageVersion; $env:NUMBER_OF_PROCESSORS CPUs; $env:PROCESSOR_ARCHITECTURE $env:PROCESSOR_IDENTIFIER; WinFsp 2.1.25156" | Out-File -FilePath image.txt -Encoding utf8
      - name: Native clippy of the receiver
        run: cargo clippy --locked -p slates-bridge-winfsp -p slates-server --all-targets -- -D warnings
      # A-215 changes the crash journal, so the live oracles run first, the new kill oracle among the bridge's. Their output
      # is published with the numbers; the step fails the job at the end if either suite failed.
      - name: The live WinFsp oracles
        shell: bash
        run: |
          set +e
          {
            WINFSP_TEST_MOUNT=1 cargo test --locked -p slates-bridge-winfsp --lib -- --test-threads=1 --nocapture
            echo "## bridge oracles exit $?"
            SLATES_TEST_CLI=1 WINFSP_TEST_MOUNT=1 cargo test --locked -p slates-cli --test winfsp -- --test-threads=1 --nocapture
            echo "## cli mount tests exit $?"
          } 2>&1 | tee live.txt
          grep -c '^## .* exit 0$' live.txt | grep -qx 2 || echo "::error::a live oracle failed"
          exit 0
      - name: Publish the live output
        if: always()
        shell: bash
        env:
          RESULTS_BRANCH: diag-winfsp-overlap-results-${{ github.run_id }}-${{ matrix.runner }}
        run: |
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          touch live.txt
          blob=$(git hash-object -w live.txt)
          tree=$(printf '100644 blob %s\tlive.txt\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "results of run $GITHUB_RUN_ID")
          git push origin "$commit:refs/heads/$RESULTS_BRANCH" || echo "::warning::could not publish"
      - name: Fail on a failed oracle
        if: always()
        shell: bash
        run: grep -c '^## .* exit 0$' live.txt | grep -qx 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receiver-ab-${{ matrix.runner }}
          path: live.txt
