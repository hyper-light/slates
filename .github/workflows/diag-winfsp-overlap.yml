name: DIAG what one WinFsp control transaction costs against its output buffer (not for main)

# Audit plan step 7: host::transact_bench::transact_cost, five release runs on each Windows runner. A real WinFsp volume
# answered by the test's own loop; each mode's call and client-open latencies, and the driver's refusal of a batch output
# under 64 KiB. Each runner's output goes to its own results branch and to an artifact.

on:
  push:
    branches: ['diag-winfsp-overlap-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  OLD_COMMIT: 71cf09acb500fba021c92cfc9c42f0180e93876b
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a

jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            msvc: x64
          - runner: windows-11-arm
            msvc: arm64
    name: transaction cost on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (x86_64)
        if: matrix.msvc == 'x64'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64)
        if: matrix.msvc == 'arm64'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install WinFsp, pinned
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "image $env:ImageOS $env:ImageVersion; $env:NUMBER_OF_PROCESSORS CPUs; $env:PROCESSOR_ARCHITECTURE $env:PROCESSOR_IDENTIFIER; WinFsp 2.1.25156" | Out-File -FilePath image.txt -Encoding utf8
      - name: Native clippy of the bridge
        run: cargo clippy --locked -p slates-bridge-winfsp --all-targets -- -D warnings
      - name: Five runs of the transaction harness
        shell: bash
        run: |
          set +e
          {
            echo "# $(git rev-parse HEAD), $(date -u +%FT%TZ)"
            tr -d '\r\000' < image.txt | sed 's/^\xef\xbb\xbf//'
            cmd //c ver | tr -d '\r' | grep -v '^$'
            cargo test --release --locked -p slates-bridge-winfsp --lib --no-run 2>&1 | tail -2
            for run in 1 2 3 4 5; do
              echo "## run $run of 5, $(date -u +%FT%TZ)"
              WINFSP_TEST_MOUNT=1 cargo test --release --locked -p slates-bridge-winfsp --lib -- --ignored --exact host::transact_bench::transact_cost --nocapture 2>&1 | grep -E "WINFSP TRANSACT|test result|panicked|FAILED"
              echo "## run $run of 5 ended, exit ${PIPESTATUS[0]}"
            done
          } 2>&1 | tee transact.txt
          exit 0
      - name: Publish
        if: always()
        shell: bash
        env:
          RESULTS_BRANCH: diag-winfsp-overlap-results-${{ github.run_id }}-${{ matrix.runner }}
        run: |
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          touch transact.txt
          blob=$(git hash-object -w transact.txt)
          tree=$(printf '100644 blob %s\ttransact.txt\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "results of run $GITHUB_RUN_ID")
          git push origin "$commit:refs/heads/$RESULTS_BRANCH" || echo "::warning::could not publish"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transact-${{ matrix.runner }}
          path: transact.txt
