name: DIAG the replayed-Close and held-open close red check, main's form and the combined form, each arm in its own job (not for main)

# docs/bugs/2026-11-06-a-replayed-close-was-refused-after-takeover.md. Each job checks out its arm's commit:
# - main-red, main-fix: main's one-worker form (00e5269c) with the tests and a refusal counter (97f42a58), the fix kept
#   out (SLATES_DIAG_KEEP_CLOSE_BUG set) or in;
# - comb-red: the combined form (45f048b6, diag tree 1e7d2307) at two fixed workers, the fix kept out;
# - comb1, comb2: the combined form with the fix at one and at two fixed workers.
# Red arms run the two close tests alone: the replayed-Close test must fail its refusal assertion, and the held-open
# test's result is recorded. Fixed arms run the bridge's whole live oracle suite, both close tests included, and must
# pass. diag-winfsp-overlap-32 (run 42171690165) failed every arm on the replayed-Close test's own wait.
#
# Derived: the oracle step times out at three times diag-20's whole live step on the slower runner. Run 42130583401
# built and ran both suites in 4 min 52 s on windows-latest, so 3 x 4 min 52 s = 14.6 min, 15. A hang ends as a failure.

on:
  push:
    branches: ['diag-winfsp-overlap-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  OLD_COMMIT: 71cf09acb500fba021c92cfc9c42f0180e93876b
  MAIN_COMMIT: 2f343fcd747148912ea9b6edac653ca48c2e47c0
  SEPARATE_COMMIT: 2adf3d5b7c3ef55c66116d538a5e65603e5ca9ff
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a

jobs:
  red:
    strategy:
      fail-fast: false
      matrix:
        arm: [main-red, main-fix, comb-red, comb1, comb2]
        runner: [windows-latest, windows-11-arm]
        include:
          - runner: windows-latest
            msvc: x64
          - runner: windows-11-arm
            msvc: arm64
          - arm: main-red
            commit: 97f42a58d9b18cea828287fbafa4ceda2c72e121
            keep_bug: "1"
            workers: ""
            red: "1"
          - arm: main-fix
            commit: 97f42a58d9b18cea828287fbafa4ceda2c72e121
            keep_bug: ""
            workers: ""
            red: ""
          - arm: comb-red
            commit: 1e7d230764b9e15743e3cc3b7c41fb0941e3b599
            keep_bug: "1"
            workers: "2"
            red: "1"
          - arm: comb1
            commit: 1e7d230764b9e15743e3cc3b7c41fb0941e3b599
            keep_bug: ""
            workers: "1"
            red: ""
          - arm: comb2
            commit: 1e7d230764b9e15743e3cc3b7c41fb0941e3b599
            keep_bug: ""
            workers: "2"
            red: ""
    name: replayed close, ${{ matrix.arm }}, on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}
      - name: The results publisher
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'EOF'
          #!/bin/bash
          # One commit per call on the results branch; a failed publish is reported and does not end the job.
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          cd "$GITHUB_WORKSPACE" || exit 0
          touch ab.txt live.txt clippy.txt mount.txt
          ab=$(git hash-object -w ab.txt) || exit 0
          live=$(git hash-object -w live.txt) || exit 0
          lint=$(git hash-object -w clippy.txt) || exit 0
          mount=$(git hash-object -w mount.txt) || exit 0
          tree=$(printf '100644 blob %s\tab.txt\n100644 blob %s\tclippy.txt\n100644 blob %s\tlive.txt\n100644 blob %s\tmount.txt\n' "$ab" "$lint" "$live" "$mount" | git mktree) || exit 0
          parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID") || exit 0
          if git push origin "$commit:refs/heads/$RESULTS_BRANCH"; then
            echo "$commit" > "$RUNNER_TEMP/results-parent"
          else
            echo "::warning::could not publish the results"
          fi
          EOF
          chmod +x "$RUNNER_TEMP/publish.sh"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (x86_64)
        if: matrix.msvc == 'x64'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64)
        if: matrix.msvc == 'arm64'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install WinFsp, pinned
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "image $env:ImageOS $env:ImageVersion; $env:NUMBER_OF_PROCESSORS CPUs; $env:PROCESSOR_ARCHITECTURE $env:PROCESSOR_IDENTIFIER; WinFsp 2.1.25156" | Out-File -FilePath image.txt -Encoding utf8
      - name: The replayed-Close check
        timeout-minutes: 15
        shell: bash
        env:
          RESULTS_BRANCH: diag-winfsp-overlap-results-${{ github.run_id }}-${{ matrix.arm }}-${{ matrix.runner }}
          ARM: ${{ matrix.arm }}
          RED: ${{ matrix.red }}
          KEEP_BUG: ${{ matrix.keep_bug }}
          WORKERS: ${{ matrix.workers }}
        run: |
          set +e
          if [ -n "$KEEP_BUG" ]; then export SLATES_DIAG_KEEP_CLOSE_BUG=1; fi
          if [ -n "$WORKERS" ]; then export SLATES_DIAG_RECEIVE_WORKERS=$WORKERS; fi
          {
            echo "# arm $ARM at $(git rev-parse HEAD); keep bug '${KEEP_BUG}', workers '${WORKERS}'"
            cat image.txt
            if [ -n "$RED" ]; then
              WINFSP_TEST_MOUNT=1 cargo test --locked -p slates-bridge-winfsp --lib -- --test-threads=1 --nocapture \
                a_close_served_before_the_kill_is_answered_done_after_takeover \
                a_handle_open_across_the_kill_closes_through_the_successor
            else
              WINFSP_TEST_MOUNT=1 cargo test --locked -p slates-bridge-winfsp --lib -- --test-threads=1 --nocapture \
                --skip a_probe_killed_mid_measure --skip probe::tests
            fi
            echo "## bridge, $ARM, exit $?"
          } 2>&1 | tee live.txt
          "$RUNNER_TEMP/publish.sh"
          if [ -n "$RED" ]; then
            grep -q 'WINFSP CLOSE: the successor settled [1-9][0-9]* captured requests, [1-9][0-9]* refused' live.txt \
              && grep -q 'the successor refused a replayed Close whose open the dead daemon had already ended' live.txt \
              && grep -q '^## bridge, .* exit 101$' live.txt
          else
            grep -q 'WINFSP CLOSE: the successor settled [1-9][0-9]* captured requests, 0 refused' live.txt \
              && grep -q 'WINFSP CLOSE: the closer client.s CloseHandle succeeded' live.txt \
              && grep -q 'WINFSP HOLD: the successor served the held open.s Close' live.txt \
              && grep -q 'WINFSP CLOSE: the holder client.s CloseHandle succeeded' live.txt \
              && grep -q '^## bridge, .* exit 0$' live.txt
          fi
      - name: Publish whatever was run
        if: always()
        shell: bash
        env:
          RESULTS_BRANCH: diag-winfsp-overlap-results-${{ github.run_id }}-${{ matrix.arm }}-${{ matrix.runner }}
        run: |
          if [ -f "$RUNNER_TEMP/publish.sh" ]; then bash "$RUNNER_TEMP/publish.sh"; fi
