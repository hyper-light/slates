name: diag measurer
# main 01a20182 (2026-11-22 ~01:45 PST): did tonight's landings regress 84a on macOS, or is it runner variance? An
# interleaved A/B inside one job on one runner: A = 946e39c22 (round 1: loaded p99 < 1 ms 5/5), B = origin/main at this
# branch's base (round 2 on 5870e50: p99 over 1 ms in 4/5). Loaded rounds A B, B A, A B, B A, A B; then quiet A, B.
# Run only from `diag-measurer-*` branches, never main; every log is an artifact.

on:
  push:
    branches: ["diag-measurer-*"]

env:
  CARGO_TERM_COLOR: never
  A_REV: 946e39c22

jobs:
  ab:
    name: 84a macOS A/B (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build A and B
        run: |
          W="$RUNNER_TEMP/ab"; mkdir -p "$W/logs"
          B_REV=$(git rev-parse HEAD^1); echo "A $A_REV B $B_REV (this branch's base)"
          for arm in A B; do
            rev=$A_REV; [ $arm = B ] && rev=$B_REV
            git worktree add -q --detach "$W/src-$arm" "$rev"
            (cd "$W/src-$arm" && CARGO_TARGET_DIR="$W/target-$arm" cargo build --release --locked -p slates-client --example edit_merge_bench > "$W/logs/build-$arm.log" 2>&1) || { tail -30 "$W/logs/build-$arm.log"; exit 1; }
            cp "$W/target-$arm/release/examples/edit_merge_bench" "$W/bench-$arm"
          done
          echo "runner cpus $(sysctl -n hw.ncpu) memory $(($(sysctl -n hw.memsize) / 1073741824)) GiB"; sw_vers
      - name: Interleaved rounds
        run: |
          W="$RUNNER_TEMP/ab"; set +e +o pipefail
          i=0
          for arm in A B B A A B B A A B; do
            i=$((i+1)); L="$W/logs/loaded-$i-$arm.log"; echo "== loaded run $i arm $arm $(date -u +%FT%TZ) load: $(uptime)" | tee "$L"
            perl -e 'alarm shift; exec @ARGV' 1500 "$W/bench-$arm" --loaded-only --spinners-per-core 2 --files 10 --form accept --form conflict </dev/null >> "$L" 2>&1
            echo "exit $?" >> "$L"; grep -E "f10_loaded_total_p(50|99|999)\b|exit" "$L" | sed "s/^/[$arm] /" | cut -c1-200
          done
          for arm in A B; do
            L="$W/logs/quiet-$arm.log"; echo "== quiet arm $arm" | tee "$L"
            perl -e 'alarm shift; exec @ARGV' 1200 "$W/bench-$arm" --quiet-only --files 10 --form accept --form conflict </dev/null >> "$L" 2>&1
            echo "exit $?" >> "$L"; grep -E "f10_quiet_total_p(50|99|999)\b|exit" "$L" | sed "s/^/[$arm] /" | cut -c1-200
          done
      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ab-84a-macos-logs
          path: ${{ runner.temp }}/ab/logs
          if-no-files-found: warn
