name: diag-measurer

# w-perf 84a macOS p999 (main 01a20182, 2026-11-22): what the over-1-ms p999 rounds wait on, under TB (A-831). Every
# loaded round's slowest requests are joined to their taking shard's long polls (task label, attribution, length
# against its allowed quantum) and parks (tailjoin.py). Beside each loaded round, in the same job on the same runner,
# the control: g222's floor, a two-thread ping-pong under the same time-constraint policy (G222_FLOOR_TB), its p99 and
# p999 the runner's own wake floor then. Diagnostics only: never main.

on:
  push:
    branches: ["diag-measurer-w-perf-84a-mac-tail"]

env:
  CARGO_TERM_COLOR: never
  ROUNDS: "8"

jobs:
  mac-tail:
    name: mac tail (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build
        run: |
          W="$RUNNER_TEMP/msr"; mkdir -p "$W/logs"
          cargo build --release --locked -p slates-client --example edit_merge_bench --example g222_floor --example g222_wake_probe > "$W/logs/build.log" 2>&1 || { tail -30 "$W/logs/build.log"; exit 1; }
          cp target/release/examples/edit_merge_bench target/release/examples/g222_floor target/release/examples/g222_wake_probe "$W/"
          echo "runner cpus $(sysctl -n hw.ncpu)"; sw_vers 2>/dev/null || true
      - name: Loaded rounds with the kernel's stacks sampled (spindump) mid-run
        run: |
          W="$RUNNER_TEMP/msr"; set +e
          for round in 1 2 3 4 5 6; do
            L="$W/logs/loaded-r$round.log"
            echo "== loaded r$round $(date -u +%FT%TZ)" | tee "$L"
            G222_DIAG="$W/logs/loaded-r$round.tsv" perl -e 'alarm shift; exec @ARGV' 1500 "$W/edit_merge_bench" --loaded-only --spinners-per-core 2 --files 10 --form accept --form conflict </dev/null >> "$L" 2>&1 &
            BENCH=$!
            sleep 0.5
            sudo spindump "$BENCH" 8 1 -file "$W/logs/spindump-r$round.txt" > "$W/logs/spindump-r$round.log" 2>&1
            echo "spindump exit $? size $(wc -c < "$W/logs/spindump-r$round.txt" 2>/dev/null)"
            wait $BENCH; echo "bench exit $?"
            grep -E "_loaded_total_p(99|999)\b" "$L" | cut -c1-120
            grep -c "wake_by_address" "$W/logs/spindump-r$round.txt" 2>/dev/null
          done
          true
      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: ${{ runner.temp }}/msr/logs
          if-no-files-found: warn
