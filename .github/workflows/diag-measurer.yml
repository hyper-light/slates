name: diag-measurer

# w-perf 84a macOS p999 (main 01a20182, 2026-11-22): what the over-1-ms p999 rounds wait on, under TB (A-831). Every
# loaded round's slowest requests are joined to their taking shard's long polls (task label, attribution, length
# against its allowed quantum) and parks (tailjoin.py). Beside each loaded round, in the same job on the same runner,
# the control: g222's floor, a two-thread ping-pong under the same time-constraint policy (G222_FLOOR_TB), its p99 and
# p999 the runner's own wake floor then. Diagnostics only: never main.

on:
  push:
    branches: ["diag-measurer-w-perf-84a-mac-tail"]

env:
  CARGO_TERM_COLOR: never
  ROUNDS: "8"

jobs:
  mac-tail:
    name: mac tail (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build
        run: |
          W="$RUNNER_TEMP/msr"; mkdir -p "$W/logs"
          cargo build --release --locked -p slates-client --example edit_merge_bench --example g222_floor > "$W/logs/build.log" 2>&1 || { tail -30 "$W/logs/build.log"; exit 1; }
          cp target/release/examples/edit_merge_bench target/release/examples/g222_floor "$W/"
          echo "runner cpus $(sysctl -n hw.ncpu)"; sw_vers 2>/dev/null || true
      - name: A/B rounds, base and arm alternating, each loaded run stamped with the control beside it
        run: |
          W="$RUNNER_TEMP/msr"; set +e
          for round in $(seq 1 "$ROUNDS"); do
            if [ $((round % 2)) -eq 1 ]; then ORDER="base arm"; else ORDER="arm base"; fi
            for arm in $ORDER; do
              if [ "$arm" = arm ]; then export G222_BELL_TB=1; else unset G222_BELL_TB; fi
              Q="$W/logs/quiet-$arm-r$round.log"
              perl -e 'alarm shift; exec @ARGV' 900 "$W/edit_merge_bench" --quiet-only --files 10 --form accept --form conflict </dev/null > "$Q" 2>&1
              echo "== quiet $arm r$round exit $?"; grep -E "_quiet_total_p(99|999)\b|doorbell thread runs" "$Q" | cut -c1-160
              L="$W/logs/loaded-$arm-r$round.log"; F="$W/logs/floor-$arm-r$round.log"
              echo "== loaded $arm r$round $(date -u +%FT%TZ) load: $(uptime)" | tee "$L"
              ( while [ ! -e "$W/logs/done-$arm-r$round" ]; do G222_FLOOR_TB=50000 "$W/g222_floor" 20000 0; done ) > "$F" 2>&1 &
              CONTROL=$!
              G222_DIAG="$W/logs/loaded-$arm-r$round.tsv" perl -e 'alarm shift; exec @ARGV' 1500 "$W/edit_merge_bench" --loaded-only --spinners-per-core 2 --files 10 --form accept --form conflict </dev/null >> "$L" 2>&1
              echo "exit $?" >> "$L"; touch "$W/logs/done-$arm-r$round"; wait $CONTROL
              grep -E "_loaded_total_p(99|999)\b|exit|doorbell thread runs" "$L" | sort -u | cut -c1-160
              echo "control: p999 us $(sed -nE 's/.*p999 ([0-9.]+) us.*/\1/p' "$F" | sort -n | tr '\n' ' ' | cut -c1-200); max us $(sed -nE 's/.*max ([0-9.]+) us.*/\1/p' "$F" | sort -n | tail -1)"
              python3 .github/g222/tailjoin.py "$W/logs/loaded-$arm-r$round.tsv" | grep -E "timed requests|p999 tail: n|wake hops|landed -> rung" | cut -c1-300
            done
          done
          true
      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mac-bell-ab-logs
          path: ${{ runner.temp }}/msr/logs
          if-no-files-found: warn
