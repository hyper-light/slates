name: diag measurer
# main 01a20182 (2026-11-22 04:04 PST): ci.yml's own wall, workspace-wide, on both host platforms, because CI's main runs
# have been cancelled one after another and the four-crate clippy round found Linux-only test code that no longer
# compiles (crates/server/tests/virtiofs.rs:1210, since 5169ed2b1 on 11-20). The same three gates ci.yml's `gates` job
# runs, each kept going so one red doesn't hide the next: fmt, and clippy --workspace --all-targets with every warning
# listed (a warning, unlike -D warnings, doesn't stop a crate's dependents from being checked; --all-targets checks every
# test target). Run only from `diag-measurer-*` branches, never main.

on:
  push:
    branches: ["diag-measurer-*"]

env:
  CARGO_TERM_COLOR: never

jobs:
  wall:
    name: the wall, workspace-wide (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format, clippy and every test compiled
        run: |
          set +e; rc=0
          cargo fmt --all --check > fmt.log 2>&1; f=$?; echo "fmt exit $f"; [ $f -eq 0 ] || { rc=1; grep -E '^Diff in' fmt.log | sed -E 's#^Diff in .*/slates/slates/##' | head -20; }
          # Every lint, every crate: lints capped at warn (the lint wall denies some by name), so no lint stops a crate's dependents.
          cargo clippy --workspace --all-targets --keep-going --message-format=short -- --cap-lints warn > clippy.log 2>&1; c=$?
          n=$(grep -cE '^[^ ]+:[0-9]+:[0-9]+: (warning|error)' clippy.log); echo "clippy exit $c, $n sites"
          grep -E '^[^ ]+:[0-9]+:[0-9]+: (warning|error)' clippy.log | sed -E 's#^/home/runner/work/slates/slates/##; s#^/Users/runner/work/slates/slates/##' | sort -u | head -80
          [ $c -eq 0 ] && [ "$n" -eq 0 ] || rc=1
          exit $rc
      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: wall-${{ matrix.os }}
          path: |
            fmt.log
            clippy.log
          if-no-files-found: warn
