name: diag-measurer

# w-perf 84a Linux (main 01a20182's go of 2026-11-22 04:30 PST): the four-arm A/B, interleaved in one job a runner.
# A = d2c6635a2 (main 4a1686023 plus the loaded form's throughput line); B = 21179849c (A plus the shards' round-robin
# class, parking at once); C = 0a7e06c56 (the shards spin R9's floor alone, plus the client's reply-wait park in the
# class); D = 69c483e8d (the shards park at once, plus the client's park in the class). Run 45023871879 found C's and
# D's restores refused EPERM (an unprivileged thread cannot clear SCHED_RESET_ON_FORK), so C and D are now
# C' = 2c69390ba and D' = 7cba67b4a, the park raised without the flag. A failure of B's, C''s or D''s own tests stops
# the run; A's red is recorded and passed over. Red/green first: crates/rt/tests/round_robin.rs on
# each arm. Each quiet run's CPU is timed (an RR shard must idle near zero), the load's throughput printed (its
# time-share neighbours must not starve). The runner's account is granted RLIMIT_RTPRIO 1 the way an administrator
# grants it (pam_limits, systemd's LimitRTPRIO=), by `sudo prlimit` on each step's shell, inherited by both arms alike:
# stock, the account has soft 0 and hard 0 (g220's probe, run 44991298743), where B declines and equals A by design.
# Diagnostics only: diag-measurer-* branches, never main.

on:
  push:
    branches: ["diag-measurer-w-perf-84a-linux-ab"]

env:
  CARGO_TERM_COLOR: never
  ARMS: "d2c6635a20cbc5ff0fc09f23235381670aa6ec58 21179849cbf776b7f26095dfc329068c98243cd0 2c69390baf4992c7555fefdc24ce0b57fabebc72 7cba67b4aa54dec68efaf6469310d7c4a92ec7e5"
  ROUNDS: "5"

jobs:
  rr-ab:
    name: round-robin A/B (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: The machine
        run: |
          echo "runner cpus $(nproc)"; uname -a; echo "kernel $(uname -r)"
          echo "sched features: $(sudo cat /sys/kernel/debug/sched/features 2>/dev/null || echo unreadable)"
          echo "base slice ns: $(sudo cat /sys/kernel/debug/sched/base_slice_ns 2>/dev/null || echo unreadable)"
          echo "config: $(grep -E '^CONFIG_HZ=|^CONFIG_PREEMPT' /boot/config-$(uname -r) 2>/dev/null | tr '\n' ' ')"
          echo "rt runtime us $(cat /proc/sys/kernel/sched_rt_runtime_us 2>/dev/null) period us $(cat /proc/sys/kernel/sched_rt_period_us 2>/dev/null)"
          echo "limits: rtprio $(ulimit -r) rttime $(ulimit -R 2>/dev/null || echo ?)"
          true
      - name: Build the arms and run the red/green test on each
        run: |
          sudo prlimit --pid $$ --rtprio=1:1; echo "granted: rtprio soft $(ulimit -r) hard $(ulimit -Hr), rttime $(ulimit -R)"
          W="$RUNNER_TEMP/msr"; mkdir -p "$W/logs"
          for arm in $ARMS; do
            s="${arm:0:9}"; mkdir -p "$W/src-$s" "$W/bin-$s"
            git archive --format=tar "$arm" | tar -xmf - -C "$W/src-$s"
            ( cd "$W/src-$s" && CARGO_TARGET_DIR="$W/target-$s" cargo build --release --locked -p slates-client --example edit_merge_bench --example provision_bench ) > "$W/logs/build-$s.log" 2>&1 \
              || { tail -40 "$W/logs/build-$s.log"; exit 1; }
            cp "$W/target-$s/release/examples/edit_merge_bench" "$W/bin-$s/edit_merge_bench"
            cp "$W/target-$s/release/examples/provision_bench" "$W/bin-$s/provision_bench"
            if [ ! -f "$W/src-$s/crates/rt/tests/round_robin.rs" ]; then
              # The red half: C's tests against A's tree, where the class does not exist.
              git show 2c69390baf4992c7555fefdc24ce0b57fabebc72:crates/rt/tests/round_robin.rs > "$W/src-$s/crates/rt/tests/round_robin.rs"
              git show 2c69390baf4992c7555fefdc24ce0b57fabebc72:crates/machine/tests/round_robin.rs > "$W/src-$s/crates/machine/tests/round_robin.rs"
            fi
            for crate in slates-rt slates-machine; do
              [ -f "$W/src-$s/crates/${crate#slates-}/tests/round_robin.rs" ] || continue
              if ( cd "$W/src-$s" && CARGO_TARGET_DIR="$W/target-$s" cargo test --release --locked -p $crate --test round_robin -- --nocapture ) > "$W/logs/test-$s-$crate.log" 2>&1; then rc=0; else rc=$?; fi
              echo "arm $s $crate round_robin test exit $rc";
              if [ $rc != 0 ] && [ "$s" != "${ARMS:0:9}" ]; then tail -30 "$W/logs/test-$s-$crate.log"; exit 1; fi grep -E "^error\[|test result|panicked|skipping|grants" "$W/logs/test-$s-$crate.log" | head -4
            done
          done
      - name: Interleaved rounds, loaded then quiet
        run: |
          sudo prlimit --pid $$ --rtprio=1:1; echo "granted: rtprio soft $(ulimit -r) hard $(ulimit -Hr), rttime $(ulimit -R)"
          W="$RUNNER_TEMP/msr"
          order() { echo $ARMS | awk -v r=$1 '{n=NF; for(i=0;i<n;i++){j=(i+r-1)%n+1; printf "%s ", $j}}'; }
          set +e
          for round in $(seq 1 "$ROUNDS"); do
            for arm in $(order $round); do
              s="${arm:0:9}"; L="$W/logs/loaded-$s-r$round.log"
              echo "== loaded round $round arm $s $(date -u +%FT%TZ) load: $(uptime)" | tee "$L"
              perl -e 'alarm shift; exec @ARGV' 1200 "$W/bin-$s/edit_merge_bench" --loaded-only --spinners-per-core 2 --files 10 --form accept --form conflict </dev/null >> "$L" 2>&1
              echo "exit $?" >> "$L"; grep -E "round-robin|real-time parks|load throughput|_loaded_total_p(50|99|999)\b|exit" "$L" | sort -u | cut -c1-220
            done
          done
          for round in $(seq 1 3); do
            for arm in $(order $round); do
              s="${arm:0:9}"; L="$W/logs/quiet-$s-r$round.log"
              echo "== quiet round $round arm $s $(date -u +%FT%TZ) load: $(uptime)" | tee "$L"
              /usr/bin/time -f "quiet cpu: user %U s, sys %S s, wall %e s" perl -e 'alarm shift; exec @ARGV' 1200 "$W/bin-$s/edit_merge_bench" --quiet-only --files 10 --form accept --form conflict </dev/null >> "$L" 2>&1
              echo "exit $?" >> "$L"; grep -E "round-robin|quiet cpu|_quiet_total_p(50|99|999)\b|exit" "$L" | cut -c1-220
              PL="$W/logs/provision-$s-r$round.log"
              perl -e 'alarm shift; exec @ARGV' 1200 "$W/bin-$s/provision_bench" </dev/null > "$PL" 2>&1; echo "exit $?" >> "$PL"
              grep -E "spinning_1_p(50|99|999):|exit" "$PL" | cut -c1-200
            done
          done
          true
      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rr-ab-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/msr/logs
          if-no-files-found: warn
