name: diag-measurer

# w-perf 84a macOS p999 (main 01a20182, 2026-11-22): what the over-1-ms p999 rounds wait on, under TB (A-831). Every
# loaded round's slowest requests are joined to their taking shard's long polls (task label, attribution, length
# against its allowed quantum) and parks (tailjoin.py). Beside each loaded round, in the same job on the same runner,
# the control: g222's floor, a two-thread ping-pong under the same time-constraint policy (G222_FLOOR_TB), its p99 and
# p999 the runner's own wake floor then. Diagnostics only: never main.

on:
  push:
    branches: ["diag-measurer-w-perf-84a-mac-tail"]

env:
  CARGO_TERM_COLOR: never
  ROUNDS: "8"

jobs:
  mac-tail:
    name: mac tail (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build
        run: |
          W="$RUNNER_TEMP/msr"; mkdir -p "$W/logs"
          cargo build --release --locked -p slates-client --example edit_merge_bench --example g222_floor --example g222_wake_probe > "$W/logs/build.log" 2>&1 || { tail -30 "$W/logs/build.log"; exit 1; }
          cp target/release/examples/edit_merge_bench target/release/examples/g222_floor target/release/examples/g222_wake_probe "$W/"
          echo "runner cpus $(sysctl -n hw.ncpu)"; sw_vers 2>/dev/null || true
      - name: The wake probe with the race, every variant, three passes in rotating order
        run: |
          W="$RUNNER_TEMP/msr"; set +e
          T="PROBE_WAKER_TB=1 PROBE_WAITER_TB=1 PROBE_SHARED=1"
          V=(
            "PROBE_MECH=ulock $T|2"
            "PROBE_MECH=ulock $T PROBE_SETTLE_NS=0|2"
            "PROBE_MECH=ulock $T PROBE_JITTER_NS=20000|2"
            "PROBE_MECH=ulock $T PROBE_SETTLE_NS=0 PROBE_WAKERS=1|2"
            "PROBE_MECH=ulock $T PROBE_SETTLE_NS=0|0"
            "PROBE_MECH=ulock $T PROBE_JITTER_NS=20000 PROBE_SHM=1 PROBE_WRITE_KB=64|2"
            "PROBE_MECH=sem $T PROBE_SETTLE_NS=0|2"
            "PROBE_MECH=sem $T PROBE_JITTER_NS=20000|2"
            "PROBE_MECH=pipe $T PROBE_SETTLE_NS=0|2"
            "PROBE_MECH=pipe $T PROBE_JITTER_NS=20000|2"
          )
          for pass in 1 2 3; do
            n=${#V[@]}
            for k in $(seq 0 $((n - 1))); do
              v="${V[$(( (k + pass * 3) % n ))]}"; envs="${v%|*}"; spin="${v#*|}"
              echo "== pass $pass: $envs spinners $spin"
              env $envs perl -e 'alarm shift; exec @ARGV' 300 "$W/g222_wake_probe" 10000 "$spin" 2>&1 | tail -2 | tee -a "$W/logs/probe.log"
            done
          done
          echo "######## summary"; sort "$W/logs/probe.log" | grep "^probe"
      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: ${{ runner.temp }}/msr/logs
          if-no-files-found: warn
