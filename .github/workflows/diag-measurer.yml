name: diag-measurer

# w-perf 84a macOS p999 (main 01a20182, 2026-11-22): what the over-1-ms p999 rounds wait on, under TB (A-831). Every
# loaded round's slowest requests are joined to their taking shard's long polls (task label, attribution, length
# against its allowed quantum) and parks (tailjoin.py). Beside each loaded round, in the same job on the same runner,
# the control: g222's floor, a two-thread ping-pong under the same time-constraint policy (G222_FLOOR_TB), its p99 and
# p999 the runner's own wake floor then. Diagnostics only: never main.

on:
  push:
    branches: ["diag-measurer-w-perf-84a-mac-tail"]

env:
  CARGO_TERM_COLOR: never
  ROUNDS: "8"

jobs:
  mac-tail:
    name: mac tail (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build
        run: |
          W="$RUNNER_TEMP/msr"; mkdir -p "$W/logs"
          cargo build --release --locked -p slates-client --example edit_merge_bench --example g222_floor > "$W/logs/build.log" 2>&1 || { tail -30 "$W/logs/build.log"; exit 1; }
          cp target/release/examples/edit_merge_bench target/release/examples/g222_floor "$W/"
          echo "runner cpus $(sysctl -n hw.ncpu)"; sw_vers 2>/dev/null || true
      - name: Loaded rounds, stamped, each with the control beside it
        run: |
          W="$RUNNER_TEMP/msr"; set +e
          for round in $(seq 1 "$ROUNDS"); do
            L="$W/logs/loaded-r$round.log"; F="$W/logs/floor-r$round.log"
            echo "== loaded round $round $(date -u +%FT%TZ) load: $(uptime)" | tee "$L"
            ( while [ ! -e "$W/logs/done-r$round" ]; do G222_FLOOR_TB=50000 "$W/g222_floor" 20000 0; done ) > "$F" 2>&1 &
            CONTROL=$!
            G222_DIAG="$W/logs/loaded-r$round.tsv" perl -e 'alarm shift; exec @ARGV' 1500 "$W/edit_merge_bench" --loaded-only --spinners-per-core 2 --files 10 --form accept --form conflict </dev/null >> "$L" 2>&1
            echo "exit $?" >> "$L"; touch "$W/logs/done-r$round"; wait $CONTROL
            grep -E "_loaded_total_p(99|999)\b|exit" "$L" | cut -c1-160
            echo "control: $(grep -c floor: "$F") runs; p99 us $(sed -nE 's/.*p99 ([0-9.]+) us.*/\1/p' "$F" | sort -n | tr '\n' ' ' | cut -c1-200)"
            echo "control: p999 us $(sed -nE 's/.*p999 ([0-9.]+) us.*/\1/p' "$F" | sort -n | tr '\n' ' ' | cut -c1-200); max us $(sed -nE 's/.*max ([0-9.]+) us.*/\1/p' "$F" | sort -n | tail -1)"
            python3 .github/g222/tailjoin.py "$W/logs/loaded-r$round.tsv"
            python3 .github/g222/macsplit.py "$W/logs/loaded-r$round.tsv" | grep -E "p999 tail|dominant" | cut -c1-200
          done
          true
      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mac-tail-logs
          path: ${{ runner.temp }}/msr/logs
          if-no-files-found: warn
