name: diag-measurer

# The supervisor's measurer: goal 234's A/B (A-223's confirmed-sleep wake estimate with the window rule, and A-326's
# closed-loop hold): `provision_bench`, main just before the landing (3d7a36ab8) against the landing (0db7ea28a), each
# built from its own source extract into one target dir (each arm extracted just before its build, so newer), at
# PROVISION_BENCH_SHARDS = 1, 3 and 15 and the derived count, quiet and then under two spinning loops a logical CPU,
# arms alternating, three rounds. A diagnostics lane run only from `diag-measurer-*` branches (never main).

on:
  push:
    branches: ["diag-measurer-*"]

env:
  CARGO_TERM_COLOR: never
  ARM_A: 3d7a36ab817a47de1211e5f3e3b3405d08050d85
  ARM_B: 0db7ea28abba4c94edf93428b8aabdc7c0fa5eb3

jobs:
  provision-ab:
    name: provision A/B (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: NASM (x86_64 Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64 Windows)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build both arms
        env:
          AWS_LC_SYS_PREBUILT_NASM: "0"
        run: |
          W="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/msr"; mkdir -p "$W/logs"
          native() { if command -v cygpath >/dev/null 2>&1; then cygpath -w "$1"; else echo "$1"; fi; }
          export CARGO_TARGET_DIR="$(native "$W/target")"
          EXE=""; [ "${RUNNER_OS}" = Windows ] && EXE=".exe"
          for arm in "$ARM_A" "$ARM_B"; do
            s="${arm:0:9}"; mkdir -p "$W/src-$s" "$W/bin-$s"
            git archive --format=tar "$arm" | tar -xmf - -C "$W/src-$s"
            ( cd "$W/src-$s" && cargo build --release --locked -p slates-client --example provision_bench ) > "$W/logs/build-$s.log" 2>&1 \
              || { tail -40 "$W/logs/build-$s.log"; exit 1; }
            cp "$W/target/release/examples/provision_bench$EXE" "$W/bin-$s/provision_bench$EXE"
          done
      - name: Interleaved rounds, quiet then loaded
        run: |
          set +e
          W="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/msr"; EXE=""; [ "${RUNNER_OS}" = Windows ] && EXE=".exe"
          cpus=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "$NUMBER_OF_PROCESSORS")
          load() { uptime 2>/dev/null || echo "windows"; }
          bound() { if command -v timeout >/dev/null 2>&1; then timeout 1200 "$@"; else perl -e 'alarm shift; exec @ARGV' 1200 "$@"; fi; }
          one() { mode=$1; round=$2; shards=$3; arm=$4; s="${arm:0:9}"; L="$W/logs/$mode-$s-s$shards-r$round.log"
            echo "== $mode round $round shards $shards arm $s $(date -u +%FT%TZ) load: $(load)" > "$L"
            if [ "$shards" = derived ]; then bound "$W/bin-$s/provision_bench$EXE" </dev/null >> "$L" 2>&1
            else PROVISION_BENCH_SHARDS=$shards bound "$W/bin-$s/provision_bench$EXE" </dev/null >> "$L" 2>&1; fi
            echo "exit $?" >> "$L"
            grep -E "^== |provisioning histogram|ac-2.1: 1 client|spinning_1 parks|paced_1_1000us|parked_1 parks|rest_cpu|^exit" "$L" | cut -c1-220
          }
          rounds() { mode=$1
            for round in 1 2 3; do
              for shards in 1 3 15 derived; do
                if [ $((round % 2)) = 1 ]; then one $mode $round $shards "$ARM_A"; one $mode $round $shards "$ARM_B"
                else one $mode $round $shards "$ARM_B"; one $mode $round $shards "$ARM_A"; fi
              done
            done
          }
          rounds quiet
          pids=""; for i in $(seq 1 $((2 * cpus))); do ( while :; do :; done ) & pids="$pids $!"; done
          sleep 5
          rounds loaded
          kill $pids 2>/dev/null; wait $pids 2>/dev/null
          exit 0
      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: measurer-g234-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/msr/logs
          if-no-files-found: warn
