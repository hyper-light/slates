name: diag measurer
# main 01a20182 (2026-11-22 14:15 PST): the whole svn matrix over both main routes (svn://, HTTPv2) on Linux as well as
# macOS: ubuntu-latest and ubuntu-24.04-arm with Ubuntu's stock Subversion, macos-latest with Homebrew's. goal 93's
# "interop with stock clients proven" holds on macOS (33/33 at 059578d78 + 61f26030b, CI 45012238025); Linux has run
# the hg matrix (24/24, CI 45065911852) but not svn's. The dump is the repository's fixture
# (crates/svn/fixtures/dump/full.dump, 14 revisions under trunk/). Run only from `diag-measurer-*` branches, never main;
# every log is an artifact, one name per leg.

on:
  push:
    branches: ["diag-measurer-*"]

env:
  CARGO_TERM_COLOR: never

jobs:
  svn-matrix:
    name: svn matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      # The same tools ci.yml's suite lanes install.
      - name: Stock Subversion
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install subversion; else sudo apt-get update -q && sudo apt-get install -y -q subversion; fi
          svn --version --quiet
      - name: Build
        run: cargo build --release --locked -p slates-cli --bin slates
      - name: The matrix over each main route
        run: |
          set +e; rc=0
          for route in svn http; do
            echo "== route $route $(date -u +%FT%TZ)"
            ROUTE=$route STEP_LIMIT=600 ci/interop/svn-matrix.sh "$PWD/target/release/slates" \
              crates/svn/fixtures/dump/full.dump "$RUNNER_TEMP/matrix-$route" 2>&1 | tee "$RUNNER_TEMP/matrix-$route.out"
            r=${PIPESTATUS[0]}; echo "route $route exit $r"; [ $r -eq 0 ] || rc=1
          done
          exit $rc
      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: svn-matrix-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/matrix-*.out
            ${{ runner.temp }}/matrix-*/logs
          if-no-files-found: warn
