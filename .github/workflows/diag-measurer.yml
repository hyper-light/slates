name: diag-measurer

# g222's Linux A/B: shard threads unpinned (G222_NO_PIN) against main's pinned ones. Was: a shard thread's EEVDF slice of 100 us (A-224's ask, G222_SLICE_NS), with and without idle spin, against main's. Was: a shard that never spins idle (no window, no hold: G222_NO_SPIN, G222_NO_HOLD) against main's, one binary with the timerfd fix, interleaved, the floor each round. Was: g222's Linux A/B of the timerfd wait (84a): ring-stamped arms without (bc688cefc) and with the fix, spin, interleaved, and the lane's ping-pong floor each round. Was: g222's Linux split: the diagnostic arm (2c8f89de6 + g222's ring stamps, diag-g222-hops-base) loaded under A-224's lane, landing->taken vs taken->reply per request. Was: g222's bisect of ~10 us on a quiet lone submit since A-400 (f2081a3c8..a5233e228), quiet only. Was: g222's lone-client A/B (the supervisor's condition 3, 2026-11-20): does A-400 (a work on its client's shard) undo W1's
# single-client regression at three shards? Four arms, each built from its own source extract, rotated each round,
# loaded then quiet: 8dff8fcad (before W1), 379dfe750 (W1 and A-296, just before A-400), f2081a3c8 (A-400 landed),
# a5233e228 (main now). Loaded on Linux = the supervisor's controlled load (A-224's lane). A diagnostics lane run only
# from `diag-measurer-*` branches (never main); every log is an artifact.

on:
  push:
    branches: ["diag-measurer-*"]

env:
  CARGO_TERM_COLOR: never
  NS9: "293b549cc"
  ARMS: "293b549cc03996db34ccc833da94a7bd4bf3db6c"
  ROUNDS: "3"
  G222_SPLIT: "1"

jobs:
  edit-merge-ab:
    name: edit and merge A/B (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: NASM (x86_64 Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64 Windows)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build both arms (one target dir, each arm's sources extracted just before its build, so newer)
        env:
          AWS_LC_SYS_PREBUILT_NASM: "0"
        run: |
          W="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/msr"; mkdir -p "$W/logs"
          native() { if command -v cygpath >/dev/null 2>&1; then cygpath -w "$1"; else echo "$1"; fi; }
          export CARGO_TARGET_DIR="$(native "$W/target")"
          EXE=""; [ "${RUNNER_OS}" = Windows ] && EXE=".exe"
          for arm in $ARMS; do
            s="${arm:0:9}"; mkdir -p "$W/src-$s" "$W/bin-$s"
            git archive --format=tar "$arm" | tar -xmf - -C "$W/src-$s"
            ( cd "$W/src-$s" && cargo build --release --locked -p slates-client --example edit_merge_bench ) > "$W/logs/build-$s.log" 2>&1 \
              || { echo "build $s failed; the arm is skipped"; tail -15 "$W/logs/build-$s.log"; rm -rf "$W/src-$s"; continue; }
            grep -E "Compiling slates-(server|client)|Finished" "$W/logs/build-$s.log" | tail -3
            cp "$W/target/release/examples/edit_merge_bench$EXE" "$W/bin-$s/edit_merge_bench$EXE"
            if [ "$s" = "$NS9" ]; then ( cd "$W/src-$s" && cargo build --release --locked -p slates-client --example g222_floor ) >> "$W/logs/build-$s.log" 2>&1 && cp "$W/target/release/examples/g222_floor" "$W/bin-$s/g222_floor"; fi
            sha256sum "$W/bin-$s/edit_merge_bench$EXE" 2>/dev/null || shasum -a 256 "$W/bin-$s/edit_merge_bench$EXE"
          done
      - name: The machine and the load's form
        run: |
          W="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/msr"
          uname -a; nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "NUMBER_OF_PROCESSORS=$NUMBER_OF_PROCESSORS"
          if [ "${RUNNER_OS}" = Linux ]; then
            free -m | head -2
            if systemd-run --user --scope -q -p MemoryMax=256M -p AllowedCPUs=0-1 true 2>/dev/null; then
              echo "systemd" > "$W/constraint"
            else
              echo "taskset" > "$W/constraint"
            fi
            # Does the newer daemon run inside 256 MB? One short loaded accept under the cap decides; else CPUs only.
            if [ "$(cat "$W/constraint")" = systemd ] && timeout 300 systemd-run --user --scope -q -p MemoryMax=256M -p AllowedCPUs=0-1 \
                 "$W/bin-293b549cc/edit_merge_bench" --loaded-only --spinners-per-core 2 --files 10 --form accept </dev/null > "$W/logs/probe.log" 2>&1; then
              echo "cap: AllowedCPUs=0-1 MemoryMax=256M" | tee "$W/capnote"
            else
              echo "cap: AllowedCPUs=0-1 only (the 256 MB probe failed: $(tail -2 "$W/logs/probe.log" | tr '\n' ' '))" | tee "$W/capnote"
              echo "nomem" > "$W/nomem"
            fi
          else
            echo "cap: none (the harness's own spinners, two a core)" | tee "$W/capnote"
          fi
      - name: Interleaved rounds, quiet
        run: |
          W="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/msr"; EXE=""; [ "${RUNNER_OS}" = Windows ] && EXE=".exe"
          load() { uptime 2>/dev/null || powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Measure-Object -Property LoadPercentage -Average).Average" 2>/dev/null; }
          ARGS="--files 10 --files 1000 --form accept --form conflict"
          cat > "$W/loaded.sh" <<'EOS'
          #!/bin/bash
          ( while true; do dd if=/dev/zero of="$2/fsync.bin" bs=1M count=16 conv=fsync status=none; done ) &
          writer=$!
          "$1" --loaded-only --spinners-per-core 2 --files 10 --form accept --form conflict
          status=$?
          kill $writer; wait $writer 2>/dev/null; rm -f "$2/fsync.bin"
          exit $status
          EOS
          chmod +x "$W/loaded.sh"
          set +e
          order() { case $1 in 1) echo $ARMS;; 2) echo $ARMS | awk '{for(i=NF;i>0;i--) printf "%s ", $i}';; *) echo $ARMS | awk '{h=int(NF/2); for(i=h+1;i<=NF;i++) printf "%s ", $i; for(i=1;i<=h;i++) printf "%s ", $i}';; esac; }
          for round in $(seq 1 "$ROUNDS"); do
            case $round in 1) modes="main nopin";; 2) modes="nopin main";; *) modes="main nopin";; esac
            for mode in $modes; do
              unset G222_NO_SPIN G222_NO_HOLD G222_SLICE_NS G222_NO_PIN
              case $mode in nopin) export G222_NO_PIN=1;; esac
              nproc; grep -h Cpus_allowed_list /proc/self/status
              arm=$ARMS; s="${arm:0:9}"; B="$W/bin-$s/edit_merge_bench$EXE"; [ -x "$B" ] || continue; L="$W/logs/loaded-$s-$mode-r$round.log"
              echo "== loaded round $round arm $s $mode $(date -u +%FT%TZ) load: $(load) $(cat "$W/capnote")" | tee "$L"
              MEM="-p MemoryMax=256M"; [ -f "$W/nomem" ] && MEM=""
              G222_DIAG="$W/logs/loaded-$s-$mode-r$round.tsv" timeout 1200 systemd-run --user --scope -q $MEM -p AllowedCPUs=0-1 "$W/loaded.sh" "$B" "$W" </dev/null >> "$L" 2>&1
              echo "exit $?" >> "$L"; grep -E "ratchet-info.*f10_loaded_total_p(50|99|999)\b|exit" "$L" | cut -c1-200
              python3 - "$W/logs/loaded-$s-$mode-r$round.tsv.ring" <<'PY' || true
          import sys
          q=[];s=[]
          for l in open(sys.argv[1]).read().splitlines()[1:]:
              a,b=l.split('\t'); q.append(int(a)); s.append(int(b))
          q.sort(); s.sort()
          pc=lambda a,p: a[min(len(a)-1,int(len(a)*p))]/1000
          print('split n',len(q),'queued p50/p99/p999/max us',pc(q,.5),pc(q,.99),pc(q,.999),q[-1]/1000,'served p50/p99/p999 us',pc(s,.5),pc(s,.99),pc(s,.999))
          PY
            done
            F="$W/bin-${NS9}/g222_floor"
            echo "== floor round $round $(date -u +%FT%TZ) load: $(load)"
            timeout 600 systemd-run --user --scope -q -p MemoryMax=256M -p AllowedCPUs=0-1 bash -c "( while true; do dd if=/dev/zero of=$W/fsync2.bin bs=1M count=16 conv=fsync status=none; done ) & w=\$!; $F 50000 2; kill \$w" </dev/null 2>&1 | grep floor
          done
          for round in $(seq 1 "$ROUNDS"); do
            for arm in $(order $round); do
              s="${arm:0:9}"; B="$W/bin-$s/edit_merge_bench$EXE"; L="$W/logs/quiet-$s-r$round.log"
              [ -x "$B" ] || continue
              echo "== quiet round $round arm $s $(date -u +%FT%TZ) load: $(load)" | tee "$L"
              perl -e 'alarm shift; exec @ARGV' 1200 "$B" --quiet-only $ARGS </dev/null >> "$L" 2>&1
              echo "exit $?" >> "$L"; grep -E "goal|WRONG|ratchet-info|exit" "$L" | cut -c1-220
            done
          done
      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: measurer-arms-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/msr/logs
          if-no-files-found: warn
