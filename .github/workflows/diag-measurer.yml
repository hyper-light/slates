name: diag-measurer

# w-perf 84a Linux arm F (main 01a20182, 2026-11-22 15:4x PST, Ada: "fix it", so Linux keeps the 1 ms bar): a client's
# synchronous request waits on its shard's CPU, so each hop is a hand-off at a block rather than a wakeup waiting for the
# tick. Plain E = 0b568ac91 against F = b44f0904f, interleaved (5 loaded, 3 quiet, R9); then the stamped builds E_diag
# = 58f792741 against F_diag = 9ad9d4cc9, interleaved loaded rounds with kick -> run. Red: F's tests against E's tree.
# Diagnostics only: never main.

on:
  push:
    branches: ["diag-measurer-w-perf-84a-f-ab"]

env:
  CARGO_TERM_COLOR: never
  PLAIN: "0b568ac91e5d4a5431a9fc48fdea0c5b62ddbc0d b44f0904fdf52af67df818a8579045bee18bfa51"
  STAMPED: "58f792741eb79be5ae6b4600501334c599aef8eb 9ad9d4cc97b30ed6d9dc851c4152c47e7f91c09c"

jobs:
  slice-ab:
    name: pin A/B (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: The machine
        run: |
          echo "runner cpus $(nproc) kernel $(uname -r) limits: rtprio $(ulimit -r) rttime $(ulimit -R)"
          echo "sched features: $(sudo cat /sys/kernel/debug/sched/features 2>/dev/null || echo unreadable)"
          echo "base slice ns: $(sudo cat /sys/kernel/debug/sched/base_slice_ns 2>/dev/null || echo unreadable)"
          true
      - name: Build the arms; F's tests on F, and against E's tree for the red half
        run: |
          W="$RUNNER_TEMP/msr"; mkdir -p "$W/logs"
          A="${PLAIN%% *}"; F="${PLAIN##* }"
          for arm in $PLAIN $STAMPED; do
            s="${arm:0:9}"; mkdir -p "$W/src-$s" "$W/bin-$s"
            git archive --format=tar "$arm" | tar -xmf - -C "$W/src-$s"
            ( cd "$W/src-$s" && CARGO_TARGET_DIR="$W/target-$s" cargo build --release --locked -p slates-client --example edit_merge_bench --example provision_bench ) > "$W/logs/build-$s.log" 2>&1 \
              || { tail -40 "$W/logs/build-$s.log"; exit 1; }
            cp "$W/target-$s/release/examples/edit_merge_bench" "$W/target-$s/release/examples/provision_bench" "$W/bin-$s/"
          done
          git show $F:crates/machine/tests/request_pin.rs > "$W/src-${A:0:9}/crates/machine/tests/request_pin.rs"
          for arm in $PLAIN; do
            s="${arm:0:9}"
            for crate in slates-machine; do
              if ( cd "$W/src-$s" && CARGO_TARGET_DIR="$W/target-$s" cargo test --release --locked -p $crate --test request_pin -- --nocapture ) > "$W/logs/test-$s-$crate.log" 2>&1; then rc=0; else rc=$?; fi
              echo "arm $s $crate request_pin test exit $rc"
              grep -E "^error\[|test result|panicked|skipping" "$W/logs/test-$s-$crate.log" | head -4
              if [ $rc != 0 ] && [ "$s" != "${A:0:9}" ]; then tail -30 "$W/logs/test-$s-$crate.log"; exit 1; fi
            done
          done
      - name: Plain interleaved rounds, loaded then quiet
        run: |
          W="$RUNNER_TEMP/msr"
          order() { if [ $(( $1 % 2 )) = 1 ]; then echo $PLAIN; else echo $PLAIN | awk '{print $2, $1}'; fi; }
          set +e
          for round in $(seq 1 5); do
            for arm in $(order $round); do
              s="${arm:0:9}"; L="$W/logs/loaded-$s-r$round.log"
              echo "== loaded round $round arm $s $(date -u +%FT%TZ) load: $(uptime)" | tee "$L"
              perl -e 'alarm shift; exec @ARGV' 1200 "$W/bin-$s/edit_merge_bench" --loaded-only --spinners-per-core 2 --files 10 --form accept --form conflict </dev/null >> "$L" 2>&1
              echo "exit $?" >> "$L"; grep -E "slice|sliced parks|pinned requests|waits off|load throughput|_loaded_total_p(99|999)\b|exit" "$L" | sort -u | cut -c1-200
            done
          done
          for round in $(seq 1 3); do
            for arm in $(order $round); do
              s="${arm:0:9}"; L="$W/logs/quiet-$s-r$round.log"
              echo "== quiet round $round arm $s" | tee "$L"
              /usr/bin/time -f "quiet cpu: user %U s, sys %S s, wall %e s" perl -e 'alarm shift; exec @ARGV' 1200 "$W/bin-$s/edit_merge_bench" --quiet-only --files 10 --form accept --form conflict </dev/null >> "$L" 2>&1
              echo "exit $?" >> "$L"; grep -E "quiet cpu|_quiet_total_p(50|99|999)\b|exit" "$L" | cut -c1-200
              PL="$W/logs/provision-$s-r$round.log"
              perl -e 'alarm shift; exec @ARGV' 1200 "$W/bin-$s/provision_bench" </dev/null > "$PL" 2>&1; echo "exit $?" >> "$PL"
              grep -E "spinning_1_p(50|99|999):" "$PL" | cut -c1-200
            done
          done
          true
      - name: Stamped interleaved loaded rounds (kick -> run)
        run: |
          W="$RUNNER_TEMP/msr"
          order() { if [ $(( $1 % 2 )) = 1 ]; then echo $STAMPED; else echo $STAMPED | awk '{print $2, $1}'; fi; }
          set +e
          for round in $(seq 1 3); do
            for arm in $(order $round); do
              s="${arm:0:9}"; L="$W/logs/stamped-$s-r$round.log"
              echo "== stamped round $round arm $s" | tee "$L"
              G222_DIAG="$W/logs/stamped-$s-r$round.tsv" perl -e 'alarm shift; exec @ARGV' 1200 "$W/bin-$s/edit_merge_bench" --loaded-only --spinners-per-core 2 --files 10 --form accept --form conflict </dev/null >> "$L" 2>&1
              echo "exit $?" >> "$L"; grep -E "_loaded_total_p(99|999)\b|exit" "$L" | cut -c1-200
              python3 .github/g222/parks.py "$W/logs/stamped-$s-r$round.tsv"
              python3 .github/g222/macsplit.py "$W/logs/stamped-$s-r$round.tsv" | grep -E "p999 tail" | cut -c1-220
            done
          done
          true
      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pin-ab-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/msr/logs
          if-no-files-found: warn
