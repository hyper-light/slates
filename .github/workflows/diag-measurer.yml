name: diag-measurer

# w-perf 84a Linux (never main): the stamped A/B of the shards' round-robin class, kick -> run per arm, interleaved,
# under an administrator's RLIMIT_RTPRIO 1 (sudo prlimit, both arms alike; stock the account has 0:0).
# A = 17d3b301e (the stamped diag build on main); B = 0f5806117 (A with 21179849c, the round-robin class, merged).

on:
  push:
    branches: ["diag-measurer-w-perf-84a-rr-stamped"]

env:
  CARGO_TERM_COLOR: never
  ARMS: "17d3b301e474642b9e63c1389012f09929d455fc 0f58061178b94661682040c8cf3d34cede03f7cb"
  ROUNDS: "3"

jobs:
  stamped-rr-ab:
    name: stamped round-robin A/B (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build the arms
        run: |
          W="$RUNNER_TEMP/msr"; mkdir -p "$W/logs"
          echo "runner cpus $(nproc) kernel $(uname -r)"
          for arm in $ARMS; do
            s="${arm:0:9}"; mkdir -p "$W/src-$s" "$W/bin-$s"
            git archive --format=tar "$arm" | tar -xmf - -C "$W/src-$s"
            ( cd "$W/src-$s" && CARGO_TARGET_DIR="$W/target-$s" cargo build --release --locked -p slates-client --example edit_merge_bench ) > "$W/logs/build-$s.log" 2>&1 \
              || { tail -40 "$W/logs/build-$s.log"; exit 1; }
            cp "$W/target-$s/release/examples/edit_merge_bench" "$W/bin-$s/edit_merge_bench"
          done
      - name: Interleaved loaded rounds, stamped
        run: |
          sudo prlimit --pid $$ --rtprio=1:1; echo "granted: rtprio soft $(ulimit -r) hard $(ulimit -Hr), rttime $(ulimit -R)"
          W="$RUNNER_TEMP/msr"
          order() { if [ $(( $1 % 2 )) = 1 ]; then echo $ARMS; else echo $ARMS | awk '{print $2, $1}'; fi; }
          set +e
          for round in $(seq 1 "$ROUNDS"); do
            for arm in $(order $round); do
              s="${arm:0:9}"; L="$W/logs/loaded-$s-r$round.log"
              echo "== loaded round $round arm $s $(date -u +%FT%TZ) load: $(uptime)" | tee "$L"
              G222_DIAG="$W/logs/loaded-$s-r$round.tsv" perl -e 'alarm shift; exec @ARGV' 1200 "$W/bin-$s/edit_merge_bench" --loaded-only --spinners-per-core 2 --files 10 --form accept --form conflict </dev/null >> "$L" 2>&1
              echo "exit $?" >> "$L"; grep -E "round-robin|load throughput|_loaded_total_p(99|999)\b|exit" "$L" | cut -c1-200
              python3 .github/g222/parks.py "$W/logs/loaded-$s-r$round.tsv"
              python3 .github/g222/macsplit.py "$W/logs/loaded-$s-r$round.tsv" | grep -E "p99 tail|p999 tail|dominant" | cut -c1-220
            done
          done
          true
      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: stamped-rr-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/msr/logs
          if-no-files-found: warn
