name: diag-mem-windows
on:
  push:
    branches: ['diag-mem-windows-*']
env:
  # Each step's measured lines become annotations, which the public run page shows without signing in.
  SHOW: "handles before|working set|us/MiB|panicked|^test result"
jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM
        uses: ilammy/setup-nasm@v1.5.2
      - name: The held section's refused adoption
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0; cargo test -p slates-mem --test held_section -- --nocapture > out.txt 2>&1 || status=$?
          cat out.txt; grep -E "$SHOW" out.txt | sed 's/^/::notice::x64 held: /' || true; exit $status
      - name: The crate's give-back
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0; cargo test -p slates-mem --test give_back -- --nocapture > out.txt 2>&1 || status=$?
          cat out.txt; grep -E "$SHOW" out.txt | sed 's/^/::notice::x64 mem: /' || true; exit $status
      - name: A daemon's give-back
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        shell: bash
        run: |
          status=0; cargo test -p slates-server --test give_back -- --nocapture > out.txt 2>&1 || status=$?
          cat out.txt; grep -E "^round|panicked|^test result" out.txt | sed 's/^/::notice::x64 daemon: /' || true; exit $status
      - name: The cost of a write after reuse
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0; cargo run --release -p slates-mem --example give_back_bench > out.txt 2>&1 || status=$?
          cat out.txt; grep -E "$SHOW" out.txt | sed 's/^/::notice::x64 bench: /' || true; exit $status
  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: clang-cl
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: The held section's refused adoption
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0; cargo test -p slates-mem --test held_section -- --nocapture > out.txt 2>&1 || status=$?
          cat out.txt; grep -E "$SHOW" out.txt | sed 's/^/::notice::arm64 held: /' || true; exit $status
      - name: The crate's give-back
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0; cargo test -p slates-mem --test give_back -- --nocapture > out.txt 2>&1 || status=$?
          cat out.txt; grep -E "$SHOW" out.txt | sed 's/^/::notice::arm64 mem: /' || true; exit $status
      - name: A daemon's give-back
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        shell: bash
        run: |
          status=0; cargo test -p slates-server --test give_back -- --nocapture > out.txt 2>&1 || status=$?
          cat out.txt; grep -E "^round|panicked|^test result" out.txt | sed 's/^/::notice::arm64 daemon: /' || true; exit $status
      - name: The cost of a write after reuse
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0; cargo run --release -p slates-mem --example give_back_bench > out.txt 2>&1 || status=$?
          cat out.txt; grep -E "$SHOW" out.txt | sed 's/^/::notice::arm64 bench: /' || true; exit $status
