name: diag shards-whp

# VFS plan step 14: Shards' WHP DAX window's three edge cases on windows-2025 through real guests, from the patch series
# in docs/wip/shards-patches on Shards' gpu. The first patch alone is the red; the second the green. Every number goes
# to the step summary, which the public run page shows. Diagnostics only.
on:
  push:
    branches: ['diag-shards-whp-*']

env:
  CARGO_TERM_COLOR: always

jobs:
  shards-window:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
      SHARDS_SHORT: e39a9218
    steps:
      - name: Line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hyper-light/shards
          ref: gpu
          fetch-depth: 0
          path: shards-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Host
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor
          "HOST $($cpu.Name), $($cpu.NumberOfLogicalProcessors) logical, $([System.Environment]::OSVersion.VersionString), $env:ImageOS $env:ImageVersion" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
      - name: The first patch alone is red
        shell: bash
        working-directory: shards-src
        run: |
          git config user.name diag; git config user.email diag@invalid
          git switch --detach "$(git rev-parse "$SHARDS_SHORT")"
          git am ../docs/wip/shards-patches/0001-*.patch
          reds=0
          for run in 1 2 3 4 5; do
            if cargo +1.98.1 test -p shards-vmm --lib --profile test-release -- --nocapture --test-threads=1 window::guest::several_vcpus_at_a_view window::guest::a_range_followed > red.log 2>&1; then
              echo "RED-CHECK run $run: passed" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "RED-CHECK run $run: failed" | tee -a "$GITHUB_STEP_SUMMARY"; reds=$((reds+1))
            fi
            grep -E "PM M421|left:|test result" red.log | cut -c1-260 | sed -e 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "RED-CHECK: $reds of 5 failed" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The second patch is green, every window test, five times
        shell: bash
        working-directory: shards-src
        run: |
          git am ../docs/wip/shards-patches/0002-*.patch
          for run in 1 2 3 4 5; do
            cargo +1.98.1 test -p shards-vmm --lib --profile test-release -- --nocapture --test-threads=1 window:: > green.log 2>&1 || { tail -40 green.log | cut -c1-260 | sed -e 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
            echo "GREEN run $run" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -E "PM M421|a 64 GiB|test result" green.log | cut -c1-400 | sed -e 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"
            if grep -q "SKIP: no WHP" green.log; then echo "a test skipped: no WHP" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi
          done
      - name: Install NASM
        uses: ilammy/setup-nasm@v1.5.2
      - name: Slates hands slices from each granule and refuses between them
        shell: bash
        run: |
          cargo +1.98.1 test -p slates-client --test shards -- --test-threads=1 > client.log 2>&1 || { tail -40 client.log | cut -c1-260 | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          grep -E "a_slice_is_handed|test result" client.log | cut -c1-200 | sed -e 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"

  slates-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Gates
        shell: bash
        run: |
          say() { echo "$1=$2" | tee -a "$GITHUB_STEP_SUMMARY"; }
          cargo +1.98.1 fmt --check; say fmt $?
          cargo +1.98.1 clippy --workspace --all-targets -- -D warnings; say clippy $?
          cargo +1.98.1 xtask check; say xtask $?
          RUSTDOCFLAGS="-D warnings -A rustdoc::private_intra_doc_links" cargo +1.98.1 doc --workspace --no-deps --document-private-items; say doc $?
          ! grep -E "=[1-9]" "$GITHUB_STEP_SUMMARY"
      - name: An ask no view can begin at is refused on every platform's route
        shell: bash
        run: |
          cargo +1.98.1 test -p slates-server --test shards > server.log 2>&1 || { tail -40 server.log | cut -c1-260 | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          grep -E "malformed|test result" server.log | cut -c1-200 | sed -e 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"
