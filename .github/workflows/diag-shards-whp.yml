name: diag shards-whp

# VFS plan step 14: Shards' WHP DAX window's three edge cases on windows-2025 through real guests, from the patch series
# in docs/wip/shards-patches on Shards' gpu. The first patch alone is the red; the second the green. Every number goes
# to an annotation, which the public run page shows where it shows no log or summary. Diagnostics only.
on:
  push:
    branches: ['diag-shards-whp-*']

env:
  CARGO_TERM_COLOR: always

jobs:
  shards-window:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
      SHARDS_SHORT: e39a9218
    steps:
      - name: Line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hyper-light/shards
          ref: gpu
          fetch-depth: 0
          path: shards-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Host
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor
          "::notice::HOST $($cpu.Name), $($cpu.NumberOfLogicalProcessors) logical, $([System.Environment]::OSVersion.VersionString), $env:ImageOS $env:ImageVersion"
      - name: The first patch alone is red
        shell: bash
        working-directory: shards-src
        run: |
          git config user.name diag; git config user.email diag@invalid
          git switch --detach "$(git rev-parse "$SHARDS_SHORT")"
          git am ../docs/wip/shards-patches/0001-*.patch
          reds=0
          for run in 1 2 3 4 5; do
            if cargo +1.98.1 test -p shards-vmm --lib --profile test-release -- --nocapture --test-threads=1 window::guest::several_vcpus_at_a_view window::guest::a_range_followed > red.log 2>&1; then
              verdict=passed
            else
              verdict=failed; reds=$((reds+1))
            fi
            echo "::notice::RED run $run $verdict: $(grep -E "PM M421|left:|test result" red.log | sed -e "s/.*PM M421/PM M421/" | cut -c1-160 | paste -s -d"|")"
          done
          echo "::notice::RED: $reds of 5 failed"
          test "$reds" -gt 0
      - name: The second patch is green, every window test, five times
        shell: bash
        working-directory: shards-src
        run: |
          git am ../docs/wip/shards-patches/0002-*.patch
          for run in 1 2 3 4 5; do
            cargo +1.98.1 test -p shards-vmm --lib --profile test-release -- --nocapture --test-threads=1 window:: > green.log 2>&1 || { echo "::error::GREEN run $run: $(grep -E "panicked|left:|right:|test result" green.log | cut -c1-200 | paste -s -d"|")"; exit 1; }
            echo "::notice::GREEN run $run: $(grep -E "PM M421|a 64 GiB|test result" green.log | sed -e "s/.*PM M421/PM M421/; s/loads_after_a_replace_that_saw_the_old_section/stale_loads/; s/stores_after_a_replace_that_reached_the_old_section/stale_stores/; s/.*a 64 GiB/a 64 GiB/" | cut -c1-210 | paste -s -d"|")"
            if grep -q "SKIP: no WHP" green.log; then echo "::error::a test skipped: no WHP"; exit 1; fi
          done
      - name: Install NASM
        uses: ilammy/setup-nasm@v1.5.2
      - name: Slates hands slices from each granule and refuses between them
        shell: bash
        run: |
          cargo +1.98.1 test -p slates-client --test shards -- --test-threads=1 > client.log 2>&1 || { echo "::error::client: $(grep -E "panicked|left:|right:|test result" client.log | cut -c1-200 | paste -s -d"|")"; exit 1; }
          echo "::notice::client: $(grep -E "a_slice_is_handed|test result" client.log | cut -c1-160 | paste -s -d"|")"

  slates-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Gates
        shell: bash
        run: |
          cargo +1.98.1 fmt --check
          cargo +1.98.1 clippy --workspace --all-targets -- -D warnings
          cargo +1.98.1 xtask check
          RUSTDOCFLAGS="-D warnings -A rustdoc::private_intra_doc_links" cargo +1.98.1 doc --workspace --no-deps --document-private-items
          echo "::notice::gates: fmt, clippy, xtask and doc passed on ${{ matrix.os }}"
      - name: An ask no view can begin at is refused on every platform's route
        shell: bash
        run: |
          cargo +1.98.1 test -p slates-server --test shards > server.log 2>&1 || { echo "::error::server: $(grep -E "panicked|left:|right:|test result" server.log | cut -c1-200 | paste -s -d"|")"; exit 1; }
          echo "::notice::server ${{ matrix.os }}: $(grep -E "test result" server.log | cut -c1-120)"
