name: DIAG g243, an observation of a starved shard on Windows (not for main)

# A diagnostics branch, never merged (goal g243). an_observation_of_a_starved_shard_is_answered failed on windows-latest
# once (diag run 42671057142, liveness.rs:833, the answer assert) with its answer filtered out of the log. This runs it
# with ShardTime's every window decision and the shard thread's raw ThreadState and WaitReason logged (lines tagged
# G243): the test alone, then the whole liveness suite in parallel as that run did, each several times, every log kept.

on:
  push:
    branches: ['diag-g243-*']

jobs:
  observe-starved:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install NASM (x86_64)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl for aws-lc-sys (arm64)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the liveness suite
        run: cargo test --locked -p slates-server --test liveness --no-run 2>&1 | tail -5
      - id: runs
        name: The test alone 8 times, then the whole suite in parallel 6 times
        run: |
          set +e
          mkdir -p out
          echo "runner ${{ matrix.os }}, $NUMBER_OF_PROCESSORS CPUs, $(date -u), commit $(git rev-parse --short HEAD)" > out/runner.txt
          failed=0
          for run in 1 2 3 4 5 6 7 8; do
            timeout 300 cargo test --locked -q -p slates-server --test liveness -- --exact \
              an_observation_of_a_starved_shard_is_answered --nocapture > "out/alone-$run.log" 2>&1
            code=$?
            echo "alone $run exit $code" | tee -a out/exits.txt
            [ $code = 0 ] || failed=1
          done
          for run in 1 2 3 4 5 6; do
            timeout 600 cargo test --locked -q -p slates-server --test liveness -- --nocapture > "out/suite-$run.log" 2>&1
            code=$?
            echo "suite $run exit $code" | tee -a out/exits.txt
            [ $code = 0 ] || failed=1
          done
          exit $failed
      - name: Summary
        if: always()
        run: |
          set +e
          cat out/runner.txt out/exits.txt
          for log in out/alone-*.log out/suite-*.log; do
            echo "== $log"
            grep -aE 'G243 test|observation of a starved|test result|FAILED|panicked|given up on|did not starve|is stuck|ends the daemon|exited' "$log" | cut -c1-600 | head -60
          done
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g243-${{ matrix.os }}
          path: out/
          retention-days: 14
