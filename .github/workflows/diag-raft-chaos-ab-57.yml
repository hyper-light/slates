name: DIAG raft-chaos interleaved A/B of the handshake fix under a confined, loaded CPU set (not for main)

# Diagnostics branch of the raft-chaos agent; never merged. Two arms built on each runner: before = 1d1bac87 (the dial
# stall counters, no fix) and after = 41cebfe7 (the fix), both with the same diagnostic harness. They alternate run by run,
# the first arm swapped between runners. Condition: the test and its five daemons pinned to CPUs 0-1 (taskset), and on the
# same two CPUs four busy loops, two one-byte dd copies (system time) and one direct-I/O disk writer, each in its own
# process group, started before a run and stopped by that group after it.

on:
  push:
    branches: [diag-raft-chaos-ab-57]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SLATES_TEST_CLI: "1"

jobs:
  ab:
    name: A/B ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: The before arm's tree
        run: |
          git fetch -q origin diag-raft-chaos-ab-57-before
          git worktree add -q ../before FETCH_HEAD
          git -C ../before log -1 --oneline
          git log -1 --oneline
      - name: Build both arms
        run: |
          CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../t-after cargo test --release --locked -p slates-cli --test live_chaos --no-run
          (cd ../before && CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../t-before cargo test --release --locked -p slates-cli --test live_chaos --no-run)
      - name: Interleaved runs
        run: |
          R=../results.txt
          echo "runner ubuntu-latest, $(nproc) CPUs, $(date -u), after $(git rev-parse --short=8 HEAD), before $(git -C ../before rev-parse --short=8 HEAD), sample ${{ matrix.sample }}" > $R
          bin_of() { ls -t ../t-$1/release/deps/live_chaos-* | grep -v '\.d$' | head -1; }
          BEFORE=$(bin_of before); AFTER=$(bin_of after)
          echo "before $BEFORE" >> $R; echo "after $AFTER" >> $R
          if [ $(( ${{ matrix.sample }} % 2 )) -eq 0 ]; then ORDER="after before"; else ORDER="before after"; fi
          for pair in 1 2 3 4 5 6; do
            for arm in $ORDER; do
              BIN=$([ "$arm" = before ] && echo "$BEFORE" || echo "$AFTER")
              # The load, each generator its own process group on CPUs 0-1.
              GROUPS=""
              for i in 1 2 3 4; do setsid taskset -c 0,1 bash -c 'while :; do :; done' & GROUPS="$GROUPS $!"; done
              for i in 1 2; do setsid taskset -c 0,1 bash -c 'while :; do dd if=/dev/zero of=/dev/null bs=1 count=2000000 status=none; done' & GROUPS="$GROUPS $!"; done
              setsid taskset -c 0,1 bash -c "while :; do dd if=/dev/zero of=$RUNNER_TEMP/load.bin bs=1M count=128 oflag=direct status=none; done" & GROUPS="$GROUPS $!"
              sleep 2
              echo "== pair $pair arm $arm at $(date -u +%H:%M:%S), load $(cut -d' ' -f1-3 /proc/loadavg)" >> $R
              status=0
              timeout 900 taskset -c 0,1 "$BIN" --nocapture --test-threads=1 --exact a_member_that_never_held_the_log_never_stands_in_for_its_holder > ../run.log 2>&1 || status=$?
              for g in $GROUPS; do kill -KILL -- -$g 2>/dev/null; done
              wait 2>/dev/null
              grep -E '^DIAG (formation|settlement) took|^DIAG slow formation|test result|panicked|no survivor adopted the registers; the|every node held the newest|stayed stopped' ../run.log | cut -c1-300 >> $R
              grep -E '^DIAG dials formation' ../run.log | head -60 | cut -c1-400 >> $R
              grep -oE '(fleet\.(dial|accept)\.(stall\.[a-z_]+|redial|fault[a-z_.]*)): [0-9]+' ../run.log | sort | uniq -c | sort -rn | head -12 >> $R
              echo "== pair $pair arm $arm exit $status, load $(cut -d' ' -f1-3 /proc/loadavg)" >> $R
            done
          done
          rm -f $RUNNER_TEMP/load.bin
      - name: Publish the results to a branch
        if: always()
        run: |
          git config user.name "diag-raft-chaos"
          git config user.email "diag-raft-chaos@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-raft-chaos-ab-57 results ${{ matrix.sample }}"
          git push -q origin "HEAD:refs/heads/diag-results/diag-raft-chaos-ab-57-${{ matrix.sample }}"
