name: DIAG nfs-write, the large-file NFS write profiled (not for main)

# Diagnostics, never merged (VFS plan step 11). The incumbent harness's large-file step through Linux's own NFSv4.2
# client, against slates and the kernel's nfsd, interleaved; then slates' daemon under perf during a 1 GiB write.

on:
  push:
    branches: ['diag-nfs-write-*']

jobs:
  profile:
    name: large NFS write, slates against nfsd, profiled (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: The machine
        run: uname -a && nproc && lscpu | grep -E 'Model name|^CPU\(s\)' && free -g && cat /proc/loadavg
      - name: Build (release, frame pointers and line tables for perf)
        env:
          RUSTFLAGS: -C force-frame-pointers=yes
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo build --release -p slates-cli --bin slates
      - name: Install nfsd, the NFS client and perf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nfs-kernel-server nfs-common "linux-tools-$(uname -r)" linux-tools-common
      - name: Interleaved writes and the profile
        run: bash diag/nfs-write/prof.sh "$GITHUB_WORKSPACE/target/release/slates" 1024 7
      - name: Anything left mounted
        if: always()
        run: grep -E ' /mnt/(slates|knfs) ' /proc/mounts || echo "nothing mounted"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfs-write-profile
          path: ${{ runner.temp }}/nfswrite
