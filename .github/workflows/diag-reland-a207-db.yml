name: DIAG reland-a207 slates-db on its release of the log (not for main)

# crates/db's whole suite on this diag commit's parent, on Linux x86-64, Linux arm64 and Windows; its lines go to
# diag-reland-a207-db-results-<run>-<runner> as one commit.

on:
  push:
    branches: ['diag-reland-a207-db-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  db:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest]
    name: slates-db on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RESULTS_BRANCH: diag-reland-a207-db-results-${{ github.run_id }}-${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: runs
        shell: bash
        run: |
          set -u +e +o pipefail
          out="$RUNNER_TEMP/results.txt"; : > "$out"
          echo "tested $(git rev-parse HEAD^) on ${{ matrix.runner }}" >> "$out"
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          cargo clippy -p slates-db --all-targets -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1; echo "clippy exit $?" >> "$out"
          grep -E '^error' -A6 "$RUNNER_TEMP/clippy.log" | head -30 >> "$out"
          cargo test -p slates-db --no-fail-fast > "$RUNNER_TEMP/test.log" 2>&1; echo "test exit $?" >> "$out"
          grep -E '^test result|FAILED' "$RUNNER_TEMP/test.log" | cut -c1-240 | head -30 >> "$out"
          grep -m6 -A3 'panicked at' "$RUNNER_TEMP/test.log" | cut -c1-400 >> "$out"
          grep -E '^test .*(release|snapshot_releases|records_after)' "$RUNNER_TEMP/test.log" | cut -c1-140 >> "$out"
          echo DONE >> "$out"
          blob=$(git hash-object -w "$out")
          tree=$(printf '100644 blob %s\tresults.txt\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "results of run $GITHUB_RUN_ID on ${{ matrix.runner }}")
          git push -q origin "$commit:refs/heads/$RESULTS_BRANCH"
          cat "$out"
