name: DIAG the Windows landing writer on every runner (not for main)

# Windows legs run from pwsh, as CI's real steps do. Git Bash sets its token's default owner to the user, which hid a
# refusal every elevated process meets (2026-11-06), so a Windows leg must never run under it.

on:
  push:
    branches: ['diag-winfsp-bench-land-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  land:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, kind: x64 }
          - { runner: windows-11-arm, kind: arm64 }
          - { runner: ubuntu-latest, kind: unix }
          - { runner: macos-latest, kind: unix }
    name: land on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (x86_64)
        if: matrix.kind == 'x64'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64)
        if: matrix.kind == 'arm64'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run the legs from pwsh (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force diag-logs | Out-Null
          $owner = [Security.Principal.WindowsIdentity]::GetCurrent().Owner.Translate([Security.Principal.NTAccount]).Value
          "$(git rev-parse HEAD) $env:RUNNER_OS $env:RUNNER_ARCH; token default owner $owner" | Out-File results.txt -Encoding ascii
          function Leg($name, $arguments) {
            $log = "diag-logs\$name.log"
            cmd /c "cargo $arguments > $log 2>&1"
            "=== ${name}: exit $LASTEXITCODE" | Out-File results.txt -Append -Encoding ascii
            Select-String -Path $log -Pattern '^(test result|error)' | ForEach-Object { $_.Line } | Group-Object | ForEach-Object { "$($_.Count) $($_.Name)" } | Out-File results.txt -Append -Encoding ascii
            Select-String -Path $log -Pattern ' panicked at |^---- |SKIP' -Context 0,2 | Select-Object -First 30 | ForEach-Object { $_.ToString() } | Out-File results.txt -Append -Encoding ascii
          }
          Leg clippy 'clippy -p slates-land -p slates-base -p slates-server -p slates-client --all-targets --locked -- -D warnings'
          Leg land 'test -p slates-land --release --locked --no-fail-fast'
          Leg base 'test -p slates-base --locked'
          foreach ($run in 1..3) {
            Leg "os-again-$run" 'test -p slates-land --release --locked --no-fail-fast --test os --test os_escape --test os_removal --test os_seam_windows'
          }
          Leg server-lib 'test -p slates-server --lib --locked -- --test-threads=1'
          Leg server-verb 'test -p slates-server --locked --no-fail-fast --test lease --test snapshot_landing --test landing_fairness -- --test-threads=1'
          Leg client-presentation 'test -p slates-client --locked --test presentation -- --test-threads=1'
          Leg client-shards 'test -p slates-client --locked --test shards -- --test-threads=1'
          "=== end" | Out-File results.txt -Append -Encoding ascii
      - name: Run the legs (Unix)
        if: runner.os != 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p diag-logs
          echo "$(git rev-parse HEAD) $RUNNER_OS $RUNNER_ARCH" > results.txt
          leg() {
            name=$1; shift
            log="diag-logs/$name.log"
            "$@" > "$log" 2>&1
            code=$?
            {
              echo "=== $name: exit $code"
              grep -aE '^(test result|error)' "$log" | cut -c1-200 | sort | uniq -c | head -30
              grep -aE -A2 ' panicked at |^---- ' "$log" | cut -c1-400 | head -60
            } >> results.txt
          }
          leg clippy cargo clippy -p slates-land -p slates-base -p slates-server --all-targets --locked -- -D warnings
          leg land cargo test -p slates-land --release --locked --no-fail-fast
          leg server-lib cargo test -p slates-server --lib --locked -- --test-threads=1
          leg server-verb cargo test -p slates-server --locked --no-fail-fast --test lease --test snapshot_landing --test landing_fairness -- --test-threads=1
          leg client-presentation cargo test -p slates-client --locked --test presentation -- --test-threads=1
          if [ "$RUNNER_OS" = Linux ]; then
            leg fmt cargo fmt --all --check
            cargo xtask check > diag-logs/xtask.log 2>&1
            { echo "=== xtask: exit $?"; grep -aE '^(structural|literals|unsafe|xtask)' diag-logs/xtask.log | cut -c1-260; } >> results.txt
          fi
          echo "=== end" >> results.txt
      - name: Publish
        if: ${{ always() }}
        shell: bash
        env:
          RESULTS_BRANCH: diag-winfsp-bench-land-results-${{ github.run_id }}-${{ matrix.runner }}
        run: |
          set +e
          [ -f results.txt ] || echo "the legs wrote nothing" > results.txt
          git config user.name diag; git config user.email diag@invalid
          tree=$(printf '100644 blob %s\tresults.txt\n' "$(git hash-object -w results.txt)" | git mktree)
          commit=$(git commit-tree "$tree" -m "results of run $GITHUB_RUN_ID")
          git push -f origin "$commit:refs/heads/$RESULTS_BRANCH"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: land-${{ matrix.runner }}
          path: diag-logs
