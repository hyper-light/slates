name: DIAG reland-a207 the paged volume listing (not for main)

# The paged `List` on this diag commit's parent: the Rust suites it touches on Linux x86-64, Linux arm64 and Windows,
# and both SDKs' suites on Linux and macOS (their async lists walk the pages as a chain). Each job's lines go to
# diag-results/reland-a207-list-<run>-<runner>-<job> as one commit after every step, watched with git fetch.

on:
  push:
    branches: ['diag-reland-a207-list-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    name: listing suites on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RESULTS_BRANCH: diag-results/reland-a207-list-${{ github.run_id }}-${{ matrix.runner }}-rust
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: runs
        shell: bash
        run: |
          set -u +e +o pipefail
          out="$RUNNER_TEMP/results.txt"; : > "$out"
          echo "tested $(git rev-parse HEAD^) on ${{ matrix.runner }}" >> "$out"
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          publish() {
            blob=$(git hash-object -w "$out") || return 0
            tree=$(printf '100644 blob %s\tresults.txt\n' "$blob" | git mktree) || return 0
            parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID on ${{ matrix.runner }}") || return 0
            git push -q origin "$commit:refs/heads/$RESULTS_BRANCH" && echo "$commit" > "$RUNNER_TEMP/results-parent"
          }
          step() {
            name=$1; shift; log="$RUNNER_TEMP/$name.log"
            "$@" > "$log" 2>&1; code=$?
            echo "$name exit $code" >> "$out"
            grep -E '^test result|FAILED|^error' "$log" | cut -c1-200 | head -20 >> "$out"
            grep -m4 -A3 'panicked at' "$log" | cut -c1-400 >> "$out"
            publish
          }
          step clippy cargo clippy -p slates-ipc -p slates-client -p slates-server -p slates-cli --all-targets -- -D warnings
          step server cargo test -p slates-server --no-fail-fast --test volume_list --test ack_release --test daemon
          step fleet cargo test -p slates-server --test fleet -- --exact a_restarted_peer_is_learned_on_contact_under_its_fresh_identity a_fleet_refuses_a_write_its_configuration_cannot_hold_to_the_declared_durability
          step client cargo test -p slates-client --no-fail-fast --test async_core --test driver
          step ipc cargo test -p slates-ipc
          SLATES_TEST_CLI=1 step cli cargo test -p slates-cli --test cli volume_list_answers
          echo DONE >> "$out"; publish
          cat "$out"
  sdks:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    name: both SDKs on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      NAPI_CLI_VERSION: 3.7.2
      RESULTS_BRANCH: diag-results/reland-a207-list-${{ github.run_id }}-${{ matrix.runner }}-sdks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: runs
        shell: bash
        env:
          SLATES_TEST_RESTART_SLOWDOWN: "10"
        run: |
          set -u +e +o pipefail
          out="$RUNNER_TEMP/results.txt"; : > "$out"
          echo "tested $(git rev-parse HEAD^) on ${{ matrix.runner }}" >> "$out"
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          publish() {
            blob=$(git hash-object -w "$out") || return 0
            tree=$(printf '100644 blob %s\tresults.txt\n' "$blob" | git mktree) || return 0
            parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID on ${{ matrix.runner }}") || return 0
            git push -q origin "$commit:refs/heads/$RESULTS_BRANCH" && echo "$commit" > "$RUNNER_TEMP/results-parent"
          }
          cargo build -p slates-cli > "$RUNNER_TEMP/build.log" 2>&1; echo "build exit $?" >> "$out"; publish
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'maturin>=1.5,<2' > "$RUNNER_TEMP/pip.log" 2>&1
          "$RUNNER_TEMP/venv/bin/maturin" build --release --out "$RUNNER_TEMP/dist" -m crates/sdk-python/Cargo.toml > "$RUNNER_TEMP/wheel.log" 2>&1; echo "wheel exit $?" >> "$out"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-index "$RUNNER_TEMP"/dist/slates-*.whl >> "$RUNNER_TEMP/pip.log" 2>&1
          SLATES_DAEMON="$PWD/target/debug/slates" "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s crates/sdk-python/tests -v > "$RUNNER_TEMP/python.log" 2>&1; echo "python exit $?" >> "$out"
          grep -E '^Ran |^OK|^FAILED|Error|skipped' "$RUNNER_TEMP/python.log" | cut -c1-200 | head -20 >> "$out"; publish
          npm install -g @napi-rs/cli@${NAPI_CLI_VERSION} > "$RUNNER_TEMP/npm.log" 2>&1
          (cd crates/sdk-node && npm run build) > "$RUNNER_TEMP/addon.log" 2>&1; echo "addon exit $?" >> "$out"
          addon=$(ls crates/sdk-node/slates.*.node | head -1)
          SLATES_NODE_ADDON="$PWD/$addon" SLATES_DAEMON="$PWD/target/debug/slates" node --test crates/sdk-node/tests/sdk.test.mjs crates/sdk-node/tests/sdk_async.test.mjs > "$RUNNER_TEMP/node.log" 2>&1; echo "node exit $?" >> "$out"
          grep -E '^# (tests|pass|fail|skipped)|^not ok' "$RUNNER_TEMP/node.log" | cut -c1-200 | head -20 >> "$out"
          echo DONE >> "$out"; publish
          cat "$out"
