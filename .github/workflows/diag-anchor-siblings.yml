name: diag-anchor-siblings
on:
  push:
    branches: ['diag-anchor-siblings-*']
env:
  CARGO_TERM_COLOR: never
jobs:
  unix:
    name: closed pipes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy the workspace (every platform-only print site)
        timeout-minutes: 60
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: The anchor and a command over pipes whose readers went away
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: bash
        env:
          SLATES_TEST_CLI: "1"
        run: |
          status=0
          cargo test -p slates-cli --test cli -- an_anchor_whose_log_reader a_command_whose_output_reader --test-threads=1 > out.log 2>&1 || status=1
          cat out.log
          grep -E "^test result|^test |panicked|anchor ended|a failed exit|^  left|^ right" out.log | head -10 | while read -r line; do
            echo "::notice title=closed pipes::$line"
          done
          exit $status
  windows:
    name: the Windows lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clang-cl for the C the daemon links (arm64)
        if: runner.arch == 'ARM64'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Clippy the Windows-buildable crates and the shipped binary
        timeout-minutes: 60
        shell: bash
        run: |
          cargo clippy -p slates-mem -p slates-ipc -p slates-rt -p slates-base -p slates-client -p slates-server -p slates-vfs -p slates-machine -p slates-bridge-winfsp -p slates-anchor -p slates-mcp --all-targets -- -D warnings
          cargo clippy -p slates-cli --bin slates --test shards --test winfsp -- -D warnings
      - name: The anchor's tests
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test -p slates-anchor -- --test-threads=1
