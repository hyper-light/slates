name: DIAG reland-a207 presentation_fairness names its probes (not for main)

# crates/server/tests/presentation_fairness.rs on this diag commit's parent: once quiet, then the granted test three
# times beside eight `yes` spinners a CPU, every named probe kept (Linux reads no run state, so a wait off the CPU is
# named unsampled). Windows: slates-rt's clippy and its thread-clock tests (run_state answers None there). Each run's
# lines go to diag-reland-a207-pf-results-<run>-<runner> as one commit after every run.

on:
  push:
    branches: ['diag-reland-a207-pf-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    name: presentation_fairness on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RESULTS_BRANCH: diag-reland-a207-pf-results-${{ github.run_id }}-${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: runs
        shell: bash
        run: |
          set -u +e +o pipefail
          out="$RUNNER_TEMP/results.txt"; : > "$out"
          echo "tested $(git rev-parse HEAD^) on $(uname -m), $(nproc) cpus" >> "$out"
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          publish() {
            blob=$(git hash-object -w "$out") || return 0
            tree=$(printf '100644 blob %s\tresults.txt\n' "$blob" | git mktree) || return 0
            parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID on ${{ matrix.runner }}") || return 0
            git push -q origin "$commit:refs/heads/$RESULTS_BRANCH" && echo "$commit" > "$RUNNER_TEMP/results-parent"
          }
          keep() { grep -E '^named:|presentation of|granted landing of|panicked|given up|test result' "$1" | head -40 | cut -c1-500 | sed 's/^/    /' >> "$out"; }
          cargo test -p slates-server --test presentation_fairness --no-run > "$RUNNER_TEMP/build.log" 2>&1; echo "build exit $?" >> "$out"
          grep -E '^error' -A6 "$RUNNER_TEMP/build.log" | head -30 >> "$out"; publish
          log="$RUNNER_TEMP/quiet.log"; start=$(date +%s)
          timeout 900 cargo test -p slates-server --test presentation_fairness -- --nocapture > "$log" 2>&1; code=$?
          echo "quiet exit $code $(( $(date +%s) - start ))s load=$(cut -d' ' -f1-3 /proc/loadavg)" >> "$out"; keep "$log"; publish
          spinners=""
          for i in $(seq 1 $(( 8 * $(nproc) ))); do yes > /dev/null & spinners="$spinners $!"; done
          sleep 2
          for n in 1 2 3; do
            log="$RUNNER_TEMP/run-$n.log"; start=$(date +%s)
            timeout 900 cargo test -p slates-server --test presentation_fairness -- --exact a_granted_landing_never_holds_its_shard_while_it_is_planned --nocapture > "$log" 2>&1; code=$?
            echo "loaded run $n exit $code $(( $(date +%s) - start ))s load=$(cut -d' ' -f1-3 /proc/loadavg)" >> "$out"; keep "$log"
            publish
          done
          kill $spinners 2>/dev/null
          echo DONE >> "$out"; publish
          cat "$out"
  windows:
    name: slates-rt on windows-latest
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RESULTS_BRANCH: diag-reland-a207-pf-results-${{ github.run_id }}-windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: runs
        shell: bash
        run: |
          set -u +e +o pipefail
          out="$RUNNER_TEMP/results.txt"; : > "$out"
          echo "tested $(git rev-parse HEAD^) on windows" >> "$out"
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          cargo clippy -p slates-rt --tests -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1; echo "clippy exit $?" >> "$out"
          grep -E '^(error|warning)' -A6 "$RUNNER_TEMP/clippy.log" | head -30 >> "$out"
          cargo test -p slates-rt --lib thread_clock > "$RUNNER_TEMP/test.log" 2>&1; echo "test exit $?" >> "$out"
          grep -E '^test |test result|panicked' "$RUNNER_TEMP/test.log" | head -10 >> "$out"
          echo DONE >> "$out"
          blob=$(git hash-object -w "$out")
          tree=$(printf '100644 blob %s\tresults.txt\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "results of run $GITHUB_RUN_ID on windows-latest")
          git push -q origin "$commit:refs/heads/$RESULTS_BRANCH"
          cat "$out"
