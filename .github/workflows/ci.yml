name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: fmt + clippy + structural + literals + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # slates has no inherited code, so the format gate is appropriate from day one
      # (Appendix B.1). A red-forever check is worse than no check: never let it rot.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (the lint wall)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # R1/R2 by construction: forbidden symbols, forbidden dependencies, and write-capable
      # syscalls outside the landing crate fail the build (AC-0.1).
      - name: Structural test
        run: cargo xtask structural
      # R3: every numeric literal in a tuning position carries its derivation (AC-0.2).
      - name: Literal check
        run: cargo xtask literals
      - name: Test
        run: cargo test --workspace
      - name: AC-1.1 model suite over 10^6 generated operations
        run: cargo test -p slates-vfs --release --test model -- --ignored ac_1_1
      - name: AC-1.2 differential suite against tmpfs (Linux)
        if: runner.os == 'Linux'
        run: SLATES_TEST_RAMDIR=/dev/shm PROPTEST_CASES=2000 cargo test -p slates-vfs --release --test differential -- --nocapture
      - name: Host semantics over tmpfs (Linux)
        if: runner.os == 'Linux'
        run: SLATES_TEST_RAMDIR=/dev/shm cargo test -p slates-base --test host -- --nocapture
      - name: Landing over tmpfs, with kill -9 (Linux)
        if: runner.os == 'Linux'
        run: SLATES_TEST_RAMDIR=/dev/shm cargo test -p slates-land --release --test os -- --nocapture
      # T-1.17: the 10k-entry delta into a 10^6-entry tree against cp -r; informational on a
      # shared runner (no ratchet baseline), the numbers land in the job log.
      - name: Landing bench over tmpfs (Linux)
        if: runner.os == 'Linux'
        run: SLATES_TEST_RAMDIR=/dev/shm cargo run --release -p slates-land --example land_bench
      # The ratchet skips loudly on a machine with no recorded baseline (shared runners have
      # none); on a reference machine with an entry in ratchets.toml it fails on a regression.
      - name: Ratchet
        run: cargo xtask ratchet

  # Every shipped crate must lint clean for every OS we build for, not only the runner's own:
  # the Linux drivers, the Windows driver and the Win32 facts are checked from one machine. The
  # C dependencies stay off here (no cross C toolchain); the profile says so in its notes.
  cross-lint:
    name: cross-target clippy (linux, windows, macos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0 # keep in sync with rust-toolchain.toml
          components: clippy
          targets: x86_64-pc-windows-msvc, aarch64-apple-darwin, x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Clippy per target
        run: |
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin; do
            cargo clippy --workspace --exclude xtask --lib --bins \
              --no-default-features --features slates-machine/pure-hash --target "$target" -- -D warnings
          done

  # D-20: instruction-count gates. callgrind counts are deterministic for a given binary, so
  # they see the one-percent change the wall clock cannot. valgrind is non-Rust tooling, admitted
  # for this lane by explicit authorization (2026-09-05); the runner version must equal the crate's.
  callgrind:
    name: instruction counts (iai-callgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: iai-callgrind-runner (the version pinned in Cargo.toml)
        run: cargo install iai-callgrind-runner --version 0.16.1 --locked
      - name: Benches
        run: cargo bench --workspace --bench callgrind

 on the unit tests of the crates that hold unsafe code. Miri ships only with the
  # nightly toolchain, which CI installs for this job alone; the pinned stable toolchain builds
  # everything else. loom runs under stable with `--cfg loom`.
  miri-and-loom:
    name: miri + loom (mem, rt, wire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: loom (every interleaving of the ring)
        run: RUSTFLAGS="--cfg loom" cargo test -p slates-mem --lib --release loom
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri (memory and wire: leak check on)
        run: cargo +nightly miri test -p slates-mem -p slates-wire --lib
      # The runtime leaks its shard contexts, rings and registry entries on purpose (they live
      # for the process; the leak is what makes every reference to them a plain `&'static`), so
      # Miri's leak check is off for it; every other check stays on. The OS-driver tests are
      # marked ignored under Miri, which cannot model kqueue or eventfd.
      - name: Miri (runtime: simulation tests, intentional leaks ignored)
        run: MIRIFLAGS="-Zmiri-ignore-leaks" cargo +nightly miri test -p slates-rt --lib --test differential

  windows-nightly:
    name: windows (nightly cadence)
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
