name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The nightly run (Part 6: shuttle, TSan and the long lanes "nightly"; AUD-29-32; Ada authorized the
  # schedule 2026-10-03). Every job runs on it, on main, so a day with no push still meets a moving
  # nightly toolchain (Miri, TSan), a changed runner image or a pulled container tag. Shape: once a day,
  # at 03:17 UTC, off the hour because GitHub delays scheduled runs most at the start of an hour
  # (GitHub Actions docs, "Events that trigger workflows", `schedule`).
  schedule:
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: fmt + clippy + structural + literals + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The workspace runs the byte-for-byte chart golden too. Use its renderer, as in the
      # KIND lane; the runner image's preinstalled Helm changes document-separator whitespace.
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      # slates has no inherited code, so the format gate is appropriate from day one
      # (Appendix B.1). A red-forever check is worse than no check: never let it rot.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (the lint wall)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Documentation is load-bearing here: the design's numbered identifiers and the module docs are how a
      # subsystem is handed to the next engineer, and rustdoc is the only thing that can tell a reference to a
      # real item from a reference to one that was renamed or deleted. Nothing in this repository ran it until
      # 2026-10-20, and the first run failed with 95 errors across fourteen crates — among them three links to
      # `WithHost`, a type that has never existed in this tree, and a doc comment that had become separated from
      # the function it described by an item inserted between them.
      #
      # Private items are documented because most of slates' design lives in private module docs, and
      # `private_intra_doc_links` is allowed for the same reason: with `--document-private-items` those links do
      # resolve in the output this builds. `broken_intra_doc_links` — the one that catches a stale reference —
      # stays denied, which is the check worth having.
      - name: Documentation (every reference names something that exists)
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
        run: cargo doc --workspace --no-deps --document-private-items
      # R1/R2 by construction: forbidden symbols, forbidden dependencies, and write-capable
      # syscalls outside the landing crate fail the build (AC-0.1).
      - name: Structural test
        run: cargo xtask structural
      # R3: every numeric literal in a tuning position carries its derivation (AC-0.2).
      - name: Literal check
        run: cargo xtask literals
      # The one version (docs/publish.md): the Python wheel derives it through maturin and the npm
      # packages are derived copies of the workspace version; a drift fails here, on every push,
      # not at tag time in the publish lanes.
      - name: Version check
        run: cargo xtask version
      # The daemon provisions from usable memory and degrades honestly when the OS grants little
      # lockable RAM (§4.2 D-12; docs/bugs/2026-09-10-provisioning-budget-from-mlock-limit.md), so the
      # tests run under the runner's default mlock limit — no `ulimit` bump, which the runners ignore.
      - name: Test
        env:
          # The fleet harness's wait trace (crates/server/tests/common/trace.rs): held in memory per test and printed
          # only with a failing test, so a takeover that never completes says which daemon stopped advancing (fleet
          # tests failed on 4 of 8 runs on 2026-10-06 with no evidence beyond a timeout).
          SLATES_FLEET_TRACE: "1"
          # The hedge test (a_slow_first_round_candidate_is_hedged_after_the_measured_p95) holds a candidate
          # down while the hedge places the second seal, and asserts the seal placed before the hold ends. The
          # hedge fires on the measured put p95 (tens of ms); the placement-and-observation path is ~360 ms
          # unloaded but inflates with runner load (a 180x-overloaded runner once took 3.003 s, racing the
          # default 3 s window). Widen the window on CI so a loaded shared runner does not false-fail; a normal
          # local run keeps the prompt 3 s default. The hedge behaviour is unchanged (crates/server/tests/fleet.rs).
          SLATES_TEST_HEDGE_STARVATION_SECS: "20"
          # a_restarted_daemons_first_answer_is_awaited_for_the_reconnect_budget runs an in-process daemon, whose
          # stop cannot fire the client's process-exit watch, so the client detects the restart only when the
          # successor republishes its bootstrap stamp. A loaded shared runner publishes that far slower than a dev
          # machine, racing the reply deadline (it reported Stalled{1ms} on macOS + TSan, run 38537130473). Scale the
          # restart timings together so the publish has room; the invariant publish << reply << recovery << reconnect
          # holds at any scale (crates/client/tests/client.rs). A normal local run keeps the prompt default of 1.
          SLATES_TEST_RESTART_SLOWDOWN: "10"
          # The fleet deadlines (DEADLINE_NS reply wait and formation_deadline convergence poll, crates/server/tests/
          # fleet.rs) default to 30 s — ample locally, but a loaded shared runner takes far longer to converge a
          # multi-node takeover (a_cross_region_client_finds_the_copyset_successor passed locally in 5.7 s yet exceeded
          # a fixed 30 s on this lane). Scale both to 120 s here so a loaded runner does not false-fail; a real
          # non-convergence is still caught at the bound, and a normal local run keeps the prompt 30 s default.
          SLATES_TEST_FLEET_DEADLINE_SECS: "120"
        run: cargo test --workspace
      # The vendored AWS-LC crates' own suites, each against the other's vendored copy (vendor/UPSTREAM.md).
      - name: The vendored crates' suites
        run: cargo test --manifest-path vendor/Cargo.toml --workspace --locked
      - name: AC-1.1 model suite over 10^6 generated operations
        run: cargo test -p slates-vfs --release --test model -- --ignored ac_1_1
      # By exact name: the file's other ignored test is a diagnosis tool (`replay_to_the_first_violation`),
      # which a bare `--ignored` swept in (CI run 36511884967).
      - name: T-8.13 Raft safety explorer at full scale
        run: cargo test -p slates-cluster --release --test explore -- --ignored --exact the_dialect_keeps_raft_safety_at_full_scale
      - name: The multi-log explorer at full scale (MLRaft's merge, research record §3.6)
        run: cargo test -p slates-cluster --release --test multilog -- --ignored --exact the_multi_log_merges_alike_at_full_scale
      # By exact name, one at a time: each search spreads over every core and holds up to 4 GiB, and the file's
      # third ignored test is a measurement tool.
      - name: The slot model's exhaustive searches (the fast track's recovery, research record §3.7 and §4)
        run: >-
          cargo test -p slates-cluster --release --test slot_model -- --ignored --test-threads=1 --exact
          the_ballot_recovery_keeps_agreement_at_full_scope
          the_published_recovery_loses_agreement_when_its_leader_decides_by_votes
      - name: The prefix model's exhaustive searches (the dialect's design and its rejected alternatives, §4)
        run: >-
          cargo test -p slates-cluster --release --test prefix_model -- --ignored --test-threads=1 --exact
          the_design_keeps_agreement_at_full_scope
          each_rejected_alternative_loses_a_committed_entry_or_resurrects_a_stale_one
      - name: AC-1.2 differential suite against the host filesystem (Linux)
        if: runner.os == 'Linux'
        run: PROPTEST_CASES=2000 cargo test -p slates-vfs --release --test differential -- --nocapture
      - name: Host semantics over the disk (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p slates-base --test host -- --nocapture
      - name: Landing over the disk, with kill -9 (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p slates-land --release --test os -- --nocapture
      # The end-to-end CLI flow spawns a real anchor and daemon; it needs the machine to
      # itself (a busy parallel suite starves the daemon), so it is its own step.
      # The Linux container profile binds a FUSE mount shared with the runtime's processes (`slates mount
      # --shared`, allow_other), which the host's operator grants with user_allow_other (Ada authorized it on
      # the CI runner, 2026-10-01; AUD-29-67/74/78).
      - name: Grant user_allow_other (Linux)
        if: runner.os == 'Linux'
        run: |
          grep -qx user_allow_other /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf
      - name: The slates CLI flow (anchor + daemon)
        env:
          SLATES_TEST_CLI: "1"
        run: |
          cargo test -p slates-cli --test cli -- --test-threads=1 --nocapture
      # The FSKit shim's Swift wire codec must agree with the Rust codec byte for byte (it shares the
      # golden vector). Compile and run its cross-check on the macOS runner, where swiftc lives.
      # ShimWire.swift is a pure library of the codec types; ShimWireMain.swift is the @main driver,
      # kept separate so the FSVolume handler can compile against the library (see the next step).
      - name: FSKit Swift shim wire cross-check (macOS)
        if: runner.os == 'macOS'
        run: |
          swiftc crates/bridge-fskit/swift/ShimWire.swift crates/bridge-fskit/swift/ShimWireMain.swift \
            -o "$RUNNER_TEMP/shimwire" && "$RUNNER_TEMP/shimwire"
      # The FSKit FSVolume handler (SlatesVolume.swift) conforms to the real FSKit operation protocols.
      # HandlerTest.swift constructs the real handler against FSKit (no mount) and drives it through a
      # mock ShimChannel, asserting the shim requests it emits and the FSKit objects it builds — the
      # translation logic by use (R5), including the open/close handle-stack that releases every handle.
      # Building the test also compiles the handler, so this one step is both the compile-verify and the
      # by-use check. FSKit ships in the macOS 15.4+ SDK; on an older runner the step skips loudly and
      # passes (it never fails for the pin being absent). The app-group ring transport and the live-mount
      # FSItem lifecycle are the Phase 4 spike, marked SPIKE: in the source (docs/wip/GAPS.md §4.6).
      - name: FSKit FSVolume handler by-use tests against the real framework (macOS 15.4+)
        if: runner.os == 'macOS'
        run: |
          if echo 'import FSKit' | swiftc -typecheck - 2>/dev/null; then
            swiftc \
              crates/bridge-fskit/swift/ShimWire.swift \
              crates/bridge-fskit/swift/SlatesVolume.swift \
              crates/bridge-fskit/swift/HandlerTest.swift \
              -framework FSKit -o "$RUNNER_TEMP/handlertest"
            "$RUNNER_TEMP/handlertest"
          else
            echo "SKIP (loud): FSKit is not in this runner's SDK (needs macOS 15.4+); handler tests skipped."
          fi
      # The in-process transport (§4.6): the `test-harness` cdylib exposes a C ABI over `serve`, and
      # InProcessTest.swift links it to drive the real handler through serve() over a real VolumeBridge
      # on a real scratch volume — the whole handler↔codec↔bridge stack end to end in one process, no
      # ring and no mount. This is the one link the Rust `serve` tests and the Swift mock tests each
      # cover only half of. The production transport form (this in-process form vs forwarding over the
      # app-group ring) and the live mount remain the spike's (docs/wip/GAPS.md §4.6).
      - name: FSKit in-process transport end-to-end test (macOS 15.4+)
        if: runner.os == 'macOS'
        run: |
          if echo 'import FSKit' | swiftc -typecheck - 2>/dev/null; then
            cargo build -p slates-bridge-fskit --features test-harness
            swiftc \
              crates/bridge-fskit/swift/ShimWire.swift \
              crates/bridge-fskit/swift/SlatesVolume.swift \
              crates/bridge-fskit/swift/InProcessTest.swift \
              -framework FSKit -L target/debug -lslates_bridge_fskit \
              -o "$RUNNER_TEMP/inprocess"
            DYLD_LIBRARY_PATH=target/debug "$RUNNER_TEMP/inprocess"
          else
            echo "SKIP (loud): FSKit is not in this runner's SDK (needs macOS 15.4+); in-process test skipped."
          fi
      # T-1.17: the 10k-entry delta into a 10^6-entry tree against cp -r; informational on a
      # shared runner (no ratchet baseline), the numbers land in the job log.
      - name: Landing bench over the disk (Linux)
        if: runner.os == 'Linux'
        run: cargo run --release -p slates-land --example land_bench
      # The ratchet skips loudly on a machine with no recorded baseline (shared runners have
      # none); on a reference machine with an entry in ratchets.toml it fails on a regression.
      - name: Ratchet
        run: cargo xtask ratchet

  # The live guest (AUD-29-68, AC-9.7): QEMU's vhost-user-fs-pci drives a Linux guest whose /init mounts a
  # daemon volume's tag, then runs the conformance roster on slates and on its RAM. QEMU, the distribution
  # kernel and a busybox initramfs come from ci/guest (Ada authorized QEMU in CI, 2026-10-01). KVM accelerates
  # the guest when the runner exposes /dev/kvm; the tests read it and fall back to software emulation.
  live-guest:
    name: live guest over vhost-user (QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Open KVM to the job
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm || echo "no /dev/kvm: the guest runs under software emulation"
      - name: Build the guest image
        run: docker build -t slates-guest ci/guest
      - name: The virtio-fs suite with the live guest
        shell: bash
        run: |
          set -o pipefail
          # `seccomp=unconfined` was needed partly to let io_uring through Docker's default profile; that
          # reason left with A-136 (2026-10-18, Linux runs on epoll). It is kept because QEMU in this lane
          # may still need it — whoever owns this lane should test dropping it, which would be a strict
          # hardening of the CI container.
          docker run --rm --security-opt seccomp=unconfined \
            $( [ -e /dev/kvm ] && echo --device /dev/kvm ) \
            -v "$PWD":/src -w /src slates-guest sh -c \
            'SLATES_GUEST_QEMU=$(ls /usr/bin/qemu-system-x86_64 /usr/bin/qemu-system-aarch64 2>/dev/null | head -1) \
             SLATES_GUEST_KERNEL=/guest/vmlinuz SLATES_GUEST_INITRD=/guest/initrd.gz \
             cargo test -p slates-server --test virtiofs -- --nocapture' 2>&1 | tee live-guest.log
          # A skipped live guest is a vacuous pass here: the image provides its environment, so a skip fails.
          if grep -q "SKIP: the live guest" live-guest.log; then echo "the live guest was skipped"; exit 1; fi
          grep -q "guest workload git: Identical" live-guest.log
          grep -q "guest suite fsx: ok" live-guest.log
          grep -q "guest suite fsstress: ok" live-guest.log
          grep -q "guest suite pjdfstest: ok" live-guest.log

  # The two SDKs as a user installs them (§2.4; docs/publish.md), by use on Linux and macOS. The
  # cp39-abi3 wheel maturin builds is installed into a fresh venv after twine checks its metadata
  # (what PyPI would refuse fails here); the napi addon `npm run build` produces is packed into the
  # main and platform tarballs, installed into a fresh project, and the packaged smoke test imports the
  # package by name — the loader resolving the addon through the optionalDependencies platform package
  # — over a live daemon. Both SDKs' own by-use suites (sync and async, over a live daemon) run against
  # the installed wheel and the built addon. The publish lanes run only on a tag, so this is where a
  # packaging defect is caught on every push. The toolchains are the SDKs' own build backends (maturin,
  # the napi CLI pinned as in publish-node.yml) plus twine, the check PyPI applies.
  sdk:
    name: SDK packaging by use (wheel, sdist, addon, tarballs)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Outside a manylinux container the wheel is tagged for this Linux only; that is what a
          # local install needs, and the publish lane builds the manylinux wheels in the containers.
          - { os: ubuntu-latest, maturin_compatibility: "--compatibility linux" }
          - { os: macos-latest, maturin_compatibility: "" }
    runs-on: ${{ matrix.os }}
    env:
      NAPI_CLI_VERSION: 3.7.2 # keep in sync with publish-node.yml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The daemon both SDK suites spawn
        run: cargo build -p slates-cli
      - name: Build the wheel and the sdist, check their metadata, install the wheel into a fresh venv
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'maturin>=1.5,<2' twine
          "$RUNNER_TEMP/venv/bin/maturin" build --release --out "$RUNNER_TEMP/dist" -m crates/sdk-python/Cargo.toml ${{ matrix.maturin_compatibility }}
          "$RUNNER_TEMP/venv/bin/maturin" sdist --out "$RUNNER_TEMP/dist" -m crates/sdk-python/Cargo.toml
          "$RUNNER_TEMP/venv/bin/twine" check --strict "$RUNNER_TEMP"/dist/*
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-index "$RUNNER_TEMP"/dist/slates-*.whl
      # The async suite's budgets scale with this, the same knob the Rust client tests read. Measured
      # 2026-10-20: under ten busy spinners on an 18-core machine, phase 1's calls came back
      # `Stalled { after_ns: 1000000000 }` once in five runs instead of being answered across the
      # restart — a flat one second is not a budget a loaded two-core runner can meet. With the knob
      # at 10 under the same load: five of five. The loop-responsiveness bound deliberately does not
      # scale with it, so this cannot mask the held-loop failure it is there to catch.
      - name: The Python suites (sync and async) against the installed wheel over a live daemon
        env:
          SLATES_TEST_RESTART_SLOWDOWN: "10"
        run: SLATES_DAEMON="$PWD/target/debug/slates" "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s crates/sdk-python/tests -v
      - name: Build the napi addon and run the Node suites (sync and async) over a live daemon
        run: |
          set -euo pipefail
          npm install -g @napi-rs/cli@${{ env.NAPI_CLI_VERSION }}
          (cd crates/sdk-node && npm run build)
          addon=$(ls crates/sdk-node/slates.*.node)
          SLATES_NODE_ADDON="$PWD/$addon" SLATES_DAEMON="$PWD/target/debug/slates" \
            node --test crates/sdk-node/tests/sdk.test.mjs crates/sdk-node/tests/sdk_async.test.mjs
      - name: Pack the main and platform packages, install them into a fresh project, run the packaged smoke test
        run: |
          set -euo pipefail
          binary=$(basename "$(ls crates/sdk-node/slates.*.node)")
          platform=${binary#slates.}
          platform=${platform%.node}
          cp "crates/sdk-node/$binary" "crates/sdk-node/npm/$platform/"
          (cd "crates/sdk-node/npm/$platform" && npm pack --pack-destination "$RUNNER_TEMP")
          (cd crates/sdk-node && npm pack --pack-destination "$RUNNER_TEMP")
          mkdir "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/hyper-light-slates-*.tgz
          cp "$GITHUB_WORKSPACE/crates/sdk-node/tests/packaged.test.mjs" .
          SLATES_DAEMON="$GITHUB_WORKSPACE/target/debug/slates" node --test packaged.test.mjs

  # The Windows cfg branches (the Win32 rendezvous, the IOCP driver, the Win32 machine facts, the
  # WinFsp bridge) lint on a NATIVE Windows runner — each platform builds and lints on its own OS, so
  # every dependency (including the C ones) builds with that OS's toolchain. Linux and macOS are already
  # covered natively by the `gates` matrix; this job adds Windows, so all three platforms' cfg code is
  # linted on native runners.
  windows-lint:
    name: native clippy + tests (windows)
    runs-on: windows-latest
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # AWS-LC's x86_64 Windows assembly is NASM source, built from source rather than taken prebuilt (Ada,
      # 2026-10-03, as ../mantle builds it); AWS_LC_SYS_PREBUILT_NASM=0 makes a missing NASM a build failure.
      - name: Install NASM
        uses: ilammy/setup-nasm@v1.5.2
      # The vendored AWS-LC crates' own suites, each against the other's vendored copy (vendor/UPSTREAM.md).
      - name: The vendored crates' suites
        run: cargo test --manifest-path vendor/Cargo.toml --workspace --locked
      # WinFsp: the live mount needs the kernel FSD installed. The daemon links nothing of WinFsp's: it finds
      # `winfsp-x64.dll` at run time, by name on the loader's path (the `bin/` added below) or under the install
      # directory the MSI records in the registry, as WinFsp's own `FspLoad` does.
      - name: Install WinFsp
        run: |
          choco install winfsp -y --no-progress
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      # `--workspace` cannot build here: the NFS-mount and FUSE/FSKit crates (bridge-nfs, cli,
      # bridge-fuse, bridge-fskit) are macOS/Linux-only — Windows mounts through WinFsp, and the fleet
      # transport is QUIC over UDP, not the NFS-over-TCP loopback. (Since A-184, 2026-10-26, `slates-bridge-nfs`
      # builds here inside `slates-server`: the NFS server is the Windows network export.) So clippy the crates that carry
      # Windows code: the shared memory and wake (mem, ipc), the runtime with its IOCP/AFD driver (rt),
      # the client, the **daemon** (`slates-server` — a RAM-only IPC daemon on Windows, its NFS mount
      # transport gated off; provisioning, merge and landing all cross-platform), the **WinFsp mount
      # host** (`slates-bridge-winfsp`), and the two SDK addons. **`slates-vfs` and `slates-machine` joined on
      # 2026-10-20**: both were already built here as dependencies, but only as libraries, so their *tests*
      # had never been compiled for Windows — which is where §4.6's DAX suite lives, with its paired `#[cfg]`
      # arms and its `huge_page_bytes` probe that answers `None` off Linux. Cross-linted clean against
      # `x86_64-pc-windows-gnu` before being added here. **`slates-mcp` joined on 2026-10-26** with its HTTP edge on Windows
      # (A-183); its test runs here once landing does, since `slates.land.materialize` answers `Unsupported` on Windows
      # until then.
      - name: Clippy the Windows-buildable crates (native Windows)
        run: cargo clippy -p slates-mem -p slates-ipc -p slates-rt -p slates-base -p slates-client -p slates-server -p slates-vfs -p slates-machine -p slates-bridge-winfsp -p slates-sdk-node -p slates-sdk-python -p slates-anchor -p slates-mcp --all-targets -- -D warnings
      # The shipped Windows binary, linted without `--all-targets` and as a step of its own so its exit code
      # is checked on its own (the Windows shell is `pwsh`, where a native command failing mid-script does not
      # end the script — only the last line decides the step, which would mask this).
      #
      # The binary is what this lane was widened for: its Windows signal handling was compiled by nothing
      # until 2026-10-20. Its *other* targets are Unix by nature — the bin's own `cfg(test)` modules and the
      # `vfs_tails` example use inherited descriptors, `slates-bridge-nfs` and `slates-bridge-oci` — and
      # `--all-targets` pulled them in here, where they cannot compile. They are not left unlinted: the
      # ubuntu and macOS gates lint the whole workspace with `--all-targets`, which is where a Unix-only
      # target belongs. Narrowing keeps this lane about the Windows artifact.
      - name: Clippy the shipped Windows binary
        run: cargo clippy -p slates-cli -- -D warnings
      # The binary's one Windows test target, the WinFsp mount through the command, linted on its own for the same
      # reason: the rest of its targets are Unix by nature.
      - name: Clippy the WinFsp CLI test (native Windows)
        run: cargo clippy -p slates-cli --test winfsp -- -D warnings
      - name: Clippy the Shards hand-off CLI test (native Windows)
        run: cargo clippy -p slates-cli --test shards -- -D warnings
      # The other half of the documentation gate in `gates`. That one runs on ubuntu and macos, so it checks
      # every reference those two hosts can resolve — and a reference resolves or not *per platform*, because
      # an item behind `#[cfg(windows)]` exists for no other. Of the errors that gate found, five were visible
      # only to macOS and two only to Linux; nothing had ever looked from Windows.
      #
      # Enumerating the Windows-invisible set statically was tried on 2026-10-20 and abandoned: three
      # iterations of the sweep reported 79, then 31, then 30 candidates, and the macOS control — where the
      # real build passes — still showed seven, every one of them false, because a sweep cannot tell whether
      # the *linking site* is itself compiled on that platform. `MAX_SHARDS_32` is the example: it and its
      # only reference are both `#[cfg(not(target_pointer_width = "64"))]`, so they appear and vanish
      # together and are never an error. rustdoc knows that and a grep does not.
      #
      # Scoped to this lane's own crate list, as its clippy steps are; `--no-deps` makes it one rustdoc pass
      # over a cache those steps have already warmed.
      - name: Documentation (every reference names something Windows can see)
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
        run: cargo doc -p slates-mem -p slates-ipc -p slates-rt -p slates-base -p slates-client -p slates-server -p slates-vfs -p slates-machine -p slates-bridge-winfsp -p slates-anchor -p slates-cli -p slates-mcp --no-deps --document-private-items
      # Run the tests whose Win32 cfg branches only a native Windows runner can exercise: the shared
      # memory (`CreateFileMappingW`); the cross-process wake (the named auto-reset Event — §4.7's
      # `WaitOnAddress`-is-process-local case, so the park/late-reply wake in `rings` goes through the
      # Event here, not the wake word); the IOCP driver's AFD socket readiness (`afd.rs`,
      # `\Device\Afd`/`IOCTL_AFD_POLL`), exercised by a real loopback UDP round trip in rt's `udp` test —
      # the fleet transport's datagram substrate; and the **Win32 rendezvous** (Phase 4) — the `Local\`
      # bootstrap object with claim slots (a `SharedObject` = `CreateFileMappingW`) over which a
      # re-invoked child process connects to the daemon end, hands over its region, and round-trips a
      # request. The daemon spin-polls the slots and the client's wait re-checks READY on each timeout,
      # so the handoff works cross-process without the sub-50 µs Event wake (that fast path is owed).
      # And the **consumer-capability delivery** (§4.13, GAP-A9-9): the re-invoked child is created by
      # `CreateProcessW` with a `PROC_THREAD_ATTRIBUTE_HANDLE_LIST` naming its one pipe handle, takes
      # the record from it, and must find the parent's inheritable decoy handle absent.
      # Each Windows test binary is its own step with its own limit, run even when an earlier one failed
      # or timed out: the job-level six-hour limit killed hung runs with no log kept (job 106959967584:
      # BlobNotFound), and one step running five binaries could not say which hung. A step compiles one
      # crate's tests and runs them; clippy of every crate here took 23-66 s over four runs (2026-09-25),
      # so fifteen minutes is over ten times the slowest measured build, and a hang is cut with its log.
      - name: Test the Win32 shared memory (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-mem
      - name: Test the rings and the Event wake (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-ipc --test rings
      - name: Test the Win32 rendezvous (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-ipc --test rendezvous
      - name: Test the consumer-capability delivery (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-ipc --test delivery
      # A Shards stream's end handed to a program by `spawn_with` (§4.6, A-181): the program writes through the handle its
      # arguments name; a child started afterwards inherits nothing of it, against an inheritable copy's contrast; the
      # launcher's copy stands until it lets the program go, and its kill-on-close job ends a program it drops.
      - name: Test the stream hand-off to a program (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-ipc --test stream_spawn
      # The IOCP driver woken by the registry's kick, the one every sender uses: a parked shard that no
      # kick reached never ran a spawn or a shutdown (docs/bugs/2026-09-26-windows-shards-were-never-kicked.md).
      - name: Test the IOCP driver's kick and no-op (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: 'cargo test -p slates-rt --lib driver::'
      # The Windows base host's containment (AUD-29-62): handle-relative opens over a real NTFS directory in
      # the build output, with the root, an intermediate and a final component swapped for junctions and
      # links between the host's calls; nothing outside the base is ever read.
      - name: Test the base host's contained access (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-base
      - name: Test the AFD readiness over loopback UDP (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-rt --test udp
      # A Windows named pipe's end on the IOCP driver (§4.3, A-179), the Shards route's stream on Windows: a task reads
      # and writes one by completions, a write to a reader that waits blocks and resumes, a gone peer ends the stream,
      # an end dropped with a read in the kernel leaves the next one whole, and a disconnect wakes its reader.
      - name: Test the IOCP driver's pipe ends (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-rt --test pipe
      # TCP on the AFD reactor (`docs/wip/platforms.md` gap 1): a request and a framed reply, a listener handed over by
      # its socket, a refused connect, the peer's close in Windows' own record of the connection, a peeked request left
      # queued, the receive low-water mark refused typed, and a listener's port no other socket can bind.
      - name: Test TCP on the AFD reactor (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-rt --test tcp
      # The NFS server on Windows (A-183), the network export's: honest clients write and read back their files while
      # breakers send partial records, oversized markers and garbage, abort mid-call and replay tampered handles, every
      # request framed by the connection's own inbox (Windows keeps no receive low-water mark); and the fleet export's
      # RPC-with-TLS by its RFC's rules. One test at a time: each starts a daemon sized from the whole machine, and
      # seventeen at once stalled a reply past its deadline on jupiter, as the client suite's did.
      - name: Test the NFS server and the network export (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test -p slates-server --test nfs_hostile --test nfs_tls -- --test-threads=1
      - name: Test a shard's lateness after a park (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-rt --test overrun
      # A shard's CPU clock read from another thread (§4.14, A-65): `GetThreadTimes` for the time it ran and
      # `QueryThreadCycleTime` for whether it ran; then the observations that count their budget in it — a starved
      # shard answered past the wall budget, a wedged one ended in one budget
      # (docs/bugs/2026-10-03-an-observation-read-a-starved-shard-as-wedged.md).
      - name: Test the shard CPU clock (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: 'cargo test -p slates-rt --lib thread_clock::'
      - name: Test the observation budget in the shard's own time (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-server --test observe
      # The client binary whole on Windows, and the async driver: an in-process `slates-server` daemon found through the
      # Win32 rendezvous bootstrap object, driven over the rings through the whole lifecycle; the same-kernel direct map
      # by handle duplication (§4.6, A-175: zero copy asserted, the hostile holder's escalations refused, the neighbour's
      # marker absent, another path's write seen); and sessions that outlive a daemon restart under a test that holds
      # the rendezvous as the anchor does (AC-2.3, A-176: a reconnecting client's region was refused by its live name,
      # until each start named its regions afresh). One test at a time, since replies stall on Windows with many
      # daemons at once in one process (GAPS: at 32 test threads 14 of 20 failed, 12 of them `Stalled`, and one
      # daemon's shard held a single poll 1277 ms; none fail one at a time).
      - name: Test the client binary and the async driver, one test at a time (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-client --test client --test driver -- --test-threads=1
      # The Shards form (§4.6, A-161, A-179) by the handle route: an in-process daemon duplicates the client end of the
      # attachment's named pipe into the test, which speaks FUSE through it in Shards' framing; hostile frames, a
      # destroy and a revocation each end the attachment; a second process is refused the pipe `ERROR_PIPE_BUSY`.
      # Windows' DAX window (plan G-shards-windows step 5): a descriptor ask naming a process that does not hold the
      # stream is refused `EACCES` with nothing put into it; a genuine one maps the section, stores, fsyncs, sees another
      # attachment's write and has its backing let go at the end; an untouched base file's section is refilled with the
      # host's edit. One test at a time, as the client binary's other daemon-per-test suites run here.
      - name: Test the Shards form over the handle route (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-client --test shards -- --test-threads=1
      # The WinFsp mount through the command (§4.6 "Windows"; G-mount step 2): a real anchor and daemon, `slates
      # mount VOLUME S:` served on the volume's owner shard through the real kernel FSD, Windows programs creating,
      # writing, reading, listing and deleting through the drive, `slates unmount`; then a change made through the SDK
      # seen by a cached read through a handle opened before it (the mount's `FspFileSystemNotify` rounds) and the
      # outcome of a mapped view after it printed (the DAX matrix's Windows mount-route cell). One test at a time: each
      # takes a free drive letter and a daemon. Gated by `SLATES_TEST_CLI=1` and `WINFSP_TEST_MOUNT=1`; WinFsp is
      # installed above, and the daemon finds its library at run time, as WinFsp's own `FspLoad` does.
      - name: The WinFsp mount through the CLI (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          SLATES_TEST_CLI: "1"
          WINFSP_TEST_MOUNT: "1"
        run: cargo test -p slates-cli --test winfsp -- --test-threads=1 --nocapture
      # `slates shards` on Windows (§4.6, A-181; G-shards-windows step 2): a real anchor and daemon, and the command
      # starting this test binary as a probe that holds the stream end as the handle `{handle}` named, mounts the
      # attachment over it and reads a file; the command exiting with its program; the attachment standing while the
      # command holds its copy and gone once the program exits; a killed command taking its program and the
      # attachment along through its job; the refusals. Gated by `SLATES_TEST_CLI=1`.
      - name: The Shards hand-off through the CLI (native Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          SLATES_TEST_CLI: "1"
        run: cargo test -p slates-cli --test shards -- --nocapture

  # D-20: instruction-count gates. callgrind counts are deterministic for a given binary, so
  # they see the one-percent change the wall clock cannot. valgrind is non-Rust tooling, admitted
  # for this lane by explicit authorization (2026-09-05); the runner version must equal the crate's.
  callgrind:
    name: instruction counts (iai-callgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: iai-callgrind-runner (the version pinned in Cargo.toml)
        run: cargo install iai-callgrind-runner --version 0.16.1 --locked
      - name: Lint the instrumented benchmarks
        run: cargo clippy -p slates-mem -p slates-rt -p slates-wire --bench callgrind --features slates-mem/instruction-counts,slates-rt/instruction-counts,slates-wire/instruction-counts -- -D warnings
      - name: Benches
        run: cargo bench --workspace --bench callgrind --features slates-mem/instruction-counts,slates-rt/instruction-counts,slates-wire/instruction-counts -- --save-summary=json
      # The gate (AUD-29-32): each benchmark's instruction count against the baseline committed for this
      # platform (xtask/callgrind-baseline.json). A regression past one percent, a benchmark with no baseline,
      # or a baseline with no benchmark fails; a failing run prints its counts for review and `--record`.
      - name: Instruction-count gate
        run: cargo xtask callgrind --iai target/iai

  # The cheap half of arm64 Windows: a cross lint from Linux on every push and pull request, paired
  # with the `windows-arm64` lane below that runs the code natively on main and the nightly. Same
  # split as `windows-lint` and `windows-nightly`, for the same reason — a compile break should fail
  # a pull request in a minute, not wait for a scarcer runner. It earns a lane
  # because exactly one file in the workspace is architecture-conditional —
  # `crates/wire/src/crc32c.rs`, whose aarch64 arm uses `is_aarch64_feature_detected!("crc")` and
  # the NEON CRC intrinsics — and because mem, rt and ipc carry the Win32 shared-memory, IOCP and
  # AFD code that no other arm64 target ever compiles. `pure-hash` keeps BLAKE3's C and NEON
  # sources out; that is the only C left in this graph, since the root's `default-features = false`
  # already keeps zstd out of `slates-machine`. vfs, cluster and server are deliberately absent:
  # they reach `slates-archive`, whose zstd needs a C toolchain for the target, and they hold no
  # architecture-conditional code, so the lane would cost a feature-graph change for no coverage.
  # Verified on Linux before it landed (2026-10-20): clean on a native `aarch64-unknown-linux-gnu`
  # container, cargo reporting 7.29 s for this invocation on six cores. The first attempt at that
  # verification is worth knowing about: `docker run rust:1.98.0` resolved to a cached image for a
  # different architecture and ran under emulation, so it checked the wrong one. Pass `--platform` when
  # the host is arm64, and read the platform warning rather than the exit code.
  cross-lint:
    name: ${{ matrix.target }} (cross lint, by compile)
    strategy:
      fail-fast: false
      matrix:
        # Every triple `release.yml` ships and `publish-node.yml` publishes that no lane ever compiled.
        # Three of the seven are covered by the hosts CI already runs on — x86_64 linux-gnu by ubuntu,
        # aarch64-apple-darwin by macos, x86_64 windows-msvc by `windows-lint`. The rest had no build
        # behind them at all, which for a declared release target means the first person to cut a tag
        # is the first to compile it. musl earns its square: a different libc under code that reaches
        # for `rustix` and `libc` on every syscall.
        #
        # Each target is paired with a host that can actually build it rather than assumed portable.
        include:
          - { target: aarch64-pc-windows-msvc, runner: ubuntu-latest }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Every crate that builds without a C toolchain for the target. The rest reach `slates-archive`
      # (zstd) or `rustls` (aws-lc-sys) and need one, so they are covered natively instead — Windows by
      # `windows-lint`, Linux and macOS by `gates`. Note what is *not* named: `slates-machine`. Naming it
      # would select it as a package, which enables its own `default = ["codecs"]` and pulls zstd back in;
      # as a dependency it inherits the workspace's `default-features = false` and stays C-free. That is
      # the same mechanism that compiled the ratio codec out of the container image
      # (docs/bugs/2026-10-20-the-ratio-codec-was-compiled-out-of-every-build.md), met from the other side.
      - name: Clippy the cross-buildable crates
        run: >-
          cargo clippy -p slates-wire -p slates-mem -p slates-rt -p slates-ipc
          -p slates-merge -p slates-db -p slates-wire-derive -p slates-test-seeds
          --all-targets --target ${{ matrix.target }}
          --features slates-machine/pure-hash -- -D warnings

  # The same square of the matrix, run rather than compiled. GitHub's `windows-11-arm` image went
  # generally available (actions/runner-images#14592) and is free for a public repository, which this
  # is, so arm64 Windows stopped being a platform we could only cross-compile for. That matters more
  # here than on most projects: arm64 has a weaker memory model than x86_64, and the rings, the
  # doorbell protocol and the parking protocol have never executed on a weak-ordering machine under
  # Windows — loom explores their interleavings and x86_64 Windows runs them, but no lane has ever
  # done both at once. The image carries what the build needs, checked against its manifest before
  # this landed: `Microsoft.VisualStudio.Component.VC.Tools.ARM64`, LLVM 22.1.8 with the clang-cl
  # components, rustup and clippy.
  #
  # Scoped at first to the five crates the cross-lint above proves compile for the target, so the one
  # new variable was native execution. Since 2026-10-26 (docs/wip/platforms.md) it also builds and runs
  # the daemon, the client, the NFS export and `slates shards`, none of which had ever run on arm64
  # Windows: they pull `aws-lc-sys`, whose builder refuses aarch64-pc-windows-msvc without clang-cl, so
  # the lane points the target's C compiler at the image's clang-cl first. That is how `cargo xwin` lints
  # them for this target, and they linted clean that way on 2026-10-26, every target of each. The SDKs
  # are still left out. On main and the nightly only, as `windows-nightly` is, so a first run
  # that finds something real does not block every pull request.
  #
  # Unlike every other lane added this week, this one could not be rehearsed before landing: there is
  # no arm64 Windows machine on this laptop or in this kiln, and jupiter — the one Windows box —
  # fails every command in its WSL bash relay. It is modelled step for step on `windows-nightly`,
  # which is proven.
  windows-arm64:
    name: aarch64 windows (native, by test)
    if: github.event_name != 'pull_request'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy natively on arm64 Windows
        run: >-
          cargo clippy -p slates-wire -p slates-mem -p slates-rt -p slates-ipc -p slates-machine
          --all-targets -- -D warnings
      - name: Test the Win32 shared memory (native arm64 Windows)
        run: cargo test -p slates-mem
      - name: Test the rings and the Event wake (native arm64 Windows)
        run: cargo test -p slates-ipc --test rings
      - name: Test the Win32 rendezvous (native arm64 Windows)
        run: cargo test -p slates-ipc --test rendezvous
      - name: Test the typed delivery (native arm64 Windows)
        run: cargo test -p slates-ipc --test delivery
      - name: Test the stream hand-off to a program (native arm64 Windows)
        run: cargo test -p slates-ipc --test stream_spawn
      - name: Test the IOCP driver's kick and no-op (native arm64 Windows)
        run: 'cargo test -p slates-rt --lib driver::'
      - name: Test the AFD readiness over loopback UDP (native arm64 Windows)
        run: cargo test -p slates-rt --test udp
      - name: Test the IOCP driver's pipe ends (native arm64 Windows)
        run: cargo test -p slates-rt --test pipe
      - name: Test TCP on the AFD reactor (native arm64 Windows)
        run: cargo test -p slates-rt --test tcp
      - name: Test a shard's lateness after a park (native arm64 Windows)
        run: cargo test -p slates-rt --test overrun
      - name: Test the shard CPU clock (native arm64 Windows)
        run: 'cargo test -p slates-rt --lib thread_clock::'
      - name: Test the wire codec and its CRC32C on arm64 hardware
        run: cargo test -p slates-wire
      # aws-lc-sys builds its C and its arm64 assembly with clang-cl on this target (its builder refuses cl.exe here);
      # the image carries LLVM with the clang-cl components. The target's C compiler is named for every later step.
      - name: clang-cl for the C the daemon links (native arm64 Windows)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          & $clang --version
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Clippy the daemon, the client and the MCP server natively on arm64 Windows
        if: ${{ !cancelled() }}
        run: >-
          cargo clippy -p slates-base -p slates-client -p slates-server -p slates-vfs -p slates-anchor
          -p slates-bridge-winfsp -p slates-mcp --all-targets -- -D warnings
      - name: Clippy the shipped binary and its Shards test natively on arm64 Windows
        if: ${{ !cancelled() }}
        run: cargo clippy -p slates-cli --bin slates --test shards -- -D warnings
      # The daemon on a weak memory model: an in-process daemon found through the rendezvous, its verbs over the rings,
      # the async driver; one test at a time, as on x86_64 (each daemon is sized from the whole machine).
      - name: Test the client binary and the async driver, one test at a time (native arm64 Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test -p slates-client --test client --test driver -- --test-threads=1
      - name: Test the Shards form over the handle route (native arm64 Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test -p slates-client --test shards -- --test-threads=1
      - name: Test the NFS server and the network export (native arm64 Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test -p slates-server --test nfs_hostile --test nfs_tls -- --test-threads=1
      - name: The Shards hand-off through the CLI (native arm64 Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          SLATES_TEST_CLI: "1"
        run: cargo test -p slates-cli --test shards -- --nocapture

  # Linux arm64, run natively (G-arm64-host): the same-kernel direct map, the FUSE mount's maps and the containers that
  # map through either, on GitHub's `ubuntu-24.04-arm` image, free for a public repository as `windows-11-arm` is. The
  # cross-lint above proves the arm64 Linux triples compile; nothing had ever run them, and arm64 is the weaker memory
  # model, under which the copy's atomic loads, the ring and the doorbell had never executed on Linux. The DAX matrix's
  # Linux arm64 cells (`docs/wip/virtiofs.md` §8) cite this lane. On main and the nightly only, as `windows-arm64` is,
  # so a first run that finds something real does not block every pull request. fuse3 and the operator's
  # user_allow_other are what the x86_64 lane's CLI flow has (the conformance lane installs fuse3 the same way).
  linux-arm64:
    name: aarch64 linux (native, by test)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: FUSE and the operator's grant (Linux arm64)
        run: |
          command -v fusermount3 >/dev/null || { sudo apt-get update && sudo apt-get install -y fuse3; }
          grep -qx user_allow_other /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf
          uname -m
          docker version --format 'docker {{.Server.Version}} {{.Server.Os}}/{{.Server.Arch}}' || true
      - name: The same-kernel direct map on arm64 (every client map test)
        run: cargo test -p slates-client --test client -- --test-threads=1 --nocapture map
      - name: The FUSE mount's maps and the containers on arm64 (the CLI flow's map tests)
        env:
          SLATES_TEST_CLI: "1"
        run: >-
          cargo test -p slates-cli --test cli -- --test-threads=1 --nocapture
          a_shared_map_through_a_mount_writes_back_and_follows_another_paths_change
          a_read_only_map_through_a_mount_follows_another_paths_change
          a_container_maps_a_file_through_the_bound_mount_and_follows_another_paths_change
          a_rootless_container_maps_a_file_through_the_mount_and_follows_another_paths_change
          a_container_maps_a_slates_file_by_the_direct_map_with_no_copy

  # Miri (the memory-model interpreter) and loom (the concurrency-permutation checker) run
  # on the unit tests of the crates that hold unsafe code. Miri ships only with the
  # nightly toolchain, which CI installs for this job alone; the pinned stable toolchain builds
  # everything else. loom runs under stable with `--cfg loom`.
  miri-and-loom:
    name: miri + loom (mem, rt, wire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      # AC-0.7 / T-0.3: every loom model in the workspace — the one-producer ring, the two contending
      # producers, the lapping producer, the handle core (a handle crossing threads against its slot's
      # reuse), the runtime's kick-if-parked protocol and the client/daemon doorbell protocol
      # (`slates-ipc` `doorbell.rs`, 2026-09-28) — under the bounds `slates_mem::loom_bounds`
      # carries in code (a preemption bound of 2 and a 224-branch cap, each Derived: there), so this
      # lane sets no environment variable and explores exactly what a laptop run explores. The models
      # print the interleavings they explored (`--nocapture`), so the log carries the numbers
      # `docs/wip/concurrency.md` records.
      - name: loom (every bounded interleaving of the rings, the handle core, the parking and doorbell protocols)
        run: RUSTFLAGS="--cfg loom" cargo test -p slates-mem -p slates-rt -p slates-ipc --lib --release loom -- --nocapture
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: "Miri (memory and wire: leak check on)"
        run: cargo +nightly miri test -p slates-mem -p slates-wire --lib
      # The runtime leaks its shard contexts, rings and registry entries on purpose (they live
      # for the process; the leak is what makes every reference to them a plain `&'static`), so
      # Miri's leak check is off for it; every other check stays on. The OS-driver tests are
      # marked ignored under Miri, which cannot model kqueue or eventfd.
      - name: "Miri (runtime: simulation tests, intentional leaks ignored)"
        run: MIRIFLAGS="-Zmiri-ignore-leaks" cargo +nightly miri test -p slates-rt --lib --test differential --test ownership --test timers --test readiness

  windows-nightly:
    name: windows (every push to main and nightly)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # AWS-LC's x86_64 Windows assembly is NASM source, built from source rather than taken prebuilt (Ada,
      # 2026-10-03, as ../mantle builds it); AWS_LC_SYS_PREBUILT_NASM=0 makes a missing NASM a build failure.
      - name: Install NASM
        uses: ilammy/setup-nasm@v1.5.2
      # `--workspace` cannot build on Windows: the NFS-mount and FUSE/FSKit crates (bridge-nfs, cli,
      # bridge-fuse, bridge-fskit) are macOS/Linux-only (Windows mounts through WinFsp, the fleet is
      # QUIC-over-UDP not NFS-over-TCP). Clippy and test the Windows-buildable crates — the same set the
      # `windows-lint` job covers, plus the WinFsp mount host, whose live mount needs WinFsp installed.
      - name: Install WinFsp
        run: |
          choco install winfsp -y --no-progress
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Clippy the Windows-buildable crates
        run: cargo clippy -p slates-mem -p slates-ipc -p slates-rt -p slates-base -p slates-client -p slates-server -p slates-vfs -p slates-machine -p slates-bridge-winfsp -p slates-sdk-node -p slates-sdk-python -p slates-anchor -p slates-mcp --all-targets -- -D warnings
      # The shipped Windows binary, linted without `--all-targets` and as a step of its own so its exit code
      # is checked on its own (the Windows shell is `pwsh`, where a native command failing mid-script does not
      # end the script — only the last line decides the step, which would mask this).
      #
      # The binary is what this lane was widened for: its Windows signal handling was compiled by nothing
      # until 2026-10-20. Its *other* targets are Unix by nature — the bin's own `cfg(test)` modules and the
      # `vfs_tails` example use inherited descriptors, `slates-bridge-nfs` and `slates-bridge-oci` — and
      # `--all-targets` pulled them in here, where they cannot compile. They are not left unlinted: the
      # ubuntu and macOS gates lint the whole workspace with `--all-targets`, which is where a Unix-only
      # target belongs. Narrowing keeps this lane about the Windows artifact.
      - name: Clippy the shipped Windows binary
        run: cargo clippy -p slates-cli -- -D warnings
      # The Win32 paths a native runner exercises, including the **full daemon lifecycle end to end**
      # (an in-process daemon a client reaches through the Win32 rendezvous, driving the whole verb set)
      # — no longer owed now that the rendezvous is proven; the cross-process anchor-restart path stays
      # macOS/Linux. WinFsp is installed above, so the live mount runs too.
      # One step per binary, each limited and run even after an earlier failure: see the same note on
      # the native Windows job (a hung binary is named by its step and cut with its log kept).
      - name: Test the Win32 shared memory (Windows, every push to main)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-mem
      - name: Test the rings and the Event wake (Windows, every push to main)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-ipc --test rings
      - name: Test the Win32 rendezvous (Windows, every push to main)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-ipc --test rendezvous
      - name: Test the consumer-capability delivery (Windows, every push to main)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-ipc --test delivery
      - name: Test the stream hand-off to a program (Windows, every push to main)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-ipc --test stream_spawn
      # The IOCP driver woken by the registry's kick, the one every sender uses: a parked shard that no
      # kick reached never ran a spawn or a shutdown (docs/bugs/2026-09-26-windows-shards-were-never-kicked.md).
      - name: Test the IOCP driver's kick and no-op (Windows, every push to main)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: 'cargo test -p slates-rt --lib driver::'
      - name: Test the AFD readiness over loopback UDP (Windows, every push to main)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-rt --test udp
      - name: Test the IOCP driver's pipe ends (Windows, every push to main)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-rt --test pipe
      - name: Test TCP on the AFD reactor (Windows, every push to main)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-rt --test tcp
      - name: Test the NFS server and the network export (Windows, every push to main)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test -p slates-server --test nfs_hostile --test nfs_tls -- --test-threads=1
      - name: Test a shard's lateness after a park (Windows, every push to main)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-rt --test overrun
      - name: Test the client binary and the async driver, one test at a time (Windows, every push to main)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-client --test client --test driver -- --test-threads=1
      - name: Test the Shards form over the handle route (Windows, every push to main)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-client --test shards -- --test-threads=1
      - name: Test the WinFsp mount through the CLI (Windows, every push to main)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          SLATES_TEST_CLI: "1"
          WINFSP_TEST_MOUNT: "1"
        run: cargo test -p slates-cli --test winfsp -- --test-threads=1 --nocapture
      - name: The Shards hand-off through the CLI (Windows, every push to main)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          SLATES_TEST_CLI: "1"
        run: cargo test -p slates-cli --test shards -- --nocapture

  # Part 6 "Conformance" and "Real workloads", example 8 "Hermeticity"; AC-9.7/T-9.1 (GAP-A9-15): the
  # suites the design names — pjdfstest, fsx, fsstress — plus the workload suite and the filesystem-write
  # tracer, over each runner's native transport, driven by the harness (`cargo xtask conformance`, record and
  # matrix in docs/wip/conformance.md). The three C suites are fetched from pinned upstream commits, verified
  # by SHA-256 and built with the system cc inside the runner's temp — not vendored (fsx is APSL 2.0 and
  # fsstress GPL-2.0; licences do not enter this MIT tree by a lane's hand) and not installed. They are the
  # only non-Rust tooling of this lane, and the design itself names them (Part 6). macOS runs the daemon's
  # NFS loopback mount as shipped (`slates mount`, no privilege); Linux reaches the same export through a root
  # `mount -t nfs` by the OS client, recorded LIMITED because no daemon transport serves the FUSE bridge yet;
  # the tracer is strace on Linux and `sudo fs_usage` on macOS. The daemon never runs as root (R10).
  # Records go to the runner's temp and are uploaded as artifacts; the tracked matrix is regenerated from
  # them deliberately (`cargo xtask conformance matrix --write`), never by CI, so a run's date cannot drift
  # the doc-truth test. A suite that does not meet its verdict fails the step after writing its record.
  conformance:
    name: conformance (pjdfstest, fsx, fsstress, workloads, hermeticity)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      # strace for the tracer; the NFS client for the root-mount adapter; fuse3 (fusermount3) for the FUSE
      # and container (`oci-linux`) transports; the workload tools the design names that the image lacks
      # (inotify-tools for the watcher, ripgrep, sqlite3, vim). Docker Engine ships with the image.
      - name: Suite tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y strace nfs-common fuse3 inotify-tools ripgrep sqlite3 vim
      # The container transport binds a FUSE mount shared with Docker's processes (`slates mount --shared`,
      # allow_other), which the host's operator grants (Ada authorized it on the CI runner, 2026-10-01;
      # AUD-29-67/74/78). Its hermeticity leg's tracer runs as root (`sudo strace -u runner`), because an
      # unprivileged tracer strips fusermount3's setuid.
      - name: Grant user_allow_other (Linux)
        if: runner.os == 'Linux'
        run: |
          grep -qx user_allow_other /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf
      # ripgrep for the rg workload and fswatch for the watcher; the rest ships with the image.
      - name: Suite tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep fswatch
      - name: Linux mount authority and traced startup regressions
        if: runner.os == 'Linux'
        run: |
          cargo build -p slates-cli
          SLATES_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/slates" cargo test -p xtask conformance:: -- --test-threads=1 --nocapture
      # The Linux kernel's own NFSv4.1 and NFSv4.2 clients against the daemon (§4.6 A-35): mount,
      # ordinary file calls through the mount, and an NFSv3 read-back of what the kernel wrote.
      - name: Linux kernel NFSv4.1/4.2 client
        if: runner.os == 'Linux'
        run: |
          SLATES_TEST_NFS4_KERNEL=1 cargo test -p slates-server --test nfs_v4_kernel -- --nocapture
          # The real anchor, the kernel's v4.2 client, a held open file and lock, and a SIGKILL of the
          # daemon: the descriptor must keep working and the lock keep binding (§4.6 A-37).
          SLATES_TEST_NFS4_KERNEL=1 cargo test -p slates-cli --test nfs_v4_restart -- --nocapture
      # The scratch and the records are in the build output (`target/`; A-50: never `/tmp`, never
      # `$RUNNER_TEMP`, never a RAM directory). `--keep` leaves the scratch in place so pjdfstest's per-file TAP output survives the run: the
      # expected-failure list's own header names this lane's root run as the review input, and the
      # summary record cannot say which assertion failed with what. The output directory is uploaded
      # below; the rest of the scratch (a cargo target, fsstress's tree) stays on the runner.
      # The cache restores the last run's `target/`, scratch included: every suite's own directory is
      # emptied before it runs (`Scratch::fresh`), and only the tool builds are reused.
      - name: Plan, then run every suite this runner can (each verdict gates the step; records kept)
        run: cargo xtask conformance all --records target/conformance-records --scratch target/conformance-scratch --keep
      - name: Upload the records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-records-${{ matrix.os }}
          path: target/conformance-records
      - name: Upload pjdfstest's per-file output (the expected-failure review input)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pjdfstest-output-${{ matrix.os }}
          path: target/conformance-scratch/*/pjdfstest-output
          if-no-files-found: ignore
      # The anchor logs: a daemon that stopped answering mid-suite (the macOS runner's fsstress run of
      # 2026-09-16) explains itself only there; the record carries their tail, the artifact the whole.
      - name: Upload the suites' anchor logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-anchor-logs-${{ matrix.os }}
          path: target/conformance-scratch/*/*.log
          if-no-files-found: ignore

  # Part 6 "Concurrency", nightly: shuttle's randomized schedules over the pure cores — T-1.6 (two
  # agents clone-and-write on one base through the store's owner) and T-6.7 (sixteen agents submit
  # with random overlaps to one green through its owner), each under a fixed seed and a schedule
  # budget that are Derived: constants in the test files, so a failing schedule replays from the seed
  # shuttle prints. shuttle is a dev-dependency built only under `--cfg shuttle`; nothing shipped
  # links it. It runs on every push to main and on the nightly schedule, as `windows-nightly` does.
  shuttle-nightly:
    name: shuttle (vfs clones, merge green; every push to main and nightly)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: shuttle (T-1.6 two agents on one base; T-6.7 sixteen agents on one green)
        run: RUSTFLAGS="--cfg shuttle" cargo test -p slates-vfs -p slates-merge --test shuttle_clones --test shuttle_green -- --nocapture

  # Part 6 "Concurrency", nightly: ThreadSanitizer over the crates whose tests run real threads against
  # shared state (mem, rt, ipc, client), with the standard library rebuilt instrumented. `cargo xtask tsan`
  # first requires a report from a deliberate race (`crates/mem/tests/race_canary.rs`), so a clean run
  # can never mean the instrumentation was missing; then any report fails the lane. The two tests it skips,
  # and why, are listed in `xtask/src/tsan.rs`. Ada authorized the lane 2026-10-03 (AUD-29-32).
  tsan-nightly:
    name: TSan (mem, rt, ipc, client; every push to main and nightly)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: TSan (the race canary must be reported; then the suites, any report fails)
        env:
          # ThreadSanitizer's 10-20x slowdown inflates the restart-detection publish window far past a native run, so
          # the slow-restart client test needs a larger scale than the plain Test lane (same reason; the invariant
          # publish << reply << recovery << reconnect holds at any scale). crates/client/tests/client.rs.
          #
          # Since 2026-10-20 this also scales START_WAIT, how long a client retries the rendezvous while a daemon
          # starts. That budget was a flat five seconds and read this knob not at all, so the lane declared itself
          # 25x slow and one of the two budgets that needed to hear it did not: run 39527867650 failed
          # a_client_maps_files_across_shards_and_always_gets_the_bytes with "the daemon did not answer the claim
          # within the claim wait" while that daemon was still starting (a shard took 15 753 us against 2 106 us
          # unloaded).
          SLATES_TEST_RESTART_SLOWDOWN: "25"
        run: cargo xtask tsan

  # The KIND fleet lane (docs/wip/kind-lane.md; docs/deploy.md; §4.8 "Deployment" and the WAN timing status
  # of 2026-09-14, which owed "the KIND lane over a real path"): the fleet on real Linux pods over a real
  # network, installed by the Helm chart. `cargo xtask kind all` drives every step and deletes the cluster
  # at the end: the image from the Dockerfile (release profile, distroless, non-root), a kind cluster of one
  # control plane and five workers (a node is a failure domain: one member per node), the chart at three
  # replicas with readiness from `slates status`, formation (every pod holds the same three members, both
  # peers probed, one council leader), a volume sealed on one pod placed at f + 1, the owner's pod deleted
  # with no grace as the SIGKILL takeover — the survivors retire it and the successor serves the volume —
  # the replacement pod rejoining by its DNS name at a new IP, the scale to five (f = 2) and back to three
  # (the configuration group's membership change), and the WAN profiles through a lane-only NET_ADMIN init
  # container running `tc netem` (80 ms ± 20 ms; the same with 1 % loss; the 350 ms handshake ceiling), each
  # pod's derived council timing checked against ⌈10 × tail / 100 ms⌉ and the leader's stability over a
  # three-minute window. kind, kubectl and helm are installed by their actions, pinned to the versions the
  # lane was validated with on 2026-09-14 — non-Rust tooling admitted for this lane by the charter that
  # commissioned it, as the conformance lane's suites are. A full run is tens of minutes (a cold release
  # build in Docker on the runner, six node containers, three shaped windows), so it runs on the push
  # cadence like the other long lanes; the chart's own gates run in `gates` on every pull request.
  kind:
    name: KIND fleet lane (chart, formation, takeover, scale, WAN profiles)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          install_only: true
      - name: The chart's gates (helm lint; the golden render)
        run: cargo test -p xtask --test helm_chart
      # AUD-29-75's kernel leg (§4.6 "Kubernetes publication without privilege"; Ada authorized its tooling on
      # 2026-10-01): kubelet mounts a published volume as an `nfs` PersistentVolume over the daemon's RFC 9289
      # RPC-with-TLS export. The node image adds Debian's ktls-utils (`tlshd`, the kernel's handshake agent);
      # the runner's kernel needs its TLS record layer and NFS client loaded, which kind's nodes share. The
      # leg runs on its own cluster, deleted at the end, and fails rather than skips on a kernel without TLS.
      - name: The kernel's TLS record layer and NFS client (for the export leg)
        run: sudo modprobe tls && sudo modprobe nfs && sudo modprobe nfsv4
      - name: The export leg (kubelet's nfs PersistentVolume over RPC-with-TLS)
        run: cargo xtask kind export --require-kernel-tls
      - name: The lane, end to end (the cluster is deleted at the end whatever happens)
        if: success() || failure()
        run: cargo xtask kind all
