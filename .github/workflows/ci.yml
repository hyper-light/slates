name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: fmt + clippy + structural + literals + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # slates has no inherited code, so the format gate is appropriate from day one
      # (Appendix B.1). A red-forever check is worse than no check: never let it rot.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (the lint wall)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # R1/R2 by construction: forbidden symbols, forbidden dependencies, and write-capable
      # syscalls outside the landing crate fail the build (AC-0.1).
      - name: Structural test
        run: cargo xtask structural
      # R3: every numeric literal in a tuning position carries its derivation (AC-0.2).
      - name: Literal check
        run: cargo xtask literals
      - name: Test
        run: cargo test --workspace
      # The ratchet skips loudly on a machine with no recorded baseline (shared runners have
      # none); on a reference machine with an entry in ratchets.toml it fails on a regression.
      - name: Ratchet
        run: cargo xtask ratchet

  # Every shipped crate must lint clean for every OS we build for, not only the runner's own:
  # the Linux drivers, the Windows driver and the Win32 facts are checked from one machine. The
  # C dependencies stay off here (no cross C toolchain); the profile says so in its notes.
  cross-lint:
    name: cross-target clippy (linux, windows, macos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0 # keep in sync with rust-toolchain.toml
          components: clippy
          targets: x86_64-pc-windows-msvc, aarch64-apple-darwin, x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Clippy per target
        run: |
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin; do
            cargo clippy -p slates-machine -p slates-mem -p slates-rt -p slates-wire --all-targets \
              --no-default-features --features slates-machine/pure-hash --target "$target" -- -D warnings
          done

  # AC-0.7: Miri on the unit tests of the crates that hold unsafe code. Miri ships only with the
  # nightly toolchain, which CI installs for this job alone; the pinned stable toolchain builds
  # everything else. loom runs under stable with `--cfg loom`.
  miri-and-loom:
    name: miri + loom (mem, rt, wire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: loom (every interleaving of the ring)
        run: RUSTFLAGS="--cfg loom" cargo test -p slates-mem --lib --release loom
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri
        run: cargo +nightly miri test -p slates-mem -p slates-wire --lib

  windows-nightly:
    name: windows (nightly cadence)
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
