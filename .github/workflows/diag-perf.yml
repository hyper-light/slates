name: diag-perf

# A-226's bounded-work siblings, judged on quiet runners (the development machines were at load 47 to 226 on
# 2026-11-06, where the probe test skips loudly): the shard-held probe test,
# `a_boot_give_back_holds_its_shard_no_longer_than_its_noise_floor`, over the sliced give-back (this commit's parent)
# and over the unsliced one (the give-back's sources as `.github/diag-perf-base` had them, the test kept), interleaved
# three times. macOS is run because the cost is macOS's (`madvise(MADV_FREE_REUSABLE)` over the range); Linux for the
# contrast. A diagnostics lane run only from `diag-perf-*` branches (never main).

on:
  push:
    branches: ["diag-perf-*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  give-back-probe:
    name: give-back probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Sliced and unsliced, interleaved
        shell: bash
        run: |
          base=$(cat .github/diag-perf-base)
          files="crates/server/src/daemon.rs crates/server/src/state.rs crates/vfs/src/checkpoint_log.rs crates/server/src/write_log.rs"
          mkdir -p "$RUNNER_TEMP/fix"
          for f in $files; do mkdir -p "$RUNNER_TEMP/fix/$(dirname $f)"; cp "$f" "$RUNNER_TEMP/fix/$f"; done
          uname -a; (nproc || sysctl -n hw.ncpu)
          for round in 1 2 3; do
            for arm in sliced unsliced; do
              if [ $arm = unsliced ]; then
                for f in $files; do git show "$base:$f" > "$f"; done
              else
                for f in $files; do cp "$RUNNER_TEMP/fix/$f" "$f"; done
              fi
              echo "== round $round arm [$arm] $(date -u +%FT%TZ) $(uptime)"
              cargo test -p slates-server --test recovery a_boot_give_back -- --nocapture 2>&1 \
                | grep -E 'probes:|longest probe|SKIPPED|^test |test result|panicked|waited'
            done
          done
