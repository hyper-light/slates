# DIAG (not for main): main's workspace tests on ubuntu with no fail-fast, so every failing test binary reports at once.
name: diag-integrator-tests
on:
  push:
    branches: ['diag-integrator-tests-*']
env:
  CARGO_TERM_COLOR: always
jobs:
  workspace-tests-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Test, every binary
        env:
          SLATES_FLEET_TRACE: "1"
          SLATES_TEST_HEDGE_STARVATION_SECS: "20"
          SLATES_TEST_RESTART_SLOWDOWN: "10"
          SLATES_TEST_FLEET_DEADLINE_SECS: "120"
        run: cargo test --workspace --no-fail-fast 2>&1 | tee target/workspace-tests.log
      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-tests-log
          path: target/workspace-tests.log
