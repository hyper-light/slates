# DIAG, not for main (g085): red-checks of A-185's Windows fixes, each mutation alone on windows-latest. Each job applies
# one patch and runs the tests that must turn red under it; the tree on the branch is the fixed one.
#   red-a: the engine's move check compares the ARCHIVE bit again.
#   red-b: the Windows seam's set_mode writes the attribute word whole (NORMAL or READONLY), as the 2026-10-26 WIP did.
#   red-c: the Windows target walk no longer asks whether the target's drive is the daemon's own (A-227).
#   red-d: the owner check compares the target's owner with the token's user alone, as the 2026-10-26 WIP did.
name: DIAG g085 red-checks (not for main)

on:
  push:
    branches: ["diag-red-g085-*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a
  DOWNLOAD_RETRIES: "20"
  DOWNLOAD_RETRY_SECONDS: "60"
  DOWNLOAD_TRY_SECONDS: "120"

jobs:
  red:
    name: ${{ matrix.mutation }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mutation: red-a
            tests: >-
              cargo test --locked -p slates-land --test os -- --test-threads=1
              a_file_whose_archive_bit_a_backup_cleared_is_replaced_by_a_landing
              a_file_a_landing_placed_is_replaced_by_the_next_landing
              a_landed_file_keeps_its_archive_bit_and_takes_read_only_from_its_mode
          - mutation: red-b
            tests: >-
              cargo test --locked -p slates-land --test os -- --test-threads=1
              a_file_whose_archive_bit_a_backup_cleared_is_replaced_by_a_landing
              a_file_a_landing_placed_is_replaced_by_the_next_landing
              a_landed_file_keeps_its_archive_bit_and_takes_read_only_from_its_mode
          - mutation: red-d
            tests: >-
              cargo test --locked -p slates-land --test os -- --test-threads=1
              a_file_whose_archive_bit_a_backup_cleared_is_replaced_by_a_landing
              a_file_a_landing_placed_is_replaced_by_the_next_landing
              a_landed_file_keeps_its_archive_bit_and_takes_read_only_from_its_mode
          - mutation: red-c
            winfsp: true
            tests: >-
              cargo test --locked -p slates-cli --test winfsp -- --test-threads=1 --nocapture
              a_landing_target_on_the_daemons_own_drive_is_refused_before_any_open
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - name: Install NASM
        uses: ilammy/setup-nasm@v1.5.2
      - name: Apply the mutation
        shell: bash
        run: |
          git apply --verbose ".github/diag-g085/${{ matrix.mutation }}.patch"
          git diff --stat
      - name: Install WinFsp
        id: winfsp
        if: ${{ matrix.winfsp }}
        timeout-minutes: 45
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi -MaximumRetryCount $env:DOWNLOAD_RETRIES -RetryIntervalSec $env:DOWNLOAD_RETRY_SECONDS -TimeoutSec $env:DOWNLOAD_TRY_SECONDS
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: The tests that must turn red (the step fails when they do)
        timeout-minutes: 60
        env:
          SLATES_TEST_CLI: "1"
          WINFSP_TEST_MOUNT: "1"
        run: ${{ matrix.tests }}
