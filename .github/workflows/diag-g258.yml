name: DIAG g258 -- the request channel's bound, and cut (c)'s no-wake variant over it, against main and a control (not for main)

# Audit plan step 7, continued (goal g258, 2026-11-18). diag-g258-1 found cut (c)'s no-wake variant stalled both Windows
# runners in its first run: the mount's request channel holds one request (REQUEST_BOUND = 1), so the call after an open
# waits in its post until the shard takes the posted confirmation, and with no wake it waited for good. On main that
# post waits for the shard's wake instead of the round cut (c) took off the worker's path.
# - red: at RED_HEAD (main with the channel test alone), the test must fail: the post waits.
# - live: at the bound fix (BOUND_HEAD) and at the no-wake variant over it (NOWAKE_HEAD): clippy -D warnings over
#   slates-bridge-winfsp's every target (--no-deps), the bridge's crate tests with the live WinFsp oracles, and the CLI's
#   live WinFsp mount and Win32 semantics suites.
# - ab: main (MAIN_HEAD: 69cd38b2 with the bench's create_security), a control (main's binary copied), the bound fix and
#   the no-wake variant over it, interleaved on one VM of each runner, quiet and loaded (two spinners a logical CPU), ten
#   runs, the list rotating each run, with windows-ab.sh's stall detector. A cut is called on its within-run differences
#   against main, beyond what the control shows; the no-wake variant also within each run against the bound fix.
# Derived: the live steps' bounds are CI's own for the same suites (ci.yml); the ab job's is diag-winfsp-overlap-51's
# 355 minutes, under the hosted runner's 360 (four arms of ten runs: about 2.6 h on x86_64 and 3.6 h on arm64 from
# diag-winfsp-overlap-51's three arms).

on:
  push:
    branches: ['diag-g258-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  MAIN_HEAD: f2a1eb258ef0e72877b458e73f2e64913f74d7dd
  RED_HEAD: ca6738e2909efbfa22824c080e48b28ee576756c
  BOUND_HEAD: bb09e307cdf13e2a3d63b91a8accfa08793ca5b4
  NOWAKE_HEAD: 685dd645937ce76a1811af8acc0bec517943593b
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a

jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
        arm: [BOUND_HEAD, NOWAKE_HEAD]
        include:
          - runner: windows-latest
            msvc: x64
          - runner: windows-11-arm
            msvc: arm64
    name: live at ${{ matrix.arm }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env[matrix.arm] }}
      - name: The results publisher
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'PUBLISH'
          #!/bin/bash
          # One commit per call on the results branch; a failed publish is reported and does not end the job.
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          cd "$GITHUB_WORKSPACE" || exit 0
          touch ab.txt live.txt clippy.txt
          ab=$(git hash-object -w ab.txt) || exit 0
          live=$(git hash-object -w live.txt) || exit 0
          lint=$(git hash-object -w clippy.txt) || exit 0
          tree=$(printf '100644 blob %s\tab.txt\n100644 blob %s\tclippy.txt\n100644 blob %s\tlive.txt\n' "$ab" "$lint" "$live" | git mktree) || exit 0
          parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID") || exit 0
          if git push origin "$commit:refs/heads/$RESULTS_BRANCH"; then
            echo "$commit" > "$RUNNER_TEMP/results-parent"
          else
            echo "::warning::could not publish the results"
          fi
          PUBLISH
          chmod +x "$RUNNER_TEMP/publish.sh"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (x86_64)
        if: matrix.msvc == 'x64'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64)
        if: matrix.msvc == 'arm64'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install WinFsp, pinned
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Clippy the touched crates on Windows
        shell: bash
        env:
          RESULTS_BRANCH: diag-results/g258-${{ github.run_id }}-live-${{ matrix.arm }}-${{ matrix.runner }}
        run: |
          set +e
          { echo "# clippy at $(git rev-parse HEAD)"
            cargo clippy --locked -p slates-bridge-winfsp --all-targets --no-deps -- -D warnings
            echo "## clippy bridge, exit $?"
          } 2>&1 | tee clippy.txt
          "$RUNNER_TEMP/publish.sh"
          grep -q '^## clippy bridge, exit 0$' clippy.txt
      - name: The live suites
        if: ${{ !cancelled() }}
        timeout-minutes: 55
        shell: bash
        env:
          RESULTS_BRANCH: diag-results/g258-${{ github.run_id }}-live-${{ matrix.arm }}-${{ matrix.runner }}
        run: |
          set +e
          {
            echo "# ${{ matrix.arm }} at $(git rev-parse HEAD)"
            WINFSP_TEST_MOUNT=1 cargo test --locked -p slates-bridge-winfsp --lib -- --test-threads=1 --nocapture
            echo "## bridge, exit $?"
            "$RUNNER_TEMP/publish.sh"
            SLATES_TEST_CLI=1 WINFSP_TEST_MOUNT=1 cargo test --locked -p slates-cli --test winfsp -- --test-threads=1 --nocapture
            echo "## cli winfsp, exit $?"
            "$RUNNER_TEMP/publish.sh"
            SLATES_TEST_CLI=1 WINFSP_TEST_MOUNT=1 cargo test --locked -p slates-cli --test winfsp_semantics -- --test-threads=1 --nocapture
            echo "## cli winfsp_semantics, exit $?"
          } 2>&1 | tee live.txt
          "$RUNNER_TEMP/publish.sh"
          grep -q 'an_opens_confirmation_does_not_hold_the_receive_worker ... ok' live.txt \
            && grep -q 'the_next_request_is_posted_while_a_confirmation_waits_untaken ... ok' live.txt \
            && grep -q 'a_crash_after_any_store_to_held_memory_loses_no_open_and_answers_every_request_once ... ok' live.txt \
            && grep -c '^## .*, exit 0$' live.txt | grep -qx 3
  red:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            msvc: x64
          - runner: windows-11-arm
            msvc: arm64
    name: red at main on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RED_HEAD }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (x86_64)
        if: matrix.msvc == 'x64'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64)
        if: matrix.msvc == 'arm64'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: The channel test at main's bound must fail
        timeout-minutes: 30
        shell: bash
        run: |
          set +e
          cargo test --locked -p slates-bridge-winfsp --lib channel:: -- --nocapture 2>&1 | tee red.txt
          code=${PIPESTATUS[0]}
          echo "## red, exit $code"
          grep -q 'the next request waited for the shard to take the confirmation' red.txt && [ "$code" -ne 0 ]
  ab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: bound-arm
            runner: windows-11-arm
            msvc: arm64
          - lane: bound-x86
            runner: windows-latest
            msvc: x64
    name: ${{ matrix.lane }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - name: The results publisher
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'PUBLISH'
          #!/bin/bash
          # One commit per call on the results branch; a failed publish is reported and does not end the job.
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          cd "$GITHUB_WORKSPACE" || exit 0
          touch ab.txt live.txt clippy.txt
          ab=$(git hash-object -w ab.txt) || exit 0
          live=$(git hash-object -w live.txt) || exit 0
          lint=$(git hash-object -w clippy.txt) || exit 0
          tree=$(printf '100644 blob %s\tab.txt\n100644 blob %s\tclippy.txt\n100644 blob %s\tlive.txt\n' "$ab" "$lint" "$live" | git mktree) || exit 0
          parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID") || exit 0
          if git push origin "$commit:refs/heads/$RESULTS_BRANCH"; then
            echo "$commit" > "$RUNNER_TEMP/results-parent"
          else
            echo "::warning::could not publish the results"
          fi
          PUBLISH
          chmod +x "$RUNNER_TEMP/publish.sh"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (x86_64)
        if: matrix.msvc == 'x64'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64)
        if: matrix.msvc == 'arm64'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install WinFsp, pinned
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "image $env:ImageOS $env:ImageVersion; $env:NUMBER_OF_PROCESSORS CPUs; $env:PROCESSOR_ARCHITECTURE $env:PROCESSOR_IDENTIFIER; WinFsp 2.1.25156" | Out-File -FilePath image.txt -Encoding utf8
      - name: Build every arm
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p slates-cli --example mount_bench
          mkdir -p ab-bin/main ab-bin/control ab-bin/bound ab-bin/nowake
          cp target/release/examples/mount_bench.exe ab-bin/mount_bench.exe
          for arm in main:MAIN_HEAD bound:BOUND_HEAD nowake:NOWAKE_HEAD; do
            name=${arm%%:*} ref=${arm#*:}
            commit=${!ref}
            git fetch --depth=1 origin "$commit"
            git worktree add --detach "$RUNNER_TEMP/$name" "$commit"
            (cd "$RUNNER_TEMP/$name" && env CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-$name" \
              cargo build --release --locked -p slates-cli --bin slates)
            cp "target-$name/release/slates.exe" "ab-bin/$name/slates.exe"
          done
          # The control: main's own binary, copied, so the arms main and control are identical code.
          cp ab-bin/main/slates.exe ab-bin/control/slates.exe
          sha256sum ab-bin/*/slates.exe ab-bin/mount_bench.exe | tee arms.txt
      - name: The interleaved mount benchmark
        shell: bash
        env:
          RESULTS_BRANCH: diag-results/g258-${{ github.run_id }}-${{ matrix.lane }}
        run: |
          {
            echo "# lane ${{ matrix.lane }}: arms main control bound nowake; MAIN_HEAD $MAIN_HEAD; BOUND_HEAD $BOUND_HEAD; NOWAKE_HEAD $NOWAKE_HEAD; bench at $(git rev-parse HEAD); $(date -u +%FT%TZ)"
            cat arms.txt
            tr -d '\r\000' < image.txt | sed 's/^\xef\xbb\xbf//'
            cmd //c ver | tr -d '\r' | grep -v '^$'
            ARMS="main=ab-bin/main/slates.exe control=ab-bin/control/slates.exe bound=ab-bin/bound/slates.exe nowake=ab-bin/nowake/slates.exe" \
              BENCH=ab-bin/mount_bench.exe RUNS=10 SPINNERS_PER_CPU=2 AFTER_RUN="$RUNNER_TEMP/publish.sh" \
              bash docs/wip/bench/fsbench/windows-ab.sh
          } 2>&1 | tee ab.txt
      - name: Publish whatever was measured
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/publish.sh" ]; then bash "$RUNNER_TEMP/publish.sh"; fi
        env:
          RESULTS_BRANCH: diag-results/g258-${{ github.run_id }}-${{ matrix.lane }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-${{ matrix.lane }}
          path: |
            ab.txt
            stall-dumps/
