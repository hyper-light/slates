name: DIAG g258 -- cut (b) in its median form, the per-kind spin choice, against main and a control (not for main)

# Audit plan step 7, continued (goal g258, 2026-11-18), cut (b) in its median form: each kind of request spins the
# window while at least half of its replies came within it, else parks at once. diag-g258-2's 2-competitive form parked
# kinds whose median reply the spin caught and lost a wake at their p50 on windows-latest (7 cells slower beyond the
# control, none faster, run 44273781244); this form parks only kinds whose median reply came past the window.
# - live: at the cut, clippy -D warnings over slates-bridge-winfsp's every target (--no-deps) and the bridge's crate
#   tests with the live WinFsp oracles (the cut's own spin-choice and wait tests among them).
# - ab: main (MAIN_HEAD: 69cd38b2 with the bench's create_security), a control (main's binary copied) and the cut
#   (CUT_HEAD), interleaved on one VM of each runner, quiet and loaded (two spinners a logical CPU), ten runs, the list
#   rotating each run, with windows-ab.sh's stall detector. A cut is called on its within-run differences against main,
#   beyond what the control shows against main.
# Derived: the live steps' bounds are CI's own for the same suites (ci.yml); the ab job's is diag-winfsp-overlap-51's
# for ten runs of three arms (355 minutes), under the hosted runner's 360.

on:
  push:
    branches: ['diag-g258-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  MAIN_HEAD: f2a1eb258ef0e72877b458e73f2e64913f74d7dd
  CUT_HEAD: 1e9afce62a14706d6abe65526cd63410afe22036
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a

jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
        include:
          - runner: windows-latest
            msvc: x64
          - runner: windows-11-arm
            msvc: arm64
    name: live at the cut on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - name: The results publisher
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'PUBLISH'
          #!/bin/bash
          # One commit per call on the results branch; a failed publish is reported and does not end the job.
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          cd "$GITHUB_WORKSPACE" || exit 0
          touch ab.txt live.txt clippy.txt
          ab=$(git hash-object -w ab.txt) || exit 0
          live=$(git hash-object -w live.txt) || exit 0
          lint=$(git hash-object -w clippy.txt) || exit 0
          tree=$(printf '100644 blob %s\tab.txt\n100644 blob %s\tclippy.txt\n100644 blob %s\tlive.txt\n' "$ab" "$lint" "$live" | git mktree) || exit 0
          parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID") || exit 0
          if git push origin "$commit:refs/heads/$RESULTS_BRANCH"; then
            echo "$commit" > "$RUNNER_TEMP/results-parent"
          else
            echo "::warning::could not publish the results"
          fi
          PUBLISH
          chmod +x "$RUNNER_TEMP/publish.sh"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (x86_64)
        if: matrix.msvc == 'x64'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64)
        if: matrix.msvc == 'arm64'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install WinFsp, pinned
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Clippy the touched crates on Windows
        shell: bash
        env:
          RESULTS_BRANCH: diag-results/g258-${{ github.run_id }}-live-${{ matrix.runner }}
        run: |
          set +e
          { echo "# clippy at $(git rev-parse HEAD)"
            cargo clippy --locked -p slates-bridge-winfsp --all-targets --no-deps -- -D warnings
            echo "## clippy bridge, exit $?"
            cargo clippy --locked -p slates-cli --example mount_bench --no-deps -- -D warnings
            echo "## clippy bench, exit $?"
          } 2>&1 | tee clippy.txt
          "$RUNNER_TEMP/publish.sh"
          grep -c '^## clippy .*, exit 0$' clippy.txt | grep -qx 2
      - name: The live suites
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: bash
        env:
          RESULTS_BRANCH: diag-results/g258-${{ github.run_id }}-live-${{ matrix.runner }}
        run: |
          set +e
          {
            echo "# cut (b), its median form, at $(git rev-parse HEAD)"
            WINFSP_TEST_MOUNT=1 cargo test --locked -p slates-bridge-winfsp --lib -- --test-threads=1 --nocapture
            echo "## bridge, exit $?"
          } 2>&1 | tee live.txt
          "$RUNNER_TEMP/publish.sh"
          grep -q 'a_kind_whose_replies_came_late_is_waited_for_parked_at_once ... ok' live.txt \
            && grep -q 'the_choice_is_the_median_rule_over_each_kinds_replies ... ok' live.txt \
            && grep -q '^## bridge, exit 0$' live.txt
  ab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: median-arm
            runner: windows-11-arm
            msvc: arm64
          - lane: median-x86
            runner: windows-latest
            msvc: x64
    name: ${{ matrix.lane }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - name: The results publisher
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'PUBLISH'
          #!/bin/bash
          # One commit per call on the results branch; a failed publish is reported and does not end the job.
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          cd "$GITHUB_WORKSPACE" || exit 0
          touch ab.txt live.txt clippy.txt
          ab=$(git hash-object -w ab.txt) || exit 0
          live=$(git hash-object -w live.txt) || exit 0
          lint=$(git hash-object -w clippy.txt) || exit 0
          tree=$(printf '100644 blob %s\tab.txt\n100644 blob %s\tclippy.txt\n100644 blob %s\tlive.txt\n' "$ab" "$lint" "$live" | git mktree) || exit 0
          parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID") || exit 0
          if git push origin "$commit:refs/heads/$RESULTS_BRANCH"; then
            echo "$commit" > "$RUNNER_TEMP/results-parent"
          else
            echo "::warning::could not publish the results"
          fi
          PUBLISH
          chmod +x "$RUNNER_TEMP/publish.sh"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (x86_64)
        if: matrix.msvc == 'x64'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64)
        if: matrix.msvc == 'arm64'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install WinFsp, pinned
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "image $env:ImageOS $env:ImageVersion; $env:NUMBER_OF_PROCESSORS CPUs; $env:PROCESSOR_ARCHITECTURE $env:PROCESSOR_IDENTIFIER; WinFsp 2.1.25156" | Out-File -FilePath image.txt -Encoding utf8
      - name: Build every arm
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p slates-cli --example mount_bench
          mkdir -p ab-bin/main ab-bin/control ab-bin/median
          cp target/release/examples/mount_bench.exe ab-bin/mount_bench.exe
          for arm in main:MAIN_HEAD median:CUT_HEAD; do
            name=${arm%%:*} ref=${arm#*:}
            commit=${!ref}
            git fetch --depth=1 origin "$commit"
            git worktree add --detach "$RUNNER_TEMP/$name" "$commit"
            (cd "$RUNNER_TEMP/$name" && env CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-$name" \
              cargo build --release --locked -p slates-cli --bin slates)
            cp "target-$name/release/slates.exe" "ab-bin/$name/slates.exe"
          done
          # The control: main's own binary, copied, so the arms main and control are identical code.
          cp ab-bin/main/slates.exe ab-bin/control/slates.exe
          sha256sum ab-bin/*/slates.exe ab-bin/mount_bench.exe | tee arms.txt
      - name: The interleaved mount benchmark
        shell: bash
        env:
          RESULTS_BRANCH: diag-results/g258-${{ github.run_id }}-${{ matrix.lane }}
        run: |
          {
            echo "# lane ${{ matrix.lane }}: arms main control median; MAIN_HEAD $MAIN_HEAD; CUT_HEAD $CUT_HEAD; bench at $(git rev-parse HEAD); $(date -u +%FT%TZ)"
            cat arms.txt
            tr -d '\r\000' < image.txt | sed 's/^\xef\xbb\xbf//'
            cmd //c ver | tr -d '\r' | grep -v '^$'
            ARMS="main=ab-bin/main/slates.exe control=ab-bin/control/slates.exe median=ab-bin/median/slates.exe" \
              BENCH=ab-bin/mount_bench.exe RUNS=10 SPINNERS_PER_CPU=2 AFTER_RUN="$RUNNER_TEMP/publish.sh" \
              bash docs/wip/bench/fsbench/windows-ab.sh
          } 2>&1 | tee ab.txt
      - name: Publish whatever was measured
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/publish.sh" ]; then bash "$RUNNER_TEMP/publish.sh"; fi
        env:
          RESULTS_BRANCH: diag-results/g258-${{ github.run_id }}-${{ matrix.lane }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-${{ matrix.lane }}
          path: |
            ab.txt
            stall-dumps/
