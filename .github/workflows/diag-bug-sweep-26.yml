name: DIAG bug-sweep 26, ShardTime and the anchor start judgment asking the scheduler, on every CI platform (not for main)

# A diagnostics branch, never merged. an_observation_of_a_starved_shard_is_answered (ShardTime asks the scheduler before
# it gives up) and a_start_held_off_its_cpus_is_starved_not_stuck (the anchor's start judgment asks whether any thread of
# the start is runnable), with slates_rt's process_runnable reader on each platform. The liveness suite and the anchor
# test three times each, rt's thread clock tests once; results pushed to diag-results/bug-sweep-26-<os>.

on:
  push:
    branches: [diag-bug-sweep-26]

permissions:
  contents: write

jobs:
  liveness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build
        run: |
          mkdir -p out
          features=""
          if [ "$RUNNER_OS" = Windows ]; then features="--no-default-features --features slates-machine/pure-hash"; fi
          echo "$features" > out/features
          cargo test -q -p slates-server --test liveness $features --no-run 2>&1 | tail -3
          cargo test -q -p slates-cli --bins $features --no-run 2>&1 | tail -3
          cargo test -q -p slates-rt --lib --no-run 2>&1 | tail -3
      - id: runs
        name: The liveness suite and the anchor test three times, the thread clock once
        run: |
          features=$(cat out/features)
          failed=0
          for run in 1 2 3; do
            cargo test -q -p slates-server --test liveness $features -- --nocapture > "out/liveness-$run.log" 2>&1 || failed=1
            cargo test -q -p slates-cli --bins $features -- --nocapture anchor::tests > "out/anchor-$run.log" 2>&1 || failed=1
          done
          cargo test -q -p slates-rt --lib thread_clock > out/thread-clock.log 2>&1 || failed=1
          exit $failed
      - name: Publish the results
        if: always()
        run: |
          {
            echo "run ${{ github.run_id }} commit ${{ github.sha }} ${{ matrix.os }} runs=${{ steps.runs.outcome }}"
            for log in out/*.log; do
              echo "== $log"
              grep -aE '^test result|\.\.\. FAILED|panicked at|starved shard:|spinning shard:|withheld the beat|did not starve|never stopped|beat stopped for|observation of a starved|given up on|a start held off|judged stuck' "$log" | cut -c1-400 | head -40
            done
          } > summary.txt
          git config user.name diag && git config user.email diag@invalid
          git checkout -q --orphan results && git rm -rfq . && git add summary.txt && git commit -qm "diag-bug-sweep-26 ${{ matrix.os }} results"
          git push -q origin "HEAD:refs/heads/diag-results/bug-sweep-26-${{ matrix.os }}"
