name: DIAG WSL2 virtio-fs file sharing and DAX (not for main)

# A diagnostics branch, never merged. WSL2 now shares Windows' drives over virtio-fs when `.wslconfig` asks
# (`[wsl2] virtiofs=true`); the DAX matrix's WSL2 row measured only the default 9P (diagnostics run 40585743122).
# This turns virtio-fs on, boots a distribution, and reads how the guest mounts the drive, what the kernel says of a
# DAX cache window, and whether a virtio-fs mount with dax=always is accepted. The probe is a script file
# (ci/diag/wsl2-probe.sh): run 41133554543's inline form lost its quoting to PowerShell and never ran.

on:
  push:
    branches: [diag-wsl2-virtiofs]

jobs:
  wsl2:
    name: WSL2 virtio-fs on windows-2025
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: WSL as installed
        shell: pwsh
        continue-on-error: true
        run: |
          wsl --version
          wsl --status
      - name: Ask for virtio-fs
        shell: pwsh
        run: |
          "[wsl2]`nvirtiofs=true" | Out-File -FilePath "$env:USERPROFILE\.wslconfig" -Encoding ascii
          Get-Content "$env:USERPROFILE\.wslconfig"
          wsl --shutdown
      - name: A distribution, without a user
        shell: pwsh
        continue-on-error: true
        run: |
          wsl --install --no-launch --distribution Ubuntu-24.04 --web-download
          wsl --list --verbose
      - name: How the guest sees Windows' drive, and DAX (a script file, run inside the distribution)
        shell: pwsh
        continue-on-error: true
        run: |
          # The checkout may carry Windows line ends; the distribution's shell reads the script without them.
          wsl --distribution Ubuntu-24.04 --user root --cd "$env:GITHUB_WORKSPACE" -- sh -c "tr -d '\r' < ci/diag/wsl2-probe.sh | sh"
