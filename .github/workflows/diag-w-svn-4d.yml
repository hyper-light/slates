# Diag for A-760 (b) 4c+4d (main's order of 2026-11-23 18:39): the FUSE park (Linux) and the WinFsp park (Windows),
# which no macOS gate compiles, built, linted and tested on their own platforms. Runs on diag-measurer-w-svn-* branches
# only; never on main. Setup steps copied from ci.yml (`gates` on ubuntu, `windows-lint` with its WinFsp install).
name: diag w-svn 4d

on:
  push:
    branches: ["diag-measurer-w-svn-*"]

env:
  CARGO_TERM_COLOR: always
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a
  DOWNLOAD_RETRIES: "20"
  DOWNLOAD_RETRY_SECONDS: "60"
  DOWNLOAD_TRY_SECONDS: "120"

jobs:
  linux:
    name: FUSE park (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Grant user_allow_other (Linux)
        run: |
          grep -qx user_allow_other /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf
      - name: Clippy the touched crates
        run: cargo clippy -p slates-merge -p slates-vcs -p slates-bridge-fuse -p slates-server --all-targets -- -D warnings
      - name: bridge-fuse (dispatch_kept, Dispatched::into_request)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: cargo test -p slates-bridge-fuse
      - name: The server's FUSE mount tests, and 4d's reads and parks
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        run: cargo test -p slates-server --lib -- fuse:: named_objects a_work_over_a_subversion_green a_mount_read_of_a_named_text_let_go a_daemon_stopped_with_a_landing_turn_held

  windows:
    name: WinFsp park (windows)
    runs-on: windows-latest
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM
        uses: ilammy/setup-nasm@v1.5.2
      - name: Install WinFsp
        id: winfsp
        timeout-minutes: 45
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          try {
            Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi -MaximumRetryCount $env:DOWNLOAD_RETRIES -RetryIntervalSec $env:DOWNLOAD_RETRY_SECONDS -TimeoutSec $env:DOWNLOAD_TRY_SECONDS
          } catch {
            throw "WinFsp's installer could not be downloaded from $env:WINFSP_MSI_URL after $env:DOWNLOAD_RETRIES retries ($($_.Exception.Message)). The job stops here: the steps after this one need WinFsp."
          }
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          New-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\WinFsp' -Name MountUseMountmgrFromFSD -Value 1 -PropertyType DWord -Force | Out-Null
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Clippy the touched crates (native Windows)
        run: cargo clippy -p slates-merge -p slates-vcs -p slates-bridge-winfsp -p slates-server --all-targets -- -D warnings
      - name: bridge-winfsp (Request::kept, refuse_io)
        if: ${{ !cancelled() && steps.winfsp.outcome == 'success' }}
        timeout-minutes: 30
        run: cargo test -p slates-bridge-winfsp --lib -- --test-threads=1 --nocapture
      - name: The server's WinFsp mount tests, and 4d's reads and parks
        if: ${{ !cancelled() && steps.winfsp.outcome == 'success' }}
        timeout-minutes: 60
        run: cargo test -p slates-server --lib -- winfsp:: named_objects a_work_over_a_subversion_green a_mount_read_of_a_named_text_let_go a_daemon_stopped_with_a_landing_turn_held
