name: diag-a197-qemu
# Diagnostics for A-197 (Step 6.4), never main: every test of tests/guest_image.rs in QEMU, three runs, the three
# hostile-guest tests over a handed copy among them (a write past the image's end, a flush storm, a kill mid-store).
on:
  push:
    branches: ['diag-a197-qemu-*']
jobs:
  qemu-image:
    name: guest_image in QEMU, the hostile guests over a handed copy (A-197)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Open KVM to the job
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm || echo "no /dev/kvm: the guest runs under software emulation"
      - name: Build the guest image
        run: docker build -t slates-guest ci/guest
      - name: Every image test in QEMU, three runs
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --device /dev/fuse --cap-add SYS_ADMIN \
            $( [ -e /dev/kvm ] && echo --device /dev/kvm ) \
            -v "$PWD":/src -w /src slates-guest sh -c \
            'set -e; host=$(rustc -vV | sed -n "s/^host: //p"); \
             RUSTFLAGS="-C target-feature=+crt-static" cargo build --release -p slates-guest-probe \
               --bin slates-guest-probe --target "$host" --target-dir target/probe; \
             uname -r; \
             for n in 1 2 3; do echo "=== run $n"; \
             SLATES_GUEST_QEMU=$(ls /usr/bin/qemu-system-x86_64 /usr/bin/qemu-system-aarch64 2>/dev/null | head -1) \
             SLATES_GUEST_KERNEL=/guest/vmlinuz \
             SLATES_GUEST_MODULES="/lib/modules/$(ls /lib/modules | head -1)" \
             SLATES_GUEST_PROBE="/src/target/probe/$host/release/slates-guest-probe" \
             cargo test -p slates-cli --test guest_image -- --nocapture --test-threads=1; done' 2>&1 | tee guest-image.log
          if grep -q "SKIP" guest-image.log; then echo "an image test was skipped"; exit 1; fi
          grep -E "^=== run|test result|sweep had|stored and synced|compare-back at the VM|launcher's sync wrote|wrote 65536|panicked" guest-image.log
          test "$(grep -c 'test result: ok. 7 passed' guest-image.log)" = 3
