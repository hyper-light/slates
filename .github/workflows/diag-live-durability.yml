name: diag-live-durability

# Diagnostics only, never on main (A-200, item 2: the dispatch round's latency). The live stable-write bench in
# release with temporary per-hop counters (owner shard to control shard, session borrow, exchange, control back to
# owner, the whole round), quiet and with two spinning shell loops per CPU, three rounds each, alternating, on both
# Linux arches. Results go to diag-results/live-durability-3-<os> by git push, costing no API quota.
on:
  push:
    branches: ["diag-live-durability-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SLATES_TEST_CLI: "1"
  SLATES_TEST_MEASURE: "1"

jobs:
  linux:
    name: A-200 dispatch hops (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --locked -p slates-cli --bin slates --test live_fleet
      - name: The bench, quiet and busy, three rounds each
        run: |
          R=../results.txt
          cpus=$(nproc)
          echo "runner ${{ matrix.os }}, $cpus CPUs, $(date -u), tree $(git rev-parse HEAD)" > $R
          for round in 1 2 3; do
            for cond in quiet busy; do
              pids=""
              if [ $cond = busy ]; then
                for i in $(seq 1 $((cpus * 2))); do ( while :; do :; done ) & pids="$pids $!"; done
              fi
              echo "== $cond round $round at $(date -u +%H:%M:%S), load $(cut -d' ' -f1-3 /proc/loadavg)" | tee -a $R
              status=0
              timeout 1500 cargo test --release --locked -p slates-cli --test live_fleet measure_what_live_shipping -- --nocapture > ../run.log 2>&1 || status=$?
              for p in $pids; do kill "$p" 2>/dev/null || true; done
              wait 2>/dev/null || true
              grep -E '^measure|^  (plain|live|added)|^hop |panicked|test result' ../run.log | cut -c1-600 | tee -a $R
              echo "== $cond round $round exit $status" | tee -a $R
            done
          done
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-3-${{ matrix.os }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-live-durability-3 results, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"
