name: diag-live-durability

# Diagnostics only, never on main (A-200): a holder back from a stop is installed from a fresh image. Test-only (red
# expected) against the fix, on a58edde8, the same diag-only timing lines on both. The new flow x5, then the rolling
# partition x30, per leg per arch. Results to diag-results/live-durability-57-<leg>.
on:
  push:
    branches: ["diag-live-durability-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  SLATES_TEST_CLI: "1"

jobs:
  check:
    name: partition (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: red-x86, os: ubuntu-latest, ref: e29caf36ea48bb7373895aeef75c081d3d010c05 }
          - { leg: fix-x86, os: ubuntu-latest, ref: 71b7eb0b492fded744bc94562b9ec238d20e0d7d }
          - { leg: red-arm, os: ubuntu-24.04-arm, ref: e29caf36ea48bb7373895aeef75c081d3d010c05 }
          - { leg: fix-arm, os: ubuntu-24.04-arm, ref: 71b7eb0b492fded744bc94562b9ec238d20e0d7d }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: The runs
        shell: bash {0}
        run: |
          R=../results.txt
          echo "leg ${{ matrix.leg }}, $(nproc) CPUs, $(date -u), tree $(git rev-parse HEAD)" > $R
          timeout 1800 cargo build --release --locked -p slates-cli --bin slates --test live_chaos --test live_fleet > ../build.log 2>&1; status=$?
          echo "== release build exit $status" >> $R
          [ $status -ne 0 ] && grep -E '^error' -A8 ../build.log | head -40 >> $R
          for run in 1 2 3 4 5; do
            timeout 600 cargo test --release --locked -p slates-cli --test live_fleet -- --nocapture --test-threads=1 --exact a_holder_back_from_a_stop_takes_one_install > ../run.log 2>&1; status=$?
            grep -E '^live one install:|panicked|takes one install' ../run.log | cut -c1-300 >> $R || true
            echo "== flow $run exit $status" >> $R
          done
          for run in $(seq 1 30); do
            timeout 900 cargo test --release --locked -p slates-cli --test live_chaos -- --nocapture --test-threads=1 --exact candidates_partitioned_in_turn_mid_stream_lose_nothing > ../run.log 2>&1; status=$?
            grep -E '^  [0-9]+ writes|violations|panicked' ../run.log | grep -v '^chaos' | sort -u | cut -c1-260 | sed "s/^/   r$run /" >> $R || true
            grep -E '^LD-RESUME|^LD-DIAL|^LD-SERVE' ../run.log | cut -c1-200 | sed "s/^/   r$run /" >> $R || true
            echo "== partition $run exit $status" >> $R
          done
          exit 0
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-57-${{ matrix.leg }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-live-durability-57 results, ${{ matrix.leg }}"
          git push -q origin "HEAD:refs/heads/$branch"
