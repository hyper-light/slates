name: diag-live-durability

# Diagnostics only, never on main (A-200, item 2): the merged stack (straggler-2 @ 55db932b): slates-db's live model and
# the rolling partition five times (release), both Linux arches. Results to diag-results/live-durability-31-<os>.
on:
  push:
    branches: ["diag-live-durability-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SLATES_TEST_CLI: "1"

jobs:
  check:
    name: stack (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: The runs
        run: |
          R=../results.txt
          echo "runner ${{ matrix.os }}, $(nproc) CPUs, $(date -u), tree $(git rev-parse HEAD)" > $R
          status=0
          timeout 1800 cargo test --locked -p slates-db --test live > ../run.log 2>&1 || status=$?
          grep -E '^test .* FAILED|test result' ../run.log >> $R
          echo "== db live exit $status" >> $R
          cargo build --release --locked -p slates-cli --bin slates --test live_chaos
          for run in $(seq 1 5); do
            status=0
            timeout 900 cargo test --release --locked -p slates-cli --test live_chaos -- --nocapture --test-threads=1 --exact candidates_partitioned_in_turn_mid_stream_lose_nothing > ../run.log 2>&1 || status=$?
            grep -E '^  [0-9]+ writes|violations|refused the owner' ../run.log | grep -v '^chaos' | cut -c1-250 >> $R
            echo "== partition $run exit $status" >> $R
          done
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-31-${{ matrix.os }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-live-durability-31 results, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"
