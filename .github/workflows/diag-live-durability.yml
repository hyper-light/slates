name: diag-live-durability

# Diagnostics only, never on main (A-200, item 2): raft-chaos's a_live_entry_past_one_chunk_is_taken_over_whole (one
# 1.5 MiB write then two small ones; on main a candidate stayed at head 1 with 1,039 unanswered) five times on the item-2
# head (lanes keep the size-derived exchange budget), release, both Linux arches. Results to
# diag-results/live-durability-15-<os> by git push.
on:
  push:
    branches: ["diag-live-durability-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SLATES_TEST_CLI: "1"
  SLATES_TEST_MEASURE: "1"

jobs:
  partition:
    name: A-200 one-chunk-past entry x5 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p slates-cli --bin slates --test live_chaos
      - name: The rolling partition flow, ten runs
        env:
          SLATES_CHAOS_PRINT_SLOW: "1"
        run: |
          R=../results.txt
          echo "runner ${{ matrix.os }}, $(nproc) CPUs, $(date -u), head $(git rev-parse HEAD)" > $R
          for run in $(seq 1 5); do
            echo "== run $run at $(date -u +%H:%M:%S), load $(cut -d' ' -f1-3 /proc/loadavg)" | tee -a $R
            status=0
            timeout 600 cargo test --release --locked -p slates-cli --test live_chaos -- --nocapture --test-threads=1 --exact a_live_entry_past_one_chunk_is_taken_over_whole > ../run.log 2>&1 || status=$?
            grep -vE 'watchdog beats every|initialized in|^\s*$|Compiling|Finished|Running' ../run.log | cut -c1-900 | tail -400 >> $R
            echo "== run $run exit $status" | tee -a $R
          done
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-15-${{ matrix.os }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-live-durability-15 results, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"
