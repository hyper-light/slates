name: diag-live-durability

# Diagnostics only, never on main (A-200, item 2): the landable branch's three tests (stop in turn, catalog, both stopped)
# five runs each on three trees: R main 4326a9d8 with the tests, U the series without the lane-ended fix, G the series
# with it. Release, both Linux arches. Results to diag-results/live-durability-24-<tree>-<os> by git push.
on:
  push:
    branches: ["diag-live-durability-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SLATES_TEST_CLI: "1"

jobs:
  steps:
    name: landable steps (${{ matrix.tree.name }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        tree:
          - { name: R, sha: 01a4afbf33fe2c2f847eab1067bfd933b7ad406e }
          - { name: U, sha: 2ee186e941e198c265b5f0d71d2576045c876d6f }
          - { name: G, sha: 3c06de44991d8dcc065f5cba8ce70fb287ab02fd }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Build the tree
        run: |
          git worktree add ../tree "${{ matrix.tree.sha }}"
          cd ../tree && cargo build --release --locked -p slates-cli --bin slates --test live_fleet
      - name: The three tests, five runs each
        run: |
          R=../results.txt
          echo "runner ${{ matrix.os }}, $(nproc) CPUs, $(date -u), tree ${{ matrix.tree.name }} ${{ matrix.tree.sha }}" > $R
          cd ../tree
          for run in $(seq 1 5); do
            echo "== run $run at $(date -u +%H:%M:%S), load $(cut -d' ' -f1-3 /proc/loadavg)" | tee -a ../results.txt
            for t in both_candidates_stopped_draw_no_storm_of_sends each_candidate_stopped_in_turn_holds_no_write_and_catches_up a_new_live_volumes_first_writes_go_only_to_candidates_holding_its_catalog; do
              status=0
              timeout 600 cargo test --release --locked -p slates-cli --test live_fleet -- --nocapture --test-threads=1 --exact $t > ../run.log 2>&1 || status=$?
              grep -E '^live turns|^live catalog|^live storm|no write waits|each resumed|no entry sent|unanswered sends|test result' ../run.log | sed -E 's/; then .*//' | cut -c1-400 >> ../results.txt
              echo "== run $run $t exit $status" >> ../results.txt
            done
          done
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-24-${{ matrix.tree.name }}-${{ matrix.os }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-live-durability-24 results, ${{ matrix.tree.name }}, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"
