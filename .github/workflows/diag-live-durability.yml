name: diag-live-durability

# Diagnostics only, never on main (§4.8): the council's voter change after a candidate's node is replaced, timed from
# the replacement answering to the joint entered and closed, quiet and loaded, x8 each, on main 80be552a.
# Results to diag-results/live-durability-71-<os>.
on:
  push:
    branches: ["diag-live-durability-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  SLATES_TEST_CLI: "1"

jobs:
  check:
    name: joint-window (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 98cad8616984086eec974bc22279471d79532089
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: The runs
        shell: bash {0}
        run: |
          R=../results.txt
          mkdir -p ../kept
          echo "runner ${{ matrix.os }}, $(nproc) CPUs, $(date -u), tree $(git rev-parse HEAD)" > $R
          timeout 1800 cargo build --release --locked -p slates-cli --bin slates --test live_chaos > ../build.log 2>&1; status=$?
          echo "== release build exit $status" >> $R
          [ $status -ne 0 ] && grep -E '^error' -A8 ../build.log | head -40 >> $R
          for variant in quiet loaded; do
            for run in 1 2 3 4 5 6 7 8; do
              timeout 600 cargo test --release --locked -p slates-cli --test live_chaos -- --nocapture --test-threads=1 --exact diag_joint_window_$variant > ../run.log 2>&1; status=$?
              grep -E '^LD-JW|panicked' ../run.log | cut -c1-400 | sed "s/^/   $variant$run /" >> $R || true
              echo "== $variant run $run exit $status" >> $R
              [ $status -ne 0 ] && cut -c1-600 ../run.log | tail -3000 > ../kept/$variant-$run.log
            done
          done
          exit 0
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-71-${{ matrix.os }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          cp ../kept/*.log . 2>/dev/null || true
          git add results.txt *.log 2>/dev/null || git add results.txt
          git commit -qm "diag-live-durability-71 results, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"
