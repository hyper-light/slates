name: diag-live-durability

# Diagnostics only, never on main (A-200; the supervisor's lever 2): the lane's stop-and-wait against a batch of up to
# 64 entries an exchange (SLATES_DIAG_LANE_BATCH, diag only), on this failure's condition made on demand: node a's
# live replies delayed 120 ms (SLATES_DIAG_LIVE_REPLY_DELAY_MS on node a only, diag only), a holder at the degraded
# round trip diag-43 measured, beside a healthy one. The rolling partition x20 per leg; Convergence and the slowest
# write per run. Same binary for both legs. Results to diag-results/live-durability-47-<leg>.
on:
  push:
    branches: ["diag-live-durability-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  SLATES_TEST_CLI: "1"
  SLATES_DIAG_LIVE_REPLY_DELAY_MS: "120"
  SLATES_DIAG_DELAY_NODE: "a"

jobs:
  check:
    name: partition (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: stopwait-x86, os: ubuntu-latest, batch: "1" }
          - { leg: batch-x86, os: ubuntu-latest, batch: "64" }
          - { leg: stopwait-arm, os: ubuntu-24.04-arm, batch: "1" }
          - { leg: batch-arm, os: ubuntu-24.04-arm, batch: "64" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      SLATES_DIAG_LANE_BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: The runs
        shell: bash {0}
        run: |
          R=../results.txt
          mkdir -p ../kept
          echo "leg ${{ matrix.leg }}, batch $SLATES_DIAG_LANE_BATCH, delay ${SLATES_DIAG_LIVE_REPLY_DELAY_MS} ms on node $SLATES_DIAG_DELAY_NODE, $(nproc) CPUs, $(date -u), tree $(git rev-parse HEAD)" > $R
          timeout 1800 cargo build --release --locked -p slates-cli --bin slates --test live_chaos > ../build.log 2>&1; status=$?
          echo "== release build exit $status" >> $R
          [ $status -ne 0 ] && grep -E '^error' -A8 ../build.log | head -40 >> $R
          kept=0
          for run in $(seq 1 20); do
            timeout 900 cargo test --release --locked -p slates-cli --test live_chaos -- --nocapture --test-threads=1 --exact candidates_partitioned_in_turn_mid_stream_lose_nothing > ../run.log 2>&1; status=$?
            grep -E '^  [0-9]+ writes|violations|^  chaos-rolling.*partitioned|never answered' ../run.log | grep -v '^chaos' | sort -u | cut -c1-400 >> $R || true
            batches=$(grep -c 'stream 24' ../run.log)
            echo "== partition $run exit $status lane_lines_stream24 $batches" >> $R
            if [ $status -ne 0 ] && [ $kept -lt 3 ]; then
              kept=$((kept + 1))
              cut -c1-1500 ../run.log > ../kept/run-$run.log
            fi
          done
          exit 0
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-47-${{ matrix.leg }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          cp ../kept/*.log . 2>/dev/null || true
          git add results.txt *.log 2>/dev/null || git add results.txt
          git commit -qm "diag-live-durability-47 results, ${{ matrix.leg }}"
          git push -q origin "HEAD:refs/heads/$branch"
