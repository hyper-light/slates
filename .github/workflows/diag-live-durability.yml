name: diag-live-durability

# Diagnostics only, never on main (A-200, the install budget's missing ceiling): a holder stops itself the moment it is
# served an install, before replying, with installs budgeted 30 s. How long the owner's lane holds its session, and what
# the owner believes meanwhile, per second for 40 s. x6 per arch. Results to diag-results/live-durability-58-<os>.
on:
  push:
    branches: ["diag-live-durability-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  SLATES_TEST_CLI: "1"
  SLATES_DIAG_INSTALL_FLOOR_MS: "30000"

jobs:
  check:
    name: partition (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: ubuntu-latest, os: ubuntu-latest }
          - { leg: ubuntu-24.04-arm, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: The runs
        shell: bash {0}
        run: |
          R=../results.txt
          echo "leg ${{ matrix.leg }}, $(nproc) CPUs, $(date -u), tree $(git rev-parse HEAD)" > $R
          timeout 1800 cargo build --release --locked -p slates-cli --bin slates --test live_chaos > ../build.log 2>&1; status=$?
          echo "== release build exit $status" >> $R
          [ $status -ne 0 ] && grep -E '^error' -A8 ../build.log | head -40 >> $R
          export SLATES_DIAG_STOP_DIR="$RUNNER_TEMP/stopdir"; mkdir -p "$SLATES_DIAG_STOP_DIR"
          for run in 1 2 3 4 5 6; do
            timeout 300 cargo test --release --locked -p slates-cli --test live_chaos -- --nocapture --test-threads=1 --exact diag_a_holder_stopped_mid_install > ../run.log 2>&1; status=$?
            grep -E '^LD-TL|^LD-LANE|panicked' ../run.log | cut -c1-260 | sed "s/^/   r$run /" >> $R || true
            echo "== run $run exit $status" >> $R
          done
          exit 0
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-58-${{ matrix.leg }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-live-durability-58 results, ${{ matrix.leg }}"
          git push -q origin "HEAD:refs/heads/$branch"
