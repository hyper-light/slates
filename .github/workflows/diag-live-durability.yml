name: diag-live-durability

# Diagnostics only, never on main (A-200, item 2): a TEMPORARY lane probe (LANEPROBE log lines: a lane step past 100 ms
# with its borrow, exchange and straggler times; a holder skipped as busy past 250 ms; a lane ending past 100 ms; the
# borrower holding a session a lane missed). The rolling partition flow ten times and the quiet-fleet flow five times,
# release, both Linux arches. Results to diag-results/live-durability-10-<os> by git push.
on:
  push:
    branches: ["diag-live-durability-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SLATES_TEST_CLI: "1"
  SLATES_TEST_MEASURE: "1"

jobs:
  partition:
    name: A-200 lane probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p slates-cli --bin slates --test live_chaos
      - name: The rolling partition flow, ten runs
        env:
          SLATES_CHAOS_PRINT_SLOW: "1"
        run: |
          R=../results.txt
          echo "runner ${{ matrix.os }}, $(nproc) CPUs, $(date -u), head $(git rev-parse HEAD)" > $R
          for run in $(seq 1 10); do
            echo "== run $run at $(date -u +%H:%M:%S), load $(cut -d' ' -f1-3 /proc/loadavg)" | tee -a $R
            status=0
            timeout 900 cargo test --release --locked -p slates-cli --test live_chaos -- --nocapture --test-threads=1 --exact candidates_partitioned_in_turn_mid_stream_lose_nothing > ../run.log 2>&1 || status=$?
            { grep -c 'LANEPROBE borrow-miss' ../run.log | sed 's/^/  borrow-miss lines: /'; grep 'LANEPROBE' ../run.log | grep -v borrow-miss | head -300; grep 'LANEPROBE borrow-miss' ../run.log | sed 's/holder=[^ ]* //' | sort | uniq -c | sort -rn | head -20; grep -E '^chaos|^  |panicked|test result' ../run.log | cut -c1-900 | tail -200; } >> $R
            echo "== run $run exit $status" | tee -a $R
          done
          for run in $(seq 1 5); do
            echo "== quiet $run at $(date -u +%H:%M:%S), load $(cut -d' ' -f1-3 /proc/loadavg)" | tee -a $R
            status=0
            timeout 900 cargo test --release --locked -p slates-cli --test live_chaos -- --nocapture --test-threads=1 --exact writes_stream_on_a_quiet_fleet > ../run.log 2>&1 || status=$?
            { grep -c 'LANEPROBE borrow-miss' ../run.log | sed 's/^/  borrow-miss lines: /'; grep 'LANEPROBE' ../run.log | grep -v borrow-miss | head -300; grep 'LANEPROBE borrow-miss' ../run.log | sed 's/holder=[^ ]* //' | sort | uniq -c | sort -rn | head -20; grep -E '^chaos|^  |panicked|test result' ../run.log | cut -c1-900 | tail -200; } >> $R
            echo "== quiet $run exit $status" | tee -a $R
          done
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-10-${{ matrix.os }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-live-durability-10 results, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"
