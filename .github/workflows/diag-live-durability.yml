name: diag-live-durability

# Diagnostics only, never on main (A-200, item 2): agents/live-durability-straggler-1 on main ecb86b4f. Per tree (R: main
# with the branch's tests, 86012d10; F: the branch, 3cef4bda) and Linux arch: the three new tests five times each, then
# the whole live_fleet suite quiet and with two spinning shell loops per CPU; on F the rolling partition five times quiet
# and five times loaded. Release. Results to diag-results/live-durability-25-<tree>-<os> by git push.
on:
  push:
    branches: ["diag-live-durability-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SLATES_TEST_CLI: "1"

jobs:
  landing:
    name: landing (${{ matrix.tree.name }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        tree:
          - { name: R, sha: 86012d108a1e329ff31e4ed52f85135e2e766f54 }
          - { name: F, sha: 3cef4bdafc676788c0554943e68626e08ddb269c }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Build the tree
        run: |
          git worktree add ../tree "${{ matrix.tree.sha }}"
          cd ../tree && cargo build --release --locked -p slates-cli --bin slates --test live_fleet --test live_chaos
      - name: The runs
        run: |
          R=../results.txt
          cpus=$(nproc)
          echo "runner ${{ matrix.os }}, $cpus CPUs, $(date -u), tree ${{ matrix.tree.name }} ${{ matrix.tree.sha }}" > $R
          cd ../tree
          spin() { pids=""; for i in $(seq 1 $((cpus * 2))); do ( while :; do :; done ) & pids="$pids $!"; done; }
          unspin() { for p in $pids; do kill "$p" 2>/dev/null || true; done; wait 2>/dev/null || true; }
          for run in $(seq 1 5); do
            for t in both_candidates_stopped_draw_no_storm_of_sends each_candidate_stopped_in_turn_holds_no_write_and_catches_up a_new_live_volumes_first_writes_go_only_to_candidates_holding_its_catalog; do
              status=0
              timeout 600 cargo test --release --locked -p slates-cli --test live_fleet -- --nocapture --test-threads=1 --exact $t > ../run.log 2>&1 || status=$?
              grep -E '^live turns|^live catalog|^live storm' ../run.log | sed -E 's/; then .*//' | cut -c1-300 >> ../results.txt
              echo "== run $run $t exit $status" >> ../results.txt
            done
          done
          for cond in quiet loaded; do
            [ $cond = loaded ] && spin
            echo "== live_fleet $cond at $(date -u +%H:%M:%S), load $(cut -d' ' -f1-3 /proc/loadavg)" >> ../results.txt
            status=0
            timeout 2400 cargo test --release --locked -p slates-cli --test live_fleet -- --test-threads=2 > ../run.log 2>&1 || status=$?
            grep -E '^test .* FAILED|test result|panicked at' ../run.log | cut -c1-300 >> ../results.txt
            echo "== live_fleet $cond exit $status" >> ../results.txt
            [ $cond = loaded ] && unspin
          done
          if [ "${{ matrix.tree.name }}" = F ]; then
            for cond in quiet loaded; do
              for run in $(seq 1 5); do
                [ $cond = loaded ] && spin
                echo "== partition $cond $run at $(date -u +%H:%M:%S), load $(cut -d' ' -f1-3 /proc/loadavg)" >> ../results.txt
                status=0
                timeout 900 cargo test --release --locked -p slates-cli --test live_chaos -- --nocapture --test-threads=1 --exact candidates_partitioned_in_turn_mid_stream_lose_nothing > ../run.log 2>&1 || status=$?
                grep -E '^  [0-9]+ writes|violations|caught up after|refused the owner' ../run.log | grep -v '^chaos' | cut -c1-300 >> ../results.txt
                echo "== partition $cond $run exit $status" >> ../results.txt
                [ $cond = loaded ] && unspin
              done
            done
          fi
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-25-${{ matrix.tree.name }}-${{ matrix.os }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-live-durability-25 results, ${{ matrix.tree.name }}, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"
