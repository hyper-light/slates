name: diag-live-durability

# Diagnostics only, never on main (A-200, item 2): does item 1's NFSv4 COMMIT flow (both candidates stopped, then resumed)
# strand the owner's sessions, and does the landable straggler wait stop it? Interleaved A/B on macos-latest, where it
# stranded locally (no_session 590 for 40 s after the resume): arm A item 1 (2ff55d42), arm B item 1 with the lanes,
# catalogued holders and straggler wait (52801c77dc1e0be13902c5305f892aca8afbc217). Ten runs an arm, debug as the suite runs. Results to
# diag-results/live-durability-23-macos-latest by git push.
on:
  push:
    branches: ["diag-live-durability-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SLATES_TEST_CLI: "1"
  ARM_A_SHA: 2ff55d42
  ARM_B_SHA: 52801c77dc1e0be13902c5305f892aca8afbc217

jobs:
  nfs4:
    name: NFSv4 stranding A/B (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Build both arms
        run: |
          git worktree add ../arm-a "$ARM_A_SHA"
          git worktree add ../arm-b "$ARM_B_SHA"
          ( cd ../arm-a && CARGO_TARGET_DIR=../target-a cargo test --no-run --locked -p slates-cli --test live_fleet )
          ( cd ../arm-b && CARGO_TARGET_DIR=../target-b cargo test --no-run --locked -p slates-cli --test live_fleet )
      - name: The NFSv4 flow ten times an arm, interleaved
        run: |
          R=../results.txt
          T=an_nfs_v4_commit_and_stable_write_to_a_live_volume_answer_only_once_a_candidate_holds_them
          echo "runner ${{ matrix.os }}, $(sysctl -n hw.ncpu) CPUs, $(date -u)" > $R
          for run in $(seq 1 10); do
            for arm in a b; do
              status=0
              ( cd ../arm-$arm && CARGO_TARGET_DIR=../target-$arm cargo test --locked -p slates-cli --test live_fleet -- --nocapture --exact $T ) > ../run.log 2>&1 || status=$?
              echo "== run $run arm $arm exit $status load $(sysctl -n vm.loadavg)" >> $R
              grep -E '^live nfs4|panicked at|came up|COMMIT succeeds' ../run.log | cut -c1-500 >> $R
            done
          done
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-23-${{ matrix.os }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-live-durability-23 results, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"
