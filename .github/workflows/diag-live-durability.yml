name: diag-live-durability

# Diagnostics only, never on main (A-200, item 1 apart: agents/live-durability-item1 cut from main d61c3be2 with only the
# durability sweep's commits, and liveness's Windows UDP fix d8a8d859 merged in for the Windows fleet). Linux, both
# arches: the live_fleet suite (every item-1 flow, virtio-fs and FUSE included), the virtio-fs crate and the daemon's
# virtio-fs and Shards suites. Windows: the WinFsp flush flow three times and the WinFsp mount suite. Results to
# diag-results/live-durability-item1-<os> by git push.
on:
  push:
    branches: ["diag-live-durability-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SLATES_TEST_CLI: "1"
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a

jobs:
  linux:
    name: item 1 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: The item-1 suites
        run: |
          R=../results.txt
          echo "runner ${{ matrix.os }}, $(nproc) CPUs, $(date -u), tree $(git rev-parse HEAD)" > $R
          status=0
          cargo test --locked -p slates-cli --test live_fleet -- --test-threads=2 --nocapture > ../fleet.log 2>&1 || status=$?
          grep -E '^test .* (ok|FAILED)$|^live (shards|map|checkout|nfs4|fsync|vhost)|panicked at|test result' ../fleet.log | cut -c1-400 | tee -a $R
          echo "== live_fleet exit $status" | tee -a $R
          status=0
          cargo test --locked -p slates-bridge-virtiofs > ../vfs.log 2>&1 || status=$?
          grep -E 'FAILED|panicked at|test result' ../vfs.log | cut -c1-300 | tee -a $R
          echo "== bridge-virtiofs exit $status" | tee -a $R
          status=0
          cargo test --locked -p slates-server --test virtiofs --test shards > ../srv.log 2>&1 || status=$?
          grep -E 'FAILED|panicked at|test result' ../srv.log | cut -c1-300 | tee -a $R
          echo "== server virtiofs+shards exit $status" | tee -a $R
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-item1-${{ matrix.os }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-live-durability-item1 results, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"

  windows:
    name: item 1 WinFsp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 170
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
      WINFSP_TEST_MOUNT: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM
        uses: ilammy/setup-nasm@v1.5.2
      - name: Install WinFsp
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: The WinFsp flush flow three times, then the mount suite
        run: |
          R=../results.txt
          echo "runner ${{ matrix.os }}, $(date -u), tree $(git rev-parse HEAD)" > $R
          for n in 1 2 3; do
            status=0
            timeout 2400 cargo test --locked -p slates-cli --test live_winfsp -- --nocapture > ../flush.log 2>&1 || status=$?
            grep -E '^test |^live winfsp|panicked at|assertion|SKIP|test result' ../flush.log | cut -c1-500 | tee -a $R
            echo "== flush $n exit $status" | tee -a $R
          done
          status=0
          timeout 3600 cargo test --locked -p slates-cli --test winfsp -- --test-threads=1 > ../suite.log 2>&1 || status=$?
          grep -E '^test .* (ok|FAILED)|panicked at|test result' ../suite.log | cut -c1-300 | tee -a $R
          echo "== winfsp suite exit $status" | tee -a $R
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-item1-${{ matrix.os }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-live-durability-item1 results, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"
