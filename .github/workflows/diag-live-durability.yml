name: diag-live-durability

# Diagnostics only, never on main (A-200, item 2): the stack at straggler-2 52bbdf30: cluster live x2, server live_ship,
# the release build, the whole live_fleet suite (its tail kept on failure), the rolling partition x3. Both Linux arches.
# Results to diag-results/live-durability-32-<os> by git push.
on:
  push:
    branches: ["diag-live-durability-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SLATES_TEST_CLI: "1"

jobs:
  check:
    name: stack (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: The runs
        shell: bash {0}
        run: |
          R=../results.txt
          echo "runner ${{ matrix.os }}, $(nproc) CPUs, $(date -u), tree $(git rev-parse HEAD)" > $R
          for run in 1 2; do
            timeout 900 cargo test --locked -p slates-cluster --test live > ../run.log 2>&1; status=$?
            grep -E 'test result|panicked' ../run.log | head -4 >> $R || true
            echo "== cluster live run $run exit $status" >> $R
          done
          timeout 1800 cargo test --locked -p slates-server --test live_ship > ../run.log 2>&1; status=$?
          grep -E '^test .* FAILED|test result' ../run.log >> $R || true
          echo "== server live_ship exit $status" >> $R
          timeout 1800 cargo build --release --locked -p slates-cli --bin slates --test live_fleet --test live_chaos > ../build.log 2>&1; status=$?
          echo "== release build exit $status" >> $R
          [ $status -ne 0 ] && grep -E '^error' -A8 ../build.log | head -40 >> $R
          timeout 2400 cargo test --release --locked -p slates-cli --test live_fleet -- --test-threads=2 > ../run.log 2>&1; status=$?
          grep -E '^test .* FAILED|test result|panicked at' ../run.log >> $R || true
          [ $status -ne 0 ] && tail -60 ../run.log | cut -c1-300 >> $R
          echo "== live_fleet exit $status" >> $R
          for run in 1 2 3; do
            timeout 900 cargo test --release --locked -p slates-cli --test live_chaos -- --nocapture --test-threads=1 --exact candidates_partitioned_in_turn_mid_stream_lose_nothing > ../run.log 2>&1; status=$?
            grep -E '^  [0-9]+ writes|violations|refused the owner' ../run.log | grep -v '^chaos' | cut -c1-250 >> $R || true
            echo "== partition $run exit $status" >> $R
          done
          exit 0
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-32-${{ matrix.os }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-live-durability-32 results, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"
