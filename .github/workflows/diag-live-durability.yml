name: diag-live-durability

# Diagnostics only, never on main (A-200, item 2). Two jobs a Linux arch. partition: the rolling partition flow
# (candidates_partitioned_in_turn_mid_stream_lose_nothing) ten times in release on the branch head, every run's verdict
# and SLATES_CHAOS_PRINT_SLOW's samples kept. ab: interleaved A/B, arm A main 4326a9d8, arm B the branch head (per-holder
# lanes, catalogued holders, lanes wait for stragglers, merged with raft-chaos-1): the release stable-write bench and the
# quiet-fleet flow, quiet and with two spinning shell loops per CPU, three rounds each, arms alternating. Results to
# diag-results/live-durability-8-<job>-<os> by git push.
on:
  push:
    branches: ["diag-live-durability-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SLATES_TEST_CLI: "1"
  SLATES_TEST_MEASURE: "1"
  ARM_A_SHA: 4326a9d8

jobs:
  partition:
    name: A-200 rolling partition flow x10 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p slates-cli --bin slates --test live_chaos
      - name: The rolling partition flow, ten runs
        env:
          SLATES_CHAOS_PRINT_SLOW: "1"
        run: |
          R=../results.txt
          echo "runner ${{ matrix.os }}, $(nproc) CPUs, $(date -u), head $(git rev-parse HEAD)" > $R
          for run in $(seq 1 10); do
            echo "== run $run at $(date -u +%H:%M:%S), load $(cut -d' ' -f1-3 /proc/loadavg)" | tee -a $R
            status=0
            timeout 900 cargo test --release --locked -p slates-cli --test live_chaos -- --nocapture --test-threads=1 --exact candidates_partitioned_in_turn_mid_stream_lose_nothing > ../run.log 2>&1 || status=$?
            grep -vE 'watchdog beats every|initialized in|^\s*$|Compiling|Finished|Running' ../run.log | cut -c1-900 | tail -400 >> $R
            echo "== run $run exit $status" | tee -a $R
          done
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-8-partition-${{ matrix.os }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-live-durability-8 partition results, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"
  ab:
    name: A-200 main against item 2 A/B (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Build both arms
        run: |
          git worktree add ../arm-a "$ARM_A_SHA"
          ( cd ../arm-a && CARGO_TARGET_DIR=../target-a cargo build --release --locked -p slates-cli --bin slates --test live_fleet --test live_chaos )
          cargo build --release --locked -p slates-cli --bin slates --test live_fleet --test live_chaos
      - name: The bench, quiet and busy, three rounds each, the arms alternating
        run: |
          R=../results.txt
          cpus=$(nproc)
          echo "runner ${{ matrix.os }}, $cpus CPUs, $(date -u), arm B $(git rev-parse HEAD)" > $R
          for round in 1 2 3; do
            if [ $((round % 2)) = 1 ]; then order="a b"; else order="b a"; fi
            for cond in quiet busy; do
              for arm in $order; do
                pids=""
                if [ $cond = busy ]; then
                  for i in $(seq 1 $((cpus * 2))); do ( while :; do :; done ) & pids="$pids $!"; done
                fi
                echo "== $cond round $round arm $arm at $(date -u +%H:%M:%S), load $(cut -d' ' -f1-3 /proc/loadavg)" | tee -a $R
                status=0
                if [ $arm = a ]; then
                  ( cd ../arm-a && CARGO_TARGET_DIR=../target-a timeout 1500 cargo test --release --locked -p slates-cli --test live_fleet measure_what_live_shipping -- --nocapture ) > ../run.log 2>&1 || status=$?
                  ( cd ../arm-a && CARGO_TARGET_DIR=../target-a timeout 900 cargo test --release --locked -p slates-cli --test live_chaos -- --nocapture --test-threads=1 writes_stream_on_a_quiet_fleet ) >> ../run.log 2>&1 || status=$?
                else
                  timeout 1500 cargo test --release --locked -p slates-cli --test live_fleet measure_what_live_shipping -- --nocapture > ../run.log 2>&1 || status=$?
                  timeout 900 cargo test --release --locked -p slates-cli --test live_chaos -- --nocapture --test-threads=1 writes_stream_on_a_quiet_fleet >> ../run.log 2>&1 || status=$?
                fi
                for p in $pids; do kill "$p" 2>/dev/null || true; done
                wait 2>/dev/null || true
                grep -E '^measure|^  (plain|live|added)|^  [0-9]+ writes|panicked|test result' ../run.log | cut -c1-600 | tee -a $R
                echo "== $cond round $round arm $arm exit $status" | tee -a $R
              done
            done
          done
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-8-ab-${{ matrix.os }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-live-durability-8 ab results, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"
