name: diag-live-durability

# Diagnostics only, never on main (A-200): the redial's wasted link period. Main against main plus the fix (a redial's
# handshake runs in the call that builds it), the same diag-only wall-clock lines on both: the test's LD-RESUME, each
# dial's LD-DIAL and each install's LD-SERVE. The rolling partition x30 per leg per arch; how long after a resume the
# redial establishes and the first install arrives. Results to diag-results/live-durability-53-<leg>.
on:
  push:
    branches: ["diag-live-durability-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  SLATES_TEST_CLI: "1"

jobs:
  check:
    name: partition (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: base-x86, os: ubuntu-latest, ref: c4a417709fe2bca35dec9e89ef84b6672b978988 }
          - { leg: fix-x86, os: ubuntu-latest, ref: 6cde112a5ac96fc3d0aa264d95f67ecb0cbf5ada }
          - { leg: base-arm, os: ubuntu-24.04-arm, ref: c4a417709fe2bca35dec9e89ef84b6672b978988 }
          - { leg: fix-arm, os: ubuntu-24.04-arm, ref: 6cde112a5ac96fc3d0aa264d95f67ecb0cbf5ada }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: The runs
        shell: bash {0}
        run: |
          R=../results.txt
          echo "leg ${{ matrix.leg }}, $(nproc) CPUs, $(date -u), tree $(git rev-parse HEAD)" > $R
          timeout 1800 cargo build --release --locked -p slates-cli --bin slates --test live_chaos > ../build.log 2>&1; status=$?
          echo "== release build exit $status" >> $R
          [ $status -ne 0 ] && grep -E '^error' -A8 ../build.log | head -40 >> $R
          for run in $(seq 1 30); do
            timeout 900 cargo test --release --locked -p slates-cli --test live_chaos -- --nocapture --test-threads=1 --exact candidates_partitioned_in_turn_mid_stream_lose_nothing > ../run.log 2>&1; status=$?
            grep -E '^  [0-9]+ writes|violations|panicked' ../run.log | grep -v '^chaos' | sort -u | cut -c1-260 | sed "s/^/   r$run /" >> $R || true
            grep -E '^LD-RESUME|^LD-DIAL|^LD-SERVE' ../run.log | cut -c1-200 | sed "s/^/   r$run /" >> $R || true
            echo "== partition $run exit $status" >> $R
          done
          exit 0
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/live-durability-53-${{ matrix.leg }}"
          git config user.name "diag-live-durability"
          git config user.email "diag-live-durability@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-live-durability-53 results, ${{ matrix.leg }}"
          git push -q origin "HEAD:refs/heads/$branch"
