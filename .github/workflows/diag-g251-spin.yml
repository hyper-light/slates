# DIAG (not for main): the seeded nemesis's spinning verdict (g251 item 1), release, Linux x86_64 and arm64.
name: diag-g251-spin
on:
  push:
    branches: ['diag-g251-spin-*']
env:
  CARGO_TERM_COLOR: never
jobs:
  spin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the chaos binary (release)
        run: cargo test --locked --release -p slates-cli --test live_chaos --no-run
      - name: The nemesis at the seed
        run: bash .github/diag-g251-spin.sh
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spin-results-${{ matrix.os }}
          path: target/spin-*
