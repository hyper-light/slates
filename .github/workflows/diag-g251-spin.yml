# DIAG (not for main): the seeded nemesis's spinning verdict (g251 item 1), release, Linux x86_64 and arm64.
name: diag-g251-spin
on:
  push:
    branches: ['diag-g251-spin-*']
env:
  CARGO_TERM_COLOR: never
jobs:
  spin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the chaos binary (release)
        run: cargo test --locked --release -p slates-cli --test live_chaos --no-run
      - name: The nemesis at the seed
        run: bash .github/diag-g251-spin.sh
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spin-results-${{ matrix.os }}
          path: target/spin-*
  winspin:
    runs-on: windows-11-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: clang-cl for the C the daemon links (native arm64 Windows)
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the fleet test binary
        run: cargo test --locked -p slates-server --test fleet --no-run
      - name: The council-forms submit, 24 runs
        shell: bash
        env:
          SLATES_FLEET_TRACE: "1"
          SLATES_TEST_HEDGE_STARVATION_SECS: "20"
          SLATES_TEST_RESTART_SLOWDOWN: "10"
          SLATES_TEST_FLEET_DEADLINE_SECS: "120"
        run: |
          mkdir -p target
          R=target/spin-win-results.txt
          t=a_submit_made_while_the_council_forms_is_answered_once_its_record_commits
          for run in $(seq 1 24); do
            began=$(date +%s)
            log=target/spin-win-$run.log
            timeout 300 cargo test --locked -q -p slates-server --test fleet -- --exact $t --nocapture > $log 2>&1; code=$?
            echo "run $run exit $code took $(( $(date +%s) - began ))s" | tee -a $R
            grep -E "DIAG|spinning|wedged|panicked" $log | cut -c1-900 | head -40 | tee -a $R
          done
          true
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spin-results-windows-11-arm
          path: target/spin-*
