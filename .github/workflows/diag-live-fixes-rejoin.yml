# Diagnostics for the live-fixes agent (not for main): a candidate's daemon killed under its anchor and succeeded under
# the same member id never rejoins (raft-chaos report 8). Three arms of one build, each run six times under two spinners
# a logical CPU: neither fix (ZZ_NO_RESTART_EPOCHS and ZZ_NO_RETURNED), the restarted epoch sequence alone
# (ZZ_NO_RETURNED), and both. Results go to diag-live-fixes-results-<run>-macos-rejoin.
name: diag-live-fixes-rejoin

on:
  push:
    branches: ['diag-live-fixes-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  rejoin:
    name: the anchored rejoin, three arms, on macos-latest
    runs-on: macos-latest
    timeout-minutes: 200
    env:
      RESULTS_BRANCH: diag-live-fixes-results-${{ github.run_id }}-macos-rejoin
    steps:
      - uses: actions/checkout@v4
      - name: The results publisher
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'EOF'
          #!/bin/bash
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          cd "$GITHUB_WORKSPACE" || exit 0
          entries=""
          for f in results/*; do
            [ -f "$f" ] || continue
            blob=$(git hash-object -w "$f") || exit 0
            entries="$entries$(printf '100644 blob %s\t%s' "$blob" "$(basename "$f")")"$'\n'
          done
          tree=$(printf '%s' "$entries" | git mktree) || exit 0
          parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID") || exit 0
          if git push origin "$commit:refs/heads/$RESULTS_BRANCH"; then
            echo "$commit" > "$RUNNER_TEMP/results-parent"
          else
            echo "::warning::could not publish the results"
          fi
          EOF
          chmod +x "$RUNNER_TEMP/publish.sh"
          mkdir -p results
          { echo "tree $(git rev-parse HEAD) $(date -u +%FT%TZ)"; sysctl -n hw.logicalcpu; sw_vers; } > results/00-image.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p slates-cli --tests --bins
      - name: Three arms, six runs each, under two spinners a logical CPU
        run: |
          set +e
          T=a_candidates_daemon_succeeded_under_its_anchor_rejoins_the_fleet
          spinners=$(( $(sysctl -n hw.logicalcpu) * 2 ))
          for i in $(seq 1 $spinners); do (while :; do :; done) & echo $! >> "$RUNNER_TEMP/spinners"; done
          sleep 10
          for arm in neither epochs both; do
            case $arm in
              neither) export ZZ_NO_RESTART_EPOCHS=1 ZZ_NO_RETURNED=1 ;;
              epochs) unset ZZ_NO_RESTART_EPOCHS; export ZZ_NO_RETURNED=1 ;;
              both) unset ZZ_NO_RESTART_EPOCHS ZZ_NO_RETURNED ;;
            esac
            for n in $(seq 1 6); do
              log="$RUNNER_TEMP/$arm-$n.log"
              SLATES_TEST_CLI=1 perl -e 'alarm shift; exec @ARGV' 400 cargo test -p slates-cli --test live_chaos $T -- --nocapture > "$log" 2>&1
              code=$?
              {
                echo "=== $arm $n exit $code load $(sysctl -n vm.loadavg)"
                grep -E '^rejoins: |panicked at' -A1 "$log" | grep -v '^--' | head -6
                grep -E 'fleet_host:|fleet_peers_probed|epoch_re|member_returned|fleet\.link\.invalid' "$log" | head -30
              } >> results/10-rejoin.txt
              pkill -f "chaos-rejoins-" || true
              bash "$RUNNER_TEMP/publish.sh"
            done
          done
          kill $(cat "$RUNNER_TEMP/spinners") 2>/dev/null || true
      - name: Publish whatever was measured
        if: always()
        run: if [ -f "$RUNNER_TEMP/publish.sh" ]; then bash "$RUNNER_TEMP/publish.sh"; fi
