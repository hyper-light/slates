name: diag-liveness-ab

# Diagnostics only, never on main (the anchor restart loop, step 4). diag-liveness-10 saw the anchor crate's
# a_crash_loop_is_restarted_after_a_doubling_backoff_never_given_up fail once on windows-latest beside two spinners a
# CPU; the branch does not touch crates/anchor. A/B: the anchor crate's suite five times on main 4326a9d8 and five on
# this tree, both beside two spinners a CPU, on both Windows runners. On both Linux runners, the process clock's tests
# twenty times beside the same spinners. Results go to diag-results/liveness-11-<os>.
on:
  push:
    branches: ["diag-liveness-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  windows:
    name: anchor A/B (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (x86_64)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build both trees
        run: |
          git fetch -q --depth=1 origin 4326a9d8aa9b83be5ed6bc7b3225f6bcf30aed9a
          git worktree add -q ../main FETCH_HEAD
          cargo test --locked -p slates-anchor --no-run
          (cd ../main && CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target cargo test --locked -p slates-anchor --no-run)
      - name: A/B beside two spinners a CPU
        run: |
          R=../results.txt
          echo "runner ${{ matrix.os }}, $NUMBER_OF_PROCESSORS CPUs, $(git log --oneline -1 | cut -c1-80), $(date -u)" > $R
          pids=""
          for i in $(seq 1 $((NUMBER_OF_PROCESSORS * 2))); do (while :; do :; done) & pids="$pids $!"; done
          trap 'for p in $pids; do kill $p 2>/dev/null; done' EXIT
          echo "== spinners: $(echo $pids | wc -w)" | tee -a $R
          for run in 1 2 3 4 5; do
            for side in main branch; do
              dir=.; [ $side = main ] && dir=../main
              status=0
              (cd $dir && CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target cargo test --locked -p slates-anchor -- --test-threads=1) > ../a.log 2>&1 || status=$?
              grep -E 'FAILED|panicked|test result' ../a.log | cut -c1-300 | tee -a $R || true
              echo "== $side run $run exit $status" | tee -a $R
            done
          done
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/liveness-11-${{ matrix.os }}"
          git config user.name "diag-liveness"
          git config user.email "diag-liveness@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-liveness-11 results, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"

  linux:
    name: process clock x20 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo test --locked -p slates-machine --lib --no-run
      - name: The process clock twenty times beside two spinners a CPU
        run: |
          R=../results.txt
          echo "runner ${{ matrix.os }}, $(nproc) CPUs, $(git log --oneline -1 | cut -c1-80), $(date -u)" > $R
          pids=""
          for i in $(seq 1 $(( $(nproc) * 2 ))); do nice -n 19 bash -c 'while :; do :; done' & pids="$pids $!"; done
          trap 'for p in $pids; do kill $p 2>/dev/null; done' EXIT
          fails=0
          for run in $(seq 1 20); do
            status=0
            cargo test --locked -p slates-machine --lib -- process_clock wake > ../m.log 2>&1 || status=$?
            [ $status = 0 ] || { fails=$((fails + 1)); grep -E 'panicked|FAILED' -A2 ../m.log | cut -c1-300 | tee -a $R; }
          done
          echo "== process_clock and wake: $fails of 20 runs failed, load $(cut -d' ' -f1 /proc/loadavg)" | tee -a $R
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/liveness-11-${{ matrix.os }}"
          git config user.name "diag-liveness"
          git config user.email "diag-liveness@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-liveness-11 results, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"
