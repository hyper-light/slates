name: DIAG raft-chaos A-261's hardened process test at extreme load (not for main)

# Diagnostics branch of the raft-chaos agent; never merged. One arm, the committed tip of agents/raft-chaos-stateless-reset,
# built as CI's gate builds the fleet tests (debug). Two conditions alternate run by run, the first swapped between
# runners: "spinners", two busy loops on every core with the test unpinned; "one-cpu", the test and its three daemons
# pinned to CPU 0 with two busy loops on that core. Each load generator runs in its own process group, started before a
# run and stopped by that group after it. Each run records the test's line: how many restarts it made, in how many the
# precondition held (the reset path ran), and its verdict.

on:
  push:
    branches: [diag-raft-chaos-ab-63]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  load:
    name: load ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build
        run: cargo test --locked -p slates-server --test fleet --no-run
      - name: Runs under load
        run: |
          R=../results.txt
          BIN=$(ls -t target/debug/deps/fleet-* | grep -v '\.d$' | head -1)
          echo "runner ubuntu-latest, $(nproc) CPUs, $(date -u), tip $(git rev-parse --short=8 HEAD), sample ${{ matrix.sample }}, $BIN" > $R
          if [ $(( ${{ matrix.sample }} % 2 )) -eq 0 ]; then ORDER="one-cpu spinners"; else ORDER="spinners one-cpu"; fi
          for pair in 1 2 3 4; do
            for condition in $ORDER; do
              LOADPG=""
              if [ $condition = spinners ]; then
                for cpu in $(seq 0 $(( $(nproc) - 1 ))); do
                  for i in 1 2; do setsid taskset -c $cpu bash -c 'while :; do :; done' & LOADPG="$LOADPG $!"; done
                done
                PIN=""
              else
                for i in 1 2; do setsid taskset -c 0 bash -c 'while :; do :; done' & LOADPG="$LOADPG $!"; done
                PIN="taskset -c 0"
              fi
              sleep 2
              echo "== pair $pair $condition at $(date -u +%H:%M:%S), load $(cut -d' ' -f1-3 /proc/loadavg)" >> $R
              status=0
              timeout 900 $PIN "$BIN" --nocapture --test-threads=1 --exact a_restarted_owner_resets_its_old_session_and_b_reaches_the_new_process > ../run.log 2>&1 || status=$?
              for g in $LOADPG; do kill -KILL -- -$g 2>/dev/null; done
              wait 2>/dev/null
              grep -E -A1 'restarts, the precondition held|test result|panicked' ../run.log | cut -c1-2400 >> $R
              echo "== pair $pair $condition exit $status, load $(cut -d' ' -f1-3 /proc/loadavg)" >> $R
            done
          done
      - name: Publish the results to a branch
        if: always()
        run: |
          git config user.name "diag-raft-chaos"
          git config user.email "diag-raft-chaos@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-raft-chaos-ab-63 results ${{ matrix.sample }}"
          git push -q origin "HEAD:refs/heads/diag-results/diag-raft-chaos-ab-63-${{ matrix.sample }}"
