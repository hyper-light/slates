name: "DIAG slabs -- a FUSE mount fusermount3's AppArmor profile refuses, in the old lane's container bound at /src (not for main)"

# Runs the helper-policy test (crates/cli/tests/cli.rs, a_mount_the_helpers_apparmor_profile_refuses_names_the_profile)
# in the container the live-guest lane used before it moved to /mnt/src: rust:1.98.1 with fuse3, seccomp and AppArmor
# unconfined, SYS_ADMIN and /dev/fuse, the workspace at /src, so the build output lies outside fusermount3's profile.

on:
  push:
    branches: ['diag-slabs-[0-9]*']

permissions:
  contents: write

jobs:
  policy:
    name: the helper-policy test on the runner image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RESULTS_BRANCH: diag-slabs-results-${{ github.ref_name }}-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The test in the container
        shell: bash
        timeout-minutes: 80
        run: |
          set +e
          {
            echo "## image: ${ImageOS:-?} ${ImageVersion:-?}"
            docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
              --device /dev/fuse --cap-add SYS_ADMIN -v "$PWD":/src -w /src rust:1.98.1 sh -c '
                apt-get update -qq >/dev/null 2>&1; apt-get install -y -qq fuse3 >/dev/null 2>&1
                SLATES_TEST_CLI=1 SLATES_TEST_HELPER_POLICY=1 cargo test --locked -p slates-cli --test cli -- \
                  --test-threads=1 --nocapture a_mount_the_helpers_apparmor_profile_refuses_names_the_profile
                echo "## policy test exit $?"'
          } 2>&1 | grep -v "^slates daemon: [a-z_0-9]* = " | tee own.txt
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          blob=$(git hash-object -w own.txt); tree=$(printf '100644 blob %s\town.txt\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "results of run $GITHUB_RUN_ID at $(date -u +%FT%TZ)")
          git push origin "$commit:refs/heads/$RESULTS_BRANCH" || echo "::warning::could not publish"
          exit 0
