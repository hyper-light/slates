name: "DIAG slabs -- can an exited fusermount3's AppArmor label be read before it is reaped (not for main)"

# Measures the read the helper-policy diagnosis will rest on: fusermount3 exec'd, held unreaped after it exits (waitid
# with WNOWAIT), its label read from /proc/<pid>/attr/apparmor/current and attr/current, then reaped. On the 26.04 host
# as the runner user and as root, and in the live-guest lane's container as root.

on:
  push:
    branches: ['diag-slabs-[0-9]*']

permissions:
  contents: write

jobs:
  label:
    name: the helper's label on the runner image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESULTS_BRANCH: diag-slabs-results-${{ github.ref_name }}-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        shell: bash
        timeout-minutes: 15
        run: |
          set +e
          P=.github/workflows/probe_label.py
          {
            echo "## image: ${ImageOS:-?} ${ImageVersion:-?}"; uname -r
            echo "## the caller's own label: $(cat /proc/self/attr/current 2>&1)"
            echo "## host, as $(id -un)"; python3 "$P"
            echo "## host, as root"; sudo python3 "$P"
            echo "## container (rust:1.98.1, the lane's options), as root"
            docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
              --device /dev/fuse --cap-add SYS_ADMIN -v "$PWD":/src -w /src rust:1.98.1 sh -c '
                apt-get update -qq >/dev/null 2>&1; apt-get install -y -qq fuse3 python3 >/dev/null 2>&1
                echo "the container process: $(cat /proc/self/attr/current 2>&1)"; python3 '"$P"
          } 2>&1 | tee own.txt
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          blob=$(git hash-object -w own.txt); tree=$(printf '100644 blob %s\town.txt\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "results of run $GITHUB_RUN_ID at $(date -u +%FT%TZ)")
          git push origin "$commit:refs/heads/$RESULTS_BRANCH" || echo "::warning::could not publish"
          exit 0
