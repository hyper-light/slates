name: DIAG loadtest-scale W3 -- the green chain's checkpointing and its suites (not for main)

# This commit's tree on ubuntu-latest: crates/server/tests/green_checkpoint.rs, then the db, merge and server suites the
# change touches. Results are published as one commit on diag-loadtest-scale-w3-results-<run>, read with git.

on:
  push:
    branches: ['diag-loadtest-scale-w3-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  w3:
    name: w3 on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      RESULTS_BRANCH: diag-loadtest-scale-w3-results-${{ github.run_id }}-${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: suites
        shell: bash
        run: |
          set -u +e +o pipefail
          out="$RUNNER_TEMP/results.txt"; : > "$out"
          step() { name=$1; shift; start=$(date +%s); "$@" > "$RUNNER_TEMP/$name.log" 2>&1; code=$?
            echo "$name exit $code $(( $(date +%s) - start ))s" >> "$out"
            grep -E '^test result|FAILED|panicked|^error|left:|right:|assertion|refused|head reached|partition snapshot' "$RUNNER_TEMP/$name.log" | head -60 | sed "s/^/  $name: /" >> "$out"; }
          echo "tested $(git rev-parse HEAD^) on $(uname -m), $(nproc) cpus" >> "$out"
          step green-checkpoint cargo test -p slates-server --test green_checkpoint -- --nocapture
          if [ -f .diag-full ]; then
            step fmt cargo fmt --all --check
            step clippy cargo clippy --workspace --all-targets -- -D warnings
            step xtask cargo xtask check
            step merge cargo test -p slates-merge --no-fail-fast
            step db cargo test -p slates-db --no-fail-fast
            step server-tests cargo test -p slates-server --test merge_load --test recovery --test checkout --test daemon --no-fail-fast
            step server-lib cargo test -p slates-server --lib
            step fleet-takeover cargo test -p slates-server --test fleet --no-fail-fast -- a_taken_over_green a_cross_region_client_finds_the_copyset_successor forwards_to_one_owner_never_wait_behind_each_other
            step client-merge cargo test -p slates-client --test merge_identity --test merge_chaos --test acknowledge --no-fail-fast
          fi
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          blob=$(git hash-object -w "$out")
          tree=$(printf '100644 blob %s\tresults.txt\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "w3 results of run $GITHUB_RUN_ID")
          git push origin "$commit:refs/heads/$RESULTS_BRANCH" || echo "::warning::could not publish the results"
