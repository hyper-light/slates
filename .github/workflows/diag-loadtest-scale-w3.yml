name: DIAG loadtest-scale W3 (A-238) and the retry hold -- after on both Linux runners, each fix red-checked (not for main)

# This commit's parent on ubuntu-latest and ubuntu-24.04-arm (after), and four variants of it on ubuntu-latest, each
# with one fix reverted in place before the build (before-*), running the test that holds it. Results are published as
# one commit per job on diag-loadtest-scale-w3-results-<run>-<job>, read with git.

on:
  push:
    branches: ['diag-loadtest-scale-w3-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  w3:
    name: ${{ matrix.variant }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: after, os: ubuntu-latest }
          - { variant: after, os: ubuntu-24.04-arm }
          - { variant: before-typed, os: ubuntu-latest }
          - { variant: before-forced, os: ubuntu-latest }
          - { variant: before-read, os: ubuntu-latest }
          - { variant: before-retry, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      RESULTS_BRANCH: diag-loadtest-scale-w3-results-${{ github.run_id }}-${{ matrix.variant }}-${{ matrix.os }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}
      - name: suites
        shell: bash
        run: |
          set -u +e +o pipefail
          out="$RUNNER_TEMP/results.txt"; : > "$out"
          step() { name=$1; shift; start=$(date +%s); "$@" > "$RUNNER_TEMP/$name.log" 2>&1; code=$?
            echo "$name exit $code $(( $(date +%s) - start ))s" >> "$out"
            grep -E '^test result|FAILED|panicked|^error|left:|right:|assertion|refused|head reached|partition snapshot|meets|unknown|released' "$RUNNER_TEMP/$name.log" | head -80 | sed "s/^/  $name: /" >> "$out"; }
          echo "tested $(git rev-parse HEAD^) variant $VARIANT on $(uname -m), $(nproc) cpus" >> "$out"
          revert() { perl -0pi -e "$2" "$1"; if git diff --quiet -- "$1"; then echo "REVERT DID NOT APPLY to $1" >> "$out"; else git diff --stat -- "$1" | sed 's/^/  reverted: /' >> "$out"; fi; }
          case "$VARIANT" in
            after)
              step green-checkpoint cargo test -p slates-server --test green_checkpoint -- --nocapture
              step fmt cargo fmt --all --check
              step clippy cargo clippy --workspace --all-targets -- -D warnings
              step xtask cargo xtask check
              step merge cargo test -p slates-merge --no-fail-fast
              step db cargo test -p slates-db --no-fail-fast
              step server-lib cargo test -p slates-server --lib
              step server-tests cargo test -p slates-server --test merge_load --test recovery --test checkout --test daemon --no-fail-fast
              step fleet cargo test -p slates-server --test fleet --no-fail-fast -- a_taken_over_green a_cross_region_client_finds_the_copyset_successor forwards_to_one_owner_never_wait_behind_each_other a_forwarded_submit_refused_overloaded a_merge_record_is_issued_only_once
              step client cargo test -p slates-client --no-fail-fast
              ;;
            before-typed)
              revert crates/server/src/error.rs 's/DbError::Capacity \{ table \} => Refusal::TableAtCapacity \{\s*table: \(\*table\)\.to_owned\(\),\s*\},/DbError::Capacity { table } => Refusal::BadRequest { reason: format!("{table} at capacity") },/s'
              step capacity cargo test -p slates-server --test green_checkpoint -- a_chain_held_by_a_reader --nocapture
              ;;
            before-forced)
              revert crates/server/src/verbs.rs 's/  if let Err\(slates_db::DbError::Capacity \{ \.\. \}\) = state\.db\.partition\(\)\.check\(record, now\) \{.*?\n  \}\n//s'
              step capacity cargo test -p slates-server --test green_checkpoint -- a_chain_held_by_a_reader --nocapture
              ;;
            before-read)
              revert crates/server/src/merge_service.rs 's/if version > engine\.head\(\) \|\| version < engine\.folded_below\(\) \{/if version > engine.head() {/'
              step recovered cargo test -p slates-server --test green_checkpoint -- a_green_recovered_after --nocapture
              ;;
            before-retry)
              revert crates/client/src/client.rs 's/let held_for_retry = by_word\n/let held_for_retry = false \&\& by_word\n/'
              step resend cargo test -p slates-server --test fleet -- a_forwarded_submit_refused_overloaded --nocapture
              ;;
          esac
          git checkout -- . 2>/dev/null
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          blob=$(git hash-object -w "$out")
          tree=$(printf '100644 blob %s\tresults.txt\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "w3 results of run $GITHUB_RUN_ID, $VARIANT on ${{ matrix.os }}")
          git push origin "$commit:refs/heads/$RESULTS_BRANCH" || echo "::warning::could not publish the results"
