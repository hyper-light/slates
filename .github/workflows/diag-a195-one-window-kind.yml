name: DIAG A-195 one window kind on Linux (not for main)

# Step 4 of the VFS and DAX plan (A-195): the fd-sharing placer maps per-file backings as the message placer does, and
# every path that mapped content blocks into a guest is removed. On both Linux architectures: Linux clippy over the
# crates the change touches; the suites with both placers (the device suite's backed tests run over each), the session's,
# the server's virtiofs, shards and recovery suites, the client's shards suite, and mem's and vfs's whole suites. Then
# three red-checks in this throwaway checkout, each of which must fail the device suite: the fd-sharing placer overlays
# the window's own offset rather than the piece's place in the object; its REMOVEMAPPING leaves the overlays; and a moved
# view refills nothing. Then QEMU 11.1 runs every test of tests/guest_vhost.rs through slates' own device.

on:
  push:
    branches: ['diag-a195-*']

env:
  CARGO_TERM_COLOR: never

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    name: suites and red-checks on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: The runner
        run: |
          echo "image $ImageOS $ImageVersion; $(nproc) CPUs; $(uname -srm); page $(getconf PAGESIZE)"
          cat /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/shmem_enabled /sys/kernel/mm/transparent_hugepage/hpage_pmd_size
      - name: Clippy on Linux
        run: cargo clippy --locked -p slates-mem -p slates-vfs -p slates-bridge-core -p slates-bridge-fuse -p slates-bridge-virtiofs -p slates-server -p slates-client -p slates-cli --all-targets -- -D warnings
      - name: The virtio-fs suites, both placers
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p slates-bridge-virtiofs -- --nocapture --test-threads 1 2>&1 | tee virtiofs.txt
          grep -E "^test backed::|SKIP|test result" virtiofs.txt
      - name: The session's suite
        run: cargo test --locked -p slates-bridge-core --test dax_backing -- --test-threads 1
      - name: The server's virtiofs, shards and recovery suites
        run: cargo test --locked -p slates-server --test virtiofs --test shards --test recovery
      - name: The client's shards suite
        run: cargo test --locked -p slates-client --test shards
      - name: mem and vfs
        run: cargo test --locked -p slates-mem -p slates-vfs
      - name: Red-check, the fd-sharing placer overlays the window's own offset
        shell: bash
        run: |
          set -u
          cp crates/bridge-virtiofs/src/device.rs /tmp/device.rs
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("crates/bridge-virtiofs/src/device.rs")
          t = p.read_text()
          old = "              descriptor.as_fd(),\n              piece.object_offset,\n              writable,\n            )\n            .is_ok();"
          assert t.count(old) == 1
          p.write_text(t.replace(old, "              descriptor.as_fd(),\n              piece.moffset,\n              writable,\n            )\n            .is_ok();"))
          EOF
          if cargo test --locked -p slates-bridge-virtiofs --test device backed:: -- --test-threads 1 > r1.txt 2>&1; then
            grep -E "^test |test result" r1.txt; echo "RED-CHECK offset: the device suite passed"; exit 1
          fi
          grep -E "panicked|left:|right:|test result" r1.txt | head -12
          cp /tmp/device.rs crates/bridge-virtiofs/src/device.rs
      - name: Red-check, the fd-sharing placer's REMOVEMAPPING leaves the overlays
        shell: bash
        run: |
          set -u
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("crates/bridge-virtiofs/src/device.rs")
          t = p.read_text()
          old = "        if cache.unmap(piece.moffset, piece.len).is_err() {"
          assert t.count(old) == 1
          p.write_text(t.replace(old, "        if piece.len == 0 && cache.unmap(piece.moffset, piece.len).is_err() {"))
          EOF
          if cargo test --locked -p slates-bridge-virtiofs --test device backed:: -- --test-threads 1 > r2.txt 2>&1; then
            grep -E "^test |test result" r2.txt; echo "RED-CHECK unmap: the device suite passed"; exit 1
          fi
          grep -E "panicked|left:|right:|test result" r2.txt | head -12
          cp /tmp/device.rs crates/bridge-virtiofs/src/device.rs
      - name: Red-check, a moved view refills nothing
        shell: bash
        run: |
          set -u
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("crates/bridge-virtiofs/src/device.rs")
          t = p.read_text()
          old = "      self.backed.session.mark_all_stale(state.backings);\n    }\n  }"
          assert t.count(old) == 1
          p.write_text(t.replace(old, "      let _ = state;\n    }\n  }"))
          EOF
          if cargo test --locked -p slates-bridge-virtiofs --test device backed::an_advance -- --test-threads 1 > r3.txt 2>&1; then
            grep -E "^test |test result" r3.txt; echo "RED-CHECK advance: the advance test passed"; exit 1
          fi
          grep -E "panicked|left:|right:|test result" r3.txt | head -12
          cp /tmp/device.rs crates/bridge-virtiofs/src/device.rs

  qemu:
    name: slates' own device with DAX in QEMU 11.1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Open KVM to the job
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm || echo "no /dev/kvm: the guest runs under software emulation"
      - name: Build the guest image
        run: docker build -t slates-guest ci/guest
      - name: slates' own device with DAX in QEMU
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --device /dev/fuse --cap-add SYS_ADMIN \
            $( [ -e /dev/kvm ] && echo --device /dev/kvm ) \
            -v "$PWD":/src -w /src slates-guest sh -c \
            'set -e; host=$(rustc -vV | sed -n "s/^host: //p"); \
             RUSTFLAGS="-C target-feature=+crt-static" cargo build --release -p slates-guest-probe \
               --bin slates-guest-probe --target "$host" --target-dir target/probe; \
             SLATES_GUEST_QEMU=$(ls /usr/bin/qemu-system-x86_64 /usr/bin/qemu-system-aarch64 2>/dev/null | head -1) \
             SLATES_GUEST_KERNEL=/guest/vmlinuz \
             SLATES_GUEST_PROBE="/src/target/probe/$host/release/slates-guest-probe" \
             cargo test -p slates-cli --test guest_vhost -- --nocapture --test-threads=1' 2>&1 | tee guest-vhost.log
          if grep -q "SKIP: the guest-over-slates" guest-vhost.log; then echo "the QEMU guest was skipped"; exit 1; fi
          grep -q "guest over slates' own device in qemu: QEMU emulator version 11" guest-vhost.log
          grep -E "test result|dax_maps|dax_placed|dax_placement" guest-vhost.log | head -20
