name: DIAG w-bugs -- A-739, a FUSE mount's end gives its references back (not for main)

on:
  push:
    branches: ['diag-w-bugs-a739-*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  b14:
    name: B14 on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RESULTS_BRANCH: ${{ github.ref_name }}-results-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: FUSE and the operator's grant
        run: |
          command -v fusermount3 >/dev/null || { sudo apt-get update && sudo apt-get install -y fuse3; }
          grep -qx user_allow_other /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf
      - name: The test, and the release test beside it, published
        shell: bash
        env:
          SLATES_TEST_CLI: "1"
        run: |
          set +e
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          echo "started $(date -u +%FT%TZ) at $(git rev-parse HEAD); $(uname -r)" > "$out/status.txt"
          for t in a_file_an_ended_mount_held_is_given_back \
                   a_file_kept_for_a_mount_that_survived_a_takeover_is_given_back_when_the_mount_ends \
                   the_handles_a_dead_daemon_issued_give_back_their_references_at_release \
                   the_lookups_a_dead_daemon_was_given_back_after_its_last_publication_stay_given_back \
                   a_fuse_mount_survives_its_daemons_kill_with_its_open_files_usable \
                   a_fuse_mount_whose_daemon_was_killed_is_ended_by_the_restarted_daemon; do
            cargo test -p slates-cli --test cli -- --test-threads=1 --nocapture --exact "$t" > "$out/$t.txt" 2>&1
            echo "$t exit $?" >> "$out/status.txt"
          done
          cargo test -p slates-server --test fuse_mount -- --test-threads=1 > "$out/fuse_mount.txt" 2>&1
          echo "server fuse_mount exit $? $(grep -E '^test result' "$out/fuse_mount.txt" | tail -1)" >> "$out/status.txt"
          echo "ended $(date -u +%FT%TZ)" >> "$out/status.txt"
          entries=""
          for f in "$out"/*; do
            b=$(tail -c 3000000 "$f" | git hash-object -w --stdin)
            entries="$entries$(printf '100644 blob %s\t%s' "$b" "$(basename "$f")")"$'\n'
          done
          tree=$(printf '%s' "$entries" | git mktree)
          c=$(git commit-tree "$tree" -m "results of run $GITHUB_RUN_ID")
          git push -q origin "$c:refs/heads/$RESULTS_BRANCH"
