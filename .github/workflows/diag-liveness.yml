name: diag-liveness-a223-merged

# Diagnostics only, never on main (A-223 window-rule plan, step 1): A-223 merged onto main. On both Windows and both
# Linux runners the merged branch's gates (fmt, clippy -D warnings, xtask check) and the machine and rt suites; on both
# Windows runners also the fix-undone arm (main plus A-223's two failing tests, without the fix). Each job pushes its
# result lines to diag-results/liveness-27-<os>, read by git fetch.
on:
  push:
    branches: ["diag-liveness-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  FIX_SHA: 097b88866d3c552ad5327e11f1da7e5c13c4f041
  RED_SHA: 5eb24825d648e71b490abeb1e4b254fcac8edc6f

jobs:
  windows:
    name: A-223 merged (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 170
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: The gates, the suites on the merged branch, and the fix-undone arm
        run: |
          set +e +o pipefail
          R=../results.txt
          echo "runner ${{ matrix.os }}, $(date -u)" > $R
          git worktree add ../src-fix "$FIX_SHA"
          git worktree add ../src-red "$RED_SHA"
          ( cd ../src-fix && git log -1 --format='fix %h %s' | cut -c1-90 ) | tee -a $R
          ( cd ../src-red && git log -1 --format='red %h %s' | cut -c1-90 ) | tee -a $R
          cd ../src-fix
          export CARGO_TARGET_DIR=../target-fix
          R=../results.txt
          status=0; cargo fmt --all --check > ../fmt.log 2>&1 || status=$?; head -20 ../fmt.log | cut -c1-200 | tee -a $R; echo "== fmt exit $status" | tee -a $R
          status=0; cargo xtask check > ../xtask.log 2>&1 || status=$?; tail -5 ../xtask.log | cut -c1-300 | tee -a $R; echo "== xtask check exit $status" | tee -a $R
          status=0; cargo clippy --locked -p slates-mem -p slates-ipc -p slates-rt -p slates-base -p slates-client -p slates-server -p slates-vfs -p slates-machine -p slates-bridge-winfsp -p slates-bridge-virtiofs -p slates-sdk-node -p slates-sdk-python -p slates-anchor -p slates-mcp -p slates-cluster --all-targets -- -D warnings > ../clippy.log 2>&1 || status=$?; grep -E '^(error|warning: unused)' ../clippy.log | head -30 | cut -c1-200 | tee -a $R; echo "== clippy crates exit $status" | tee -a $R
          status=0; cargo clippy --locked -p slates-cli -- -D warnings > ../clippy2.log 2>&1 || status=$?; grep -E '^error' ../clippy2.log | head -20 | cut -c1-200 | tee -a $R; echo "== clippy cli exit $status" | tee -a $R
          status=0; cargo test --locked -p slates-machine -p slates-rt > ../test-fix.log 2>&1 || status=$?
          grep -E '^test .*FAILED|^test .*(switch|asleep|attribution::tests::a_thread)|^test result|panicked' ../test-fix.log | cut -c1-400 | tee -a $R
          echo "== tests merged exit $status" | tee -a $R
          cd ../src-red
          export CARGO_TARGET_DIR=../target-red
          status=0; cargo test --locked -p slates-machine --lib -- wake:: > ../test-red1.log 2>&1 || status=$?
          grep -E '^test .*FAILED|^test result|panicked|WakeLatency|→' ../test-red1.log | cut -c1-500 | tee -a $R
          echo "== red wake exit $status" | tee -a $R
          status=0; cargo test --locked -p slates-rt --lib -- attribution:: > ../test-red2.log 2>&1 || status=$?
          grep -E '^test .*FAILED|^test result|panicked|→' ../test-red2.log | cut -c1-500 | tee -a $R
          echo "== red attribution exit $status" | tee -a $R
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/liveness-27-${{ matrix.os }}"
          git config user.name "diag-liveness"
          git config user.email "diag-liveness@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-liveness-27 results, ${{ matrix.os }}"
          git push -q -f origin "HEAD:refs/heads/$branch"

  linux:
    name: A-223 merged (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: The gates and the suites on the merged branch
        run: |
          set +e +o pipefail
          R=../results.txt
          echo "runner ${{ matrix.os }}, $(nproc) CPUs, $(date -u)" > $R
          git worktree add ../src-fix "$FIX_SHA"
          cd ../src-fix
          export CARGO_TARGET_DIR=../target-fix
          R=../results.txt
          git log -1 --format='fix %h %s' | cut -c1-90 | tee -a $R
          status=0; cargo fmt --all --check > ../fmt.log 2>&1 || status=$?; head -20 ../fmt.log | cut -c1-200 | tee -a $R; echo "== fmt exit $status" | tee -a $R
          status=0; cargo xtask check > ../xtask.log 2>&1 || status=$?; tail -5 ../xtask.log | cut -c1-300 | tee -a $R; echo "== xtask check exit $status" | tee -a $R
          status=0; cargo clippy --locked --workspace --all-targets -- -D warnings > ../clippy.log 2>&1 || status=$?; grep -E '^(error|warning: unused)' ../clippy.log | head -30 | cut -c1-200 | tee -a $R; echo "== clippy workspace exit $status" | tee -a $R
          status=0; cargo test --locked -p slates-machine -p slates-rt > ../test.log 2>&1 || status=$?
          grep -E '^test .*FAILED|^test result|panicked' ../test.log | cut -c1-400 | tee -a $R
          echo "== tests merged exit $status" | tee -a $R
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/liveness-27-${{ matrix.os }}"
          git config user.name "diag-liveness"
          git config user.email "diag-liveness@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-liveness-27 results, ${{ matrix.os }}"
          git push -q -f origin "HEAD:refs/heads/$branch"
