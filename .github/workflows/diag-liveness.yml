name: diag-liveness-a223-step6

# Diagnostics only, never on main (A-223 plan, step 6): the kept rule confirmed on the finished code (steps 4 and 5,
# adb383f26) against main (29ef4521d) and the x100 baseline (3603ab9d7, A-223 alone). Each runner at 2 shards
# and at its derived count, quiet and with two spinning shell loops per logical CPU, three rounds, the arms alternating.
# The 2-shard job also runs the gates and the suites on the finished tree. Results go to
# diag-results/liveness-42-<os>-<shards>.
on:
  push:
    branches: ["diag-liveness-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  RULE_SHA: adb383f26371138c8296d2e94bb89d84d8590c08
  X100_SHA: 3603ab9d7ac9e66e8a974e10a6161ea5a682a3bd
  MAIN_SHA: 29ef4521d9711fd380b7fde45f63e83bac3166c7

jobs:
  step6:
    name: A-223 step 6 (${{ matrix.os }}, ${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        shards: ["2", derived]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: Build the three arms' bench
        run: |
          set +e +o pipefail
          R=../results.txt
          ext=""; case "${{ matrix.os }}" in windows-*) ext=".exe";; esac
          mkdir -p ../arms
          for arm in main x100 rule; do
            case $arm in main) sha=$MAIN_SHA;; x100) sha=$X100_SHA;; rule) sha=$RULE_SHA;; esac
            git worktree add "../src-$arm" "$sha" > /dev/null 2>&1
            ( cd "../src-$arm" && CARGO_TARGET_DIR="../target-$arm" cargo build --release --locked -p slates-client --example provision_bench ) > ../build-$arm.log 2>&1 || { echo "== build $arm failed" | tee -a $R; grep -E '^error' -A6 ../build-$arm.log | head -30 >> $R; exit 1; }
            cp "../target-$arm/release/examples/provision_bench$ext" "../arms/bench-$arm$ext"
            ( cd "../src-$arm" && git log -1 --format="arm $arm %h %s" | cut -c1-90 ) | tee -a $R
          done
      - name: The gates and the suites on the finished tree
        if: matrix.shards == '2'
        run: |
          set +e +o pipefail
          R=../results.txt
          cd ../src-rule
          export CARGO_TARGET_DIR=../target-rule
          status=0; cargo fmt --all --check > ../fmt.log 2>&1 || status=$?; echo "== fmt exit $status" | tee -a $R
          status=0; cargo xtask check > ../xtask.log 2>&1 || status=$?; tail -3 ../xtask.log | cut -c1-200 | tee -a $R; echo "== xtask check exit $status" | tee -a $R
          case "${{ matrix.os }}" in
            windows-*) status=0; cargo clippy --locked -p slates-mem -p slates-ipc -p slates-rt -p slates-base -p slates-client -p slates-server -p slates-vfs -p slates-machine -p slates-bridge-winfsp -p slates-bridge-virtiofs -p slates-sdk-node -p slates-sdk-python -p slates-anchor -p slates-mcp -p slates-cluster --all-targets -- -D warnings > ../clippy.log 2>&1 || status=$?;;
            *) status=0; cargo clippy --locked --workspace --all-targets -- -D warnings > ../clippy.log 2>&1 || status=$?;;
          esac
          grep -E '^error' -A6 ../clippy.log | head -30 | cut -c1-200 | tee -a $R; echo "== clippy exit $status" | tee -a $R
          status=0; cargo test --locked -p slates-machine -p slates-rt -p slates-ipc > ../test.log 2>&1 || status=$?
          grep -E '^test .*FAILED|^test result: FAILED|panicked' ../test.log | cut -c1-300 | tee -a $R
          echo "ok lines $(grep -c '^test result: ok' ../test.log)" | tee -a $R; echo "== suites exit $status" | tee -a $R
          status=0; cargo test --locked -p slates-server --lib config > ../cfg.log 2>&1 || status=$?; grep -E '^test result|FAILED' ../cfg.log | tee -a $R; echo "== server config exit $status" | tee -a $R
      - name: The three arms, quiet and loaded, three rounds, alternating
        run: |
          set +e +o pipefail
          R=../results.txt
          command -v timeout > /dev/null || { if command -v gtimeout > /dev/null; then timeout() { gtimeout "$@"; }; else timeout() { shift; "$@"; }; fi; }
          ext=""; case "${{ matrix.os }}" in windows-*) ext=".exe";; esac
          cpus=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "$NUMBER_OF_PROCESSORS")
          echo "runner ${{ matrix.os }}, $cpus CPUs, shards ${{ matrix.shards }}, $(date -u)" | tee -a $R
          if [ "${{ matrix.shards }}" = derived ]; then unset PROVISION_BENCH_SHARDS; else export PROVISION_BENCH_SHARDS=${{ matrix.shards }}; fi
          for cond in quiet busy; do
            for round in 1 2 3; do
              for arm in main x100 rule; do
                pids=""
                if [ $cond = busy ]; then
                  for i in $(seq 1 $((cpus * 2))); do ( while :; do :; done ) & pids="$pids $!"; done
                fi
                echo "== $cond round=$round arm=$arm at $(date -u +%H:%M:%S)" | tee -a $R
                timeout 1500 "../arms/bench-$arm$ext" > ../run.log 2>&1; status=$?
                for p in $pids; do kill "$p" 2>/dev/null; done
                wait 2>/dev/null
                grep -E 'provisioning histogram|_cpu_|parks per 1000|^  provision\.(spinning_1|spinning_8|parked_1)_p99:|panicked' ../run.log | cut -c1-600 | tee -a $R
                echo "== exit $status" | tee -a $R
              done
            done
          done
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/liveness-42-${{ matrix.os }}-${{ matrix.shards }}"
          git config user.name "diag-liveness"
          git config user.email "diag-liveness@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-liveness-42 results, ${{ matrix.os }}, ${{ matrix.shards }}"
          git push -q -f origin "HEAD:refs/heads/$branch"
