name: DIAG bug-sweep 25, the liveness suite with the CPU-clock and nice-proof tests on every CI platform (not for main)

# A diagnostics branch, never merged. a_spinning_shard_stops_the_beat now waits on its shard's CPU clock;
# a_shard_starved_off_its_cpu_keeps_the_beat holds its precondition at any nice and charges the rule only for withheld
# beats; a_poller_is_forgotten_when_its_task_ends counts sweeps. The whole liveness suite three times on each platform,
# the pollers suite once; results pushed to diag-results/bug-sweep-25-<os>, watched with git fetch.

on:
  push:
    branches: [diag-bug-sweep-25]

permissions:
  contents: write

jobs:
  liveness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build
        run: |
          mkdir -p out
          features=""
          if [ "$RUNNER_OS" = Windows ]; then features="--no-default-features --features slates-machine/pure-hash"; fi
          echo "$features" > out/features
          cargo test -q -p slates-server --test liveness $features --no-run 2>&1 | tail -3
          cargo test -q -p slates-rt --test pollers --no-run 2>&1 | tail -3
      - id: runs
        name: The liveness suite three times, the pollers suite once
        run: |
          features=$(cat out/features)
          failed=0
          for run in 1 2 3; do
            cargo test -q -p slates-server --test liveness $features -- --nocapture > "out/liveness-$run.log" 2>&1 || failed=1
          done
          cargo test -q -p slates-rt --test pollers > out/pollers.log 2>&1 || failed=1
          exit $failed
      - name: Publish the results
        if: always()
        run: |
          {
            echo "run ${{ github.run_id }} commit ${{ github.sha }} ${{ matrix.os }} runs=${{ steps.runs.outcome }}"
            for log in out/*.log; do
              echo "== $log"
              grep -aE '^test result|\.\.\. FAILED|panicked at|starved shard:|spinning shard:|withheld the beat|did not starve|never stopped|beat stopped for' "$log" | cut -c1-400 | head -40
            done
          } > summary.txt
          git config user.name diag && git config user.email diag@invalid
          git checkout -q --orphan results && git rm -rfq . && git add summary.txt && git commit -qm "diag-bug-sweep-25 ${{ matrix.os }} results"
          git push -q origin "HEAD:refs/heads/diag-results/bug-sweep-25-${{ matrix.os }}"
