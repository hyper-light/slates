name: diag-winfsp-fixes
on:
  push:
    branches: ['diag-winfsp-fixes-*']
env:
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a
  # This agent's machine has no authenticated reader, so the lines a run is read for go where a public run page shows them.
  REPORT: >-
    report() { code=$1; { echo '```'; grep -aE 'WINFSP (LONG PATH|UNHELD|REFUSED HOLD)|^test |test result|panicked|left:|right:|refused:|version' out.txt | cut -c1-260 | tail -n 150; echo '```'; } >> "$GITHUB_STEP_SUMMARY";
    grep -aE 'WINFSP LONG PATH: first|WINFSP UNHELD: [0-9]+ drives|test result|panicked' out.txt | cut -c1-260 | tail -n 9 | sed 's/^/::notice::/'; exit "$code"; }
jobs:
  mac-gates:
    name: macOS gates
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo xtask check
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
  live:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    name: live winfsp (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    env:
      AWS_LC_SYS_PREBUILT_NASM: ${{ matrix.runner == 'windows-latest' && '0' || '' }}
      SLATES_TEST_CLI: "1"
      WINFSP_TEST_MOUNT: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM
        if: matrix.runner == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: Install WinFsp
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build
        run: cargo test -p slates-cli --test winfsp --no-run
      - name: Bridge oracles
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          eval "$REPORT"
          cargo test -p slates-bridge-winfsp --lib -- --test-threads=1 --nocapture > out.txt 2>&1; report $?
      - name: Hold channel, native
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          eval "$REPORT"
          cargo test -p slates-server --lib a_missed_deadline -- --test-threads=1 --nocapture > out.txt 2>&1; report $?
      - name: Long paths
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          eval "$REPORT"
          cargo test -p slates-cli --test winfsp -- --test-threads=1 --nocapture opens_past_a_thousand a_file_at_a_two_thousand > out.txt 2>&1; report $?
      - name: Refused holds
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          eval "$REPORT"
          cargo test -p slates-cli --test winfsp -- --test-threads=1 --nocapture a_release_the_anchor a_refused_mount_time > out.txt 2>&1; report $?
      - name: The whole live suite
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          eval "$REPORT"
          cargo test -p slates-cli --test winfsp -- --test-threads=1 --nocapture > out.txt 2>&1; report $?
