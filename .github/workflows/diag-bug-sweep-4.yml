name: DIAG bug-sweep 4, slates exec's FUSE flow with user namespaces unconfined (not for main)

# A diagnostics branch, never merged: the step the gates job gains, run alone first, since the FUSE exec flow has
# never run on any lane.

on:
  push:
    branches: [diag-bug-sweep-4]

jobs:
  exec:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Grant user_allow_other
        run: grep -qx user_allow_other /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf
      - name: fuse3 present
        run: command -v fusermount3 && ls -l /dev/fuse
      - name: The slates exec FUSE flow, user namespaces unconfined
        env:
          SLATES_TEST_CLI: "1"
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          status=0
          cargo test -p slates-cli --test cli -- --test-threads=1 --nocapture --exact \
            the_launcher_refuses_a_path_it_would_have_to_create_and_leaves_the_host_untouched \
            the_launcher_binds_a_volume_or_names_the_host_setting_that_forbids_it > exec.log 2>&1 || status=$?
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          cat exec.log
          if grep -q "SKIP" exec.log; then echo "the exec flow skipped where it must run"; exit 1; fi
          grep -q "test result: ok. 2 passed" exec.log
          exit "$status"
