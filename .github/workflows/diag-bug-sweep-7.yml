name: DIAG bug-sweep 7, crash-dump exclusion on Windows (not for main)

# A diagnostics branch, never merged: A-231 (GAPS 8a-win-dumps), a mutation: registration skipped, so the dump must carry the patterns (red-check).

on:
  push:
    branches: [diag-bug-sweep-7]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM
        uses: ilammy/setup-nasm@v1.5.2
      - name: WER's state on this runner
        run: |
          Get-Service WerSvc | Format-List Name,Status,StartType
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting' -ErrorAction SilentlyContinue | Format-List
          Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting' -ErrorAction SilentlyContinue | Format-List
          [System.Environment]::OSVersion.Version
      - name: Have WER write full crash dumps (LocalDumps)
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP 'wer-dumps'
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Force -Path $key | Out-Null
          New-ItemProperty -Force -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumps | Out-Null
          New-ItemProperty -Force -Path $key -Name DumpType -PropertyType DWord -Value 2 | Out-Null
          New-ItemProperty -Force -Path $key -Name DumpCount -PropertyType DWord -Value 10 | Out-Null
          "SLATES_WER_DUMP_DIR=$dumps" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test that a crash dump leaves out the private mappings
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: cargo test -p slates-server --test dump_exclusion -- --nocapture
      - name: The dumps folder afterwards
        if: ${{ !cancelled() }}
        run: Get-ChildItem -Force $env:SLATES_WER_DUMP_DIR | Format-Table Name,Length
      - name: Clippy the Windows crates
        if: ${{ !cancelled() }}
        run: cargo clippy -p slates-mem -p slates-ipc -p slates-server -p slates-mcp -p slates-anchor -p slates-client --all-targets -- -D warnings
      - name: Test the Win32 shared memory
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test -p slates-mem
      - name: Test the Windows anchor
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test -p slates-anchor -- --test-threads=1
