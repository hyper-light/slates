name: diag-liveness-rdv

# Diagnostics only, never on main. diag-liveness-13: held_rendezvous on windows-latest beside two spinners a CPU failed
# 3 of 3 at its wall bound (answered by the next daemon, exit 0, but not inside the 1 s claim wait); windows-11-arm
# passed at 619-630 ms. The test five times quiet and five beside two spinners a CPU, on both Windows runners, with
# its whole output kept. Results go to diag-results/liveness-14-<os>.
on:
  push:
    branches: ["diag-liveness-*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  windows:
    name: held rendezvous (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (x86_64)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1.5.2
      - name: clang-cl (arm64)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build
        run: cargo test --locked -p slates-cli --test held_rendezvous --no-run
      - name: Quiet, then beside two spinners a CPU
        env:
          SLATES_TEST_CLI: "1"
        run: |
          R=../results.txt
          echo "runner ${{ matrix.os }}, $NUMBER_OF_PROCESSORS CPUs, $(git log --oneline -1 | cut -c1-80), $(date -u)" > $R
          one() {
            status=0
            cargo test --locked -p slates-cli --test held_rendezvous -- --test-threads=1 --nocapture > ../h.log 2>&1 || status=$?
            grep -vE '^warning|^ +Compiling|^ +Finished|^ +Running|^$' ../h.log | grep -E 'panicked|round|held rendezvous|test result|answered|slates anchor' | cut -c1-300 | tee -a $R || true
            echo "== $1 exit $status" | tee -a $R
          }
          for run in 1 2 3 4 5; do one "quiet run $run"; done
          pids=""
          for i in $(seq 1 $((NUMBER_OF_PROCESSORS * 2))); do (while :; do :; done) & pids="$pids $!"; done
          trap 'for p in $pids; do kill $p 2>/dev/null; done' EXIT
          for run in 1 2 3 4 5; do one "loaded run $run"; done
      - name: Publish the results to a branch
        if: always()
        run: |
          branch="diag-results/liveness-14-${{ matrix.os }}"
          git config user.name "diag-liveness"
          git config user.email "diag-liveness@users.noreply.github.com"
          git checkout --orphan results-only
          git rm -rq --cached . || true
          cp ../results.txt results.txt 2>/dev/null || echo "no results" > results.txt
          git add results.txt
          git commit -qm "diag-liveness-14 results, ${{ matrix.os }}"
          git push -q origin "HEAD:refs/heads/$branch"
