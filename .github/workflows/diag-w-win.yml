name: diag-w-win

# w-win for main 01a20182 (2026-11-23), main's Windows reds. A diagnostics lane run only from `diag-measurer-w-win-*`
# branches, never main.
# - checks: on both Windows runners, item 3's new rendezvous test on the commit before its fix (red expected), then on
#   the fixed tree the tests of items 1 to 4 (green expected).
# - shards-hang: item 5, the Shards hand-off through the CLI that hung 20 minutes in run 45163517212. The test file is
#   run as CI runs it, at most 40 times, each bounded at 90 s (a passing run takes about 2 s); at the first hang the
#   instance's status, the process list and the markers this branch adds to the probe and its harness are printed.

on:
  push:
    branches: ["diag-measurer-w-win-*"]

env:
  CARGO_TERM_COLOR: never
  RED: 064674a8d0a7b9b934a30f54ad4aef10dc7bccbd

jobs:
  red:
    name: red arm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: "Red: item 3's rendezvous test on the commit before its fix"
        run: |
          red="$(cygpath -u "$RUNNER_TEMP")/red"; mkdir -p "$red"
          git archive --format=tar "$RED" | tar -x -f - -C "$red"
          cd "$red"
          set +e
          CARGO_TARGET_DIR="$RUNNER_TEMP/red-target" cargo test -p slates-ipc --lib an_anchor_that_lets_go 2>&1 | grep -v '^\s*Compiling '
          code=${PIPESTATUS[0]}
          echo "red arm exit $code"
          if [ "$code" -eq 0 ]; then echo "UNEXPECTED: the test passed without its fix"; exit 1; fi

  driver-ab:
    name: client driver A/B (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: ilammy/setup-nasm@v1.5.2
      - name: Build both arms (the fix, and the commit before it)
        run: |
          root="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$root/before"
          git archive --format=tar "$RED" | tar -x -f - -C "$root/before"
          cargo test -p slates-client --test driver --no-run 2>&1 | grep -v '^\s*Compiling '
          (cd "$root/before" && CARGO_TARGET_DIR="$RUNNER_TEMP/before-target" cargo test -p slates-client --test driver --no-run 2>&1 | grep -v '^\s*Compiling ')
      - name: "Run each test alone, each arm, three rounds, each run bounded at 60 s"
        run: |
          root="$(cygpath -u "$RUNNER_TEMP")"
          fixed=$(cargo test -p slates-client --test driver --no-run 2>&1 | sed -n 's/.*Executable .*(\(.*\.exe\)).*/\1/p' | tail -1 | tr '\\' '/')
          before=$(cd "$root/before" && CARGO_TARGET_DIR="$RUNNER_TEMP/before-target" cargo test -p slates-client --test driver --no-run 2>&1 | sed -n 's/.*Executable .*(\(.*\.exe\)).*/\1/p' | tail -1 | tr '\\' '/')
          case "$before" in /*|[A-Za-z]:*) ;; *) before="$root/before/$before";; esac
          echo "fixed=$fixed before=$before"
          tests="a_call_whose_daemon_is_gone_ends_before_the_old_reply_deadline a_chained_call_is_reported_at_each_step_until_it_ends a_held_daemons_calls_are_waited_for_and_answered_and_a_cancel_releases_at_once a_ready_call_is_reported_once_until_it_is_finished every_call_ends_and_the_loop_is_never_held_across_restart_and_death"
          for round in 1 2 3; do
            for arm in fixed before; do
              exe=$fixed; [ "$arm" = before ] && exe=$before
              for name in $tests; do
                log="$root/driver-$arm-$round-$name.log"
                started=$(date +%s)
                timeout 60 "$exe" --exact "$name" --test-threads=1 > "$log" 2>&1; code=$?
                echo "=== round $round $arm $name: exit $code after $(( $(date +%s) - started )) s"
                if [ "$code" -ne 0 ]; then
                  grep -E 'panicked at|after the daemon|DaemonGone|answered after|refused at once|non-vacuous|^  left|^ right|has been running' "$log" | head -12
                fi
              done
            done
          done

  shards-hang:
    name: shards hang (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: ilammy/setup-nasm@v1.5.2
      - name: Build the Shards CLI tests
        env:
          AWS_LC_SYS_PREBUILT_NASM: "0"
        run: cargo test -p slates-cli --test shards --no-run 2>&1 | grep -v '^\s*Compiling '
      - name: Run the file until it hangs, at most 40 times
        env:
          AWS_LC_SYS_PREBUILT_NASM: "0"
          SLATES_TEST_CLI: "1"
        run: |
          exe=$(cargo test -p slates-cli --test shards --no-run 2>&1 | sed -n 's/.*Executable .*(\(.*\.exe\)).*/\1/p' | tail -1 | tr '\\' '/')
          echo "exe=$exe"
          slates=target/debug/slates.exe
          for i in $(seq 1 40); do
            log="$RUNNER_TEMP/shards-$i.log"
            "$exe" --nocapture > "$log" 2>&1 &
            bg=$!
            waited=0
            while kill -0 "$bg" 2>/dev/null && [ "$waited" -lt 90 ]; do sleep 1; waited=$((waited + 1)); done
            if kill -0 "$bg" 2>/dev/null; then
              echo "=== iteration $i HUNG past ${waited} s"
              instance=$(sed -n 's/.*instance \(cr[0-9]*\) up.*/\1/p' "$log" | head -1)
              echo "--- the resync test's instance: $instance"
              "$slates" --instance "$instance" status 2>&1 | grep -i 'shards\|holder\|resync\|pid\|attach' || true
              echo "--- processes, with their parents and command lines"
              pwsh -NoProfile -Command "Get-CimInstance Win32_Process | Where-Object { \$_.Name -match 'slates|shards' } | ForEach-Object { '{0} parent {1} started {2}: {3}' -f \$_.ProcessId, \$_.ParentProcessId, \$_.CreationDate, \$_.CommandLine }" || true
              echo "--- the run's log whole, derived values alone left out"
              grep -v 'slates daemon: [a-z_0-9]* = ' "$log"
              winpid=$(cat "/proc/$bg/winpid" 2>/dev/null || echo "")
              [ -n "$winpid" ] && taskkill //T //F //PID "$winpid" || true
              exit 1
            fi
            wait "$bg"; code=$?
            echo "iteration $i exit $code after ${waited} s"
            if [ "$code" -ne 0 ]; then
              grep -v 'slates daemon: [a-z_0-9]* = \|slates anchor: a \|slates anchor: issuer' "$log" | tail -80
            fi
          done
          echo "no hang in 40 runs"
