name: diag-w-win

# w-win for main 01a20182 (2026-11-23), main's Windows reds. A diagnostics lane run only from `diag-measurer-w-win-*`
# branches, never main.
# - checks: on both Windows runners, item 3's new rendezvous test on the commit before its fix (red expected), then on
#   the fixed tree the tests of items 1 to 4 (green expected).
# - shards-hang: item 5, the Shards hand-off through the CLI that hung 20 minutes in run 45163517212. The test file is
#   run as CI runs it, at most 40 times, each bounded at 90 s (a passing run takes about 2 s); at the first hang the
#   instance's status, the process list and the markers this branch adds to the probe and its harness are printed.

on:
  push:
    branches: ["diag-measurer-w-win-*"]

env:
  CARGO_TERM_COLOR: never
  RED: 064674a8d0a7b9b934a30f54ad4aef10dc7bccbd

jobs:
  shards-hang:
    name: shards hang (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: ilammy/setup-nasm@v1.5.2
      - name: Build the Shards CLI tests
        env:
          AWS_LC_SYS_PREBUILT_NASM: "0"
        run: cargo test -p slates-cli --test shards --no-run 2>&1 | grep -v '^\s*Compiling '
      - name: Run the file until it hangs, at most 40 times
        env:
          AWS_LC_SYS_PREBUILT_NASM: "0"
          SLATES_TEST_CLI: "1"
        run: |
          exe=$(cargo test -p slates-cli --test shards --no-run 2>&1 | sed -n 's/.*Executable .*(\(.*\.exe\)).*/\1/p' | tail -1 | tr '\\' '/')
          echo "exe=$exe"
          slates=target/debug/slates.exe
          for i in $(seq 1 40); do
            log="$RUNNER_TEMP/shards-$i.log"
            "$exe" --nocapture > "$log" 2>&1 &
            bg=$!
            waited=0
            while kill -0 "$bg" 2>/dev/null && [ "$waited" -lt 90 ]; do sleep 1; waited=$((waited + 1)); done
            if kill -0 "$bg" 2>/dev/null; then
              echo "=== iteration $i HUNG past ${waited} s"
              echo "--- processes, with their parents and command lines"
              pwsh -NoProfile -Command "Get-CimInstance Win32_Process | Where-Object { \$_.Name -match 'slates|shards' } | ForEach-Object { '{0} parent {1} started {2}: {3}' -f \$_.ProcessId, \$_.ParentProcessId, \$_.CreationDate, \$_.CommandLine }" || true
              cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
              if [ -x "$cdb" ]; then
                for pid in $(pwsh -NoProfile -Command "Get-CimInstance Win32_Process | Where-Object { \$_.Name -match 'slates|shards' } | ForEach-Object { \$_.ProcessId }"); do
                  pid=$(echo "$pid" | tr -d '\r')
                  echo "--- every thread's stack of process $pid"
                  timeout 120 "$cdb" -pv -p "$pid" -y "$(pwd -W)\\target\\debug;$(pwd -W)\\target\\debug\\deps" -c "~*k 30; qd" 2>&1 | grep -v '^\*\*\*\|Symbol search path\|Executable search path\|^ModLoad\|^$' | head -400 || true
                done
              else
                echo "--- no cdb on this image at $cdb"
              fi
              for instance in $(sed -n 's/.*instance \(c[a-z][0-9]*\) up.*/\1/p' "$log" | sort -u); do
                echo "--- status of $instance, bounded at 20 s"
                timeout 20 "$slates" --instance "$instance" status 2>&1 | head -12 || echo "(status gave no answer in 20 s)"
              done
              echo "--- the run's log whole, derived values alone left out"
              grep -v 'slates daemon: [a-z_0-9]* = ' "$log"
              winpid=$(cat "/proc/$bg/winpid" 2>/dev/null || echo "")
              [ -n "$winpid" ] && taskkill //T //F //PID "$winpid" || true
              exit 1
            fi
            wait "$bg"; code=$?
            echo "iteration $i exit $code after ${waited} s"
            if [ "$code" -ne 0 ]; then
              grep -v 'slates daemon: [a-z_0-9]* = \|slates anchor: a \|slates anchor: issuer' "$log" | tail -80
            fi
          done
          echo "no hang in 40 runs"
