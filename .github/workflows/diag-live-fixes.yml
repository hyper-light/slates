# Diagnostics for the live-fixes agent (bug 2: a live-shipped volume conforms as a plain one; never on main). Triggered
# only by pushes to diag-live-fixes-[0-9]* branches. Each job publishes its text results to
# diag-live-fixes-results-<run>-<runner>, one commit per step, so the agent reads them with git fetch.
name: diag-live-fixes

on:
  push:
    branches: ['diag-live-fixes-[0-9]*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  WINFSP_MSI_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_MSI_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a

jobs:
  linux:
    name: live fleet suite and the live-shipped conformance pair on ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      RESULTS_BRANCH: diag-live-fixes-results-${{ github.run_id }}-ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: The results publisher
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'EOF'
          #!/bin/bash
          # One commit per call on the results branch: every *.txt and records.tgz under results/; a failed publish
          # is reported and does not end the job.
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          cd "$GITHUB_WORKSPACE" || exit 0
          mkdir -p results
          tar czf results/records.tgz target/pair 2>/dev/null || true
          entries=""
          for f in results/*; do
            [ -f "$f" ] || continue
            blob=$(git hash-object -w "$f") || exit 0
            entries="$entries$(printf '100644 blob %s\t%s' "$blob" "$(basename "$f")")"$'\n'
          done
          tree=$(printf '%s' "$entries" | git mktree) || exit 0
          parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID") || exit 0
          if git push origin "$commit:refs/heads/$RESULTS_BRANCH"; then
            echo "$commit" > "$RUNNER_TEMP/results-parent"
          else
            echo "::warning::could not publish the results"
          fi
          EOF
          chmod +x "$RUNNER_TEMP/publish.sh"
          mkdir -p results
          { echo "tree $(git rev-parse HEAD) $(date -u +%FT%TZ)"; nproc; uname -a; } > results/00-image.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Suite tools
        run: |
          sudo apt-get update && sudo apt-get install -y strace nfs-common fuse3 inotify-tools ripgrep sqlite3 vim
          grep -qx user_allow_other /etc/fuse.conf 2>/dev/null || echo user_allow_other | sudo tee -a /etc/fuse.conf
      - name: The live fleet suite (three daemon processes)
        if: ${{ !cancelled() }}
        run: |
          cargo build -p slates-cli --tests --bins
          SLATES_TEST_CLI=1 timeout 2400 cargo test -p slates-cli --test live_fleet -- --test-threads 2 --nocapture 2>&1 \
            | grep -vE '^slates-cluster: fleet: HostId' > results/live_fleet_full.log || true
          grep -E '^test |test result|panicked at|^live |^forming:' results/live_fleet_full.log > results/10-live_fleet.txt || true
          grep -A3 'panicked at' results/live_fleet_full.log | head -400 >> results/10-live_fleet.txt || true
          rm -f results/live_fleet_full.log
          bash "$RUNNER_TEMP/publish.sh"
      - name: The plain and live-shipped conformance pair
        if: ${{ !cancelled() }}
        run: |
          for suite in fsx fsstress pjdfstest; do
            for arm in plain live; do
              flag=""; [ "$arm" = live ] && flag="--live-ship"
              start=$(date +%s)
              timeout --signal=INT 2400 cargo xtask conformance run --suite $suite $flag \
                --records target/pair/$arm/records --scratch target/pair/$arm/scratch --keep > results/run-$suite-$arm.log 2>&1
              code=$?
              echo "$suite $arm exit=$code seconds=$(( $(date +%s) - start )) load=$(cut -d' ' -f1-3 /proc/loadavg)" >> results/20-conformance.txt
              tail -60 results/run-$suite-$arm.log >> results/20-conformance.txt
              rm -f results/run-$suite-$arm.log
              bash "$RUNNER_TEMP/publish.sh"
            done
          done
      - name: Compare the live-shipped runs with the plain ones
        if: ${{ !cancelled() }}
        run: |
          cargo xtask conformance compare --plain target/pair/plain --live target/pair/live > results/30-compare.txt 2>&1 || true
          bash "$RUNNER_TEMP/publish.sh"
      - name: The stopped-candidates test
        if: ${{ !cancelled() }}
        env:
          SLATES_TEST_LIVE_CONFORMANCE: "1"
        run: |
          SLATES_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/slates" timeout 1800 \
            cargo test -p xtask a_live_shipped_volume_makes_a_writer_wait -- --nocapture > results/40-stopped.txt 2>&1 || true
          bash "$RUNNER_TEMP/publish.sh"
      - name: Publish whatever was measured
        if: always()
        run: if [ -f "$RUNNER_TEMP/publish.sh" ]; then bash "$RUNNER_TEMP/publish.sh"; fi

  windows:
    name: the live-shipped conformance pair on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
      RESULTS_BRANCH: diag-live-fixes-results-${{ github.run_id }}-${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: The results publisher
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'EOF'
          #!/bin/bash
          export GIT_AUTHOR_NAME=diag GIT_AUTHOR_EMAIL=diag@users.noreply.github.com
          export GIT_COMMITTER_NAME=diag GIT_COMMITTER_EMAIL=diag@users.noreply.github.com
          cd "$GITHUB_WORKSPACE" || exit 0
          mkdir -p results
          tar czf results/records.tgz target/pair 2>/dev/null || true
          entries=""
          for f in results/*; do
            [ -f "$f" ] || continue
            blob=$(git hash-object -w "$f") || exit 0
            entries="$entries$(printf '100644 blob %s\t%s' "$blob" "$(basename "$f")")"$'\n'
          done
          tree=$(printf '%s' "$entries" | git mktree) || exit 0
          parent=$(cat "$RUNNER_TEMP/results-parent" 2>/dev/null || true)
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "results of run $GITHUB_RUN_ID") || exit 0
          if git push origin "$commit:refs/heads/$RESULTS_BRANCH"; then
            echo "$commit" > "$RUNNER_TEMP/results-parent"
          else
            echo "::warning::could not publish the results"
          fi
          EOF
          chmod +x "$RUNNER_TEMP/publish.sh"
          mkdir -p results
          echo "tree $(git rev-parse HEAD) $(date -u +%FT%TZ)" > results/00-image.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: clang-cl (arm64)
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl -ErrorAction SilentlyContinue).Source
          if (-not $clang) { $clang = "C:\Program Files\LLVM\bin\clang-cl.exe" }
          if (-not (Test-Path $clang)) { throw "clang-cl is not on this image" }
          (Split-Path $clang) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX_aarch64_pc_windows_msvc=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install WinFsp (pinned, as ci.yml)
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile $msi
          $found = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($found -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's installer hashes $found, not $env:WINFSP_MSI_SHA256" }
          $install = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp's installer answered $($install.ExitCode)" }
          "C:\Program Files (x86)\WinFsp\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: The plain and live-shipped pair
        if: ${{ !cancelled() }}
        timeout-minutes: 150
        shell: bash
        run: |
          for suite in fsx winfstest; do
            for arm in plain live; do
              flag=""; [ "$arm" = live ] && flag="--live-ship"
              start=$(date +%s)
              timeout 2400 cargo xtask conformance run --suite $suite $flag \
                --records target/pair/$arm/records --scratch target/pair/$arm/scratch --keep > results/run-$suite-$arm.log 2>&1
              code=$?
              echo "$suite $arm exit=$code seconds=$(( $(date +%s) - start ))" >> results/20-conformance.txt
              tail -60 results/run-$suite-$arm.log >> results/20-conformance.txt
              rm -f results/run-$suite-$arm.log
              bash "$RUNNER_TEMP/publish.sh"
            done
          done
      - name: Compare
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo xtask conformance compare --plain target/pair/plain --live target/pair/live > results/30-compare.txt 2>&1 || true
          bash "$RUNNER_TEMP/publish.sh"
      - name: Publish whatever was measured
        if: always()
        shell: bash
        run: if [ -f "$RUNNER_TEMP/publish.sh" ]; then bash "$RUNNER_TEMP/publish.sh"; fi
