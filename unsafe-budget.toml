# The unsafe budget (Phase 0, 2026-09-05; Ada: "we SHOULD find a way to minimize unsafe blocks").
#
# `cargo xtask unsafe` counts `unsafe` blocks, functions and impls in each shipped crate's sources
# (comments and tests excluded) and fails when a crate exceeds its budget; `--tighten` lowers a
# budget to the current count. A budget only goes down. Raising one is an edit here that names the
# new site and its reason. What each crate still holds, as of the counts below:
#
# slates-machine (45): Apple sysctl, mach host statistics and IOKit power queries, for which no
#   safe wrapper exists (7 sites, one helper each); the macOS thread-affinity hint (1); the
#   file-backed map of the profile segment (1); the Win32 facts, probes and section (the rest,
#   compiled only for Windows) — raised 43 → 44 on 2026-09-14 for `GetProcessAffinityMask`, the
#   mask the core matrix puts back on the calling thread after it pinned it (a spawned daemon
#   inherited the one-core mask: docs/bugs/2026-09-14-core-matrix-leaves-the-anchor-pinned-to-one-core.md).
#   Raised 44 → 45 on 2026-09-17 for clock::monotonic_ns's QueryInterruptTimePrecise output pointer:
#   one Win32 FFI query with no safe wrapper, a common boot origin for cross-process heartbeats.
#   Raised 45 → 49 on 2026-09-22 for the wake probe (`wake.rs`, docs/bugs/2026-09-22-wake-probe-mixes-two-
#   events-and-reports-an-unconverged-tail.md), which confirms a waiter asleep and learns each thread's CPU:
#   macOS `pthread_cpu_number_np`, `pthread_mach_thread_np` and `thread_info` (3) and Windows
#   `GetCurrentProcessorNumber` (1) — FFI with no safe wrapper; Linux uses rustix and `/proc` (none).
# slates-mem (19): the Windows working-set raise and VirtualLock/VirtualUnlock (memmap2 covers
#   Unix) (4); the shared memory object of §4.7 (`shared.rs`, added 2026-09-05 for Phase 2):
#   the file-backed map of a memory object (1), the descriptor a child inherits (1), the one
#   atomic word view both objects share (`word_view`, 1; it replaced the two per-width views
#   2026-09-26), and the Windows section (create, open, view, drop, the two byte views and the
#   lock: 8); the sparse object (2026-09-26, the anchor segment and content object on a
#   `SEC_RESERVE` section — CI run 36202635768's 167 GB layout refused 1450 on a 16 GB runner):
#   `GetSystemInfo` for the commit granule (1), `VirtualAlloc(MEM_COMMIT)` of a range (1), and the
#   two committed-range views (2).
# slates-rt (48): rustix marks kevent unsafe because the kernel fills the buffer (3); io-uring
#   marks push unsafe for buffer lifetimes (2); the RawWaker vtable is unsafe by signature (5);
#   the IOCP calls are Win32 (6); the UDP readiness registration (§4.10a, added 2026-09-07): the
#   kqueue read-filter `kevent` (unsafe by signature, one change record, 1) and the epoll
#   `BorrowedFd::borrow_raw` of a live socket for the `epoll_ctl` that arms either interest (1 — the
#   readable and writable registrations share one helper since 2026-09-14, when the epoll re-add
#   defect was fixed: docs/bugs/2026-09-14-epoll-readiness-re-add-eexist.md; 49 → 48); the TCP
#   write-readiness registration (§4.6, added 2026-09-09 for the async loopback server): the kqueue
#   write-filter `kevent` (1).
#   The Windows socket stack (added 2026-09-09, compiled only for Windows — the daemon and the
#   QUIC fleet transport run there; TCP stays macOS/Linux for the NFS mount): the **AFD readiness
#   reactor** `afd.rs` that gives the completion-native IOCP driver edge readiness the way wepoll/mio
#   do — the ntdll FFI windows-sys does not wrap (`NtCreateFile` of `\Device\Afd`, `NtDeviceIoControlFile`
#   for `IOCTL_AFD_POLL`, `RtlNtStatusToDosError`, `CloseHandle` on drop), `WSAIoctl(SIO_BASE_HANDLE)`
#   for the base socket, a zeroed `OVERLAPPED` poll block, and the `Box::into_raw`/`from_raw` that leak
#   one block into the kernel per poll and reclaim it on completion (11); the **Winsock 2 datagram
#   seam** `netsys.rs` (the platform UDP arm behind the cross-platform socket) — `WSAStartup`, a zeroed
#   `WSADATA`, `WSAGetLastError`, `closesocket` on drop, `socket`/`ioctlsocket(FIONBIO)`/`bind`/
#   `getsockname`/`recvfrom`/`sendto`, and the `S_addr` address-union read (14); and the IOCP driver's
#   `iocp.rs` AFD wiring — associating the AFD device with the port, arming a poll, and reclaiming a
#   delivered block (3). All are Win32/ntdll FFI without a safe wrapper, each with a `// SAFETY:` line.
#   The simulation clock (`sim.rs`, 2026-09-16): the runtime holds the clock's allocation as a raw
#   pointer and frees it in `Drop` with `Box::from_raw` after the contexts are reclaimed (1) — a `Box`
#   field's move was a unique retag that invalidated the drivers' shared borrows under Stacked Borrows
#   (Miri, the differential test); the `&'static` the drivers hold is derived from that pointer (1,
#   the site the box version already had). 65 → 66.
#   io_uring socket readiness (`uring.rs` `arm_poll`, 2026-09-16): one `unsafe` submission-queue push
#   of a `PollAdd` SQE (no buffer; the fd is borrowed by number for the single submission), the same
#   shape `arm_kick` already had. `register_readable`/`register_writable` were stubs returning
#   `DriverRefused`, so async TCP and the UDP transport were dead the first time they awaited readiness
#   on io_uring (docs/bugs/2026-09-16-io-uring-driver-carries-no-socket-readiness.md). 66 → 67.
#   The long-poll attribution (`attribution.rs`, 2026-09-25, §4.3 A-31): Linux's per-thread voluntary
#   context switches through `getrusage(RUSAGE_THREAD)` — rustix offers no `getrusage`, so one libc
#   call over a zeroed `rusage` this frame owns (1, Linux only). The ceiling had the room (58 of 59).
# slates-wire (4): the CRC32C hardware intrinsics behind runtime feature detection.
# slates-wire-derive (0).
# slates-base (6): rustix marks kevent unsafe because the kernel fills the output list; one
#   registration and one drain of the macOS/BSD directory watcher (2); the Windows fingerprint
#   through the stable Win32 file-information calls (two zeroed records, two calls: 4), since
#   the standard library's handle metadata is unstable on 1.98.
# slates-vfs (0): the volume core is safe Rust over the arenas and slabs of slates-mem; the block
#   layout is read and written through byte slices, never a cast.
# slates-anchor (6): the segment is byte slices and the atomic views of slates-mem; the Windows
#   job object that ends the daemon with the anchor (`supervise.rs`, added 2026-09-05 with the
#   CLI of Phase 2 task 5): create, the zeroed limit record, set the kill-on-close limit, assign
#   the child, and the two closes (6), compiled only for Windows.
# slates-ipc (35): the macOS wait-on-address and wake-by-address calls libc exposes without a
#   safe wrapper (`wake.rs`), each on a live word of a shared mapping (2); the Linux rendezvous
#   adopting the region descriptor it duplicated for the handoff before sending it (1) and
#   borrowing the shard's leaked kick descriptor to duplicate it for the client (1); and the
#   Windows named-Event wake (`wake.rs`, added 2026-09-09, compiled only for Windows): the four
#   Win32 calls windows-sys exposes without a safe wrapper — `CreateEventW` to create-or-open the
#   named auto-reset Event, `SetEvent` and `WaitForSingleObject` on the handle it owns, and
#   `CloseHandle` on drop (4). The consumer-capability delivery channel (`delivery.rs`, added
#   2026-09-14, §4.13 / GAP-A9-9 — the inherited descriptor): on Unix, `pre_exec` clearing
#   close-on-exec on the one descriptor in the forked child (unsafe by signature; the closure is one
#   async-signal-safe `fcntl`) (1), borrowing the harness-named number for the `fstat` that checks it
#   before adoption (1), and adopting it once checked (1); on Windows, compiled only there, the Win32
#   calls windows-sys exposes without a safe wrapper — `CreatePipe`, `WriteFile`, `CloseHandle` on
#   drop, `DuplicateHandle` for the inheritable duplicate that lives only across the spawn,
#   `GetStdHandle`, the two `InitializeProcThreadAttributeList` calls (size query, init),
#   `UpdateProcThreadAttribute`, `DeleteProcThreadAttributeList` on drop, the two zeroed records
#   (`STARTUPINFOEXW`, `PROCESS_INFORMATION`), `CreateProcessW` itself, `WaitForSingleObject`,
#   `GetExitCodeProcess`, `TerminateProcess`, `SetHandleInformation`, `GetFileType`, `PeekNamedPipe`,
#   `ReadFile` for the record, the `ReadFile` loop that drains a captured output with the
#   `GetLastError` that tells its end of stream, and the three `GetLastError` reads beside the rest
#   (24). The standard library's `Command` cannot
#   restrict inheritance on Windows (the handle-list attribute is unstable on the pinned toolchain), so
#   the spawn is made here like `slates-rt`'s AFD reactor: from the headers, each call with its
#   invariant stated.
# slates-server (5): the Linux doorbell thread borrowing the daemon's listening socket by
#   number for one readiness poll (`doorbell.rs`); the Windows liveness probe of a client's
#   process (`peer.rs`, added 2026-09-05 with the dead-client reclaim): open, wait with a zero
#   timeout, close (3), compiled only for Windows; and the daemon adopting the anchor's inherited
#   NFS-listener descriptor (`daemon.rs`, added 2026-09-09 for the anchor-held listener, §4.6):
#   `OwnedFd::from_raw_fd` on the number the anchor handed over across the spawn (1, Unix only).
# slates-db (0): records, indexes and the log are safe Rust over the segment's byte slices.
# slates-merge (0): the verdict is a pure sweep over ranges and a memcmp; safe Rust throughout.
# slates-client (0): the rings and the rendezvous are slates-ipc's; the client is safe Rust.
# slates-cli (4): the stop flag's handlers (`signal.rs`): `signal(2)` for SIGINT and SIGTERM on
#   Unix (1), and on Windows the console control handler, an `unsafe extern` function by
#   signature and its registration (2); the launcher's `unshare_unsafe` (`exec.rs`, Linux),
#   marked unsafe because it changes every thread's namespace, sound in the single-threaded
#   pre-exec launcher (1).
# slates-bridge-fuse (0): the FUSE ABI codec is byte slices read and written in field order
#   through a sequential reader/writer (`wire.rs`), never a cast; the /dev/fuse transport and
#   mount (Unix, added later) will carry their own budgeted sites.
# slates-land (3): the macOS libc calls rustix does not wrap, each on a descriptor the writer
#   owns: fcntl(F_BARRIERFSYNC) as the data barrier, fcntl(F_FULLFSYNC) as the media barrier,
#   renameatx_np(RENAME_SWAP) as the exchange.
#   the Winsock `getsockopt(SO_RCVBUF)` of a live socket (§4.10a, added 2026-09-10 for the
#   demultiplexer's per-session queue sizing; Win32, unsafe by signature, 1).
#
# slates-archive (0): the archive format is byte buffers written and read in field order
#   through a sequential reader/writer (`wire.rs`), never a cast; content-addressed and verified
#   by BLAKE3.

[budget]
slates-machine = 49
slates-mem = 19
# 2026-09-14 (+11, registry slot reclamation — `docs/bugs/2026-09-14-shard-registry-leaks-every-slot-for-the-process-lifetime.md`):
# `driver::KickFd` — the slot-owned kick descriptor: `Sync`/`Send` impls (2), `with`, `fd`, `close` (3
# blocks reading or taking the `UnsafeCell` under the `closed` flag); `registry::register` (the previous
# entry's drop after the generation moved past every reader; the `'static` borrow of the kick fd into
# the boxed entry: 2), `registry::unregister` (the retired entry's borrow after the join: 1),
# `registry::entry` (the live-or-retired entry deref under the generation check: 1),
# `registry::lend_pair_ring` (the entry borrow and the ring's `'static` lend: 2). Each site's `SAFETY:`
# names the slot protocol invariant it rests on; the loom lane's coverage of this crate is owed.
# 2026-09-14 (+4, the context reclaimed — `docs/bugs/2026-09-14-shard-context-and-fleet-sockets-leak-per-boot.md`):
# `ShardContext::build` (the `&'static` handed out over the box `Box::into_raw` produced: 1),
# `registry::reclaim_context` (the `Box::from_raw` of that same pointer on the owning thread after its
# loop returned, when no reference is live: 1), `ShardContext::keep` (a per-shard singleton's borrow
# extended to `'static` over a heap box the context drops last, after its tasks: 1), and
# `registry::read_counted` (the entry deref under the reader count, which a re-registration waits on
# before freeing the previous entry: 1 — the counted form every foreign reader now takes).
# 2026-09-14 (+2, the simulation's leaks closed): `registry::register`'s `RegisterKick::Sim` arm (the
# simulated flags' `'static` borrow into the boxed entry, the descriptor's pattern: 1) and
# `SimRuntime::new` (the clock's `'static` borrow for the drivers over the box the runtime owns and drops
# after its contexts: 1).
# 2026-09-14 (−1, the KIND lane: the epoll one-shot re-arm — `docs/bugs/2026-09-14-epoll-readiness-re-add-eexist.md`):
# the second `BorrowedFd::borrow_raw` of the readiness re-add is gone with the re-add itself (the
# descriptor is re-armed with `EPOLL_CTL_MOD` through the one remaining borrow).
# 2026-09-19 (-8): generational Unix/simulation kicks remove KickFd's UnsafeCell,
# unsafe Send/Sync, escaping descriptor borrows, and self-references. Registry retirement
# pins foreign borrows before closing. Forced-overlap regression fails before and passes after.
slates-rt = 59
slates-base = 6
slates-vfs = 0
slates-land = 3
slates-anchor = 6
slates-db = 0
slates-ipc = 35
# 2026-09-19 (-1): Linux rendezvous awaits driver readiness; no raw-fd polling thread.
slates-server = 4
slates-client = 0
slates-cli = 4
slates-wire = 4
# slates-bridge-core (0): the operation layer is the trait, neutral data structs and the
# volume-core implementation; no syscalls, no unsafe.
slates-bridge-core = 0
slates-bridge-fuse = 0
# slates-bridge-nfs (0): the XDR/RPC codec is bounds-checked byte slices; the blocking demo socket uses
# safe std::net, and the production async server (`serve_connection_async`) uses the runtime's safe
# `TcpStream` (the socket unsafe lives in slates-rt) — no unsafe in this crate.
slates-bridge-nfs = 0
slates-merge = 0
# slates-transport (0): the control-datagram codec is byte slices read and written in field order
# through a bounded reader, never a cast; the owned QUIC dialect and the AEAD seal (later slices, §4.10a)
# will carry their own budgeted sites (the rt UDP driver's unsafe lives in slates-rt).
slates-transport = 0
# slates-mcp (0): the JSON-RPC dispatch is safe Rust over serde_json and the client SDK.
slates-mcp = 0
slates-archive = 0
slates-wire-derive = 0
# slates-cluster (0): the register-commit dispatch is safe Rust — spawned tasks, a channel, and the
# db acceptance rules over the transport; no raw pointers.
slates-cluster = 0
# slates-sdk-python (0): the PyO3 bindings are safe Rust over the typed client; the FFI unsafety lives
# in PyO3's macro-generated code, not this crate's own source (which has no `unsafe` block).
slates-sdk-python = 0
# slates-sdk-node (0): the napi-rs bindings are safe Rust over the typed client; the FFI unsafety lives
# in napi's macro-generated code, not this crate's own source (which has no `unsafe` block).
slates-sdk-node = 0
# slates-bridge-fskit (9): the FSKit shim wire codec is safe Rust (bounds-checked byte slices onto the
# Bridge trait, exactly like the NFS codec). The 9 sites are all in `src/ffi.rs`, the `test-harness`
# in-process transport (§4.6): two `extern "C"` entries and the raw-pointer handling they need to hand
# the Swift FSVolume handler a C ABI over `serve` — sanctioned FFI unsafe, each block with a SAFETY
# note. The shipped crate (no `test-harness` feature) builds none of it; the count is a text scan.
slates-bridge-fskit = 9
# slates-bridge-winfsp (86): the VfsError->NTSTATUS refusal taxonomy stays safe Rust (lib.rs, 0). The
# WinFsp mount host is Windows-only FFI, hand-transcribed from winfsp's headers (like the rt AFD
# reactor from the WDK) and compiled only for Windows, each block with a `// SAFETY:` line (clippy
# `undocumented_unsafe_blocks` enforces it): `ffi.rs` (18) declares the `FspFileSystem*` exports and
# the `FSP_FILE_SYSTEM_INTERFACE` callback signatures; `host.rs` (68) is the mount driver — the 16
# `FSP_FILE_SYSTEM_INTERFACE` trampolines that read WinFsp's raw pointers (the file system's
# `UserContext` handler, the opaque `FileContext` open-files, UTF-16 path strings, the read/write
# buffers) under WinFsp's COARSE operation guard that serializes them, plus `FspFileSystemCreate`/
# `SetMountPoint`/`StartDispatcher`/`AddDirInfo`, the leaked `Handler`/`OpenFile` boxes, and the
# `ConvertStringSecurityDescriptor…`/`GetSecurityDescriptorLength`/`LocalFree` for the reference
# descriptor. All are Win32/WinFsp FFI without a safe wrapper; there is no `unsafe impl Send`/`Sync`
# (the volume is owned by one thread and shared only over channels, R2/D-7).
slates-bridge-winfsp = 86
# slates-bridge-virtiofs (0): the virtqueue machine and the FUSE-over-virtio device read and write
# guest memory only through the `GuestMemory` seam — bounded, checked copies into byte arrays, fields
# decoded in order, never a cast or a pointer into the guest (the FUSE codec's discipline). The
# simulated seams are `Vec<u8>` and `Cell`/`RefCell`; the doorbell descriptors are `rustix` reads and
# writes on owned descriptors. A real shared mapping (the later VMM leg) will go through
# `slates_mem::SharedObject`'s atomic views, whose unsafe already lives in slates-mem.
slates-bridge-virtiofs = 0
# slates-bridge-oci (1): the macOS `getfsstat(MNT_NOWAIT)` pair — the count query and the fill of a
# buffer sized for exactly that count, plus the `set_len` to what the kernel wrote — in one block
# (added 2026-09-14 for the OCI attachment form, §4.6 A-9): rustix has no mount-table query, and a
# `statfs` of the path would touch the very mount the daemon serves. The Linux read of
# `/proc/self/mountinfo` is safe rustix; the parser, verification and entry are pure.
slates-bridge-oci = 1
# slates-conformance (0): pure parsers and records; no FFI, no I/O.
slates-conformance = 0
