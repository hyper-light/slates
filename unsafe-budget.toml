# The unsafe budget (Phase 0, 2026-09-05; Ada: "we SHOULD find a way to minimize unsafe blocks").
#
# `cargo xtask unsafe` counts `unsafe` blocks, functions and impls in each shipped crate's sources
# (comments and tests excluded) and fails when a crate exceeds its budget; `--tighten` lowers a
# budget to the current count. A budget only goes down. Raising one is an edit here that names the
# new site and its reason. What each crate still holds, as of the counts below:
#
# slates-machine (50): Apple sysctl, mach host statistics and IOKit power queries, for which no
#   safe wrapper exists (7 sites, one helper each); the macOS thread-affinity hint (1); the
#   file-backed map of the profile segment (1); the Win32 facts, probes and section (the rest,
#   compiled only for Windows) — raised 43 → 44 on 2026-09-14 for `GetProcessAffinityMask`, the
#   mask the core matrix puts back on the calling thread after it pinned it (a spawned daemon
#   inherited the one-core mask: docs/bugs/2026-09-14-core-matrix-leaves-the-anchor-pinned-to-one-core.md).
#   Raised 44 → 45 on 2026-09-17 for clock::monotonic_ns's QueryInterruptTimePrecise output pointer:
#   one Win32 FFI query with no safe wrapper, a common boot origin for cross-process heartbeats.
#   Raised 45 → 49 on 2026-09-22 for the wake probe (`wake.rs`, docs/bugs/2026-09-22-wake-probe-mixes-two-
#   events-and-reports-an-unconverged-tail.md), which confirms a waiter asleep and learns each thread's CPU:
#   macOS `pthread_cpu_number_np`, `pthread_mach_thread_np` and `thread_info` (3) and Windows
#   `GetCurrentProcessorNumber` (1) — FFI with no safe wrapper; Linux uses rustix and `/proc` (none).
#   Corrected 49 → 50 on 2026-10-01 (AUD-29-31), no new site: the shared-memory map of the profile segment's
#   macOS/Linux object (`segment.rs` platform module, `MmapOptions::map_mut`) had gone uncounted, because the
#   scanner took that production module for a test module after a `#[cfg(test)] fn` above it.
#   Raised 50 → 51 on 2026-10-19 for `bench::involuntary_switches` (`bench.rs`): one `libc::getrusage`
#   with `RUSAGE_SELF` into a zeroed, fully sized `rusage` this crate owns. It reads `ru_nivcsw`, so a probe
#   that overran its bound can say whether the scheduler took the thread away instead of reporting the
#   overrun as the machine's cost — the busy-machine discriminator a timing gate needs. rustix 1.1.4 has no
#   `getrusage` and no `Rusage` of any kind, so there is no safe wrapper to reach for; the non-Unix arm is a
#   paired `#[cfg(not(unix))]` returning `None` rather than a zero, and holds no `unsafe`.
# slates-mem (22): the Windows working-set raise and VirtualLock/VirtualUnlock (memmap2 covers
#   Unix) (4); the shared memory object of §4.7 (`shared.rs`, added 2026-09-05 for Phase 2):
#   the file-backed map of a memory object (1), the descriptor a child inherits (1), the one
#   atomic word view both objects share (`word_view`, 1; it replaced the two per-width views
#   2026-09-26), and the Windows section (create, open, view, drop, the two byte views and the
#   lock: 8); the sparse object (2026-09-26, the anchor segment and content object on a
#   `SEC_RESERVE` section — CI run 36202635768's 167 GB layout refused 1450 on a 16 GB runner):
#   `GetSystemInfo` for the commit granule (1), `VirtualAlloc(MEM_COMMIT)` of a range (1), and the
#   two committed-range views (2).
#   Lock on fault (`region.rs` `lock_map`, 2026-10-03, D-12): one `rustix::mm::mlock_with(ONFAULT)` over a map's
#   own live range (1, Linux only) — memmap2's safe `lock` is a plain `mlock`, which faults the whole range in under
#   the process's memory-map lock and stalled every shard behind one strict volume's arena lock
#   (docs/bugs/2026-10-03-locking-an-arena-stalled-every-shard-on-the-memory-map-lock.md). 23 → 24.
#   Congruent placement of a shared object's mapping (`shared.rs` `Mapped`, 2026-10-20, §4.6 L1): a huge page
#   behind a memory object is addressed twice over — by where it sits in this process and by where it sits in
#   the object — and the kernel forms one only where the two agree, so the window is now placed instead of left
#   to `mmap`. Measured on Linux 6.12.76 (aarch64): 13 of 16 objects came back incongruent, `MADV_COLLAPSE` over
#   an incongruent span is refused `EINVAL`, and the DAX sandbox was reserved for 0 or for 8 of 8 volumes by
#   address luck alone (docs/bugs/2026-10-20-the-dax-sandbox-was-reserved-by-mmap-address-luck.md). memmap2
#   offers no placement, so the mapper is rustix: the `PROT_NONE` reservation (1), the `MAP_FIXED` of the object
#   over the congruent address inside it (1), the `munmap` of that reservation when the placement is refused (1)
#   and again in `Drop` (1), the huge-page advice the placement finally makes worth asking (1), and the two byte
#   views the owner lends (`Deref`, `DerefMut`: 2), less the memmap2 map they replace (−1): +6. Locking moved
#   with it, since a mapping is its bytes whoever made it (`region.rs` `lock_bytes_whole`/`lock_bytes_range`):
#   the whole-map lock on fault and its macOS arm (2) and the range lock with `MADV_DONTDUMP` (2), less the two
#   that took a memmap2 map and are now thin callers (−2): +2. 37 → 45.
