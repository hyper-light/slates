[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Workspace tasks: the structural test (R1/R2 by construction) and the literal check (R3)."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# The ratchet task keys ceilings by the machine identity the profile computes.
slates-machine = { workspace = true }
# ratchets.toml is read and rewritten by the ratchet task.
toml = { workspace = true }
# The conformance harness: the pure records, parsers and matrix live in the crate; this tool
# mounts, runs and traces (docs/wip/conformance.md).
slates-conformance = { workspace = true }
# The pinned upstream suite sources are verified by SHA-256 before they are built.
sha2 = { workspace = true }
# The workload manifests digest every file with BLAKE3.
blake3 = { workspace = true }
# The KIND lane mints self-signed fleet identities, as the fleet tests mint theirs (kind.rs).
rcgen = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The Linux grant path reopens the anchor's memfd handoff and makes it inheritable.
rustix = { workspace = true }

# xtask is a development tool, not shipped code: it reads sources and runs cargo, so the
# workspace lints that forbid std::fs and panics are relaxed here, with the reasons in main.rs.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
