# Lint configuration for the workspace. Every entry is a rule from Part 0 of the design with
# its reason; a change here is a design change and goes through the amendment log.

# Shape constant ratified in Phase 0 (GAPS §5): the lowest threshold the reference crates pass.
# It only ratchets down. A function above it is split, never allowed.
cognitive-complexity-threshold = 10

# The no-panic law applies to shipped code; tests may unwrap, expect, panic and dbg.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-indexing-slicing-in-tests = true

# R2 and D-7/D-8: no atomic reference counting and no locks on data paths. The only allowed
# sites are named FFI edge modules (bindings objects a GC may drop mid-call; foreign APIs that
# take Arc by signature; test harnesses), each with a comment naming the two owners.
disallowed-types = [
  { path = "std::sync::Arc", reason = "R2/D-8: ownership is by arena and generational handle; sharing is a move over a bounded channel or an epoch-published immutable root. Allowed only in a named FFI edge module with a comment naming the two owners." },
  { path = "std::rc::Rc", reason = "R2/D-8: same rule as Arc." },
  { path = "std::sync::Mutex", reason = "D-7: no locks on data paths; one owning shard per volume. A cold-path lock needs a documented allow that recovers from poisoning." },
  { path = "std::sync::RwLock", reason = "D-7: same rule as Mutex." },
  { path = "std::sync::Condvar", reason = "D-9/D-10: parking goes through the runtime's wake words, never a condvar." },
]

# R1: no disk writes outside the landing crate under a grant, and never /tmp. Reads of the
# kernel's pseudo-files are queries and are allowed where the structural test lists them.
#
# The `rustix::` and `libc::` entries carry `allow-invalid = true`; the `std::` ones deliberately do not.
# A POSIX call does not resolve on Windows — `rustix` is a `cfg(unix)` dependency and libc offers no
# `renameat` there — and clippy warns "does not refer to a reachable function" for each, which `-D warnings`
# turns into a red lane. The flag silences only that; where the path does resolve the call is still denied,
# so the wall is unchanged on Linux and macOS. It is not put on the `std::` entries because those must
# resolve on every platform, and there a typo would otherwise become an entry that silently denies nothing.
# Found 2026-10-20, the first time a Windows runner linted the crates these entries were added for (AUD-29-31
# landed while main was 228 commits ahead of origin, so no Windows lane had seen them).
disallowed-methods = [
  { path = "std::fs::write", reason = "R1: the landing crate is the only writer of host paths." },
  { path = "std::fs::create_dir", reason = "R1." },
  { path = "std::fs::create_dir_all", reason = "R1." },
  { path = "std::fs::remove_file", reason = "R1." },
  { path = "std::fs::remove_dir", reason = "R1." },
  { path = "std::fs::remove_dir_all", reason = "R1." },
  { path = "std::fs::rename", reason = "R1." },
  { path = "std::fs::hard_link", reason = "R1." },
  { path = "std::fs::copy", reason = "R1." },
  { path = "std::fs::set_permissions", reason = "R1." },
  { path = "std::fs::File::create", reason = "R1." },
  { path = "std::fs::File::create_new", reason = "R1." },
  { path = "std::fs::File::set_len", reason = "R1." },
  { path = "rustix::fs::unlinkat", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths, and a memory-object site allows it in place with a reason.", allow-invalid = true },
  { path = "rustix::fs::renameat", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths, and a memory-object site allows it in place with a reason.", allow-invalid = true },
  { path = "rustix::fs::mkdirat", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths, and a memory-object site allows it in place with a reason.", allow-invalid = true },
  { path = "rustix::fs::linkat", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths, and a memory-object site allows it in place with a reason.", allow-invalid = true },
  { path = "rustix::fs::symlinkat", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths, and a memory-object site allows it in place with a reason.", allow-invalid = true },
  { path = "rustix::fs::ftruncate", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths, and a memory-object site allows it in place with a reason.", allow-invalid = true },
  { path = "rustix::fs::fsync", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths, and a memory-object site allows it in place with a reason.", allow-invalid = true },
  { path = "rustix::fs::utimensat", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths, and a memory-object site allows it in place with a reason.", allow-invalid = true },
  { path = "rustix::fs::futimens", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths, and a memory-object site allows it in place with a reason.", allow-invalid = true },
  { path = "rustix::fs::chmodat", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths, and a memory-object site allows it in place with a reason.", allow-invalid = true },
  { path = "rustix::fs::fchmod", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths, and a memory-object site allows it in place with a reason.", allow-invalid = true },
  { path = "rustix::fs::chownat", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths, and a memory-object site allows it in place with a reason.", allow-invalid = true },
  { path = "rustix::fs::fchown", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths, and a memory-object site allows it in place with a reason.", allow-invalid = true },
  { path = "libc::rename", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::renameat", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::unlink", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::unlinkat", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::mkdir", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::mkdirat", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::rmdir", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::link", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::linkat", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::symlink", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::symlinkat", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::truncate", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::ftruncate", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::fsync", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::utimensat", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::futimens", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::chmod", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::fchmod", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::chown", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "libc::fchown", reason = "R1 (AUD-29-31): a write-capable file call; only the landing crate writes host paths.", allow-invalid = true },
  { path = "std::env::temp_dir", reason = "R1: no /tmp, ever; tests use RAM-backed directories they name." },
  { path = "std::thread::sleep", reason = "D-9: no blocking sleeps in shipped code; time goes through the timing wheel. Tests and the machine probes may allow it in place with a reason." },
]
