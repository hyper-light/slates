{{- /*
One Secret per pod — `<fullname>-N-identity` holding pod N's private key (and its certificate, for the
operator's reference; peers pin the ConfigMap's copy). A StatefulSet's pod template cannot name a Secret
per pod, so every pod's Secret is projected into one volume and each container mounts only its own key
file from it by `subPathExpr` on its pod name (statefulset.yaml): the container sees one key. The node's
kubelet materializes the projected Secrets for the pod; the design's §4.13 enrollment, or a certificate
CSI driver issuing per-pod identities, removes even that in production.
*/ -}}
{{- range $index := until (int .Values.replicas) }}
{{- $pod := include "slates.podName" (dict "root" $ "index" $index) }}
{{- include "slates.identity" (dict "root" $ "index" $index) }}
{{- $identity := index $.Values.certificates $pod }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pod }}-identity
  labels:
    {{- include "slates.labels" $ | nindent 4 }}
    slates.lundhe.audio/node: {{ $pod }}
type: Opaque
data:
  {{ $pod }}.key.der: {{ $identity.key }}
  {{ $pod }}.crt.der: {{ $identity.certificate }}
{{- end }}
