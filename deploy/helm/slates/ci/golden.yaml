---
# Source: slates/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slates
  labels:
    helm.sh/chart: slates-0.1.0
    app.kubernetes.io/name: slates
    app.kubernetes.io/instance: slates
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: slates
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: slates
      app.kubernetes.io/instance: slates
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slates
        app.kubernetes.io/instance: slates
      annotations:
        # The manifest is the fleet's membership: a change of it (a scale) restarts every pod on the new
        # manifest, the fleet re-forming — D-14's cold path, never a per-write concern.
        checksum/fleet: 60e04e601787e6842e1d4769daecc9239e0e35206a1ecf9c13728487d64ace5e
    spec:
      # R10: no privilege. The daemon runs as the image's non-root user with every capability dropped and
      # a read-only root filesystem — a RAM-only service writes no file (R1), so any write it attempted
      # would fail loudly here rather than land on a node's disk.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          # A node is a failure domain (D-14 copysets): two members never share one.
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: slates
                  app.kubernetes.io/instance: slates
      topologySpreadConstraints:
        # Across zones the members spread where the cluster has zones; a cluster without zone labels
        # still schedules (`whenUnsatisfiable`).
        - topologyKey: topology.kubernetes.io/zone
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: slates
              app.kubernetes.io/instance: slates
      containers:
        - name: slates
          image: "slates:lane"
          imagePullPolicy: IfNotPresent
          # The anchor is PID 1 (Dockerfile): it supervises the daemon and takes SIGTERM. The pod's own
          # name selects its manifest entry — the same file for every pod.
          args:
            - anchor
            - --fleet
            - /etc/slates/fleet/fleet.json
            - --node
            - $(POD_NAME)
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            # Guaranteed QoS: requests equal limits, so the §4.2 effective capacity is exactly this bound.
            requests:
              memory: 1Gi
              cpu: 2
            limits:
              memory: 1Gi
              cpu: 2
          readinessProbe:
            # The daemon's own health signal (§4.14): `slates status` exits 0 only when the daemon serves
            # (3 when no daemon answers, 4 when the anchor failed) — never a bare port check.
            exec:
              command: ["/slates", "status"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          # No liveness probe: the anchor already kills a daemon whose heartbeat lapses and restarts it
          # under its derived bound (crates/anchor), which is finer than a pod restart.
          volumeMounts:
            - name: fleet
              mountPath: /etc/slates/fleet
              readOnly: true
            - name: identities
              mountPath: /etc/slates/keys/$(POD_NAME).key.der
              subPathExpr: $(POD_NAME).key.der
              readOnly: true
      volumes:
        - name: fleet
          configMap:
            name: slates-fleet
        # Every pod's Secret projected into one volume; the container mounts its own key from it alone
        # (secrets.yaml explains the shape).
        - name: identities
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: slates-0-identity
                  items:
                    - key: slates-0.key.der
                      path: slates-0.key.der
              - secret:
                  name: slates-1-identity
                  items:
                    - key: slates-1.key.der
                      path: slates-1.key.der
              - secret:
                  name: slates-2-identity
                  items:
                    - key: slates-2.key.der
                      path: slates-2.key.der
