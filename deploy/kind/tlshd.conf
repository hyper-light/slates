# tlshd's configuration for the KIND export leg (§4.6, AUD-29-75): the node's client identity for
# RPC-with-TLS mounts (`xprtsec=mtls`), and the authority that issued the export's server certificate. The
# format is ktls-utils 1.0.0's own (the file it ships, see tlshd.conf(5)); the PEM files are minted per run
# by `cargo xtask kind export` and mounted at /etc/slates-tls.

[debug]
loglevel=0
tls=0
nl=0

[authenticate]

[authenticate.client]
x509.truststore=/etc/slates-tls/authority.pem
x509.certificate=/etc/slates-tls/client.pem
x509.private_key=/etc/slates-tls/client.key
