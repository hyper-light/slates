# Performance ratchets (design R4, Part 6; Phase 0 task 7).
#
# A ceiling is the upper edge of the 95% bootstrap interval of the best of N runs on the machine
# named by the identity hash below; `cargo xtask ratchet` re-runs the benches and fails when a
# row's best lower edge lies above its ceiling (the two intervals no longer overlap, so the
# regression is distinguishable from noise). Ceilings only tighten: `cargo xtask ratchet --tighten`
# lowers them to a better run; raising one is a deliberate edit that names its reason here.
# A machine with no entry skips loudly; `cargo xtask ratchet --record` writes its first baseline.
# Reset 2026-09-05 (a deliberate act: the tightening rule changed). Before it, three rows had
# been tightened by a cold run and then "regressed" by 1-5% on warm ones, one of them
# (mem.buddy_alloc_free_64_pages_split_and_coalesce, 71 -> 72-75 ns) in a crate untouched since
# Phase 0. Tightening now requires an improvement larger than the row's own between-run drift.
# Facts recorded on the way, measured in isolation: vfs.clone_and_destroy_the_clone_at_1000_files
# 270 ns [270, 276] (was 265: one clock read per destroy_step, the time-budgeted slices of
# AC-1.8); vfs.insert_and_remove_in_a_tree_dir_of_128 151 ns [145, 151] (was 140; the tree code
# on that path unchanged, a code-layout shift); vfs.destroy_per_unit_in_one_slice 14 ns (12
# before the clock read every sixteen units).
# Raised 2026-09-05: vfs.readdir_of_a_36_entry_dir 416 -> 500. Between 6d56f74 and the landing
# commit the row moved from 406 to 468-489 ns (two runs of each binary, same session) with no
# source change on its path; `otool -tv` of both bench binaries shows the directory iterator and
# the lookup instruction-identical (readdir itself is inlined into the bench). A code-placement
# shift, not a change of the code; the ceiling is the widest upper edge measured and tightens
# again when the path is next touched. The same run tightened eleven rows and recorded the three
# landing rows (land.*).

